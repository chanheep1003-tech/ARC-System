  v4 20문항 실측: D2 13·D3 7·D4 0(비율 .65/.35/.00), 목표 D2 .20/D3 .50/D4 .30(±.12) 불합격. 구조 게이트는 FAIL 없음, 구조 밴드는 D2 7·D3 4·D4 9인데 풀이자가 한 단계 이상 낮게 본 문항이 11개(005, 009, 012~020 중 다수).
  정답 불일치 1건: 19번 키가 옵션 2번이었으나 실제 정답 문장은 1번에 놓여 있었다(저자 키 오류). 독립 풀이가 발견했고 19번은 정답 옵션을 2번으로 옮겨 수정함(정답 번호 목록은 키와 같아짐). 나머지 19문항은 키와 일치.
  해석: (1) 풀이자는 실제 기준 '상' 문항을 D4(대체로 확신 LOW, 정답이 갈림)로 평가해 눈금은 정확하다. (2) 정의·규칙을 문항 안에 주면 규칙을 따라 기계적으로 풀 수 있어 확신 HIGH·체감 D2~D3 로 평가된다. 구조(판단 횟수·표·3입장)가 학생에게는 더 어려울 수 있으나, AI 풀이자는 이 종류의 난이도를 재지 못할 가능성이 있다(측정 한계).
  실제 '상' 문항의 난이도 원천은 규칙을 따라가는 단계 수가 아니라, 교과서 요약 수준을 넘는 정의론 개념과 선지 간 미세한 의미 차이로 정답이 갈리는 데 있었다(기준 문항 4개가 확신 LOW).
  결과 파일: blind_review_v4_calibration_run_REJECTED.yaml.
kor_saturation_check_20261109: >
  국어 우선 전환(사용자 2026-11-09 "최우선은 국어"). 실제 동북고 2025-2 기말 공통국어2 맞춤법 문항 3개(8·9·10번; 9번 3.8~3.9점, 10번 4.0점 이상)를 정답·배점 없이 전사해 같은 풀이자에게 풀게 했다:
  3개 모두 정답 확신 HIGH, 난이도 D2. 즉 이 풀이자로는 국어 맞춤법/문법 영역의 실제 고배점 문항도 D2 로 평가된다(SOLVER_SATURATED). 국어 v4 의 D2 18/D3 2 결과는 실제 기출과 같은 눈금에서 나온 값이라 '기출보다 쉽다'는 증거가 아니다.
  구조 점수 기준 국어 v4: D2 19·D3 1 (템플릿 코드 없는 v4 에 enforce_templates=False 로 계산). 실제 기출 대비 상대 비교는 아직 안 했다.
  결과 파일: quality/production/KOR_S2_MEDIEVAL_ORTHO_20261108/real_exam_orthography_solver_check.yaml. 기출 원문은 저장소에 넣지 않았다.
  제안(사용자 정책 결정 대기): 국어 맞춤법/문법은 AI 풀이자 난이도를 게이트로 쓰지 않고 구조 점수 밴드와 선생님 검토를 기준으로 한다. 레지스트리 solver_saturation.KOR_ORTHOGRAPHY 에 제안 상태로 기록했다.
