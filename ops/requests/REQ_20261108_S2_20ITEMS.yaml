  첫 눈금 보정 실행(D-23): 사회 v3 20문항 + 기준 문항 7개(MEGA3-08/14/25/01, MEGA4-17/13/01; 출판사 라벨 상 3·중상 2·하 2)를 같은 풀이자에게 풀게 했다.
  기준 문항 결과: 상·중상 5개는 모두 D4, 하 2개는 D2 → 보정 상태 CALIBRATED(offset -0.14, 허용 ±0.5). 즉 풀이자는 관대하지 않다.
  v3 20문항: D2 17·D3 3·D4 0(비율 .85/.15/.00). 같은 문항을 기준 문항 없이 풀렸을 때(D2 10·D3 10)보다 7문항이 D3→D2로 내려갔다(어려운 기준 문항과 함께 풀면 상대적으로 쉬워 보임).
  구조 밴드와 풀이자 평가가 한 단계 이상 어긋난 문항: 005, 006, 010, 013, 015, 016, 017.
  해석: 난이도 부족의 원인은 풀이자 눈금이 아니라 문항 자체의 개념 깊이·자료 복잡도다. 기준 '상' 문항은 교과서 요약을 넘는 정의론 개념(역사적 원리, 정형적 분배 원리, 원초적 입장, 원칙 간 우선순위, 형벌론)과 선지 간 미세 구분을 쓴다.
  결과 파일: blind_review_v3_calibration_run.yaml. 기준 문항 원문은 저장소에 넣지 않았다.
