  의도한 D4(15~20번)는 모두 D3로 평가: 15 흐름도, 16 응답표, 17 비판 방향, 18 조건 매트릭스, 20 3인 비교. 19번은 D2.
  눈금 확인용 실제 동북고 기출 2문항: 정의관 원전 귀속 판별(기출 6번) → D3, 청소년 노동권 응답표 계산(기출 17번) → D4(노동법 지식 필요, 범위 밖 플래그 d). 즉 풀이자는 4.2점급 정의관 문항을 D3로 보므로 우리 D3 와 같은 선이고,
  실제 D4 로 평가된 기출은 단원 밖 지식이 섞인 응답표였다. 한 소단원(Ⅱ-2)만으로는 D4 30% 가 비현실적일 수 있다는 근거.
  결과 파일은 blind_review_v3_REJECTED.yaml 로 보관. 기준 문항 원문은 저장소에 넣지 않았다(학교 저작물).
