# 요청에 빠진 값을 채우는 기본값. 사용자가 말한 값이 항상 우선한다.
schema: ARC-PLAN-DEFAULTS-V1
date: 2026-11-11
count_default: {KOR: 50, SOC: 20, SCI: 20}
set_split:                # 한 번에 만드는 묶음. 묶음마다 초안→검토 후 다음 묶음으로 간다.
  KOR: {unit_selected: 11, unit_constructed: 1}
  SOC: {unit_selected: 18, unit_constructed: 2}
  SCI: {unit_selected: 18, unit_constructed: 2}
kor_versions:             # 국어 ARC N° 네 단계 + 특화. 근거: quality/korean/ARC_KOR_V1_V6_LEVEL_POLICY_V1.2.md
  V1: {name: 전범위 기본, goal: 시험범위 개념을 빠짐없이 다양한 유형으로, difficulty: {D2: 0.40, D3: 0.45, D4: 0.15, D5: 0.00}, advanced: 0.20, new_material: 교과서·학습지 예문 중심}
  V2: {name: 핵심 집중·복합, goal: 학교자료·기출로 중요도가 확인된 축에 비중, difficulty: {D2: 0.30, D3: 0.45, D4: 0.22, D5: 0.03}, advanced: 0.25, new_material: 학교자료 변형}
  V3: {name: 낯선 자료 전이, goal: 처음 보는 지문·예문에 범위 개념 적용, difficulty: {D2: 0.25, D3: 0.45, D4: 0.25, D5: 0.05}, advanced: 0.30, new_material: 문항마다 새 자료}
  V4: {name: 최상위 변별, goal: 근거 다층 결합·반례·미세 조건, difficulty: {D2: 0.15, D3: 0.50, D4: 0.30, D5: 0.05}, advanced: 0.30, new_material: 필요 시}
  V6: {name: 맞춤법·띄어쓰기 특화, goal: 낯선 표현의 품사·규정 적용, difficulty: {D2: 0.25, D3: 0.45, D4: 0.25, D5: 0.05}, advanced: 0.30, new_material: 문항마다 새 예문, policy: quality/korean/ARC_KOR_V6_UNFAMILIAR_EXPRESSION_ORTHOGRAPHY_V1.0.md}
kor_version_choice:
  explicit: 사용자가 버전을 말하면 그대로
  orthography_or_spacing_request: V6
  otherwise: 같은 범위의 RUN_LOG 기록이 없으면 V1, 있으면 마지막 버전의 다음 단계(V4 다음은 V4 유지)
  final_request: V5는 ARC_FINAL이다. ARC N° 요청에 V5를 쓰지 않는다.
other_subjects:           # 사회·과학은 버전 사다리가 없다
  SOC: {difficulty: {D2: 0.30, D3: 0.45, D4: 0.22, D5: 0.03}, advanced: 0.25}
  SCI: {difficulty: {D2: 0.30, D3: 0.45, D4: 0.22, D5: 0.03}, advanced: 0.25}
hard_limits:              # 기존 게이트와 같은 값. 계획이 이 범위를 벗어나면 계획 단계에서 거부한다.
  advanced_share: [0.20, 0.30]
  d45_share_kor: [0.15, 0.35]
  d1_share_max: 0.10
archetype_library:
  KOR_GRAMMAR: quality/korean/ARC_KOR_GRAMMAR_ARCHETYPES_V1.0.yaml
ask_user_only_when:       # 이 경우가 아니면 묻지 않고 계획 카드를 보여 준 뒤 진행한다
  - 과목을 알 수 없다
  - 범위를 전혀 알 수 없다 (단원·작품·쪽수·"맞춤법" 같은 단서가 하나도 없음)
