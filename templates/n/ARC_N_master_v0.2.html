<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>ARC N° Master v0.2 (Pure B&W Body Edition)</title><style>
:root{--navy:#1F2A44;--warm:#E9E7E1;--burg:#7A2E35;--ink:#000000;--muted:#666c74;--rule:#000000}
*{box-sizing:border-box;margin:0;padding:0}@page{size:A4;margin:0}html,body{margin:0;padding:0;background:#ffffff;color:#000000;font-family:"Noto Sans CJK KR","Noto Sans KR","Noto Sans",sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{width:210mm;height:297mm;position:relative;background:#ffffff;page-break-after:always;break-after:page;overflow:visible}.page:last-child{page-break-after:auto;break-after:auto}
.blank-page{width:210mm;height:297mm;page-break-after:always;break-after:page;background:#ffffff}
/* cover (keep original Academic B cover style intact) */
.cover{padding:24mm 20mm 18mm;color:#17191d}.kicker{font-family:Inter,Arial,sans-serif;font-size:10.5pt;font-weight:700;letter-spacing:.11em;color:var(--navy)}.toprule{height:.7pt;background:var(--navy);margin-top:7mm}.accent{position:absolute;left:20mm;top:82mm;width:12mm;height:1.2mm;background:var(--burg)}.covermain{margin-top:53mm}.covermain h1{margin:0;font-size:30pt;line-height:1.15;letter-spacing:-.045em}.covermeta{margin-top:12mm;font-size:10pt;line-height:1.85;color:#3d4248}.year{position:absolute;left:20mm;bottom:24mm;font-family:Inter;font-size:10pt;color:var(--muted);letter-spacing:.08em}.series{position:absolute;right:20mm;bottom:24mm;font-family:Inter;font-size:8pt;color:var(--navy);font-weight:700;letter-spacing:.05em}
/* body (Pure Black & White #000000 / #FFFFFF, Enlarged Readability, Outer Border Boxes Only) */
.body{padding:11mm 12.8mm 11mm 12.8mm;color:#000000;background:#ffffff}
.head{width:100%;display:table;border-bottom:1.2pt solid #000000;padding-bottom:4px;margin-bottom:7px;color:#000000}
.brand{display:table-cell;text-align:left;font-size:8.4pt;font-weight:800;letter-spacing:-.2px;color:#000000;white-space:nowrap}
.head .unit{display:table-cell;text-align:right;font-size:8.1pt;font-weight:700;letter-spacing:-.2px;color:#000000;white-space:nowrap}
.content{width:100%;height:256mm}
.cols{display:table;width:100%;table-layout:fixed;height:256mm}
.col:first-child{display:table-cell;width:48.2%;vertical-align:top;padding-right:2px}
.col-divider{display:table-cell;width:3.6%;position:relative}
.col-divider::after{content:"";display:block;width:0.8pt;height:254mm;background:#000000;margin:0 auto}
.col:last-child{display:table-cell;width:48.2%;vertical-align:top;padding-left:2px}
u,.target-ul{text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px;color:#000000}
.q{break-inside:avoid;page-break-inside:avoid;margin-bottom:11px;color:#000000}
.q-tag{display:inline-block;border:0.9pt solid #000000;padding:1.5px 6px;font-size:7.7pt;font-weight:800;margin-bottom:4px;line-height:1.25;background:#ffffff;color:#000000}
.qnum{display:inline;font-weight:900;font-size:9.8pt;color:#000000;margin-right:3px}
.stem{font-size:9.5pt;line-height:1.42;font-weight:800;letter-spacing:-.15px;margin-bottom:5px;padding-left:18px;text-indent:-18px;color:#000000}
.box{border:0.9pt solid #000000;padding:5px 7px 6px 7px;margin-bottom:6px;background:#ffffff;color:#000000}
.box-title{text-align:center;font-size:8.4pt;font-weight:800;margin-bottom:3.5px;letter-spacing:.5px;color:#000000}
.bodytxt{font-family:"Noto Serif CJK KR","Noto Serif KR",serif;font-size:8.8pt;line-height:1.42;letter-spacing:-.15px;color:#000000;white-space:pre-line}
.choices{font-size:9.1pt;line-height:1.36;margin-top:2px;color:#000000}
.choice{padding-left:14px;text-indent:-14px;letter-spacing:-.15px;margin-bottom:2.5px;line-height:1.36;color:#000000}
.table{width:100%;border-collapse:collapse;font-size:8.0pt;line-height:1.3;margin-top:2px;color:#000000;background:#ffffff}
.table th,.table td{border:0.75pt solid #000000;padding:3px 4px;text-align:center;color:#000000;background:#ffffff}
.table th{font-weight:800;background:#ffffff}
.bundle{border:1.1pt solid #000000;padding:5.5px 7.5px 6.5px 7.5px;margin-bottom:7px;background:#ffffff;color:#000000}
.bundle-title{font-size:8.8pt;font-weight:800;line-height:1.34;padding-bottom:3.5px;margin-bottom:3.5px;border-bottom:0.8pt solid #000000;color:#000000}
.bundle-sub{font-size:8.1pt;font-weight:800;margin-bottom:3.5px;color:#000000}
.bundle-text{font-family:"Noto Serif CJK KR","Noto Serif KR",serif;font-size:8.65pt;line-height:1.40;letter-spacing:-.15px;color:#000000;white-space:pre-line}
.source{text-align:right;font-size:7.6pt;font-weight:700;color:#000000;margin-top:2.5mm}
.wide{border:1.0pt solid #000000;margin-bottom:7mm;padding:5.5mm;background:#ffffff;color:#000000}
.wide-title{font-size:9.2pt;font-weight:800;margin-bottom:4mm;color:#000000}
.visual{height:48mm;display:flex;align-items:center;justify-content:center;background:#ffffff;border:0.8pt solid #000000;color:#000000;font-size:8.5pt;font-weight:700}
.caption{font-size:7.6pt;color:#000000;margin-top:2mm}
.foot{position:absolute;left:12.8mm;right:12.8mm;bottom:11mm;border-top:0.9pt solid #000000;padding-top:4px;height:18px;font-size:8.2pt;font-weight:700;color:#000000}
.foot-left{float:left;width:45%;text-align:left;font-weight:500}
.foot-center{float:left;width:10%;text-align:center;font-weight:800;font-size:8.8pt}
.foot-right{float:right;width:45%;text-align:right}
/* Quick Answer Table Page */
.ans-table-title{font-size:15.5pt;font-weight:900;margin:4px 0 5px 0;color:#000000}
.ans-table-note{font-size:8.8pt;margin-bottom:10px;color:#000000}
.quick-grid{width:100%;border-collapse:collapse;border:1.4pt solid #000000;margin-bottom:16px;background:#ffffff;color:#000000}
.quick-grid th,.quick-grid td{border:0.8pt solid #000000;padding:7.5px 6px;text-align:center;font-size:9.3pt;background:#ffffff;color:#000000}
.quick-grid th{font-weight:800;border-bottom:1.2pt solid #000000}
.quick-grid td{font-weight:700}
.diag-box{border:1.1pt solid #000000;padding:12px 14px;background:#ffffff;color:#000000}
.diag-title{font-size:10.2pt;font-weight:800;margin-bottom:7px;color:#000000}
.diag-item{font-size:8.9pt;line-height:1.52;margin-bottom:3px;padding-left:10px;text-indent:-10px;color:#000000}
</style></head><body>
