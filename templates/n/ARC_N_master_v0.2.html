<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>ARC N° · Black & White</title>
<style>
/* ARC N° B&W V1.0, 2026-11-06. Reference: neutralization V2, Drive 1qIq8QaZd89N7WZac7vXHvuB5XYZ6AZnz. */
:root{--ink:#000;--paper:#fff;--rule:#000;--shade:#f0f0f0;--body:9.7pt;--leading:1.52}
*{box-sizing:border-box} @page{size:A4;margin:0}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans KR","Pretendard",sans-serif;print-color-adjust:exact}
.page{width:210mm;min-height:297mm;position:relative;padding:12.7mm;break-after:page}
.page:last-child{break-after:auto}.blank{padding:0}.cover{padding-top:25mm}
.wordmark{font-size:24pt;font-weight:700}.cover h1{font-size:30pt;margin:24mm 0 8mm}.cover h2{font-size:22pt;margin:0}
.cover .meta{font-size:10pt;line-height:1.7;margin-top:8mm}.common{margin-top:45mm;font-size:10pt;line-height:1.65}
.head{display:flex;justify-content:space-between;border-bottom:.6pt solid #000;font-size:8.5pt;font-weight:700;padding-bottom:3mm}
.columns{display:grid;grid-template-columns:1fr 1fr;column-gap:7mm;margin-top:5mm;min-height:250mm;position:relative}
.columns:before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:.4pt solid #000}
.column{min-width:0;display:flex;flex-direction:column;gap:12mm;padding:0 1.5mm}
.question{break-inside:avoid;page-break-inside:avoid;overflow:visible;font-size:var(--body);line-height:var(--leading)}
.stem{font-weight:600;margin-bottom:3mm}.material,.statements{border:.5pt solid #000;padding:3mm;margin:3mm 0}
.choices{margin-top:3mm}.choice{display:grid;grid-template-columns:4mm 1fr;gap:1mm;margin:1.5mm 0}
.table{border-collapse:collapse;width:100%;font-size:8.6pt;line-height:1.45;margin:3mm 0}
.table th,.table td{border:.45pt solid #000;padding:2mm}.table th{background:#f0f0f0}
.visual svg{width:100%;height:auto;display:block}.visual text{fill:#000}.visual{margin:3mm 0}
.foot{position:absolute;left:12.7mm;right:12.7mm;bottom:9mm;border-top:.6pt solid #000;padding-top:2mm;font-size:8pt;display:flex;justify-content:space-between}
.answer-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4mm;font-size:11pt}
sup,sub{font-size:.72em;line-height:0}.review-only{display:none}
/* Pagination is resolved before filling this shell. Never use overflow:hidden or omit content to fit. */
</style></head><body>
<!-- Contract: cover → truly blank verso → pre-paginated two-column problem pages → truly blank separator → compact answers. -->
{{COVER_PAGE}}
<section class="page blank" aria-label="blank cover verso"></section>
{{PROBLEM_PAGES}}
<section class="page blank" aria-label="blank answer separator"></section>
{{ANSWER_PAGE}}
</body></html>
