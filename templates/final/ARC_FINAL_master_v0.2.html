<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>ARC FINAL Master v0.2 (Pure B&W Body Edition)</title><style>
:root{--navy:#1F2A44;--burg:#7A2E35;--ink:#000000;--muted:#686d74;--rule:#000000}
*{box-sizing:border-box;margin:0;padding:0}@page{size:A4;margin:0}html,body{margin:0;padding:0;color:#000000;background:#ffffff;font-family:"Noto Sans CJK KR","Noto Sans KR","Noto Sans",sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{width:210mm;height:297mm;position:relative;page-break-after:always;break-after:page;overflow:visible;background:#ffffff}.page:last-child{page-break-after:auto;break-after:auto}
.blank-page{width:210mm;height:297mm;page-break-after:always;break-after:page;background:#ffffff}
/* cover (keep original Academic B cover style intact) */
.cover{padding:24mm 20mm 18mm;color:#17191d}.kicker{font-family:Inter;font-size:10.5pt;font-weight:700;letter-spacing:.11em;color:var(--navy)}.toprule{height:.7pt;background:var(--navy);margin-top:7mm}.accent{position:absolute;left:20mm;top:82mm;width:12mm;height:1.2mm;background:var(--burg)}.covermain{margin-top:53mm}.covermain h1{margin:0;font-size:30pt;line-height:1.15;letter-spacing:-.045em}.covermeta{margin-top:12mm;font-size:10pt;line-height:1.85;color:#3d4248}.year{position:absolute;left:20mm;bottom:24mm;font-family:Inter;font-size:10pt;color:var(--muted);letter-spacing:.08em}.series{position:absolute;right:20mm;bottom:24mm;font-family:Inter;font-size:8pt;color:var(--navy);font-weight:700;letter-spacing:.05em}
/* exam body (Pure B&W Enlarged 2-Column) */
.exam{padding:11mm 12.8mm 11mm 12.8mm;color:#000000;background:#ffffff}
.examtop{text-align:center;border-bottom:1.2pt solid #000000;padding-bottom:4.2mm;color:#000000}
.small{font-size:8.4pt;font-weight:700;color:#000000;margin-bottom:1.8mm}
.title{font-size:18.5pt;font-weight:900;letter-spacing:-.035em;color:#000000}
.sub{font-family:Inter;font-size:8.0pt;font-weight:800;letter-spacing:.07em;color:#000000;margin-top:1.5mm}
.info{display:table;width:100%;border:0.9pt solid #000000;margin-top:4mm;height:10.5mm;font-size:8.5pt;font-weight:700;color:#000000;background:#ffffff}
.info>div{display:table-cell;vertical-align:middle;padding:0 4mm;border-right:0.8pt solid #000000}
.info>div:last-child{border-right:0}
.guide{display:table;width:100%;font-size:8.0pt;font-weight:700;color:#000000;margin-top:2.5mm}
.guide span:first-child{display:table-cell;text-align:left}
.guide span:last-child{display:table-cell;text-align:right}
.runhead{display:table;width:100%;border-bottom:1.2pt solid #000000;padding-bottom:4px;margin-bottom:7px;font-size:8.4pt;font-weight:800;color:#000000}
.runhead .brand{display:table-cell;text-align:left;color:#000000}
.runhead span:last-child{display:table-cell;text-align:right;font-size:8.1pt;font-weight:700;color:#000000}
.content{margin-top:4mm}
.cols{display:table;width:100%;table-layout:fixed;height:250mm}
.col:first-child{display:table-cell;width:48.2%;vertical-align:top;padding-right:2px}
.col-divider{display:table-cell;width:3.6%;position:relative}
.col-divider::after{content:"";display:block;width:0.8pt;height:248mm;background:#000000;margin:0 auto}
.col:last-child{display:table-cell;width:48.2%;vertical-align:top;padding-left:2px}
u,.target-ul{text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px;color:#000000}
.q{break-inside:avoid;page-break-inside:avoid;margin-bottom:11px;color:#000000}
.stem{font-size:9.5pt;line-height:1.42;font-weight:800;letter-spacing:-.15px;margin-bottom:5px;padding-left:18px;text-indent:-18px;color:#000000}
.choices{font-size:9.1pt;line-height:1.36;margin-top:2px;color:#000000}
.choice{padding-left:14px;text-indent:-14px;letter-spacing:-.15px;margin-bottom:2.5px;line-height:1.36;color:#000000}
.box{border:0.9pt solid #000000;padding:5px 7px 6px 7px;margin-bottom:6px;background:#ffffff;color:#000000}
.box-title{text-align:center;font-size:8.4pt;font-weight:800;margin-bottom:3.5px;letter-spacing:.5px;color:#000000}
.bodytxt{font-family:"Noto Serif CJK KR","Noto Serif KR",serif;font-size:8.8pt;line-height:1.42;letter-spacing:-.15px;color:#000000;white-space:pre-line}
.table{width:100%;border-collapse:collapse;margin-top:2px;font-size:8.0pt;line-height:1.3;background:#ffffff;color:#000000}
.table th,.table td{border:0.75pt solid #000000;padding:3px 4px;text-align:center;background:#ffffff;color:#000000}
.table th{font-weight:800;background:#ffffff}
.footer{position:absolute;left:12.8mm;right:12.8mm;bottom:11mm;border-top:0.9pt solid #000000;text-align:center;font-size:8.8pt;font-weight:800;color:#000000;padding-top:4px}
</style></head><body>

</body></html>
