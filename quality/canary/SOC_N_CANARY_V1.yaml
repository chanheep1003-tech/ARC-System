    ## QUESTION 1
    Which statement best distinguishes equality from equity?
    1) Equality always uses different rules. 2) Equity ignores relevant differences. 3) Equality applies the same rule while equity considers relevant differences. 4) Both reject criteria. 5) Both mean identical outcomes.

    ## QUESTION 2
    A distribution judgment is strongest when it does what?
    1) Names and applies a relevant criterion. 2) Uses the longest description. 3) Ignores the allocated shares. 4) Assumes every difference is unfair. 5) Replaces reasons with preference.

    ## QUESTION 3
    Which question belongs to corrective rather than distributive reasoning?
    1) Which region is largest? 2) How should an unjust imbalance be restored? 3) Which resource is most popular? 4) How old is a city? 5) Which map color is darkest?

    ## QUESTION 4
    What should a reader identify in a global production network?
    1) Connections and spatial roles. 2) One country name only. 3) Decorative colors only. 4) The page number. 5) Personal preference.

    ## QUESTION 5
    What does a population pyramid primarily represent?
    1) Trade value. 2) Age and sex composition. 3) Constitutional hierarchy. 4) Punishment purpose. 5) Cultural diffusion alone.

    ## QUESTION 6
    Which evidence is most suitable for examining population movement?
    1) A migration-flow map. 2) A logo. 3) A punishment quotation. 4) A rights checklist. 5) A title page.

    ## QUESTION 7
    A rights-restriction judgment should first identify what?
    1) The right, actor, purpose, and means. 2) The longest sentence. 3) The most familiar slogan. 4) An unrelated historical date. 5) A preferred result only.

    ## QUESTION 8
