  student_manuscript: '## QUESTION 1

    Which statement keeps a limited claim about a right within its stated condition?

    1) It extends the claim to every later case. 2) It preserves the limitation as stated. 3) It drops the condition from the claim. 4) It swaps the actor who holds the right. 5) It cites a date unrelated to the case.


    ## QUESTION 2

    Two rights conflict. What should decide between proposed arrangements?

    1) The position of the option in the list. 2) The length of the sentence that states it. 3) Both claims weighed against the means. 4) The personal preference of the reader. 5) The number of nouns used in the claim.


    ## QUESTION 3

    Which review best avoids a half-true answer about a remedy?

    1) Checking the infringed right alone. 2) Checking right and institution together. 3) Picking the phrase that sounds familiar. 4) Ignoring the procedure that follows. 5) Using a case from outside the range.


    ## QUESTION 4

    A choice names the right principle but applies it to the wrong case. How is it judged?

    1) Fully correct because the name is right. 2) Correct whenever the sentence is long. 3) Correct if it was mentioned in class. 4) Half-true and therefore rejected. 5) Correct when it is placed first.


    ## QUESTION 5

    A group tendency is applied to one person without evidence. Which review is required?

    1) Separate the average from the person. 2) Count the punctuation in the passage. 3) Prefer the broadest available claim. 4) Remove the condition from the source. 5) Choose the shortest answer offered.


    ## QUESTION 6

    Which evidence pattern supports a comparison of two regions?

    1) One isolated figure for a single year. 2) The title of the chart without values. 3) Two indicators tied to one criterion. 4) A biography unrelated to either region. 5) A phrase repeated without any context.


    ## QUESTION 7

    A new case changes one condition of a restriction. What must the solver do?

    1) Reapply the test to the new condition. 2) Reuse the earlier answer without change. 3) Ignore the new case as an exception. 4) Choose the longest option that remains. 5) Bring in a theory from outside the range.


    ## QUESTION 8

    Two maps agree on location but differ in scale. Which approach is strongest?

    1) Treat the two maps as fully identical. 2) Compare only the colors of the legend. 3) Ignore the scale and read the labels. 4) Combine location with the scale gap. 5) Choose whichever map appears first.


    ## QUESTION 9

    A choice is true for the rate but overstates the level. What is the best judgment?

    1) Accept it because half of it is true. 2) Reject it because the level claim fails. 3) Accept it if the wording is detailed. 4) Ignore the level and keep the rate. 5) Replace the level with background data.


    ## QUESTION 10

    Which final check best protects a difficult rights-restriction item?

    1) Confirm one keyword in the correct option. 2) Confirm the answer is the longest option. 3) Confirm all options on purpose and means. 4) Confirm the positions are evenly spread. 5) Confirm the stem appears difficult enough.'
