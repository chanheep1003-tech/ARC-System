  student_manuscript: |-
    ## QUESTION 1
    Which reading is supported when a source states a limited condition?
    1) Extend the claim to every case. 2) Preserve the stated limitation. 3) Ignore the condition. 4) Replace the source with background knowledge. 5) Choose the most detailed sentence.

    ## QUESTION 2
    Two interpretations share one detail. What should decide between them?
    1) Option position. 2) Sentence length. 3) The full evidence chain and limiting condition. 4) Personal preference. 5) The number of nouns.

    ## QUESTION 3
    Which comparison method best avoids a half-true answer?
    1) Check only the common point. 2) Check common and contrasting axes together. 3) Select the familiar phrase. 4) Ignore the second source. 5) Use outside facts.

    ## QUESTION 4
    A choice correctly names a technique but gives the wrong effect. How should it be judged?
    1) Fully correct. 2) Correct if it is long. 3) Correct if the term appears in class. 4) Half-true and therefore rejected. 5) Correct when placed first.

    ## QUESTION 5
    When a speaker inference exceeds the observed fact, which review is required?
    1) Distinguish observation from inference. 2) Count punctuation. 3) Prefer the broadest claim. 4) Remove the source condition. 5) Choose the shortest answer.

    ## QUESTION 6
    Which evidence pattern supports a higher-level comparison?
    1) One isolated word only. 2) A title only. 3) Two relevant details linked to one judgment axis. 4) An unrelated biography. 5) A repeated phrase without context.

    ## QUESTION 7
    A new case changes one condition from the source. What must the solver do?
    1) Reapply the rule while tracking the changed condition. 2) Reuse the old answer unchanged. 3) Ignore the new case. 4) Choose the longest option. 5) Use an outside theory.

    ## QUESTION 8
    Two passages agree on a surface feature but differ in attitude. Which approach is strongest?
    1) Treat them as identical. 2) Compare only vocabulary. 3) Ignore attitude. 4) Integrate the shared feature and the attitude difference. 5) Choose the first passage.

    ## QUESTION 9
    A choice is true for passage A but overgeneralizes passage B. What is the best judgment?
    1) Accept because half is true. 2) Reject because the comparison claim fails for B. 3) Accept if it is detailed. 4) Ignore B. 5) Replace B with outside context.

    ## QUESTION 10
    Which final verification best protects a difficult comparison item?
    1) Confirm one keyword. 2) Confirm the answer is longest. 3) Confirm every option against all required evidence and conditions. 4) Confirm the answer position is balanced. 5) Confirm the stem looks difficult.
