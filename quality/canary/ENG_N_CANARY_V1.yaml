    ## QUESTION 2

    Two sentences share one blank. What must the shared word satisfy?

    1) The meaning of the first one only. 2) The meaning and form of both. 3) The spelling of a similar word. 4) The length of the longer sentence. 5) The position of the blank alone.


    ## QUESTION 3

    An underlined word is defined in English. Which definition fits?

    1) The one built from its prefix alone. 2) The one for its opposite meaning. 3) The one that fits this context. 4) The one from another context. 5) The one with the longest wording.


    ## QUESTION 4

    A subject is separated from its verb by a long clause. What is checked?

    1) The noun closest to the verb. 2) The tense of the relative clause. 3) The number of modifiers used. 4) The head noun of the subject. 5) The article before the verb.


    ## QUESTION 5

    Whole sentences are underlined for grammar. What must a solver do?

    1) Find the error inside each one. 2) Trust the first underlined one. 3) Count the words in each one. 4) Skip the longest underlined one. 5) Compare only the final words.


    ## QUESTION 6

    A blank repeats the main idea in other words. Which choice is right?

    1) The one copying a passage noun. 2) The one restating the main idea. 3) The one adding an outside fact. 4) The one reversing the conclusion. 5) The one naming a minor detail.


    ## QUESTION 7

