registry_id: ARC_CALIBRATION_ANCHOR_REGISTRY_V1.0
version: 1.0
date: 2026-11-08
status: ACTIVE_DEV
decision: D-23
purpose: >
  AI 풀이자의 난이도 눈금이 실제 시험의 난이도 표기와 얼마나 어긋나는지 재기 위한 기준 문항의 위치 목록이다.
  문항 원문은 저작물이라 저장소에 넣지 않는다. 풀이 평가를 돌릴 때 아래 Drive 파일에서 해당 문항을 읽어 원고 끝에
  ANCHOR-<id> 문항으로 붙이고, 풀이자 결과를 tooling/production/difficulty_calibration.py 에 넣는다.
label_to_level:            # 출판사 난이도 라벨 → 수치(2=D2, 3=D3, 4=D4)
  하: 2.0
  중하: 2.0
  중: 3.0
  중상: 3.5
  상: 4.0
limits: >
  라벨은 출판사 모의고사 해설의 주관 표기이며 학생 정답률이 아니다. 라벨과 ARC D 등급이 1:1로 대응한다는 보장은 없다.
  기준 문항이 4개 미만이거나 낮은 쪽(하)과 높은 쪽(상)이 모두 없으면 눈금 보정은 INSUFFICIENT_ANCHORS 이며 보정값을 적용하지 않는다.
