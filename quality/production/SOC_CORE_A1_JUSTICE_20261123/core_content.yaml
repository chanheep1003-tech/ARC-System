      text: '· 롤스는 불평등을 없애자고 하지 않는다. 제2원칙의 두 조건을 모두 갖춘 사회적·경제적 불평등은 정의롭다고 본다.

        · 허용되는 예: 의사에게 높은 보수를 주는 제도 덕분에 유능한 사람들이 의사가 되고, 그 결과 가난한 사람들도 더 나은 의료를 받는다면 최소 수혜자에게 이익이 되므로 허용된다.

        · 허용되지 않는 예: 부자를 더 부유하게 할 뿐 최소 수혜자의 처지를 나아지게 하지 못하는 불평등'
