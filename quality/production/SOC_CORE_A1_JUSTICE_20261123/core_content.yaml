      body: 교과서가 직접 결론을 제시한 사례(노예제 배상, 개발 제한 구역)는 교과서의 결론을 그대로 따른다. 그 밖의 사례에서 "롤스는 반드시 찬성한다"처럼 단정하는 선지는 조건을 확인해야 한다. 롤스의 찬성에는 '최소 수혜자에게 이익이 되는 한'이라는 조건이 붙는다.
