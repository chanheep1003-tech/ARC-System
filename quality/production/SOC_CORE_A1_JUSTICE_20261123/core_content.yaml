  - 'no': '07'
    heading: 노직 — 정당하게 얻었다면, 그 결과가 아무리 불평등해도 정의롭다
    blocks:
    - type: prose
      text: 노직도 출발점은 롤스와 같다. 개인의 자유와 권리를 보호하고 존중하는 것이 정의다. 그런데 노직은 그중에서도 소유 권리를 최대한 보장해야 한다고 강조한다(47쪽).
