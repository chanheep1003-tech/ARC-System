  - 'no': '05'
    heading: 롤스 ① — "내가 누가 될지 모른다면" 어떤 규칙을 고를까?
    blocks:
    - type: prose
      text: 이제 자유주의 안으로 들어간다. 롤스와 노직은 둘 다 자유주의자로, 개인의 자유와 권리를 보호하고 존중하는 것을 정의라고 본다. 47쪽 노직의 말도 "저도 개인의 자유와 권리를 보호하고 존중하는 것이 정의라고 생각합니다"로 시작한다. 그런데 '가난한 사람과 부자의 격차'를 두고 정반대 결론을 내린다. 이 차이를 이해하려면 먼저 롤스가 정의의 원칙을 어떻게 '만드는지'부터 봐야 한다.
    - type: callout
      label: 비유로 이해하기 — 케이크 자르기
      text: 케이크를 여러 명이 나누는데, 자르는 사람이 마지막 조각을 가져간다는 규칙이 있다고 하자. 자르는 사람은 최대한 똑같이 자를 것이다. 자기가 어떤 조각을 받을지 모르기 때문이다. 롤스의 생각도 같은 구조다.
    - type: steps
      label: 롤스가 정의의 원칙을 만드는 과정
      items:
      - title: 자신에 대한 정보를 가린다
        body: 사람들이 자신의 사회적 지위, 타고난 신체적·정신적 재능, 심리적 특성, 가치관을 모른다고 가정한다(47쪽).
      - title: 그 상태에서 규칙을 고른다
        body: 내가 부자로 태어날지 가난하게 태어날지, 재능이 많을지 적을지 모르니 특정 집단에게만 유리한 규칙을 고를 이유가 없다.
      - title: 이렇게 나온 원칙이 가장 공정하다
        body: 공정한 상황에서 합의한 원칙이므로 가장 공정한 정의의 원칙이 된다.
    - type: callout
      style: key
      label: 용어 연결 — 원초적 입장과 무지의 베일
      text: '· 원초적 입장: 위와 같은 가상의 출발 상황

        · 무지의 베일: 자신에 대한 정보를 가리는 장치

        · 교과서 본문에는 두 용어가 직접 나오지 않고 상황 설명만 나온다. 그러나 시험 제시문에는 용어나 비슷한 설명이 자주 쓰이므로 반드시 연결해 두자.'
    - type: callout
      label: 교과서 38쪽 — 롤스 『정의론』 구절 (롤스를 가려내는 강력한 단서)
      text: '· 사회 제도의 제1덕목은 정의다.

        · 법이나 제도가 아무리 효율적이어도 정당하지 못하면 개선되거나 폐기되어야 한다.

        · 모든 사람은 전체 사회의 복지를 이유로도 침해될 수 없는 기본적 권리를 가진다.

        · 타인이 갖게 될 큰 선을 위해 소수의 자유를 빼앗는 것은 정당화될 수 없다.'
    - type: callout
      label: 심화 · 고2 생활과 윤리 — 원초적 입장의 당사자는 어떤 사람인가
      text: '· 롤스는 당사자를 ''합리적이고, 서로에게 무관심한'' 사람으로 가정한다. 이타심 때문에 약자를 배려하는 것이 아니다.

        · 내가 최악의 처지가 될 수도 있으니, 합리적으로 계산하면 최악의 처지를 최대한 낫게 만드는 원칙을 고른다. 이것이 ''최소 극대화(maximin) 전략''이다.

        · 공정한 절차에서 합의된 결과라면 그 결과도 공정하다고 본다. 그래서 그의 정의관을 ''공정으로서의 정의''라고 부른다.'
