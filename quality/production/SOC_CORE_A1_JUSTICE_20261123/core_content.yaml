      label: '심화 — 38쪽 구절이 겨냥하는 것: 다수의 행복을 위한 소수의 희생'
      text: '"전체 사회의 복지를 이유로도 침해될 수 없는 권리", "큰 선을 위해 소수의 자유를 빼앗는 것은 정당화될 수 없다"는 사회 전체의 행복의 총량만을 기준으로 삼는 관점(공리주의)을 비판하는 말이다. 롤스는 행복의 총합이 커지더라도 개인의 기본적 권리를 희생시키는 것은 부정의하다고 본다.

        시험 포인트: "롤스는 사회 전체의 복지 증진을 위해서라면 개인의 기본적 자유를 제한할 수 있다고 본다" → ×'
