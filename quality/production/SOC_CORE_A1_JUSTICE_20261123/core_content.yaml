units:
- unit_kicker: A파트 · CORE 01 · 교과서 44~49쪽
  title: 자유주의와 공동체주의 정의관 — 롤스와 노직을 중심으로
  sections:
  - 'no': '01'
    heading: 조상의 잘못을 후손이 책임져야 할까? — 이 장 전체를 꿰는 질문
    blocks:
    - type: prose
      text: 교과서는 이 단원을 미국의 노예제 배상 논쟁으로 시작한다(44쪽). 200년 전 조상이 흑인 노예를 소유했던 잘못에 대해, 지금 살아 있는 후손이 사과하고 배상해야 할까? 두 입장을 나란히 놓고 보자.
    - type: contrast
      left_title: 반대 — "후손에게 책임 없다"
      left_body: 배상 책임은 잘못한 사람에게만 있다. 지금의 미국인은 노예를 소유한 적이 없다. 인간은 공동체 구성원이기 이전에 자유롭고 독립된 존재이므로, 자기가 선택한 일에만 책임지면 된다.
      right_title: 찬성 — "후손에게 책임 있다"
      right_body: 독일은 조상이 저지른 유대인 학살을 후손이 사과하고 배상했다. 인간은 특정 공동체의 일원으로서 역사적 유산과 책무를 물려받는다. 그러므로 지금의 미국인에게도 책임이 있다.
    - type: callout
      style: key
      label: 두 사람은 무엇 때문에 갈리는가
      text: '· 사실관계 때문이 아니다. 노예제가 있었다는 사실은 둘 다 인정한다.

        · 갈리는 것은 인간관이다. ''나는 공동체와 떨어져서도 나인가, 공동체의 역사 속에서만 나인가?''

        · 왼쪽 입장 = 자유주의, 오른쪽 입장 = 공동체주의'
    - type: prose
      text: 이 단원 시험 문제의 대부분은 '이 진술은 누구의 것인가', '이 사람은 이 사례를 어떻게 판단할까'를 묻는다. 그러니 각 사상가가 무엇을 근거로 결론을 내리는지 이해해 두는 것이 가장 확실한 대비다.
    - type: steps
      label: 이 장을 읽는 요령 — 3단계
      items:
      - title: 개인 vs 공동체
        body: 먼저 이 축으로 자유주의와 공동체주의를 가른다.
      - title: 불평등을 허용하는 조건
        body: 자유주의 안에서 이 축으로 롤스와 노직을 가른다.
      - title: 사례에 적용
        body: 누구의 권리·자유가 걸렸나 → 공동체의 어떤 가치가 걸렸나 → 분배 결과가 누구에게 유리한가를 순서대로 확인한다.
  - 'no': '02'
    heading: 자유주의 — 개인이 먼저고, 국가는 개인을 지키는 도구다
    blocks:
    - type: prose
      text: 자유주의는 무엇보다 개인의 자유와 권리를 중시하는 사상이다(45쪽). 자유주의의 인간관은 세 문장으로 정리된다.
    - type: steps
      label: 자유주의의 인간관
      items:
      - title: 천부 인권을 지닌 존엄한 존재
        body: 모든 인간은 태어날 때부터 인권을 가진다. 그러니 타인이나 사회의 간섭을 받지 않고 원하는 삶을 살 수 있다.
      - title: 스스로 선택하는 독립적 존재
        body: 인간은 합리적 이성으로 삶의 목적을 스스로 선택한다.
      - title: 선택이 만드는 자아 정체성
        body: 자아 정체성은 공동체가 정해 준 역할보다 '내가 무엇을 선택했는가'로 만들어진다.
    - type: callout
      style: key
      label: 핵심 정리 — 이 인간관에서 나오는 결론
      text: '· 우선순위 ①: 국가나 사회보다 개인이 먼저다.

        · 우선순위 ②: 공동선(공동체 전체의 이익·목표)보다 개인선(개인의 이익·목표)이 먼저다.

        · 국가의 역할: 개인의 자유와 권리를 보호·증진하는 ''수단''이다. 좋은 삶을 정해 주지 않고 중립을 지키며 개인의 자유로운 삶을 최대한 허용한다.

        · 정의로운 상태: 개인이 자유와 권리를 최대한 누리며 개인선을 실현하는 상태

        · 노예제 배상: 조상의 행위와 후손은 관계가 없으므로 후손에게 사과·배상 책임이 없다.'
    - type: callout
      label: 교과서 속 사상가 — 밀
      text: '"생각과 의견의 자유, 결사의 자유, 자기 개성에 맞게 삶을 설계할 자유가 존중되지 않는 사회는 자유로운 사회가 아니다."

        교과서 설명: 밀은 타인에게 영향을 미치지 않는 행위에 대해서는 개인에게 절대적 자유를 인정한 자유주의 사상가다.'
    - type: callout
      label: 심화 · 고2 생활과 윤리 — 밀의 해악의 원리
      text: '밀은 국가나 사회가 개인의 자유를 간섭해도 되는 경우를 ''타인에게 해악을 끼치는 경우''로 한정했다. 이것을 해악의 원리라고 한다. 반대로 자기 자신에게만 관련된 행위는 본인에게 해롭더라도 강제로 막아서는 안 된다고 보았다.

        시험 포인트: 자유주의는 ''무엇이든 해도 된다''는 사상이 아니다. "자유주의는 타인에게 해를 끼치는 행위도 개인의 자유로 허용한다" → ×'
    - type: callout
      label: 교과서 적용 사례 — 청소년 SNS 보호 기능(45쪽)
      text: 부모가 자녀의 메신저 사용을 확인할 수 있는 기능이 추가되었다. 자유주의 관점에서는 청소년의 자율성과 선택권이 침해될 수 있다는 점을 먼저 문제 삼는다. 다만 범죄 피해라는 타인의 해악을 막으려는 목적도 있으므로, 자유주의 안에서도 간섭이 어디까지 정당한지가 쟁점이 된다.
    - type: disc
      title: 헷갈림 주의 — 자유주의 ≠ 이기주의, 자유주의 ≠ 공동체 부정
      body: '· 자유주의도 공동체와 국가가 필요하다고 본다. 다만 공동체를 개인의 권리를 지키는 ''수단''으로 본다. "자유주의는 국가와 공동체의 존재 가치를 부정한다" → × (과장)

        · 자유주의는 자기 이익만 추구하라는 이기주의가 아니다. 모든 개인의 동등한 자유와 권리를 존중하라는 사상이다.'
  - 'no': '03'
    heading: 공동체주의 — 나는 공동체의 이야기 속에서만 '나'다
    blocks:
    - type: prose
      text: 공동체주의는 인간의 삶이 공동체에 뿌리를 두고 있음을 강조한다(46쪽). 공동체주의에 따르면 공동체와 분리되어 독립적으로 존재하는 개인은 있을 수 없다. 예를 들어 '나'를 설명하려면 누구의 자식인지, 어느 학교 학생인지, 어느 나라 국민인지 같은 공동체 속 역할을 빼놓을 수 없다.
    - type: steps
      label: 공동체주의의 인간관
      items:
      - title: 공동체 안에서 태어나는 존재
        body: 인간은 가족·지역·민족·국가 같은 특정한 공동체 안에서 태어난다.
      - title: 공동체의 덕목을 실천하는 존재
        body: 그 공동체의 구성원으로서 공동체의 덕목을 실천하며 살아간다.
      - title: 역할이 만드는 자아 정체성
        body: 주어진 사회적 역할을 수행하면서 자아 정체성이 형성된다.
    - type: callout
      style: key
      label: 핵심 정리 — 자유주의와 반대가 되는 우선순위
      text: '· 우선순위: 개인보다 공동체가, 개인선보다 공동선이 먼저다.

        · 공동체의 의미: 개인의 권리를 지키는 단순한 도구가 아니라 좋은 삶을 살기 위한 중요한 기반이다.

        · 사회의 역할: 개인이 공동체의 가치와 목적을 내면화하고 책임과 의무를 다하도록 장려한다.

        · 정의로운 상태: 구성원이 유대감을 바탕으로 역할과 의무를 다하며 공동선을 실현하는 상태

        · 노예제 배상: 후손의 정체성은 공동체의 역사와 분리될 수 없고, 사회적 책무도 공동체의 역사와 전통에서 물려받는다. 그러므로 후손에게도 사과·배상 책임이 있다.'
    - type: callout
      label: 교과서 속 사상가 — 매킨타이어(46~47쪽)
      text: '· "내 삶의 역사는 내가 정체성을 끌어내는 공동체의 역사 속에 편입되어 있다."

        · 나는 가족·도시·민족·국가로부터 빚과 유산, 기대와 의무를 물려받으며, 이것이 ''내 도덕의 출발점''이다.

        · 현대 사회의 분열은 인간을 자유롭고 독립적인 존재로만 보는 자유주의적 인간관에서 비롯되었다고 비판했다.'
    - type: callout
      label: 심화 · 고3 윤리와 사상 — 서사적 자아와 연고적 자아
      text: '· 매킨타이어는 인간을 ''이야기(서사)를 가진 존재''로 본다. 내 삶의 이야기는 공동체의 더 큰 이야기 속에서만 의미를 가진다.

        · 샌델(교과서 41·58쪽에 인용된 『공정하다는 착각』, 『정의란 무엇인가』의 저자)은 자유주의가 가정하는 인간이 공동체의 유대와 애착이 모두 벗겨진 ''무연고적 자아''라고 비판했다. 실제 인간은 가족·민족·국가와 묶인 ''연고적 자아''라는 것이다.'
    - type: callout
      label: 교과서 적용 사례 — 소각장과 님비 현상(46쪽)
      text: 모두가 소각장이 필요하다고 인정하지만, 정작 '우리 동네에는 안 된다'고 반대하는 것이 님비 현상이다. 공동체주의 관점에서는 공동선(쓰레기 처리)을 위해 구성원이 책임을 나누어야 하므로, 님비 현상을 공동체 의식이 약해진 결과로 본다. 교과서는 이천시가 님비를 극복하고 소각장을 광역화한 사례를 함께 소개한다.
    - type: disc
      title: 헷갈림 주의 — 공동체주의 ≠ 전체주의
      body: 공동체주의는 개인의 권리를 없애자는 사상이 아니다. 개인의 정체성과 좋은 삶이 공동체 안에서 형성된다고 보고, 공동선에 우선순위를 둘 뿐이다. "공동체주의는 개인의 권리를 인정하지 않는다", "공동체주의는 국가가 개인을 전면 통제해야 한다고 본다" → ×
  - 'no': '04'
    heading: 두 정의관 한눈에 비교 — 그리고 교과서의 결론은 '상호 보완'
    blocks:
    - type: prose
      text: 두 정의관의 차이는 결국 하나의 질문으로 모인다. 개인이 먼저인가, 공동체가 먼저인가? 아래 표의 모든 칸이 이 질문에서 나온다.
    - type: table
      caption: 비교표 — 자유주의 vs 공동체주의
      headers:
      - 비교 기준
      - 자유주의적 정의관
      - 공동체주의적 정의관
      weights:
      - 1.0
      - 1.6
      - 1.6
      rows:
      - - 인간관
