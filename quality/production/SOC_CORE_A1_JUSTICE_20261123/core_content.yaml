      text: 노인 지하철 무료 승차(42쪽)나 장애인 의무 고용 제도(57쪽)도 같은 방식으로 판단한다. 롤스는 지지 근거를, 노직은 강제 부담에 대한 반대 근거를 찾기 쉽다.
    - type: disc
