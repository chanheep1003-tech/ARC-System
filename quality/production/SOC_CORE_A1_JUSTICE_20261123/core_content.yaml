      style: key
      label: 선지 분석 사용법
      text: 각 선지의 O/× 판단과 이유를 확인하자. [ ] 안은 함정 유형이다. 이유를 가리고 먼저 판단한 뒤 확인하면 효과가 가장 좋다.
    - type: checks
      items:
      - statement: ① 자유주의는 개인이 공동체에 앞서 존재하는 독립적 존재라고 본다. → ○
        why: 교과서 45쪽. 합리적 이성으로 삶의 목적을 선택하는 독립적 존재.
      - statement: ② 자유주의는 국가가 특정한 좋은 삶의 방식을 적극적으로 장려해야 한다고 본다. → ×
        why: '[관점 바꿔치기] 자유주의 국가는 중립적 입장에서 개인의 자유로운 삶을 최대한 허용한다. 공동체 가치의 내면화를 장려하는 것은 공동체주의다.'
      - statement: ③ 공동체주의는 개인의 자아 정체성이 사회적 역할 수행을 통해 형성된다고 본다. → ○
        why: 교과서 46쪽.
      - statement: ④ 자유주의는 공동선이 개인선보다 우선한다고 본다. → ×
        why: '[역전] 자유주의는 개인선 > 공동선. 교과서 단원 퀴즈(60쪽)에서도 묻는 내용이다.'
      - statement: ⑤ 공동체주의는 공동체를 개인의 권리를 보호하기 위한 수단으로만 본다. → ×
        why: '[역전] 공동체를 수단으로 보는 쪽은 자유주의다. 공동체주의에게 공동체는 좋은 삶의 중요한 기반이다.'
      - statement: ⑥ 공동체주의는 개인의 권리와 자유를 전면 부정한다. → ×
        why: '[과장] 공동선에 우선순위를 둘 뿐, 개인의 권리 자체를 부정하지 않는다.'
      - statement: ⑦ 자유주의적 관점에서는 과거 조상의 잘못에 대해 후손이 배상할 책임이 없다. → ○
        why: 교과서 45쪽의 결론. 조상의 행위와 후손은 무관하다.
      - statement: ⑧ 공동체주의적 관점에서는 후손이 공동체의 역사로부터 책무를 물려받는다고 본다. → ○
        why: 교과서 46쪽, 매킨타이어(47쪽).
      - statement: ⑨ 자유주의는 타인에게 해를 끼치는 행위까지 개인의 자유로 보장한다. → ×
        why: '[과장] 밀은 타인에게 영향을 미치지 않는 행위에 대해서만 절대적 자유를 인정했다(심화: 해악의 원리).'
      - statement: ⑩ 두 정의관은 개인의 행복과 정의로운 사회를 지향한다는 점에서 상호 보완적이다. → ○
        why: 교과서 48쪽.
      - statement: ⑪ 개발 제한 구역에 대해 공동체주의는 토지 소유자의 재산권 침해를 이유로 반대할 것이다. → ×
        why: '[관점 바꿔치기] 재산권 침해를 우려하는 쪽은 자유주의다. 공동체주의는 환경 보호 의무를 근거로 정책이 필요하다고 본다.'
      - statement: ⑫ 매킨타이어는 현대 사회의 분열이 자유주의적 인간관에서 비롯되었다고 비판한다. → ○
        why: 교과서 46쪽 사진 설명.
      - statement: ⑬ 공동체주의 관점에서 님비 현상은 공동선보다 개인의 이익을 앞세운 사례로 비판받을 수 있다. → ○
        why: 교과서 46쪽 탐구 질문의 정당한 적용.
      - statement: ⑭ 교과서에 따르면 권리만 강조하고 의무를 회피해도 개인의 권리는 충분히 보장된다. → ×
        why: '[결론 뒤집기] 권리는 의무를 전제로 한다. 의무를 회피하면 누구도 자신의 권리조차 누릴 수 없다(48쪽).'
      - statement: ⑮ 자유주의는 자아 정체성이 공동체가 부여한 역할보다 개인의 선택으로 이루어진다고 본다. → ○
        why: 교과서 45쪽, 47쪽 매킨타이어 인용 속 자유주의 설명.
  - 'no': '13'
    heading: 선지 분석 ② — 롤스와 노직 (고난도 집중)
    blocks:
    - type: callout
      style: key
      label: 선지 분석 사용법
      text: 롤스와 노직 문항은 '반만 맞는 진술'과 '조건을 뺀 진술'로 변별한다. 문장의 앞부분이 맞아도 마지막 단어 하나로 ×가 되는 경우가 많으니 끝까지 읽자.
    - type: checks
      items:
      - statement: ① 롤스와 노직은 모두 개인의 자유와 권리를 보호하는 것을 정의라고 본다. → ○
        why: 교과서 47쪽 대담. 둘 다 자유주의자.
      - statement: ② 롤스는 사람들이 자신의 사회적 지위와 재능을 모르는 상황에서 정의의 원칙이 도출된다고 본다. → ○
        why: 교과서 47쪽. 원초적 입장·무지의 베일.
      - statement: ③ 롤스는 모든 사회적·경제적 불평등이 부정의하다고 본다. → ×
        why: '[과장] 두 조건(차등의 원칙, 기회균등의 원칙)을 충족한 불평등은 허용된다.'
      - statement: ④ 롤스는 최소 수혜자에게 최대의 이익이 되는 불평등을 허용한다. → ○
        why: 차등의 원칙.
      - statement: ⑤ 롤스는 사회 구성원 모두가 같은 몫의 소득을 갖는 것이 정의라고 본다. → ×
        why: '[과장] 결과적 평등을 목표로 하지 않는다.'
      - statement: ⑥ 롤스는 사회 전체의 이익을 증진할 수 있다면 소수의 기본적 자유를 제한할 수 있다고 본다. → ×
        why: '[핵심 함정] 교과서 38쪽 "타인이 갖게 될 큰 선을 위하여 소수의 자유를 빼앗는 것이 정당화될 수 없다".'
      - statement: ⑦ 롤스에 따르면 차등의 원칙이 평등한 자유의 원칙보다 우선 적용된다. → ×
        why: '[순서 뒤집기 · 심화] 평등한 자유의 원칙이 최우선이다.'
      - statement: ⑧ 롤스에 따르면 불평등의 계기가 되는 직책과 지위는 모든 사람에게 개방되어야 한다. → ○
        why: 기회균등의 원칙.
      - statement: ⑨ 롤스는 최소 수혜자의 이익만 보장된다면 직책이 일부에게만 개방되어도 정당하다고 본다. → ×
        why: '[조건 누락] 제2원칙의 두 조건을 모두 충족해야 한다. 기회균등이 차등보다 우선한다(심화).'
      - statement: ⑩ 노직은 정당하게 취득하거나 양도받은 소유물에 대해 개인은 소유 권리를 가진다고 본다. → ○
        why: 교과서 47쪽.
      - statement: ⑪ 노직은 취득과 양도의 원칙이 지켜졌다면 빈부 격차는 문제가 되지 않는다고 본다. → ○
        why: 교과서 47쪽.
      - statement: ⑫ 노직은 최소 수혜자에게 최대 이익을 보장하는 것이 정의라는 데 동의한다. → ×
        why: '[사상가 바꿔치기] 노직은 "동의하기 어렵다"고 말했다(47쪽).'
      - statement: ⑬ 노직은 개인이 자신의 소유물을 어떻게 사용할지는 개인의 자유로운 선택에 맡겨야 한다고 본다. → ○
        why: 교과서 47쪽.
      - statement: ⑭ 노직은 국가가 존재해서는 안 된다고 본다. → ×
        why: '[과장 · 심화] 최소 국가를 인정한다. 무정부주의가 아니다.'
      - statement: ⑮ 노직은 부정의하게 취득한 소유물도 현재 소유자의 정당한 권리로 인정한다. → ×
        why: '[조건 누락] 정당한 취득·양도가 전제다. 심화: 부정의는 교정의 원칙으로 바로잡는다.'
      - statement: ⑯ 노직은 개인의 자발적인 기부를 소유 권리의 정당한 행사로 볼 수 있다. → ○
        why: 소유물의 사용은 개인의 자유로운 선택. 반대하는 것은 국가의 강제 재분배다.
      - statement: ⑰ 노직은 재분배를 목적으로 한 국가의 과세가 개인의 소유 권리를 침해할 수 있다고 본다. → ○
        why: '심화: 노동 소득에 대한 과세를 강제 노동에 비유하였다.'
      - statement: ⑱ 롤스는 타고난 재능에 따른 이익을 전적으로 재능을 가진 개인의 것으로 본다. → ×
        why: '[사상가 바꿔치기 · 심화] 이것은 노직에 가깝다. 롤스는 재능을 도덕적으로 우연한 것으로 보고 그 이익이 최소 수혜자에게도 돌아가게 하려 한다.'
      - statement: ⑲ 롤스와 달리 노직은 분배의 결과보다 소유가 이루어진 과정을 중시한다. → ○
        why: '심화: 노직은 역사적(과정) 원리를 중시하고 정형적(결과) 분배에 반대한다.'
      - statement: ⑳ 노직과 달리 롤스는 사회적 약자를 위한 복지 제도를 정당화할 수 있다. → ○
        why: 최소 수혜자의 처지를 개선하는 제도는 차등의 원칙으로 정당화된다.
      - statement: ㉑ 롤스와 노직은 모두 사회 계층 간 격차를 줄이는 것을 정의의 최우선 목표로 삼는다. → ×
        why: '[과장] 노직은 격차 자체를 문제 삼지 않는다. 롤스도 격차 축소 자체가 아니라 최소 수혜자의 처지를 기준으로 판단한다(05절 사회 을 사례).'
      - statement: ㉒ (상속세) 노직은 부모가 정당하게 모은 재산을 자녀에게 물려주는 것을 정당한 양도로 볼 것이다. → ○
        why: 양도의 원칙의 정당한 적용.
      - statement: ㉓ (상속세) 롤스는 상속세를 어떤 경우에도 부정의하다고 볼 것이다. → ×
        why: '[단정] 출생이라는 우연에서 오는 불평등을 줄이고 최소 수혜자에게 이익이 된다면 정당화할 수 있다.'
      - statement: ㉔ 공동체주의자는 롤스가 가정한 당사자를 공동체의 연고를 벗어난 자아라고 비판할 수 있다. → ○
        why: '심화: 샌델의 무연고적 자아 비판.'
      - statement: ㉕ 공동체주의자는 롤스가 평등한 자유를 무시한다고 비판할 것이다. → ×
        why: '[허수아비 비판] 롤스는 평등한 자유를 최우선 원칙으로 둔다. 비판은 상대의 실제 전제를 겨냥해야 한다.'
      - statement: '㉖ 노직이 롤스에게 제기할 비판: "최소 수혜자를 위한 강제 재분배는 정당하게 소유한 사람의 권리를 침해한다." → ○'
        why: 롤스의 실제 주장(차등의 원칙)을 노직의 전제(소유 권리)로 공격하는 정확한 비판.
      - statement: '㉗ 롤스가 노직에게 제기할 비판: "정당한 과정만 따지면 우연에 의한 불평등이 방치된다." → ○'
        why: '심화: 타고난 재능·환경의 우연성을 근거로 한 롤스의 비판.'
      - statement: '㉘ 노직이 롤스에게 제기할 비판: "당신은 개인을 공동체의 역사 속에 묶인 존재로 본다." → ×'
        why: '[비판 방향 오류] 이것은 롤스의 입장도, 노직의 비판 근거도 아니다. 공동체주의적 인간관이다.'
  - 'no': '14'
    heading: 서술형 대비 — 근거와 결론을 잇는 답안 틀
    blocks:
    - type: prose
      text: A파트에는 서술형이 1문항 출제된다. 사상가 비교 서술형은 아래 세 요소를 빠짐없이 쓰면 채점 기준을 대부분 충족한다.
    - type: steps
      label: 답안의 세 요소
      items:
      - title: 입장
        body: 그 사상가가 사례를 어떻게 평가하는가 (정당하다 / 부당하다, 조건부라면 조건까지)
      - title: 근거
        body: 사상가 이름 대신 핵심 개념어(차등의 원칙, 최소 수혜자, 취득과 양도의 원칙, 공동선, 개인선)를 정확히 쓴다.
      - title: 사례 적용
        body: 근거가 이 사례의 어떤 부분과 연결되는지 한 문장으로 잇는다.
    - type: callout
      style: key
      label: 예시 문제 — 롤스와 노직이 상속세 강화 정책을 어떻게 평가할지 각각의 근거와 함께 서술하시오.
      text: '[롤스] 롤스는 사회적·경제적 불평등이 최소 수혜자에게 최대의 이익이 될 때만 허용된다는 차등의 원칙을 주장한다. 따라서 상속세가 출생 환경에 따른 불평등을 줄이고 그 세수가 최소 수혜자의 처지를 개선하는 데 쓰인다면 상속세 강화를 정당하다고 평가할 것이다.

        [노직] 노직은 정당한 취득과 양도의 원칙이 지켜진 소유물에 대해 개인은 소유 권리를 가지며, 그 결과 나타난 빈부 격차는 문제가 되지 않는다고 본다. 따라서 정당하게 모은 재산을 자녀에게 물려주는 것은 정당한 양도이며, 이를 재분배하기 위한 상속세 강화는 소유 권리를 침해한다고 평가할 것이다.'
    - type: disc
      title: 감점 포인트
      body: '· "롤스는 평등을 중시해서 찬성한다"처럼 조건(최소 수혜자에게 이익) 없이 쓰기

        · 노직의 근거를 ''자유''라고만 쓰고 ''소유 권리, 취득·양도의 정당성''을 빼기

        · 노직이 "부자가 되어야 한다"고 주장한다고 쓰기 (노직은 결과를 정당화 근거로 삼지 않는다)'
  - 'no': '15'
    heading: 한 장 정리 — 판단 기준 세 개로 끝내기
    blocks:
