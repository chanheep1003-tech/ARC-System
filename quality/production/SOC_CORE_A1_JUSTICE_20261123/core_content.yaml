      label: 노직의 논리 (교과서 47쪽)
      items:
      - title: 취득의 원칙
        body: 다른 사람에게 피해를 주지 않고 정당하게 소유물을 얻었다면, 그 소유물에 대한 권리를 가진다.
      - title: 양도의 원칙
        body: 정당하게 넘겨받은 소유물에 대해서도 권리를 가진다.
      - title: 사용은 개인의 자유
        body: 그 소유물을 어떻게 쓸지는 전적으로 그 사람의 자유로운 선택에 맡겨야 한다.
      - title: 빈부 격차는 문제가 아니다
        body: 취득·양도의 원칙이 지켜졌다면 빈부 격차가 생기는 것은 문제가 되지 않는다.
    - type: callout
      style: key
      label: 노직의 판단 기준 — 결과의 모양이 아니라 과정의 역사
      text: '· 노직은 롤스의 차등의 원칙("최소 수혜자에게 최대의 이익을 보장해야 한다")에 동의하지 않는다고 분명히 말한다.

        · 정의로운지 판단할 때 ''지금 누가 얼마를 가졌는가''(결과)를 보지 않고, ''그것을 어떤 과정으로 얻었는가''(역사)를 본다.'
    - type: callout
      label: 예시로 이해하기 — 가수의 공연
      text: '· 관객 100만 명이 스스로 원해서 1만 원씩 내고 공연을 봤다. 가수는 큰 부자가 되었고 빈부 격차는 커졌다.

        · 노직의 판단: 아무도 강제당하지 않았고 모두가 자기 돈을 자유롭게 썼다. 그러므로 이 결과는 정의롭다.

        · 이 가수의 돈을 세금으로 거두어 가난한 사람에게 나눠 주라고 강제한다면, 그것이야말로 소유 권리를 침해하는 부정의다.'
    - type: callout
      label: '심화 · 고2 생활과 윤리 — 노직의 세 번째 원칙: 교정의 원칙'
      text: '· 교과서에는 취득과 양도의 원칙만 나오지만, 노직은 세 번째로 교정의 원칙을 제시했다. 도둑질이나 사기처럼 취득·양도가 부정의하게 이루어졌다면 그 부정의를 바로잡아야 한다는 원칙이다.

        · 시험 포인트: 노직은 ''모든'' 재분배에 반대하지 않는다. 과거의 부정의한 취득을 바로잡기 위한 재분배는 인정할 수 있다. "노직은 어떠한 경우에도 소유물의 재분배를 인정하지 않는다" → ×

        · 주의: 교과서는 노예제 배상 사례에서 ''자유주의 = 후손 책임 없음''으로 정리한다(45쪽). 교과서 범위 문항은 이 정리를 따른다.'
    - type: table
      caption: 심화 — 노직을 더 정확히 이해하는 세 개념
      headers:
      - 개념
      - 내용
      weights:
      - 1.0
      - 3.0
      rows:
      - - 로크적 단서
        - 주인 없는 것을 처음 차지할 때(취득) 그 때문에 다른 사람의 처지가 나빠져서는 안 된다는 조건. 취득 원칙에 붙는 제한이다.
      - - 최소 국가
        - 노직은 무정부주의자가 아니다. 폭력·절도·사기로부터 개인을 보호하고 계약 이행을 강제하는 역할에 그치는 국가만 정당하다. 그보다 많은 일, 특히 재분배를 위한 과세는 권리 침해다.
      - - 과세와 강제 노동
        - 노동 소득에 대한 재분배 목적의 과세는 강제 노동과 다르지 않다. 내가 일한 시간의 일부를 남을 위해 강제로 일하게 하는 것과 같다는 뜻이다.
    - type: disc
      title: 헷갈림 주의 — 노직은 가난한 사람을 돕는 것 자체를 반대할까?
      body: 아니다. 노직이 반대하는 것은 국가가 '강제로' 재분배하는 것이다. 개인이 자기 소유물을 자발적으로 기부하는 것은 노직의 원칙(소유물 사용은 개인의 자유로운 선택)에 비추어 얼마든지 정당하다. "노직은 자발적 기부와 자선도 부정의하다고 본다" → ×
  - 'no': 08
    heading: 롤스 vs 노직 — 쟁점별 정면 대결
    blocks:
    - type: prose
      text: 두 사람의 공통점과 차이점을 쟁점별로 맞대어 보자. 교과서 47쪽 탐구 활동도 정확히 이것을 묻는다.
    - type: callout
      style: key
      label: 공통점
      text: '· 둘 다 자유주의자로서 개인의 자유와 권리를 보호하고 존중하는 것을 정의로 본다.

        · 둘 다 국가의 존재를 인정한다.

        · 둘 다 사회 전체의 이익을 이유로 개인을 희생시키는 것에 반대한다.'
    - type: contrast
      left_title: 롤스 — 결과가 최소 수혜자에게 어떤가
      left_body: 공정한 출발 조건(무지의 베일)에서 합의한 원칙을 따른다. 불평등은 최소 수혜자에게 최대 이익이 되고 기회가 모두에게 열려 있을 때만 허용한다. 재능은 우연이므로 그 이익을 사회가 함께 나누도록 제도화한다.
      right_title: 노직 — 소유의 과정이 정당했는가
      right_body: 정당한 취득·양도라면 그 소유는 정당하다. 결과로 나타난 빈부 격차는 문제 삼지 않는다. 재능과 그 성과는 그 사람의 것이다. 강제적 재분배는 권리 침해다.
    - type: callout
      label: 그래서 결론이 갈린다
      text: '· 롤스: 복지 제도나 재분배 정책처럼 최소 수혜자의 처지를 개선하는 국가의 역할을 정당화할 수 있다.

        · 노직: 재분배를 위한 강제 과세를 소유 권리 침해로 보고 최소 국가를 주장한다.'
    - type: table
      caption: 쟁점별 비교표
      headers:
      - 쟁점
      - 롤스
      - 노직
      weights:
      - 1.0
      - 1.7
      - 1.7
      rows:
      - - 사상적 위치
        - 자유주의 (평등을 함께 중시하는 자유주의)
        - 자유주의 (소유권을 최우선하는 자유 지상주의)
      - - 정의 판단의 기준
        - 공정한 절차에서 합의된 원칙에 맞는가
        - 소유물의 취득·양도 과정이 정당한가
      - - 빈부 격차
        - 최소 수혜자에게 이익이 될 때만 허용
        - 정당한 과정을 거쳤다면 문제 되지 않음
      - - 최소 수혜자
        - 최대 이익을 보장해야 함 (차등의 원칙)
        - 최대 이익 보장에 동의하지 않음
      - - 타고난 재능 (심화)
        - 도덕적으로 우연, 사회의 공동 자산처럼 다룸
        - 자기 소유, 그 성과도 본인 권리
      - - 국가의 역할 (심화)
        - 복지·재분배 제도로 최소 수혜자 처지 개선
        - 최소 국가 (보호·계약 집행)
      - - 재분배 과세 (심화)
        - 조건을 갖추면 정당화 가능
        - 강제 노동과 다르지 않은 권리 침해
      - - 재분배를 전면 부정하는가
        - 아니다 — 오히려 정당화
        - 아니다 — 교정의 원칙, 자발적 기부는 인정
    - type: disc
      title: 최다 빈출 함정 4가지
      body: '① "롤스는 평등을 위해 자유를 제한한다" → ×. 제1원칙(평등한 자유)이 최우선이다.

        ② "롤스는 결과적으로 모두가 똑같이 가져야 한다고 본다" → ×. 최소 수혜자에게 이익이 되는 불평등을 허용한다.

        ③ "노직은 국가가 필요 없다고 본다" → ×. 최소 국가를 인정한다.

        ④ "노직은 모든 재분배를 반대한다" → ×. 교정의 원칙과 자발적 기부는 인정한다.'
  - 'no': 09
    heading: 심화 — 공동체주의는 롤스와 노직에게 무엇을 따질까?
    blocks:
    - type: prose
      text: 롤스와 노직은 결론이 정반대지만, 공동체주의자가 보기에는 같은 약점을 공유한다. 둘 다 '공동체와 떨어진 독립적 개인'을 출발점으로 삼는다는 점이다.
    - type: contrast
      left_title: 롤스에 대한 비판
      left_body: 무지의 베일 속 당사자는 자신의 가치관·소속·역사를 모르는 존재다. 샌델은 이를 '무연고적 자아'라고 비판했다. 연고를 모두 벗겨 낸 사람이 합의한 원칙이 현실 공동체에 맞을 리 없다는 것이다.
      right_title: 노직에 대한 비판
      right_body: 소유 권리론은 개인이 공동체에 지는 책무를 충분히 설명하지 못한다. 공동체주의에서는 개인이 공동체 안에서 역할과 의무를 물려받으므로, 부의 사용에도 공동체에 대한 책임이 따른다.
    - type: callout
      style: key
      label: 시험 형식 — "갑이 을에게 제기할 비판"
      text: '· 정답은 을의 ''실제 전제''를 겨냥해야 한다.

        · 예: 롤스에게 "당신은 개인의 자유를 무시한다"고 비판하는 선지는 오답이다. 롤스는 평등한 자유를 최우선으로 두었기 때문이다.'
    - type: steps
      label: 비판 선지를 고르는 순서
      items:
      - title: 비판받는 사람(을)의 실제 주장을 떠올린다
        body: 예를 들어 을이 롤스라면 차등의 원칙, 평등한 자유의 우선성
      - title: 비판하는 사람(갑)의 핵심 전제를 떠올린다
        body: 공동체 우선인가, 결과를 중시하는가, 과정을 중시하는가
      - title: 선지가 제대로 겨냥하는지 확인한다
        body: '''을이 실제로 한 주장''을 ''갑의 전제''로 공격해야 한다. 을이 하지도 않은 주장을 공격하면 허수아비 비판이므로 오답이다.'
  - 'no': '10'
    heading: 사례에 적용하기 — 교과서 탐구 활동을 세 관점으로 풀어 보기
