      text: '· 롤스는 타고난 재능, 좋은 가정환경 같은 요소를 내가 노력해서 얻은 것이 아니라 ''우연''이라고 본다. 우연으로 얻은 것은 그 사람이 받을 자격이 있다고 할 수 없다(도덕적으로 임의적).

