- item_id: KOR-OP-001
  archetype: A7_EXPLANATION_PASSAGE_APPLY
  format: MCQ
  lexicon: COMMON
  sound_to_spelling: true
  rule_axis: GENERAL_RULE_1
  headwords: [드러났다, 늘어나자, 마개, 넓이, 밭이]
  set: P-A7
  stem: 윗글을 바탕으로 <보기>의 ⓐ~ⓔ를 이해한 내용으로 적절하지 않은 것은?
  view:
  - ∘ 장마로 강물이 ⓑ늘어나자 ⓔ밭이 물에 잠기고, 흙에 묻혀 있던 돌이 ⓐ드러났다.
  - ∘ 병 ⓒ마개를 꼭 닫은 뒤 상자의 ⓓ넓이를 재어 보았다.
  options:
  - 'ⓐ: 앞말이 ''들다''의 본뜻에서 멀어졌으므로 소리대로 적은 것이겠군.'
  - 'ⓑ: 앞말에 ''늘다''의 뜻이 살아 있으므로 어간 ''늘-''의 본모양을 밝혀 적은 것이겠군.'
  - 'ⓒ: 일부 어근에만 붙는 접미사 ''-애''가 결합하였으므로 어근 ''막-''을 밝혀 적지 않고 소리대로 적은 것이겠군.'
  - 'ⓓ: 여러 어근에 두루 붙는 접미사 ''-이''가 결합하였으므로 어근 ''넓-''의 본모양을 밝혀 적은 것이겠군.'
  - 'ⓔ: 조사 ''이''가 붙을 때 달라지는 소리를 그대로 반영하여 적은 것이겠군.'
  answer: 5
  second_best: 1
  difficulty: D3
  family: PASSAGE_APPLICATION
  balance: CORE_EXAM_POINT
  reasoning_steps: 2
  immediate_elimination: 0
  transfer: true
  stem_polarity: NEGATIVE
  judgments:
  - {axis: orthography, c: CORRECT_STATEMENT, claim: deureonada, ev: [PASSAGE, VIEW, OPTION1], v: true, trap: T4_SAME_FORM_OTHER_FUNCTION,
     why: "'드러나다'는 '들다'의 뜻이 남아 있지 않아 소리대로 적는다(제15항 [붙임 1]). '돌아가다'와 달리 앞말의 본모양을 밝히지 않는다."}
  - {axis: orthography, c: CORRECT_STATEMENT, claim: neureonada, ev: [PASSAGE, VIEW, OPTION2], v: true, trap: T5_RULE_JURISDICTION,
     why: "'늘어나다'는 '늘다'의 뜻이 살아 있어 '늘-'을 밝혀 적는다(제15항 [붙임 1])."}
  - {axis: orthography, c: CORRECT_STATEMENT, claim: magae, ev: [PASSAGE, VIEW, OPTION3], v: true, trap: T2_EXCEPTION_CONDITION,
     why: "'마개'는 '막-'에 '-애'가 붙은 말로, '-애'는 일부 어근에만 붙으므로 소리대로 적는다(제19항 [붙임])."}
  - {axis: orthography, c: CORRECT_STATEMENT, claim: neolbi, ev: [PASSAGE, VIEW, OPTION4], v: true, trap: T1_RIGHT_CONCEPT_WRONG_CASE,
     why: "'넓이'는 '넓-'에 명사를 만드는 '-이'가 붙은 말로 어간의 원형을 밝혀 적는다(제19항)."}
  - {axis: orthography, c: CORRECT, claim: bat_i, ev: [PASSAGE, VIEW, OPTION5], v: false,
     why: "'밭이'는 소리로는 'ㅊ'으로 나지만 체언 '밭'과 조사 '이'를 구별해 본모양을 밝혀 적은 것이다. 소리를 그대로 반영한 것이 아니다."}
