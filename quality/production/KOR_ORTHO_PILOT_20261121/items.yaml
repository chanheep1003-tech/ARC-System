      origin: GENERATED
      paragraphs:
      - 한글 맞춤법 제1항은 '한글 맞춤법은 표준어를 소리대로 적되, 어법에 맞도록 함을 원칙으로 한다.'이다. 소리대로 적는다는 것은 표준어의 발음대로 적는다는 뜻이다. 그러나 같은 말도 뒤에 오는 말에 따라 소리가 달라지므로, 소리대로만 적으면 읽는 사람이 뜻을 바로 알아보기 어렵다. 예를 들어 '꽃이', '꽃만'을 소리대로 적으면 '꼬치', '꼰만'이 되어 '꽃'이라는 말이 잘 드러나지 않는다. 그래서 체언과 조사, 용언의 어간과 어미를 구별하여 형태소의 본모양을 밝혀 적는다. 이것이 어법에 맞도록 적는다는 뜻이다.
      - 어근에 접미사가 붙어 새말이 될 때는 두 가지 경우로 나뉜다. '-이', '-음'처럼 여러 어근에 두루 붙고 붙은 뒤에도 어근의 뜻이 살아 있으면 '길이', '울음'처럼 어근의 본모양을 밝혀 적는다. 그러나 일부 어근에만 붙는 접미사가 결합한 '무덤(묻-+-엄)'은 소리대로 적는다. 또 두 용언이 이어져 한 단어가 될 때, 앞말의 본뜻이 살아 있으면 '돌아가다'처럼 앞말의 본모양을 밝혀 적고, 앞말이 본뜻에서 멀어졌으면 '사라지다'처럼 소리대로 적는다.
      - '[A] 한편, 띄어쓰기도 뜻을 정확히 전하는 데 중요하다. ''만''은 ''빵만 먹었다''처럼 다른 것을 제외하고 어떤 것을 한정할 때는 조사이므로 앞말에 붙여 쓰지만, ''십 분 만에''처럼 앞에서 말한 동안이 지났음을 나타낼 때는 의존 명사이므로 띄어 쓴다. ''대로''도 ''법대로''처럼 체언 뒤에 붙으면 조사이므로 붙여 쓰지만, ''들은 대로''처럼 용언의 관형사형 뒤에 오면 의존 명사이므로 띄어 쓴다.'
