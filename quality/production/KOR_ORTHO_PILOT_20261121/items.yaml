- item_id: KOR-OP-004
  archetype: C1_CONSTRUCTED_BLANK_SENTENCE
  format: CR
  points: 5
  lexicon: COMMON
  headwords: [금세, 요새]
  answer_targets: [금세]
  stem: <보기>의 대화를 읽고, <조건>에 따라 서술하시오.
  view:
  - '민지: 하늘이 맑아졌네. 비가 ( ㉠ ) 그쳤어.'
  - '준호: 내가 메시지에 ''금새''라고 썼는데, ''요새''처럼 ''새''로 쓰는 게 맞지 않아?'
  - '민지: 두 말은 어떤 말이 줄어든 것인지가 달라서 표기도 달라.'
  conditions:
  - 1. ㉠에 들어갈 말을 바른 표기로 쓸 것.
  - 2. ㉠의 말과 '요새'가 각각 어떤 말이 줄어든 것인지 밝힐 것.
  - 3. 1, 2를 바탕으로 두 말의 표기가 다른 이유를 한 문장으로 쓸 것.
  model_answer: "㉠은 '금세'이다. '금세'는 '금시에'가 줄어든 말이라 '세'로 적고, '요새'는 '요사이'가 줄어든 말이라 '새'로 적는다."
  accepted_variants:
  - "'금세'는 '금시에'의 준말이고 '요새'는 '요사이'의 준말이므로 표기가 다르다."
  rubric:
  - "㉠ 바른 표기 '금세' 1점"
  - '''금시에''·''요사이''를 각각 밝힘 각 1점, 2점'
  - "줄어든 본말에 따라 표기가 달라진다는 이유를 한 문장으로 씀 2점 (본말 언급 없이 '원래 그렇게 쓴다'만 쓰면 0점)"
  ev:
  - VIEW
  difficulty: D3
