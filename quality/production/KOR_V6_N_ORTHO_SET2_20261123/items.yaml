  stem: <보기>를 바탕으로 단위 명사의 띄어쓰기를 탐구한 내용으로 가장 적절한 것은?
  view:
  - 제43항 단위를 나타내는 명사는 ㉠띄어 쓴다. 다만, ㉡순서를 나타내는 경우나 숫자와 어울리어 쓰이는 경우에는 붙여 쓸 수 있다.
  - '- 한글 맞춤법'
  options:
  - '''차 한 대''의 ''대''는 단위를 나타내는 명사이므로 ㉡에 따라 ''한대''로 붙여 쓸 수 있다.'
  - '''제삼 장''을 ''제삼장''으로 붙여 쓸 수 있는 것은 순서를 나타내는 경우이므로 ㉡에 근거한다.'
  - '''3미터''로 붙여 쓰는 것은 ''미터''가 단위를 나타내는 명사가 아니기 때문이다.'
  - '''열 살''은 나이의 차례를 나타내므로 ㉡에 따라 ''열살''로 붙여 쓸 수 있다.'
  - '''두 시 삼십 분''을 ''두시 삼십분''으로 붙여 쓰는 것은 ㉠에 따른 표기이다.'
