  - ㉡은 민수가 스스로 떠올린 원리이므로, ㉢의 과정을 거치기 전부터 이미 보편적인 행위 법칙인 도덕 법칙에 해당한다.
  - ㉢에서 모순이 생기지 않는다고 판단한 것만으로, 민수는 아직 행위하지 않았더라도 이미 자유를 의식하는 상태에 이른다.
