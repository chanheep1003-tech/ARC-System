  passage:
  - '갑: 나는 어느 날 갑자기 홀로 존재하게 된 자아가 아니다. 나는 가족과 도시, 민족과 국가의 구성원으로 태어나 그 공동체로부터 빚과 유산, 그리고 마땅한 의무를 물려받는다. 이것이 내 도덕의 출발점이다.'
  - '을: 인간은 이성에 따라 스스로 선택한 삶의 목적을 추구하는 독립적 존재이다. 국가는 특정한 삶의 방식을 앞세우지 말고 중립적 입장에서 각자의 자유로운 삶을 최대한 허용해야 한다.'
  options:
