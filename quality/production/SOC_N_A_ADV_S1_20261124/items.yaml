  - '을: 다른 사람에게 피해를 주지 않고 정당하게 취득하거나 양도받은 소유물에 대해 개인은 온전한 소유 권리를 가진다. 그 소유물을 어떻게 쓸지는 전적으로 개인의 자유로운 선택에 맡겨야 한다.'
  view:
  - 'ㄱ. A: 사회적·경제적 불평등은 최소 수혜자에게 최대의 이익이 될 때 허용된다.'
  - 'ㄴ. B: 개인의 자유와 권리를 보호하고 존중하는 것을 정의의 핵심으로 본다.'
  - 'ㄷ. B: 정당한 취득과 양도를 거쳐 생긴 빈부 격차는 그 자체로 문제가 되지 않는다.'
  - 'ㄹ. C: 국가는 최소 수혜자를 위해 개인의 소유물을 재분배할 수 있다.'
