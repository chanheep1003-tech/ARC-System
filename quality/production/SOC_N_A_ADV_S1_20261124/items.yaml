  stem: 다음은 갑, 을 사상가의 주장이다. A는 갑만의 입장, B는 갑과 을의 공통 입장, C는 을만의 입장일 때, A~C에 들어갈 진술로 옳은 것만을 <보기>에서 고른 것은?
