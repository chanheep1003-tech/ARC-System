  archetype: A1_GENERAL_RULE_MAPPING
  stem: '[제27항] <보기>의 한글 맞춤법 조항을 바탕으로 탐구한 내용으로 가장 적절한 것은?'
  view:
  - 제27항 ㉠둘 이상의 단어가 어울리거나 접두사가 붙어서 이루어진 말은 각각 그 원형을 밝히어 적는다.
  - '[붙임 1] ㉡어원은 분명하나 소리만 특이하게 변한 것은 변한 대로 적는다.'
  - '[붙임 2] ㉢어원이 분명하지 아니한 것은 원형을 밝히어 적지 아니한다.'
  - '[붙임 3] ㉣''이[齒, 虱]''가 합성어나 이에 준하는 말에서 ''니'' 또는 ''리''로 소리 날 때에는 ''니''로 적는다.'
  options:
  - '''며칠''은 ''몇''과 ''일''이 결합한 말이 분명하므로 ㉠에 따라 원형을 밝혀 적는다.'
  - '''골병''은 ''골''과 ''병''의 결합이 분명하므로 ㉠에 따라 원형을 밝혀 적은 것이다.'
  - '''할아버지''는 ㉡과 관계없이 ''한''과 ''아버지''의 원형을 밝혀 적어야 한다.'
  - '''엿듣다''는 접두사 ''엿-''의 어원이 분명하지 않아 ㉢에 따라 적은 말이다.'
  - '''덧니''는 ''이[齒]''가 [니]로 소리 나므로 ㉣에 따라 ''니''로 적는다.'
  answer: 5
