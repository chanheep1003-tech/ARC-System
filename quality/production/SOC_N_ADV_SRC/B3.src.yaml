  sb: 3
  medium: [5]
  why:
  - 재생이 가능하다고 본다.
  - 지형·기후 제약을 한계로 지적한다.
  - 대체를 주장하는 것은 유한성을 전제한다.
  - 을도 이를 부정하지 않는다.
  - 갑은 대체를 주장한다.
