  - ㄴ. 바이오 에너지는 A에 해당한다.
  - ㄷ. B는 자연적으로 재생되는 요소를 에너지로 변환한 것이다.
  - ㄹ. A는 화석 에너지를 변환하거나 화학 반응을 일으켜 전기나 열을 만든다.
  options: ['ㄱ, ㄴ', 'ㄴ, ㄹ', 'ㄱ, ㄷ, ㄹ', 'ㄴ, ㄷ, ㄹ', 'ㄱ, ㄴ, ㄷ, ㄹ']
  key: 3
  sb: 5
  medium: [4]
  why:
  - ㄴ이 틀리다.
  - ㄴ이 틀리다. 바이오는 재생 에너지이다.
  - 신에너지와 재생 에너지의 구분이다.
  - ㄴ이 틀리다.
  - ㄴ이 틀리다.
- id: B3-04
  d: D3
  fam: PERSPECTIVE_IDENTIFICATION
  scope: TEXTBOOK-p135
  stem: 갑, 을의 주장에 대한 설명으로 옳은 것은?
  passage:
  - '갑: 신·재생 에너지는 오염 물질을 적게 배출하고 재생이 가능하므로 화석 에너지를 빠르게 대체해야 합니다.'
  - '을: 신·재생 에너지는 아직 에너지 효율이 낮고 지형과 기후의 제약이 커서, 당분간은 화석 에너지와 함께 써야 합니다.'
  options:
  - 갑은 신·재생 에너지가 고갈될 위험이 크다고 본다.
  - 을은 신·재생 에너지가 자연 조건에 좌우된다고 본다.
  - 갑은 을과 달리 화석 에너지의 유한성을 부정한다.
  - 을은 신·재생 에너지가 오염 물질을 더 많이 낸다고 본다.
  - 갑과 을은 모두 화석 에너지 사용을 늘려야 한다고 본다.
