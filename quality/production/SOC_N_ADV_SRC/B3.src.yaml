  - 천연가스(다)가 석유보다 오염 물질을 적게 배출한다.
  - 석탄의 사용 역사가 가장 길다.
  - 소비량이 가장 많은 것은 석유(나)이다.
  - (다)는 발전·가정용 비중이 높은 천연가스이다.
- id: B3-02
  d: D3
  fam: CAUSE_EFFECT
  scope: TEXTBOOK-p136
  stem: 다음 글에서 설명하는 현상의 원인으로 가장 적절한 것은?
  passage:
  - 세계 석유 매장량의 절반가량은 서남아시아에 있지만, 석유는 아시아의 공업 국가와 유럽, 미국에서 많이 소비된다. 그 결과 대형 유조선과 송유관을 통해 대륙을 넘나드는 석유 이동이 활발하게 이루어진다.
  options:
  - 생산 지역과 소비 지역이 일치하지 않는다.
  - 석유는 여러 지역에 고르게 매장되어 있다.
  - 석유는 소비량이 적어 비축이 쉽다.
  - 석유는 재생이 가능한 에너지 자원이다.
  - 석유는 연소 시 오염 물질을 배출하지 않는다.
  key: 1
  sb: 2
  medium: [3]
  why:
  - 편재성으로 생산지와 소비지가 일치하지 않는다.
  - 서남아시아에 편재되어 있다.
  - 소비량이 가장 많다.
  - 재생이 어렵다.
  - 오염 물질을 배출한다.
- id: B3-03
  d: D3
  fam: PRINCIPLE_APPLICATION
  scope: TEXTBOOK-p135
