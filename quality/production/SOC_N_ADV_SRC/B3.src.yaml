- id: B3-07
  d: D4
  fam: CLAIM_EVIDENCE_MATCH
  scope: TEXTBOOK-p138
  stem: (가), (나) 기사에 대한 설명으로 옳은 것은?
  passage:
  - (가) 선진국에만 감축 목표를 정한 기존 체제는 한계를 드러냈다. 그사이 경제가 빠르게 성장한 일부 개발 도상국의 배출량이 크게 늘었기 때문이다.
  - (나) 새 협약에 따라 선진국과 개발 도상국을 가리지 않고 모든 당사국이 스스로 정한 감축 목표를 제출하게 되었다.
  options:
  - (가)의 기존 체제는 개발 도상국의 감축 목표를 정하였다.
  - (나)의 새 협약은 선진국에만 감축 의무를 부과한다.
  - (가)의 기존 체제는 국제 연합의 기후 협약과 관계가 없다.
  - (나)의 새 협약은 기온 상승 억제 목표를 두지 않았다.
  - (나)의 협약은 감축 의무의 대상을 모든 국가로 넓혔다.
  key: 5
  sb: 4
  medium: [1]
  why:
  - 교토 의정서는 선진국에만 목표를 정하였다.
  - 파리 협정은 모든 국가에 의무를 준다.
  - 교토 의정서는 기후변화 협약의 이행 방안이다.
  - 1.5℃ 이내 제한을 약속하였다.
  - 교토 의정서에서 파리 협정으로의 변화이다.
