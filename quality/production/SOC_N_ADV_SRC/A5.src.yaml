- id: A5-01
  d: D4
  fam: PERSPECTIVE_IDENTIFICATION
  scope: TEXTBOOK-p45-46
  stem: 갑, 을의 입장에 대한 설명으로 옳은 것은?
  passage:
  - '갑: 봉사 활동은 개인이 자유롭게 선택할 문제이다. 국가가 이를 의무로 강제하면 개인의 자유를 침해하게 된다.'
  - '을: 우리는 공동체 속에서 정체성을 형성하므로 공동체의 발전에 기여할 책임이 있다. 공동선을 위한 봉사는 시민의 마땅한 도리이다.'
  options:
  - 갑은 공동선 실현을 개인의 권리보다 우선해야 한다고 본다.
  - 을은 개인이 공동체와 무관하게 자아를 형성한다고 본다.
  - 갑은 을과 달리 공동체에 대한 의무를 강조한다.
  - 을은 갑이 공동체에 대한 연대 의식을 소홀히 한다고 비판할 것이다.
  - 갑과 을은 모두 개인의 선택보다 공동체의 전통을 중시한다.
  key: 4
  sb: 1
  medium: [5]
  why:
  - 갑은 자유주의자로 개인의 권리를 우선한다.
  - 을은 공동체 속에서 정체성이 형성된다고 본다.
  - 공동체에 대한 의무를 강조하는 쪽은 을이다.
  - 공동체주의는 자유주의가 연대와 공동선을 소홀히 한다고 비판한다.
  - 갑은 개인의 선택을 중시한다.
- id: A5-02
  d: D4
  fam: PRINCIPLE_APPLICATION
  scope: TEXTBOOK-p47
  stem: 다음 사상가의 입장에서 <사례>의 정책을 평가한 내용으로 가장 적절한 것은?
  passage:
  - 각 개인은 다른 사람의 자유와 양립하는 가장 광범위한 기본적 자유에 대해 평등한 권리를 가진다. 이 원칙은 사회적·경제적 불평등을 다루는 원칙보다 우선한다.
  - '<사례> 갑국 정부는 최소 수혜자의 소득을 높이는 경제 정책을 추진하기 위해, 그 정책을 비판하는 언론 보도와 집회를 모두 금지하였다.'
  options:
  - 최소 수혜자에게 이익이 되므로 정당한 정책이다.
  - 기본적 자유를 제한했으므로 정당화될 수 없다.
  - 사회 전체의 효용이 늘어난다면 정당한 정책이다.
  - 정당하게 취득한 소유물을 침해하므로 부당하다.
  - 공동체의 전통에 부합하는지가 판단 기준이 된다.
  key: 2
  sb: 1
  medium: [4]
  why:
  - 차등의 원칙보다 평등한 자유의 원칙이 우선한다.
  - 롤스는 기본적 자유를 경제적 이익과 맞바꿀 수 없다고 본다.
  - 공리주의적 평가이다.
  - 노직의 논리이며 사례는 소유권과 관련이 없다.
  - 공동체주의적 기준이다.
- id: A5-03
  d: D3
  fam: PERSPECTIVE_IDENTIFICATION
  scope: TEXTBOOK-p46-47
  stem: 표는 사상가 A, B에 대한 질문과 답을 나타낸 것이다. A, B에 대한 설명으로 옳은 것은? (단, A, B는 각각 롤스, 매킨타이어 중 하나임.)
  table:
    header: [질문, A, B]
    rows:
    - ['자아는 공동체의 역사와 전통 속에서 형성되는가?', 아니요, 예]
    - ['무지의 베일을 쓴 상태에서 정의의 원칙을 도출하는가?', 예, 아니요]
    weights: [0.7, 0.15, 0.15]
  options:
  - A는 공정한 절차로 합의된 원칙을 정의로 본다.
  - B는 자아가 공동체로부터 독립적이라고 본다.
  - A는 공동체의 전통과 미덕을 정의의 근거로 삼는다.
  - B는 원초적 입장에서 정의의 원칙을 도출한다.
  - A와 B는 모두 개인선보다 공동선을 우선한다.
  key: 1
  sb: 4
  medium: [3]
  why:
  - A는 롤스로 공정한 절차를 통한 합의를 중시한다.
  - B는 매킨타이어로 공동체 속 자아를 강조한다.
  - 매킨타이어(B)의 입장이다.
  - 롤스(A)의 입장이다.
  - 롤스는 자유주의자이다.
- id: A5-04
  d: D3
  fam: CLAIM_EVIDENCE_MATCH
  scope: TEXTBOOK-p46,48
  stem: 다음 글의 관점에서 지지할 정책으로 가장 적절한 것은?
  passage:
  - 개인의 이익만 추구하는 사회에서는 이웃에 대한 관심이 줄고 유대가 약해진다. 개인의 삶은 공동체 안에서 의미를 얻으므로, 공동체의 전통과 공동선을 함께 가꾸어 나가야 한다.
  options:
  - 개인의 사적 영역에 대한 국가의 간섭을 최소화하는 정책
  - 정당하게 얻은 소득에 대한 과세를 최소화하는 정책
  - 개인이 원하는 삶의 방식을 제약 없이 선택하게 하는 정책
  - 사회 전체의 효용을 극대화하도록 자원을 배분하는 정책
  - 주민이 함께 마을 공동체를 가꾸는 활동을 지원하는 정책
  key: 5
  sb: 4
  medium: [1]
  why:
  - 자유주의적 정책이다.
  - 노직의 입장에 가깝다.
  - 자유주의적 정책이다.
  - 공리주의적 정책이다.
  - 유대와 공동선을 가꾸는 공동체주의적 정책이다.
- id: A5-05
  d: D4
  fam: DATA_INTERPRETATION
  scope: TEXTBOOK-p53-54
  stem: 표는 갑국 A 지역과 B 지역의 지표를 나타낸 것이다. 이에 대한 옳은 분석만을 <보기>에서 고른 것은?
  table:
    header: [지표, A 지역, B 지역]
    rows:
    - ['국토 면적 비중(%)', '12', '88']
    - ['인구 비중(%)', '51', '49']
    - ['대기업 본사 비중(%)', '74', '26']
    - ['인구 1천 명당 의사 수(명)', '2.9', '1.8']
    weights: [0.5, 0.25, 0.25]
  view:
  - ㄱ. A 지역은 B 지역보다 인구 밀도가 높다.
  - ㄴ. 두 지역 간 차이는 인구 비중보다 대기업 본사 비중에서 크다.
  - ㄷ. B 지역 주민은 A 지역 주민보다 의료 서비스에 접근하기 쉽다.
  - ㄹ. 기업 본사가 한 지역에 집중되면 일자리와 인구가 그 지역으로 더 몰릴 수 있다.
  options: ['ㄱ, ㄷ', 'ㄴ, ㄹ', 'ㄱ, ㄴ, ㄹ', 'ㄱ, ㄷ, ㄹ', 'ㄴ, ㄷ, ㄹ']
  key: 3
  sb: 2
  medium: [4]
  why:
  - ㄷ이 틀리다.
  - ㄱ도 옳다.
  - 면적 대비 인구가 A가 훨씬 많고, 본사 비중 차이(48%p)가 인구 비중 차이(2%p)보다 크며, ㄹ은 지역 격차의 심화 과정이다.
  - ㄷ이 틀리다. B 지역의 의사 수가 더 적다.
  - ㄷ이 틀리다.
- id: A5-06
  d: D3
  fam: PRINCIPLE_APPLICATION
  scope: TEXTBOOK-p55-56
  stem: 사회 보험과 공공 부조를 비교할 때, A는 사회 보험에만, B는 두 제도에 공통으로, C는 공공 부조에만 해당한다. A~C에 들어갈 진술로 옳은 것만을 <보기>에서 고른 것은?
  view:
  - 'ㄱ. A: 수혜자가 비용의 일부를 부담한다.'
  - 'ㄴ. B: 국가가 운영에 관여하는 사회 보장 제도이다.'
  - 'ㄷ. C: 능력에 따른 비용 부담을 원칙으로 한다.'
  - 'ㄹ. C: 생활이 어려운 사람에게 최저 생활을 보장한다.'
  options: ['ㄱ, ㄴ', 'ㄱ, ㄷ', 'ㄴ, ㄹ', 'ㄱ, ㄷ, ㄹ', 'ㄱ, ㄴ, ㄹ']
  key: 5
  sb: 3
  medium: [1]
  why:
  - ㄹ도 옳다.
  - ㄷ이 틀리다.
  - ㄱ도 옳다.
  - ㄷ이 틀리다. 능력별 부담은 사회 보험의 원칙이다.
  - 사회 보험은 보험료 부담, 공공 부조는 최저 생활 보장이며 둘 다 사회 보장 제도이다.
- id: A5-07
  d: D3
  fam: PRINCIPLE_APPLICATION
  scope: TEXTBOOK-p57-58
  stem: 다음 제도에 대한 설명으로 적절하지 않은 것은?
  passage:
  - 갑국 정부는 지방으로 이전한 공공 기관이 신규 직원의 일정 비율 이상을 해당 지역 대학 졸업자로 채용하도록 하는 제도를 시행하고 있다.
  options:
  - 지역 간 격차를 완화하려는 정책의 하나이다.
  - 상대적으로 불리한 집단에 기회를 주는 적극적 조치이다.
  - 결과의 평등보다 형식적 기회의 평등만을 중시한다.
  - 다른 지역 출신 지원자의 역차별 논란을 부를 수 있다.
  - 지역 인재가 지역에 정착하는 데 도움을 줄 수 있다.
  key: 3
  sb: 4
  medium: [2]
  negative: true
  why:
  - 지역 격차 완화 정책이다.
  - 적극적 평등 실현 조치의 성격을 가진다.
  - 실질적 기회 보장을 위한 조치로 형식적 평등만 중시하는 것이 아니다.
  - 역차별 논란이 제기될 수 있다.
  - 지역 정착에 기여할 수 있다.
- id: A5-08
  d: D3
  fam: PERSPECTIVE_IDENTIFICATION
  scope: TEXTBOOK-p59
  stem: 갑이 동의할 진술만을 <보기>에서 고른 것은?
  passage:
  - '갑: 절대 빈곤으로 고통받는 사람을 돕는 것은 자선이 아니라 의무이다. 도움을 주는 데 드는 희생이 그 도움으로 막을 수 있는 고통보다 작다면, 우리는 반드시 도와야 한다.'
  view:
  - ㄱ. 먼 나라에 사는 사람이라는 이유로 원조 의무가 줄어들지 않는다.
  - ㄴ. 원조는 개인의 선택이므로 하지 않아도 도덕적 문제가 없다.
  - ㄷ. 원조는 고통을 줄여 인류 전체의 행복을 늘리는 데 기여해야 한다.
  - ㄹ. 원조의 목적은 고통받는 개인이 아닌 질서 정연한 사회를 만드는 것이다.
  options: ['ㄱ, ㄴ', 'ㄴ, ㄷ', 'ㄴ, ㄹ', 'ㄱ, ㄷ', 'ㄷ, ㄹ']
  key: 4
  sb: 5
  medium: [1]
  why:
  - ㄴ은 싱어와 반대된다.
  - ㄴ이 틀리다.
  - ㄴ, ㄹ이 틀리다.
  - 싱어는 거리와 국적을 따지지 않고 고통 감소를 위한 원조를 주장한다.
  - ㄹ은 롤스의 원조관이다.
- id: A5-09
  d: D4
  fam: DATA_INTERPRETATION
  scope: TEXTBOOK-p52,58
  stem: 표는 갑국의 성별 월평균 임금과 여성 관리자 비율을 나타낸 것이다. 이에 대한 분석으로 옳은 것은?
  table:
    header: [구분, 2015년, 2019년, 2023년]
    rows:
    - ['남성 월평균 임금(만 원)', '300', '340', '380']
    - ['여성 월평균 임금(만 원)', '190', '220', '260']
    - ['여성 관리자 비율(%)', '18', '20', '22']
    weights: [0.4, 0.2, 0.2, 0.2]
  options:
  - 여성 임금 대비 남성 임금의 배율은 지속적으로 낮아졌다.
  - 남녀 간 월평균 임금 차이는 지속적으로 줄어들었다.
  - 2023년 여성 관리자 비율은 2015년의 두 배 이상이다.
  - 여성의 임금 증가율은 조사 기간마다 남성보다 낮았다.
  - 자료를 통해 여성 고용 할당제가 시행되었음을 알 수 있다.
  key: 1
  sb: 2
  medium: [4]
  why:
  - 약 1.58배→1.55배→1.46배로 낮아졌다.
  - 차이는 110→120→120만 원으로 줄지 않았다.
  - 18%에서 22%로 두 배에 못 미친다.
  - 여성의 증가율(약 16%, 18%)이 남성(약 13%, 12%)보다 높았다.
  - 자료로는 알 수 없다.
- id: A5-10
  d: D3
  fam: PRINCIPLE_APPLICATION
  scope: TEXTBOOK-p109
  stem: 갈퉁의 관점에서 밑줄 친 ㉠~㉢에 대한 설명으로 옳은 것은?
  passage:
  - 한 나라에서는 ㉠ 무장 단체의 공격으로 마을 주민들이 목숨을 잃었다. 휴전 이후에도 ㉡ 특정 지역 주민들은 불공정한 토지 제도 때문에 굶주림에 시달렸고, 일부 언론은 ㉢ 소수 민족에 대한 차별을 당연한 것처럼 표현하였다.
  options:
  - ㉠은 사회 구조에 의해 간접적으로 가해지는 폭력이다.
  - ㉡은 의도가 드러나지 않는 구조적 폭력에 해당한다.
  - ㉢은 물리적 힘을 사용한 직접적 폭력에 해당한다.
  - 휴전 이후 이 나라는 적극적 평화를 실현하였다.
  - ㉡과 ㉢이 사라져야 소극적 평화가 비로소 실현된다.
  key: 2
  sb: 5
  medium: [4]
  why:
  - ㉠은 직접적 폭력이다.
  - 제도에 의한 빈곤은 구조적 폭력이다.
  - ㉢은 문화적 폭력이다.
  - 구조적·문화적 폭력이 남아 있다.
  - 이는 적극적 평화의 조건이다.
- id: A5-11
  d: D3
  fam: CAUSE_EFFECT
  scope: TEXTBOOK-p110
  stem: 다음 분쟁에 대한 설명으로 가장 적절한 것은?
  passage:
  - □□ 지역은 두 나라 사이에 놓인 산악 지대로, 큰 강의 발원지가 있어 물 자원이 풍부하다. 이 지역 주민 다수는 한 나라와 종교가 같지만 영토는 다른 나라에 속해 있어, 수십 년째 무력 충돌이 이어지고 있다.
  options:
  - 경제적 이해관계와는 무관한 순수한 종교 분쟁이다.
  - 영토·자원·종교 문제가 얽혀 해결이 쉽지 않다.
