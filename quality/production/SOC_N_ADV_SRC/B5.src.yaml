items:
- id: B5-01
  d: D4
  fam: DATA_INTERPRETATION
  scope: TEXTBOOK-p135-136
  stem: 표는 화석 에너지 (가), (나)의 상대적 특징을 비교한 것이다. 이에 대한 설명으로 옳은 것은? (단, (가), (나)는 각각 석탄, 석유 중 하나임.)
  table:
    header: [구분, '(가)', '(나)']
    rows:
    - [국제 이동량, 많음, 적음]
    - [가채 연수, 짧음, 긺]
    - [운송용 소비 비중, 높음, 낮음]
    weights: [0.4, 0.3, 0.3]
  options:
  - (가)는 주로 제철 공업의 연료로 쓰인다.
  - (나)는 전 세계 매장량의 절반이 서남아시아에 있다.
  - (나)는 (가)보다 인류가 사용한 역사가 길다.
  - (가)는 (나)보다 연소 시 오염 물질 배출량이 많다.
  - (가)는 냉동 액화 기술의 발달로 이동량이 급증하였다.
  key: 3
  sb: 4
  medium: [5]
  why:
  - (가)는 석유이며, 제철 공업의 연료는 석탄이다.
  - (나)는 석탄이며, 서남아시아 편재는 석유의 특징이다.
  - 석탄은 산업 혁명 이후 쓰여 사용 역사가 가장 길다.
  - 석탄이 석유보다 오염 물질을 많이 배출한다.
  - 냉동 액화 기술은 천연가스의 특징이다.
- id: B5-02
  d: D3
  fam: CLAIM_EVIDENCE_MATCH
  scope: TEXTBOOK-p137
  stem: 다음 글의 필자가 지지할 정책으로 가장 적절한 것은?
  passage:
  - 화석 에너지 중심의 소비는 자원 고갈, 자원을 둘러싼 분쟁, 기후변화를 불러와 현세대는 물론 미래 세대의 경제·사회·환경의 안정까지 위협한다. 우리는 이러한 소비 실태에 문제의식을 가져야 한다.
  options:
  - 화석 에너지 수입을 늘려 값싼 에너지를 공급하는 정책
  - 석탄 화력 발전소를 새로 지어 전력을 늘리는 정책
  - 에너지 소비를 늘려 경제 성장을 우선하는 정책
  - 자원 보유국의 수출 제한을 지지하는 정책
  - 신·재생 에너지의 개발과 보급을 지원하는 정책
  key: 5
  sb: 1
  medium: [3]
  why:
  - 화석 에너지 의존을 키운다.
  - 화석 에너지 소비를 늘린다.
  - 필자의 문제의식과 반대된다.
  - 자원 민족주의는 분쟁의 원인이 된다.
  - 화석 에너지를 줄이고 신·재생 에너지를 늘리자는 주장과 맞는다.
- id: B5-03
  d: D3
  fam: PRINCIPLE_APPLICATION
  scope: TEXTBOOK-p135
  stem: 다음 사례를 통해 알 수 있는 자원의 특성으로 옳은 것은?
  passage:
  - 땅속 깊은 암석층에 갇혀 있는 셰일 가스는 오래전부터 존재가 알려져 있었지만 꺼낼 기술이 없어 쓰지 못하였다. 그러나 시추 기술이 발달하고 채굴 비용이 낮아지자 중요한 에너지 자원으로 이용되기 시작하였다.
  options:
  - 기술과 경제적 여건에 따라 자원의 범위가 달라진다.
  - 자연에 존재하는 모든 물질은 곧바로 자원이 된다.
  - 자원의 가치는 시대가 바뀌어도 변하지 않는다.
  - 자원은 기술 발달과 관계없이 매장량만으로 결정된다.
  - 한번 자원이 된 물질은 영원히 고갈되지 않는다.
  key: 1
  sb: 4
  medium: [3]
  why:
  - 자원은 기술적·경제적으로 이용 가능한 것이다.
  - 유용하고 이용 가능해야 자원이다.
  - 시대에 따라 달라진다.
  - 기술 발달에 따라 달라진다.
  - 화석 에너지는 고갈될 수 있다.
- id: B5-04
  d: D3
  fam: CAUSE_EFFECT
  scope: TEXTBOOK-p138
  stem: 밑줄 친 ㉠~㉣에 대한 설명으로 옳은 것은?
  passage:
  - ㉠ 화석 에너지 사용량이 늘면서 ㉡ 이산화 탄소가 많이 배출되어 ㉢ 지구의 평균 기온이 높아졌다. 그 결과 빙하가 녹아 해수면이 오르고 ㉣ 자연재해가 잦아지며 피해 규모도 커지고 있다.
  options:
  - ㉠은 신·재생 에너지 보급이 늘어난 결과이다.
  - ㉡은 탄소 흡수원이 늘어나 나타난 현상이다.
  - ㉢은 생태계에만 영향을 주고 경제와는 무관하다.
  - ㉣의 피해는 계층과 지역에 따라 다르게 나타날 수 있다.
  - ㉠~㉣은 인간의 활동과 관계없는 자연 현상이다.
  key: 4
  sb: 3
  medium: [5]
  why:
  - 화석 에너지 소비 증가이다.
  - 화석 에너지 연소 때문이다.
  - 사회와 경제 전반에도 영향을 준다.
  - 기후변화 재해는 지역·세대·계층 간 불평등을 심화한다.
  - 인간의 영향이 크다.
- id: B5-05
  d: D3
  fam: PRINCIPLE_APPLICATION
  scope: TEXTBOOK-p139-140
  stem: 제도 A, B에 대한 설명으로 가장 적절한 것은?
  passage:
  - 'A: 정부가 기업마다 배출할 수 있는 온실가스의 양을 정해 주고, 남거나 부족한 양을 기업끼리 거래하도록 허용한다.'
  - 'B: 일정 규모 이상의 발전 설비를 가진 사업자가 총발전량의 일정 비율 이상을 신·재생 에너지로 생산하도록 한다.'
  options:
  - A는 개인 가정에 배출 허용량을 할당한다.
  - A는 시장 원리를 활용해 감축을 유도한다.
  - B는 모든 국민에게 발전 설비 설치를 의무화한다.
  - A, B는 모두 국내 제도가 아닌 국제 협약이다.
  - B는 화석 에너지 발전 비중을 높이려는 제도이다.
  key: 2
  sb: 1
  medium: [3]
  why:
  - 기업을 대상으로 한다.
  - 배출권 거래제는 시장 원리를 활용한다.
  - 발전 사업자에게 적용된다.
  - 우리나라가 시행하는 국내 제도이다.
  - 신·재생 에너지 비중을 높이려는 제도이다.
- id: B5-06
  d: D4
  fam: DATA_INTERPRETATION
  scope: TEXTBOOK-p138
  stem: 표는 A~C국의 온실가스 배출과 기후변화 피해에 관한 지표이다. 이에 대한 설명으로 옳은 것은?
  table:
    header: [구분, '1인당 배출량(톤)', '세계 누적 배출 비중(%)', 해수면 상승 피해 위험]
    rows:
    - [A국, '15', '25', 낮음]
    - [B국, '2', '3', 중간]
    - [C국, '1', '0.1', 매우 높음]
    weights: [0.16, 0.26, 0.3, 0.28]
  options:
  - 기후변화의 원인 제공과 피해 위험은 비례한다.
  - C국은 원인 제공이 적지만 피해 위험이 크다.
  - A국은 세계 누적 배출 비중이 가장 작다.
  - 1인당 배출량은 B국이 A국보다 많다.
  - 기후정의의 관점에서 C국이 가장 큰 책임을 져야 한다.
  key: 2
  sb: 5
  medium: [1]
  why:
  - 오히려 반대로 나타난다.
  - 기후정의가 문제 삼는 불평등이다.
  - 가장 크다.
  - A국이 더 많다.
  - 원인 제공이 큰 A국의 책임이 크다.
- id: B5-07
  d: D3
  fam: CAUSE_EFFECT
  scope: TEXTBOOK-p139,148
  stem: 다음 자료를 바탕으로 한 추론으로 가장 적절한 것은?
  passage:
  - 고기 1인분과 우유 한 잔을 얻으려면 소에게 곡식 22인분을 먹여야 하고, 100g짜리 햄버거 패티 하나를 만들기 위해 열대 우림 5㎡가 목초지로 바뀐다. 한편 남아메리카 8개국은 열대 우림을 지키기 위해 삼림 벌채를 멈추기로 합의하였다.
  options:
  - 육류 생산은 열대 우림 면적과 관계가 없다.
  - 열대 우림 보전은 한 나라의 노력만으로 충분하다.
  - 삼림 벌채를 늘리면 탄소 흡수원이 늘어난다.
  - 육류 소비를 줄이면 열대 우림 보전에 도움이 된다.
  - 곡식을 가축 사료로 쓰는 것이 식량 효율을 높인다.
  key: 4
  sb: 2
  medium: [5]
  why:
  - 목초지로 바뀐다.
  - 여러 나라의 협력이 필요하다.
  - 흡수원이 줄어든다.
  - 목초지 전환 수요가 줄어든다.
  - 22인분이 필요해 비효율적이다.
- id: B5-08
  d: D4
  fam: CLAIM_EVIDENCE_MATCH
  scope: TEXTBOOK-p139
  stem: 다음 글에 대한 옳은 설명만을 <보기>에서 고른 것은?
  passage:
  - 전기가 들어오지 않는 마을에 태양광 전등이 보급되자, 아이들은 밤에도 공부할 수 있게 되었고 등유 램프의 연기로 인한 호흡기 질환도 줄었다. 부모들은 저녁에도 가게를 열어 소득을 늘렸다.
  view:
  - ㄱ. 지속가능발전목표들은 서로 긴밀하게 연결되어 있다.
  - ㄴ. 한 목표의 달성이 다른 목표의 달성에 도움을 줄 수 있다.
  - ㄷ. 지속가능발전목표는 정부만 추진하는 목표이다.
  - ㄹ. 지속가능발전목표는 경제 측면을 고려하지 않는다.
  options: COMBO5
  key: 1
  sb: 2
  medium: [4]
  why:
  - 청정에너지 보급이 교육·건강·소득에 함께 영향을 주었다.
  - ㄷ이 틀리다. 정부, 기업, 시민 사회가 함께 추진한다.
  - ㄷ이 틀리다.
  - ㄹ이 틀리다. 환경·경제·사회를 통합적으로 고려한다.
  - ㄷ, ㄹ 모두 틀리다.
- id: B5-09
  d: D3
  fam: PRINCIPLE_APPLICATION
  scope: TEXTBOOK-p138,140
  stem: 다음 정책의 의의로 옳은 것만을 <보기>에서 고른 것은?
  passage:
  - 환경부는 폭염이 심해지자 쪽방촌 주민과 홀로 사는 노인 등 기후변화 취약 계층에게 냉방 물품을 지원하고 폭염 행동 요령을 안내하였다.
  view:
  - ㄱ. 기후위기에 취약한 사람들을 보호하려는 노력이다.
  - ㄴ. 사회 안정과 통합을 위한 지속가능 정책이다.
  - ㄷ. 온실가스 배출권 거래제의 하나이다.
  - ㄹ. 기후정의 실현에 기여할 수 있다.
  options: ['ㄱ, ㄴ', 'ㄱ, ㄷ', 'ㄴ, ㄹ', 'ㄱ, ㄷ, ㄹ', 'ㄱ, ㄴ, ㄹ']
  key: 5
  sb: 1
  medium: [3]
  why:
  - ㄹ도 옳다.
  - ㄷ이 틀리다.
  - ㄱ도 옳다.
  - ㄷ이 틀리다.
  - 취약 계층 보호, 사회 통합, 기후정의와 관련된다.
- id: B5-10
  d: D4
  fam: CLAIM_EVIDENCE_MATCH
  scope: TEXTBOOK-p140
  stem: (가), (나) 사례를 비교하여 얻을 수 있는 교훈으로 가장 적절한 것은?
  passage:
  - (가) △△ 마을에는 현지에서 구한 재료로 만든 손 펌프가 보급되었다. 고장이 나면 마을 사람들이 직접 고칠 수 있어 10년째 잘 쓰이고 있다.
  - (나) □□ 마을에는 값비싼 첨단 정수 장치가 설치되었다. 그러나 고장이 나자 부품을 해외에서 들여와야 해 몇 달 만에 방치되었다.
  options:
  - 첨단 기술일수록 저개발 지역에 적합하다.
  - 기술 지원은 주민의 참여 없이 이루어져야 한다.
  - 현지 여건을 고려한 기술이 오래 쓰일 수 있다.
  - 비싼 장비를 보급할수록 지속가능한 발전에 가깝다.
  - 기술 보급에서 수리와 관리는 고려할 필요가 없다.
  key: 3
  sb: 4
  medium: [1]
  why:
  - (나)는 실패하였다.
  - 주민 참여가 지속성을 높였다.
  - 적정 기술의 의미이다.
  - 비용보다 현지 적합성이 중요하다.
  - 수리 가능성이 지속성을 좌우하였다.
- id: B5-11
  d: D3
  fam: CAUSE_EFFECT
  scope: TEXTBOOK-p141
  stem: 다음 자료를 통해 추론할 수 있는 내용으로 가장 적절한 것은?
  passage:
  - 같은 딸기 1kg이라도 국내 농장에서 트럭으로 운송한 딸기와 다른 대륙에서 비행기로 들여온 딸기는 탄소 발자국이 크게 다르다. 비행기로 들여온 딸기는 수송 단계에서 훨씬 많은 온실가스를 배출한다.
  options:
  - 같은 음식도 운송 방법에 따라 탄소 발자국이 다르다.
  - 탄소 발자국은 음식의 종류에 따라서만 결정되는 값이다.
  - 수입 식품은 생산 단계에서 온실가스를 배출하지 않는다.
  - 운송 거리가 길수록 탄소 발자국은 줄어든다.
  - 탄소 발자국은 음식을 조리하는 단계에서만 생긴다.
  key: 1
  sb: 2
  medium: [5]
  why:
  - 교과서 탄소 발자국 활동의 핵심이다.
  - 생산지·운송·조리 방법에 따라서도 달라진다.
  - 생산 단계에서도 배출한다.
  - 늘어난다.
  - 생산·수송·조리 전 과정에서 생긴다.
- id: B5-12
  d: D3
