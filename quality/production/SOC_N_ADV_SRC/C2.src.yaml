- id: C2-01
  d: D3
  fam: RIGHTS_CONFLICT
  scope: TEXTBOOK-p24-25
  stem: 다음 사례에 대한 옳은 설명만을 <보기>에서 고른 것은?
  passage:
  - 62세인 갑은 경력을 살려 ○○ 회사의 사무직에 지원하려 하였다. 그러나 채용 공고에는 직무와 관계없이 “60세 미만만 지원 가능”이라고 적혀 있었다.
  view:
  - ㄱ. 연령을 이유로 한 차별이 나타나 있다.
  - ㄴ. 사회적 소수자 차별은 사회 통합을 저해할 수 있다.
  - ㄷ. 차별 해소를 위해 인권 교육과 의식 개선 활동이 필요하다.
  - ㄹ. 나이에 따른 대우는 어떤 경우에도 인권 문제가 아니다.
  options: ['ㄱ, ㄴ', 'ㄱ, ㄷ', 'ㄴ, ㄹ', 'ㄱ, ㄴ, ㄹ', 'ㄱ, ㄴ, ㄷ']
  key: 5
  sb: 1
  medium: [2]
  why:
  - ㄷ도 옳다.
  - ㄴ도 옳다.
  - ㄹ이 틀리다.
  - ㄹ이 틀리다.
  - 연령 차별, 사회 통합 저해, 사회적 차원의 해결 노력이다.
- id: C2-02
  d: D3
  fam: REMEDY_PROCEDURE
  scope: TEXTBOOK-p25
  stem: (가)~(다)에 해당하는 법률을 옳게 짝지은 것은?
  passage:
  - (가) 국가와 지방 자치 단체의 책무 등을 규정하여 정치·경제·사회·문화 모든 영역에서 성별에 따른 차별 없는 사회를 실현하는 것을 목적으로 한다.
  - (나) 이주민 가족 구성원의 삶의 질 향상과 사회 통합에 이바지하는 것을 목적으로 한다.
  - (다) 신체적·정신적 손상을 가진 사람의 완전한 사회 참여와 평등권을 실현하는 것을 목적으로 한다.
  options:
  - '(가) 양성평등 기본법 (나) 다문화 가족 지원법 (다) 장애인 차별 금지법'
  - '(가) 다문화 가족 지원법 (나) 양성평등 기본법 (다) 장애인 차별 금지법'
  - '(가) 양성평등 기본법 (나) 장애인 차별 금지법 (다) 다문화 가족 지원법'
  - '(가) 장애인 차별 금지법 (나) 다문화 가족 지원법 (다) 양성평등 기본법'
  - '(가) 다문화 가족 지원법 (나) 장애인 차별 금지법 (다) 양성평등 기본법'
  key: 1
  sb: 3
  medium: [2]
  why:
  - 각 법률의 목적이다.
  - (가)는 양성평등 기본법이다.
  - (나)와 (다)가 바뀌었다.
  - (가)와 (다)가 바뀌었다.
  - 모두 어긋난다.
- id: C2-03
  d: D4
  fam: PERSPECTIVE_IDENTIFICATION
  scope: TEXTBOOK-p26
  stem: 청소년 노동권에 대해 옳게 말한 학생만을 고른 것은?
  passage:
  - '갑: 청소년의 노동권은 성인보다 약하게 보장돼.'
  - '을: 4시간을 일하면 근로 시간 도중에 30분 이상 쉬어야 해.'
  - '병: 16세 근로자는 당사자끼리 합의하면 1주에 5시간까지 근로 시간을 늘릴 수 있어.'
  - '정: 근로 계약서에는 임금과 근로 시간 등을 밝혀 적어야 해.'
  options: ['갑, 을', '갑, 정', '을, 병, 정', '갑, 을, 병', '갑, 병, 정']
  key: 3
  sb: 4
  medium: [5]
  why:
  - 갑이 틀리다.
  - 갑이 틀리다.
  - 근로기준법 제54조·제69조와 근로 계약서의 명시 사항이다.
  - 갑이 틀리다. 성인과 동일하게 보장되며 더 강하게 보호받는다.
  - 갑이 틀리다.
- id: C2-04
  d: D3
  fam: REMEDY_PROCEDURE
  scope: TEXTBOOK-p26
  stem: 다음 상황에 놓인 갑에게 할 조언으로 가장 적절한 것은?
  passage:
  - 17세 갑은 편의점에서 두 달 동안 일했지만 사장은 “청소년은 원래 덜 받는 거야.”라며 최저 임금보다 적은 돈을 주었고, 그마저 한 달째 밀려 있다. 갑은 근로 계약서도 쓰지 않았다.
  options:
  - 청소년은 최저 임금을 적용받지 않으니 참아야 해.
  - 고용노동부 등의 기관에 문의해 적극적으로 대응해.
  - 근로 계약서가 없으니 임금을 청구할 방법이 없어.
  - 청소년 노동권은 성인보다 약하게 보장되니 포기해.
  - 사장과 합의했다면 법보다 그 합의가 우선이야.
  key: 2
  sb: 3
  medium: [5]
  why:
  - 청소년도 최저 임금을 보장받는다.
  - 교과서가 제시한 대응 방법이다.
  - 계약서가 없어도 구제를 받을 수 있다.
  - 성인과 동일하게 보장된다.
  - 법정 기준에 미달하는 합의는 인정되지 않는다.
- id: C2-05
  d: D3
  fam: CAUSE_EFFECT
  scope: TEXTBOOK-p65
  stem: 다음 사상가의 주장으로 가장 적절한 것은?
  passage:
  - 부의 축적을 죄악시하던 로마 가톨릭과 달리, 프로테스탄트는 성실하게 일하고 근검절약하여 재산을 모으는 것을 종교적 소명으로 여겼다. 이 윤리는 사람들이 직업 활동을 도덕적인 행위로 인식하게 하였다.
  options:
  - 종교는 경제생활에 아무런 영향을 주지 않는다.
  - 이윤 추구는 어떤 경우에도 비윤리적이다.
  - 부의 축적을 죄악시해야 자본주의가 발전한다.
  - 종교 윤리가 이윤 추구를 정당화하였다.
  - 자본주의는 국가의 계획과 통제에서 시작되었다.
  key: 4
  sb: 3
  medium: [1]
  why:
  - 영향을 주었다고 본다.
  - 윤리적으로 정당화되었다.
  - 가톨릭의 태도로 반대이다.
  - 베버의 주장이다.
  - 관련 없다.
- id: C2-06
  d: D4
  fam: PRINCIPLE_APPLICATION
  scope: TEXTBOOK-p65-66
  stem: 자본주의와 사회주의를 비교할 때, A는 자본주의에만, B는 둘에 공통으로, C는 사회주의에만 해당한다. A~C에 들어갈 진술로 옳은 것만을 <보기>에서 고른 것은?
  view:
  - 'ㄱ. A: 생산 수단의 사적 소유를 인정한다.'
  - 'ㄴ. B: 생산 수단의 공동 소유를 지향한다.'
  - 'ㄷ. C: 개인의 자유보다 사회 전체의 이익을 중시한다.'
  - 'ㄹ. C: 시장 가격에 따라 거래가 이루어지도록 한다.'
  options: ['ㄱ, ㄷ', 'ㄱ, ㄹ', 'ㄴ, ㄷ', 'ㄴ, ㄹ', 'ㄷ, ㄹ']
  key: 1
  sb: 3
  medium: [2]
  why:
  - 사유 재산 제도와 사회 전체 이익 중시이다.
  - ㄹ이 틀리다.
  - ㄴ이 틀리다. 사회주의만의 특징이다.
  - ㄴ, ㄹ이 틀리다.
  - ㄹ이 틀리다. 자본주의의 특징이다.
- id: C2-07
  d: D4
  fam: CAUSE_EFFECT
  scope: TEXTBOOK-p66
  stem: (가), (나) 시기의 자본주의에 대한 설명으로 옳은 것은?
  passage:
  - (가) 절대 왕정 국가들은 식민지에서 원자재를 싸게 들여와 비싸게 팔아 이윤을 얻었다.
  - (나) 방적기와 증기 기관이 발명되어 공장에서 면직물을 대량으로 생산하였다.
  options:
  - (가)에서는 국가의 시장 개입을 최소화하였다.
  - (나)는 (가)보다 먼저 나타났다.
  - (가)에서 축적된 자본은 (나)로 이행하는 데 방해가 되었다.
  - (나) 시기에 케인스는 큰 정부를 주장하였다.
  - (가)는 유통에서, (나)는 생산에서 이윤을 얻었다.
  key: 5
  sb: 1
  medium: [3]
  why:
  - 중상주의로 국가가 보호하였다.
  - 상업 자본주의가 먼저이다.
  - 밑거름이 되었다.
  - 케인스는 수정 자본주의 시기이다.
  - 상업 자본주의와 산업 자본주의의 이윤 원천이다.
- id: C2-08
  d: D3
  fam: CAUSE_EFFECT
  scope: TEXTBOOK-p67
  stem: 수정 자본주의에서 신자유주의로 바뀐 배경으로 가장 적절한 것은?
  options:
  - 대공황으로 기업이 도산하고 실업자가 크게 늘었다.
  - 정부의 적극적 개입이 오히려 비효율을 낳았다.
  - 대규모 독점 기업이 처음으로 출현하였다.
  - 산업 혁명으로 상품의 대량 생산이 가능해졌다.
  - 절대 왕정이 중상주의 정책을 강하게 펼쳤다.
  key: 2
  sb: 1
  medium: [3]
  why:
  - 수정 자본주의의 등장 배경이다.
  - 석유 파동과 정부 실패이다.
  - 수정 자본주의의 배경이다.
  - 산업 자본주의의 배경이다.
  - 상업 자본주의의 모습이다.
- id: C2-09
  d: D4
  fam: PRINCIPLE_APPLICATION
  scope: TEXTBOOK-p69-71
  stem: 수해로 농산물 생산량이 급감했을 때 갑~병국의 대응이다. 이에 대한 설명으로 옳은 것은?
  passage:
  - '갑국: 농산물 가격이 크게 오르자 소비자들은 스스로 구매량을 줄였다.'
  - '을국: 정부가 가구별 농산물 배급량을 줄였다.'
  - '병국: 시장 가격을 기본으로 하되 정부가 보조금을 지급해 가격 안정을 꾀하였다.'
  options:
  - 갑국에서는 정부가 생산 수단 대부분을 소유한다.
  - 을국에서는 수요와 공급으로 가격이 결정된다.
  - 을국은 갑국보다 개인의 선택 자유가 크다.
  - 병국은 시장을 바탕으로 정부가 개입하는 체제이다.
  - 갑국은 을국보다 분배의 평등을 중시한다.
  key: 4
  sb: 2
  medium: [5]
  why:
  - 갑국은 시장경제 체제이다.
  - 을국은 계획경제 체제이다.
  - 계획경제는 선택이 제한된다.
  - 혼합 경제 체제이다.
  - 계획경제가 분배의 평등을 중시한다.
- id: C2-10
  d: D3
  fam: CLAIM_EVIDENCE_MATCH
  scope: TEXTBOOK-p71
  stem: 다음 글의 결론으로 가장 적절한 것은?
  passage:
  - 정부는 공정한 경쟁 규칙을 만들고 공공재를 생산하며, 조세와 사회 보장 제도로 소득 분배를 개선할 수 있다. 그러나 정부의 개입과 규제가 지나치면 오히려 자원이 비효율적으로 배분될 수 있다.
  options:
  - 경제 문제는 정부의 계획으로만 해결해야 한다.
  - 정부는 시장에 어떠한 개입도 해서는 안 된다.
  - 시장과 정부가 서로 보완하며 균형을 이루어야 한다.
  - 소득 분배는 시장에 전적으로 맡겨야 한다.
  - 공공재는 기업이 시장에서 충분히 공급한다.
  key: 3
  sb: 2
  medium: [1]
  why:
  - 지나친 개입은 비효율을 낳는다.
  - 정부의 역할도 필요하다.
  - 혼합 경제 체제의 바람직한 관계이다.
  - 정부가 개선할 수 있다.
  - 공공재는 과소 공급된다.
- id: C2-11
  d: D3
  fam: REMEDY_PROCEDURE
  scope: TEXTBOOK-p69,76
  stem: 다음 문제를 해결하기 위한 정부의 대응으로 가장 적절한 것은?
  passage:
  - 산업 혁명 이후 영국의 가정과 공장은 값싼 석탄을 연료로 썼고, 매연은 정화되지 않은 채 대기로 배출되었다. 1952년 런던에서는 스모그로 1만 2천여 명이 목숨을 잃었다.
  options:
  - 석탄 사용 기업에 보조금을 지급한다.
  - 매연 배출을 시장의 자율에만 맡긴다.
  - 오염 물질 배출에 세금이나 벌금을 부과한다.
  - 공장의 생산량을 늘리도록 지원한다.
  - 대기 오염은 개인이 각자 해결하게 한다.
  key: 3
  sb: 2
  medium: [1]
  why:
  - 오염을 늘린다.
  - 시장에 맡겨 생긴 문제이다.
  - 부정적 외부 효과에 대한 정부의 대응이다.
  - 오염이 늘어난다.
  - 정부의 개입이 필요하다.
- id: C2-12
  d: D4
  fam: DATA_INTERPRETATION
  scope: TEXTBOOK-p73
  stem: 표는 갑이 방과 후에 할 수 있는 활동의 편익과 명시적 비용이다. 이에 대한 옳은 설명만을 <보기>에서 고른 것은? (단, 갑은 한 가지만 선택할 수 있고, 활동 시간은 같음.)
  table:
    header: ['구분(만 원)', 학원 수강, 독서실 이용, 운동]
    rows:
    - [편익, '12', '7', '8']
    - [명시적 비용, '4', '1', '3']
    weights: [0.25, 0.25, 0.25, 0.25]
  view:
  - ㄱ. 순편익이 가장 큰 활동은 학원 수강이다.
  - ㄴ. 편익이 가장 큰 활동은 언제나 합리적 선택이다.
  - ㄷ. 독서실 이용의 순편익은 운동보다 크다.
  - ㄹ. 명시적 비용이 가장 적은 활동을 고르는 것이 합리적이다.
  options: ['ㄱ, ㄴ', 'ㄴ, ㄷ', 'ㄴ, ㄹ', 'ㄱ, ㄷ', 'ㄷ, ㄹ']
  key: 4
  sb: 1
  medium: [5]
  why:
  - ㄴ이 틀리다. 비용도 함께 고려해야 한다.
  - ㄴ이 틀리다.
  - ㄴ, ㄹ이 틀리다.
