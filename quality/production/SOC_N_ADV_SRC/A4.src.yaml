items:
- id: A4-01
  d: D3
  fam: PERSPECTIVE_IDENTIFICATION
  scope: TEXTBOOK-p45
  stem: 다음 사상가의 입장으로 적절하지 않은 것은?
  passage:
  - 생각과 의견의 자유, 결사의 자유, 각자의 개성에 맞게 자기 삶을 설계하고 원하는 대로 살아갈 자유가 존중되지 않는 사회는 결코 자유로운 사회라고 할 수 없다. 타인에게 영향을 미치지 않는 행위에 대해서는 개인에게 절대적 자유가 주어져야 한다.
  options:
  - 개인은 타인이나 사회의 간섭 없이 원하는 삶을 살 수 있어야 한다.
  - 국가는 개인의 자유와 권리를 보호하고 증진하는 수단이다.
  - 인간은 이성에 따라 스스로 선택한 삶의 목적을 추구하는 존재이다.
  - 타인에게 해를 끼치지 않는 행위라면 개인의 선택이 존중되어야 한다.
  - 자아 정체성은 공동체가 부여한 역할을 수행할 때 비로소 형성된다.
  key: 5
  sb: 2
  medium: [3]
  negative: true
  why:
  - 자유주의의 핵심 주장이다.
  - 자유주의는 국가를 개인의 자유 보호 수단으로 본다.
  - 자유주의적 인간관이다.
  - 밀의 주장이다.
  - 공동체주의의 인간관이다.
- id: A4-02
  d: D4
  fam: PRINCIPLE_APPLICATION
  scope: TEXTBOOK-p46-47
  stem: 다음 사상가의 입장에서 <문제 상황> 속 갑에게 할 조언으로 가장 적절한 것은?
  passage:
  - 나는 공동체와 분리된 존재가 아니다. 나는 가족, 도시, 민족, 국가의 구성원이며, 그로부터 다양한 빚과 유산, 마땅한 기대와 의무를 물려받는다. 내 삶의 역사는 언제나 나의 정체성을 이끌어 내는 공동체의 역사 속에 들어 있다.
  - '<문제 상황> 대도시에서 일하는 갑은 자신이 나고 자란 고향 마을이 큰 수해를 입어 주민들이 복구 성금을 모은다는 소식을 들었다. 갑은 이미 고향을 떠났으니 자신과는 상관없는 일이라고 생각하고 있다.'
  options:
  - 고향 공동체에서 물려받은 유대와 책무를 자기 삶의 일부로 생각해 보세요.
  - 스스로 선택하지 않은 의무는 지지 않아도 된다는 점을 명심하세요.
  - 성금은 오로지 자신의 소유물을 처분할 자유의 문제임을 기억하세요.
  - 고향보다 사회 전체의 행복 총량이 가장 커지는 곳에만 기부하세요.
  - 개인의 자유를 지키려면 어떤 공동체에도 얽매이지 말아야 해요.
  key: 1
  sb: 2
  medium: [3]
  why:
  - 매킨타이어는 공동체로부터 물려받은 의무를 도덕의 출발점으로 본다.
  - 자유주의적 조언이다.
  - 노직의 입장에 가깝다.
  - 공리주의적 조언이다.
  - 공동체주의와 반대된다.
- id: A4-03
  d: D4
  fam: PERSPECTIVE_IDENTIFICATION
  scope: TEXTBOOK-p47
  stem: 다음 수업 장면에서 제시된 사상가의 입장을 옳게 말한 학생만을 고른 것은?
  passage:
  - '교사: 여러분이 자신의 부모가 누구인지, 어떤 재능과 처지를 타고날지 전혀 모르는 상태에서 앞으로 살아갈 사회의 규칙을 정한다고 해 봅시다. 이 사상가는 이런 상황에서 가장 공정한 원칙이 도출된다고 보았어요. 어떤 원칙이 선택될까요?'
  view:
  - '갑: 자신이 가장 불리한 처지일 수도 있으니 최소 수혜자를 배려하는 원칙을 고를 거예요.'
  - '을: 자신이 부유하게 태어날 것을 알고 있으니 부유층에 유리한 규칙을 정할 거예요.'
  - '병: 모든 사람이 동등한 기본적 자유를 누리는 원칙에 먼저 합의할 거예요.'
  - '정: 어떤 경우에도 불평등은 허용되지 않는 원칙을 택하게 될 거예요.'
  view_label: ' '
  options:
  - 갑, 을
  - 을, 정
  - 갑, 병
  - 병, 정
  - 갑, 병, 정
  key: 3
  sb: 5
  medium: [4]
  why:
  - 을은 처지를 모른다는 가정에 어긋난다.
  - 을, 정 모두 틀리다.
  - 롤스의 원초적 입장에서 도출되는 원칙이다.
  - 정은 틀리다. 조건이 맞으면 불평등이 허용된다.
  - 정은 틀리다.
- id: A4-04
  d: D4
  fam: PRINCIPLE_APPLICATION
  scope: TEXTBOOK-p47
  stem: 갑의 입장에서 (가)~(다)를 평가한 내용으로 가장 적절한 것은?
  passage:
  - '갑: 남에게 피해를 주지 않고 정당하게 취득하거나 양도받은 소유물에 대해 개인은 소유 권리를 가진다. 소유물을 어떻게 쓸지는 전적으로 개인의 자유로운 선택에 맡겨야 한다.'
  - (가) A는 자신이 개발한 기술로 번 돈을 자녀에게 물려주었다.
  - (나) B는 서류를 위조해 남의 땅을 자기 명의로 바꾼 뒤 C에게 팔았다.
  - (다) 정부는 D의 정당한 소득에 높은 세금을 매겨 빈곤층에게 나누어 주었다.
  options:
  - (나)에서 C는 대가를 치렀으므로 그 땅에 대한 정당한 소유 권리를 가진다.
  - (가)의 자녀는 정당한 양도로 재산을 받았으므로 소유 권리가 인정된다.
  - (다)는 최소 수혜자에게 이익이 되므로 정의롭다.
  - (가)로 빈부 격차가 생겼다면 그것만으로도 부정의하다.
  - (나)와 (다)는 모두 개인의 소유 권리를 존중한 사례이다.
  key: 2
  sb: 1
  medium: [3]
  why:
  - B가 정당하게 취득하지 않은 땅이므로 정당한 양도라 볼 수 없다.
  - 노직의 양도의 원칙에 해당한다.
  - 롤스의 차등의 원칙에 따른 평가이다.
  - 노직은 정당한 과정으로 생긴 격차는 문제가 되지 않는다고 본다.
  - (나)는 부정한 취득, (다)는 강제 재분배이다.
- id: A4-05
  d: D3
  fam: CLAIM_EVIDENCE_MATCH
  scope: TEXTBOOK-p48
  stem: 다음 글에서 강조하는 내용으로 가장 적절한 것은?
  passage:
  - 권리는 의무를 전제로 하고, 의무는 권리를 전제로 한다. 자신의 권리만 내세우며 의무를 피한다면 누구도 권리를 누릴 수 없고, 공동체에 대한 의무만 강요한다면 개인은 자유를 제대로 누릴 수 없다. 공익을 생각하지 않고 사익만 내세우면 공동체가 무너져 개인의 이익마저 보장받지 못하고, 공익만 강조하면 개인에게 희생을 강요하게 된다.
  options:
  - 개인의 권리는 공동체에 대한 의무와 관계없이 보장되어야 한다.
  - 공익을 위해서라면 개인에게 희생을 요구하는 것이 정당하다.
  - 사익 추구를 최대한 허용하면 공동체도 저절로 발전한다.
  - 권리와 의무, 사익과 공익이 조화를 이룰 때 모두 더 잘 실현된다.
  - 자유주의와 공동체주의 중 하나만을 일관되게 따라야 한다.
  key: 4
  sb: 5
  medium: [2]
  why:
  - 권리와 의무는 서로를 전제한다.
  - 희생 강요를 경계한다.
  - 사익만 내세우면 공동체가 무너진다고 한다.
  - 글의 결론이다.
  - 상호 보완을 강조한다.
- id: A4-06
  d: D3
  fam: CAUSE_EFFECT
  scope: TEXTBOOK-p51
  stem: 다음 자료에 대한 설명으로 옳은 것은?
  passage:
  - 조선 후기의 그림 <노상알현도>에는 길 위에서 말을 탄 양반에게 평민 부부가 몸을 낮춰 인사하는 모습이 담겨 있다. 그림의 제목은 '길 위에서 높은 사람을 뵙는다'는 뜻이다. 조선 시대에는 소수의 특권 계층이 사회적 지위와 경제적 부를 차지하는 것이 당연하게 여겨졌다.
  options:
  - 희소한 자원이 차등 분배되면 구성원의 위치가 서열화된다.
  - 신분제가 사라진 오늘날에는 사회 불평등이 더 이상 존재하지 않는다.
  - 어느 정도의 불평등도 없어야만 정의로운 사회라고 할 수 있다.
  - 사회 계층은 사회적 자원과 관계없이 개인의 타고난 성격에 따라 나뉜다.
  - 능력과 업적에 따른 불평등은 언제나 사회 발전을 가로막는다.
  key: 1
  sb: 3
  medium: [5]
  why:
  - 교과서의 사회 불평등 정의이다.
  - 오늘날에도 계층 양극화 등 불평등이 나타난다.
  - 어느 정도의 불평등은 불가피하며 정도가 심할 때 부정의하다.
  - 사회 계층은 사회적 자원의 차등 분배로 형성된다.
  - 동기를 주어 사회 발전에 기여하기도 한다.
- id: A4-07
  d: D4
  fam: DATA_INTERPRETATION
  scope: TEXTBOOK-p51
  stem: 표는 갑국 소득 하위 20%와 상위 20% 가구의 월평균 소득을 나타낸 것이다. 이에 대한 옳은 분석만을 <보기>에서 고른 것은?
  table:
    header: ['구분(단위: 천 원)', 2021년, 2022년, 2023년]
    rows:
    - [하위 20%, '900', '1,000', '1,100']
    - [상위 20%, '10,800', '11,500', '11,000']
    weights: [0.31, 0.23, 0.23, 0.23]
  view:
  - ㄱ. 상위 20%의 월평균 소득은 해마다 증가하였다.
  - ㄴ. 상위 20% 소득을 하위 20% 소득으로 나눈 값은 해마다 작아졌다.
  - ㄷ. 2023년 하위 20%의 소득은 2021년보다 20% 넘게 늘었다.
  - ㄹ. 계층 간 소득 격차가 커지면 위화감이 커지고 계층 간 갈등이 생길 수 있다.
  options: COMBO_MIX
  key: 5
  sb: 4
  medium: [3]
  why:
  - ㄱ이 틀리다.
  - ㄱ이 틀리다.
  - ㄹ도 옳다.
  - ㄷ도 옳다.
  - 배율은 12→11.5→10으로 줄었고, 하위 소득은 약 22% 늘었으며, ㄹ은 교과서 내용이다.
- id: A4-08
  d: D3
  fam: CAUSE_EFFECT
  scope: TEXTBOOK-p50-52
  stem: 다음 장면을 통해 탐구할 수 있는 내용으로 가장 적절한 것은?
  passage:
  - 한 영화에는 두 가족이 나온다. 한 가족은 부유한 동네의 넓은 저택에 살고, 다른 가족은 그 동네에서 끝없이 이어진 계단을 한참 내려가야 닿는 반지하 집에 산다. 폭우가 쏟아지던 날 밤, 저택의 아이는 정원에 텐트를 치고 캠핑을 즐겼지만 아랫동네의 반지하 집은 물에 잠겼다.
  options:
  - 한 도시의 내부에서는 계층 간 공간 불평등이 나타나지 않는다.
  - 같은 재난도 계층과 거주 공간에 따라 다른 피해로 나타날 수 있다.
  - 사회 계층의 차이는 생활 환경의 차이와는 관계가 없다.
  - 공간 불평등은 선진국과 개발 도상국 사이에서만 나타나는 현상이다.
  - 불평등은 개인이 선택한 결과이므로 사회 문제가 될 수 없다.
  key: 2
  sb: 1
  medium: [3]
  why:
  - 도시 내 격차도 공간 불평등이다.
  - 계층 차이가 공간 차이와 겹쳐 재난 피해의 차이로 나타난다.
  - 계층 차이가 주거 환경 차이로 나타난다.
  - 도시 내 격차도 있다.
  - 불평등이 심해지면 사회 문제가 된다.
- id: A4-09
  d: D4
  fam: PRINCIPLE_APPLICATION
  scope: TEXTBOOK-p52
  stem: 다음 사례의 A, B에 대한 설명으로 옳은 것은?
  passage:
  - A는 사고로 하반신 장애를 갖게 된 뒤 계단이 많은 건물과 대중교통을 이용하기 어려워졌다.
  - B는 같은 일을 하고도 '외국인'이라는 이유로 더 낮은 임금을 받으며, 자신이 차별받는 집단에 속해 있다고 느낀다.
  options:
  - A는 사회적 소수자가 아니므로 사회적 약자에도 해당하지 않는다.
  - B는 사회적 소수자이지만 사회적 약자에는 해당하지 않는다.
  - A가 겪는 이동의 어려움은 사회 구조와 무관한 개인의 문제이다.
  - B는 집단 성원이라는 이유로 차별받는 사회적 소수자이다.
  - 사회적 소수자는 사회적 약자보다 더 넓은 범위를 포괄하는 개념이다.
  key: 4
  sb: 5
  medium: [3]
  why:
  - 신체적으로 불리한 위치에 있는 사회적 약자이다.
  - 사회적 소수자는 사회적 약자의 일부이다.
  - 시설 등 사회 환경이 어려움을 만든다.
  - 집단 성원이라는 이유의 차별과 차별 집단 의식이 있다.
  - 사회적 소수자는 사회적 약자의 부분 집합이다.
- id: A4-10
  d: D3
  fam: RIGHTS_CONFLICT
  scope: TEXTBOOK-p58
  stem: 다음 정책에 반대하는 측의 근거로 적절한 것만을 <보기>에서 고른 것은?
  passage:
  - □□ 법학 전문 대학원은 입학생의 약 15%를 사회적 소수 집단에서 뽑는 우대 정책을 시행하였다. 성적이 높았던 백인 지원자 A는 자신보다 점수가 낮은 소수 집단 지원자가 합격하자 소송을 제기하였다.
  view:
