- id: A3-01
  d: D3
  fam: PERSPECTIVE_IDENTIFICATION
  scope: TEXTBOOK-p44-46
  stem: 표는 정의관 A, B를 질문에 따라 구분한 것이다. A, B에 대한 설명으로 옳은 것은?
  table:
    header:
    - 질문
    - A
    - B
    rows:
    - - 자아 정체성은 공동체가 부여한 역할을 수행하며 형성되는가?
      - 예
      - 아니요
    - - 국가는 좋은 삶에 대해 중립적 입장을 지켜야 하는가?
      - 아니요
      - 예
    weights:
    - 0.7
    - 0.15
    - 0.15
  options:
  - A는 국가나 사회보다 개인이 우선한다고 본다.
  - B는 조상의 잘못에 대한 후손의 배상 책임을 부정할 것이다.
  - A는 공동체를 개인의 권리를 지키는 수단으로만 본다.
  - B는 구성원이 공동체의 덕목을 내면화해야 한다고 본다.
  - A와 B는 모두 정의로운 사회의 실현을 지향하지 않는다.
  key: 2
  sb: 4
  medium:
  - 3
  why:
  - A는 공동체주의로 공동체를 우선한다.
  - B(자유주의)는 조상의 행위와 후손이 무관하다고 본다.
  - 공동체를 단순한 수단으로 보는 것은 자유주의적 시각이다.
  - 공동체 덕목의 내면화는 A의 주장이다.
  - 두 정의관 모두 정의로운 사회를 지향한다.
- id: A3-02
  d: D4
  fam: DATA_INTERPRETATION
  scope: TEXTBOOK-p51
  stem: 표는 갑국 소득 하위 20%와 상위 20% 가구의 월평균 균등화 처분가능소득을 나타낸 것이다. 이에 대한 옳은 분석만을 <보기>에서 고른 것은?
  table:
    header:
    - '구분(단위: 만 원)'
    - 2022년
    - 2023년
    - 2024년
    rows:
    - - 하위 20%
      - '100'
      - '120'
      - '150'
    - - 상위 20%
      - 1,000
      - 1,080
      - 1,200
    weights:
    - 0.31
    - 0.23
    - 0.23
    - 0.23
  view:
  - ㄱ. 소득 5분위 배율은 해마다 낮아졌다.
  - ㄴ. 2022년 대비 2024년에 상위 20%와 하위 20%의 소득 차이는 커졌다.
  - ㄷ. 소득 5분위 배율로 보면 2024년의 소득 불평등은 2022년보다 심하다.
  - ㄹ. 균등화 처분가능소득은 직접 번 소득에 연금 등을 더하고 세금 등을 뺀 소득이다.
  options: COMBO_MIX
  key: 4
  sb: 1
  medium:
  - 5
  why:
  - ㄹ도 옳다.
  - ㄷ이 틀리다.
  - ㄷ이 틀리다.
  - 배율은 10→9→8로 낮아졌지만 금액 차이는 900→1,050만 원으로 커졌다.
  - ㄷ이 틀리다.
- id: A3-03
  d: D4
  fam: CAUSE_EFFECT
  scope: TEXTBOOK-p53-54
  stem: 밑줄 친 ㉠~㉣에 대한 설명으로 옳지 않은 것은?
  passage:
  - 한국 사회의 불평등은 단순한 빈부 격차가 아니라 여러 영역에서 격차가 함께 벌어지는 모습으로 나타난다. ㉠ 소득 격차는 자산의 불평등으로 이어지고, ㉡ 소득과 자산의 격차는 주거 불평등을 심화한다. 이러한 격차는 다시 ㉢ 교육 불평등에 영향을 주고, 교육 불평등은 대학 진학에, 출신 대학은 또다시 ㉣ 소득 격차로 연결된다.
  options:
  - ㉠~㉣의 연결은 여러 영역의 불평등이 서로를 강화할 수 있음을 보여 준다.
  - 이러한 연쇄가 이어지면 계층 간 이동이 어려워질 수 있다.
  - ㉢을 줄이기 위한 지원은 불평등의 연쇄를 끊는 방안이 될 수 있다.
  - 불평등이 환경적·구조적 원인으로도 나타날 수 있음을 시사한다.
  - 불평등은 한 영역에서만 생기므로 그 영역만 고치면 해결된다.
  key: 5
  sb: 4
  medium:
  - 3
  negative: true
  why:
  - 다중 격차의 핵심이다.
  - 계층 이동이 어려워지면 갈등이 커질 수 있다.
  - 교육 격차 완화는 연쇄의 한 고리를 줄인다.
  - 교과서는 환경적·구조적 원인의 불평등을 언급한다.
  - 자료는 여러 영역이 연결된 다중 격차를 말한다.
- id: A3-04
  d: D4
  fam: CAUSE_EFFECT
  scope: TEXTBOOK-p51-52
  stem: 표는 불평등 현상 A~C의 특징을 나타낸 것이다. 이에 대한 설명으로 옳은 것은?
  table:
    header:
    - 구분
    - 특징
    rows:
    - - A
      - 중간 계층의 비중이 줄고 상층과 하층의 비중이 늘어난다.
    - - B
      - 지역 사이에 사회적·경제적·문화적 격차가 나타난다.
    - - C
      - 선입견과 편견, 주류 집단과 다르다는 비합리적 이유로 나타난다.
    weights:
    - 0.12
    - 0.88
  options:
  - A의 대표적 원인으로 재산과 소득 차이에 따른 경제적 격차를 들 수 있다.
  - B는 자연환경 차이와 관계없이 지역 개발 방식만으로 발생한다.
  - C의 대상은 신체적 조건이 다른 사람에게만 한정된다.
  - A와 달리 B는 지역 간 갈등을 일으켜도 사회 통합은 해치지 않는다.
  - C를 완화하기 위한 대표적 정책으로 성장 거점 개발을 들 수 있다.
  key: 1
  sb: 2
  medium:
  - 4
  why:
  - 사회 계층 양극화의 대표적 원인이다.
  - 공간 불평등은 기본적으로 자연환경과 생산 요소 차이에서 생긴다.
  - 성별·나이·국적·소득 수준 등 다양한 이유로 차별받는다.
  - 공간 불평등도 사회 통합을 저해한다.
  - 성장 거점 개발은 공간 불평등을 심화한 방식이다.
- id: A3-05
  d: D3
  fam: PRINCIPLE_APPLICATION
  scope: TEXTBOOK-p52,55
  stem: 다음은 지역 개발 방식 A, B를 구분한 것이다. 이에 대한 설명으로 옳은 것은? (단, A, B는 각각 성장 거점 개발, 균형 개발 중 하나임.)
  table:
    header:
    - 질문
    - A
    - B
    rows:
    - - 그동안 개발에서 소외된 지역을 중심으로 투자하는가?
      - 아니요
      - 예
    weights:
    - 0.7
    - 0.15
    - 0.15
  options:
  - A는 지역 간 형평성을 효율성보다 우선한다.
  - B는 성장 잠재력이 큰 지역에 투자를 집중한다.
  - 우리나라의 수도권 집중은 A의 추진과 관련이 깊다.
  - 수도권 공공 기관의 지방 이전은 A의 사례이다.
  - A와 달리 B는 국토의 균형 발전을 추구하지 않는다.
  key: 3
  sb: 4
  medium:
  - 1
  why:
  - A는 효율성을 우선한다.
  - 성장 잠재력이 큰 지역에 집중하는 것은 A이다.
  - 수도권·대도시 중심의 성장 거점 개발로 인구와 자본이 몰렸다.
  - 공공 기관 이전은 B(균형 개발)의 사례이다.
  - 균형 발전을 추구하는 것은 B이다.
- id: A3-06
  d: D4
  fam: DATA_INTERPRETATION
  scope: TEXTBOOK-p55
  stem: 다음 자료에 대한 설명으로 가장 적절한 것은?
  passage:
  - (가) 정부는 국가 균형 발전을 위해 10대 혁신 도시를 지정하고 수도권 공공 기관의 지방 이전을 추진하였다. 2019년까지 154개 기관이 옮겨 갔지만, 여전히 공공 기관의 40% 넘게 수도권에 남아 있고 대다수 혁신 도시는 계획한 인구 목표를 달성하지 못했다.
  - (나) 개인이 현재 주소지를 제외한 원하는 지방 자치 단체에 기부하면 세금 감면과 지역 특산품을 답례로 받는 제도가 시행되고 있다.
  options:
  - (가)의 1차 이전 이후 수도권에 남은 공공 기관은 없다.
  - (가)의 혁신 도시는 지역 대학이나 산업체와의 협력을 고려하지 않는다.
  - (가)의 결과는 기관 이전만으로는 지역 격차 해소가 어려움을 보여 준다.
  - (나)는 기부자가 현재 사는 지방 자치 단체에 기부하는 제도이다.
  - (가), (나)는 모두 수도권 집중을 더 강화하려는 정책이다.
  key: 3
  sb: 4
  medium:
  - 2
  why:
  - 40% 넘게 수도권에 남아 있다.
  - 혁신 도시는 이전 기관과 지역 대학·산업체·지자체의 협력을 지향한다.
  - 계획 인구 미달로 2차 이전 필요성이 제기되었다.
  - 현재 주소지를 제외한 곳에 기부한다.
  - 둘 다 지역 격차 완화 정책이다.
- id: A3-07
  d: D3
  fam: PRINCIPLE_APPLICATION
  scope: TEXTBOOK-p54
  stem: 다음 (가)~(다)에 적용된 사회 복지 제도를 옳게 짝지은 것은?
  passage:
  - (가) 직장에 다니며 매달 보험료를 내 온 갑은 회사가 문을 닫아 실직하자, 새 일자리를 구하는 동안 생활비를 지원받았다.
  - (나) 소득과 재산이 거의 없어 생활을 유지하기 어려운 을은 국가와 지방 자치 단체로부터 생계비와 의료비를 지원받았다.
  - (다) 혼자 사는 노인 병은 정기적인 방문 돌봄과 상담을 받고 있다.
  options:
  - (가) 사회 보험 (나) 공공 부조 (다) 사회 서비스
  - (가) 공공 부조 (나) 사회 보험 (다) 사회 서비스
  - (가) 사회 보험 (나) 사회 서비스 (다) 공공 부조
  - (가) 사회 서비스 (나) 공공 부조 (다) 사회 보험
  - (가) 공공 부조 (나) 사회 서비스 (다) 사회 보험
  key: 1
  sb: 2
  medium:
  - 3
  why:
  - 보험료를 낸 고용 보험, 국민 기초 생활 보장, 돌봄 서비스이다.
  - 보험료를 낸 갑은 사회 보험이다.
  - 생계비·의료비는 공공 부조이다.
  - (가)와 (다)가 틀렸다.
  - 모두 틀렸다.
- id: A3-08
  d: D4
  fam: RIGHTS_CONFLICT
  scope: TEXTBOOK-p56-57
  stem: 다음 제도에 대한 옳은 설명만을 <보기>에서 고른 것은?
  passage:
  - 국가와 지방 자치 단체, 근로자 50명 이상의 공공 기관과 민간 기업은 장애인을 일정 비율 이상 고용해야 한다. 이 비율은 기업 규모와 관계없이 똑같이 적용되어, 장애인을 더 많이 고용한 대기업이 오히려 의무 고용률에 미달하는 경우가 생긴다.
  view:
  - ㄱ. 이 제도는 모두를 똑같이 대우하는 형식적 평등의 강화를 주된 목적으로 한다.
  - ㄴ. 장애인이 경제적으로 자립하고 사회와 소통할 기회를 넓힌다는 의의가 있다.
  - ㄷ. 근로자가 많은 기업일수록 의무 고용률을 맞추기가 쉽다는 한계가 있다.
  - ㄹ. 기업 규모와 관계없이 같은 비율을 적용해 형평성 논란이 생길 수 있다.
  options: COMBO5
  key: 4
  sb: 3
  medium:
  - 1
  why:
  - ㄱ이 틀리다. 실질적 기회의 평등을 위한 적극적 평등 실현 조치이다.
  - ㄱ, ㄷ이 틀리다.
  - ㄷ이 틀리다. 근로자가 많을수록 고용해야 할 인원이 많다.
  - 의의(자립·사회 참여)와 한계(규모 무관 일률 적용)가 옳다.
  - ㄷ이 틀리다.
- id: A3-09
  d: D3
  fam: PRINCIPLE_APPLICATION
  scope: TEXTBOOK-p56-57
  stem: 다음 활동이 보여 주는 내용으로 가장 적절한 것은?
  passage:
  - 비영리 단체 ○○ 클럽은 휠체어나 유아차를 이용하는 이동 약자가 겪는 불편을 줄이기 위해, 시민들이 직접 가게와 건물을 방문해 계단 정보를 등록하는 '계단 정복 지도'를 만들고 있다. 지금까지 400여 명의 시민이 1만 곳이 넘는 장소의 정보를 모았다.
  options:
  - 시민 참여는 제도적 장치가 전혀 없을 때에만 의미를 가질 수 있다.
  - 시민이 나서 이동 약자의 불편을 줄이는 것은 정의로운 사회를 위한 실천이다.
  - 사회적 약자를 돕는 일은 국가의 책임이므로 개인이 나설 필요가 없다.
  - 이러한 활동은 이동 약자에 대한 사회의 선입견을 오히려 강화한다.
  - 이 활동이 돕는 대상은 장애인으로만 한정된다.
  key: 2
  sb: 3
  medium:
  - 1
  why:
  - 제도와 시민 실천은 함께 필요하다.
  - 시민의 자발적 참여로 사회적 약자를 배려하는 실천이다.
  - 교과서는 개인의 실천도 강조한다.
  - 약자의 고통에 공감하고 배려하는 활동이다.
  - 유아차 이용자 등 이동 약자 전체를 돕는다.
- id: A3-10
  d: D5
  fam: PERSPECTIVE_IDENTIFICATION
  scope: TEXTBOOK-p47,56
  stem: (가)의 갑, 을 입장을 비교할 때, A는 갑만의 입장, B는 갑과 을의 공통 입장, C는 을만의 입장이다. A~C에 들어갈 진술로 옳은 것만을 <보기>에서 고른 것은?
  passage:
