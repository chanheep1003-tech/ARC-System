- id: A1-14
  d: D3
  fam: CAUSE_EFFECT
  scope: TEXTBOOK-p109,117-120
  stem: 밑줄 친 ㉠~㉣에 대한 설명으로 옳은 것은?
  passage:
  - 광복과 함께 ㉠ 한반도는 두 강대국에 의해 분할 점령되었고, 이후 ㉡ 남북에 서로 다른 정부가 들어섰으며 전쟁을 거치며 분단이 굳어졌다. 오늘날 남북한은 경제 규모에 비해 ㉢ 많은 군사비를 지출하고 있고, 헤어진 가족을 만나지 못한 이산가족은 빠르게 고령화되고 있다. 한편 동아시아에서는 ㉣ 과거사를 둘러싼 역사 인식 갈등이 이어지고 있다.
  options:
  - ㉠은 냉전 체제가 무너진 뒤 미국과 소련이 합의하여 이루어졌다.
  - ㉡ 이전에 국제 연합은 남북한 정부를 각각 따로 세우는 방안을 결의하였다.
  - ㉢이 줄어들면 그 자원을 경제 발전에 쓸 수 있다는 점이 평화 통일의 이점으로 제시된다.
  - ㉣을 해결하려면 정부 간 협상만 필요하며 시민 사회의 교류는 오히려 갈등을 키운다.
  - 이산가족의 고통은 직접적 폭력의 결과일 뿐이므로 소극적 평화가 실현되면 모두 해소된다.
  key: 3
  sb: 2
  medium:
  - 5
