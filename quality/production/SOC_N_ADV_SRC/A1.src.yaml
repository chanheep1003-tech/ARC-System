items:
- id: A1-01
  d: D3
  fam: PERSPECTIVE_IDENTIFICATION
  scope: TEXTBOOK-p45-46
  stem: 갑, 을의 입장으로 가장 적절한 것은?
  passage:
  - '갑: 나는 어느 날 갑자기 홀로 존재하게 된 자아가 아니다. 나는 가족과 도시, 민족과 국가의 구성원으로 태어나 그 공동체로부터 빚과 유산, 그리고 마땅한 의무를 물려받는다. 이것이 내 도덕의 출발점이다.'
  - '을: 인간은 이성에 따라 스스로 선택한 삶의 목적을 추구하는 독립적 존재이다. 국가는 특정한 삶의 방식을 앞세우지 말고 중립적 입장에서 각자의 자유로운 삶을 최대한 허용해야 한다.'
  options:
  - '갑: 공동선보다 개인선이 우선한다고 보아야 한다.'
  - '갑: 개인의 정체성은 공동체의 역사와 분리되어 형성된다.'
  - '을: 국가는 구성원에게 공동체의 덕목을 내면화하도록 장려해야 한다.'
  - '을: 조상이 저지른 잘못에 대해 후손이 배상할 책임은 없다고 볼 것이다.'
  - '갑과 을: 공동체는 개인의 권리를 보호하는 수단에 불과하다.'
  key: 4
  sb: 3
  medium:
  - 1
  why:
  - 갑은 공동체주의자로 공동선을 개인선보다 앞세운다.
  - 갑은 정체성이 공동체의 역사 속에 편입되어 있다고 본다.
  - 덕목의 내면화 장려는 공동체주의의 주장이며 을은 국가 중립을 요구한다.
  - 자유주의는 조상의 행위와 후손은 무관하다고 보아 배상 책임을 부정한다.
  - 갑은 공동체를 좋은 삶의 기반으로 보며 단순한 수단으로 보지 않는다.
- id: A1-02
  d: D4
  fam: PERSPECTIVE_IDENTIFICATION
  scope: TEXTBOOK-p47
  stem: 다음은 갑, 을 사상가의 주장이다. A는 갑만의 입장, B는 갑과 을의 공통 입장, C는 을만의 입장일 때, A~C에 들어갈 진술로 옳은 것만을 <보기>에서 고른 것은?
  passage:
  - '갑: 각자가 자신의 사회적 지위나 타고난 재능을 모른다고 가정한 공정한 상황에서 합의한 원칙이 정의롭다. 모든 사람은 평등한 기본적 자유를 누려야 하고, 사회적·경제적 불평등은 가장 불리한 처지의 사람에게 최대 이익이 되며 그 지위가 모두에게 개방될 때만 허용된다.'
  - '을: 다른 사람에게 피해를 주지 않고 정당하게 취득하거나 양도받은 소유물에 대해 개인은 온전한 소유 권리를 가진다. 그 소유물을 어떻게 쓸지는 전적으로 개인의 자유로운 선택에 맡겨야 한다.'
  view:
  - 'ㄱ. A: 사회적·경제적 불평등은 최소 수혜자에게 최대의 이익이 될 때 허용된다.'
  - 'ㄴ. B: 개인의 자유와 권리를 보호하고 존중하는 것을 정의의 핵심으로 본다.'
  - 'ㄷ. B: 정당한 취득과 양도를 거쳐 생긴 빈부 격차는 그 자체로 문제가 되지 않는다.'
  - 'ㄹ. C: 국가는 최소 수혜자를 위해 개인의 소유물을 재분배할 수 있다.'
  options: COMBO5
  key: 1
  sb: 2
  medium:
  - 3
  why:
  - ㄱ(갑만의 입장)과 ㄴ(공통 입장)이 옳다.
  - ㄷ은 을만의 입장이므로 B가 아닌 C에 해당한다.
  - ㄷ이 틀리다.
  - ㄹ은 을이 반대하는 재분배 주장이다.
  - ㄷ과 ㄹ 모두 틀리다.
- id: A1-03
  d: D3
  fam: PRINCIPLE_APPLICATION
  scope: TEXTBOOK-p48
  stem: 다음 사례에 대한 평가로 옳은 것만을 <보기>에서 고른 것은?
  passage:
  - ○○시는 도시 주변의 녹지를 보전하기 위해 개발 제한 구역을 계속 유지하기로 하였다. 이 구역에 토지를 가진 일부 주민은 건물을 짓거나 농로를 내는 것조차 어려워 재산권을 행사할 수 없다며 반발하였다. 반면 시민단체는 개발 제한 구역이 도시의 허파 역할을 하므로 미래 세대를 위해 보존해야 한다고 주장하였다.
  view:
  - ㄱ. 자유주의적 정의관은 이 정책이 토지 소유자의 권리와 사익을 부당하게 침해할 수 있다고 볼 것이다.
  - ㄴ. 공동체주의적 정의관은 구성원에게 공동체의 환경을 보호할 의무가 있다고 볼 것이다.
  - ㄷ. 자유주의적 정의관은 공동선 실현을 위해 개인에게 희생을 요구하는 것이 정당하다고 볼 것이다.
  - ㄹ. 토지 소유자에게 적절히 보상하는 방안은 개인선을 실현하면서도 공동선을 훼손하지 않는 대안이 될 수 있다.
  options: COMBO_MIX
  key: 4
  sb: 1
  medium:
  - 5
  why:
  - ㄹ도 옳으므로 부족하다.
  - ㄷ은 자유주의가 아닌 공동체주의 쪽의 논리이다.
  - ㄷ이 틀리다.
  - ㄱ, ㄴ, ㄹ이 옳다. 두 정의관은 상호 보완적으로 대안을 찾을 수 있다.
  - ㄷ이 틀리다.
- id: A1-04
  d: D4
  fam: CLAIM_EVIDENCE_MATCH
  scope: TEXTBOOK-p45-48
  stem: 갑의 입장에서 을에게 제기할 수 있는 비판으로 가장 적절한 것은?
  passage:
  - '갑: 생각과 의견의 자유, 각자의 개성에 맞게 삶을 설계하고 원하는 대로 살아갈 자유가 존중되지 않는 사회는 결코 자유로운 사회가 아니다. 타인에게 영향을 미치지 않는 행위에 대해서는 개인에게 절대적 자유가 주어져야 한다.'
  - '을: 공동체는 개인의 권리를 보호하는 도구가 아니라 좋은 삶의 바탕이다. 구성원은 공동체의 가치와 목적을 내면화하고 주어진 책임과 의무를 다할 때 정의로운 삶을 살 수 있다.'
  options:
  - 개인은 공동체의 전통으로부터 역할과 의무를 물려받는다는 점을 간과한다.
  - 공동선을 앞세우면 개인의 자유와 권리가 침해될 수 있다는 점을 간과한다.
  - 국가가 개인의 삶의 방식에 대해 중립을 지켜야 한다는 점을 지나치게 강조한다.
  - 인간을 공동체와 분리된 독립적 존재로만 바라본다는 점을 간과한다.
  - 사회의 분열이 개인을 독립적 존재로만 보는 인간관에서 비롯됨을 간과한다.
  key: 2
  sb: 4
  medium:
  - 3
  why:
  - 을 자신의 주장이므로 갑이 을에게 하는 비판이 될 수 없다.
  - 자유주의자 갑은 공동선 우선이 개인의 자유를 침해할 수 있다고 비판한다.
  - 국가 중립은 갑의 입장이며 을은 이를 강조하지 않는다.
  - 공동체주의가 자유주의에 제기하는 비판이다.
  - 공동체주의가 자유주의에 제기하는 비판이다.
- id: A1-05
  d: D3
  fam: DATA_INTERPRETATION
  scope: TEXTBOOK-p51
  stem: 표는 갑국의 소득 수준 상·하위 20% 가구의 월평균 균등화 처분가능소득을 나타낸 것이다. 이에 대한 분석으로 옳은 것만을 <보기>에서 고른 것은?
  table:
    header:
    - '구분(단위: 만 원)'
    - 2021년
    - 2022년
    - 2023년
    rows:
    - - 하위 20%
      - '200'
      - '210'
      - '220'
    - - 상위 20%
      - 1,300
      - 1,260
      - 1,540
    weights:
    - 0.28
    - 0.24
    - 0.24
    - 0.24
  view:
  - ㄱ. 2023년의 소득 5분위 배율은 2021년보다 낮다.
  - ㄴ. 조사 기간 중 소득 5분위 배율은 2022년이 가장 낮다.
  - ㄷ. 2021년 대비 2023년에 하위 20%의 소득은 늘었지만 소득 불평등은 심화되었다.
  - ㄹ. 소득 5분위 배율이 높아질수록 사회 계층의 양극화가 완화된다고 볼 수 있다.
  options: COMBO5
  key: 3
  sb: 1
  why:
  - ㄱ이 틀리다. 2021년 6.5배, 2023년 7배이다.
  - ㄱ이 틀리다.
  - 2022년 6배로 가장 낮고, 2023년 7배로 2021년 6.5배보다 높다.
  - ㄹ이 틀리다.
  - 배율이 높을수록 빈부 격차가 크다.
- id: A1-06
  d: D4
  fam: CAUSE_EFFECT
  scope: TEXTBOOK-p52,55-56
  stem: 밑줄 친 ㉠~㉣에 대한 설명으로 옳지 않은 것은?
  passage:
  - ○○국은 빠른 경제 성장을 위해 ㉠ 성장 잠재력이 큰 수도권과 대도시에 투자를 집중하였고, 그 결과 인구와 자본이 수도권으로 몰렸다. 비수도권의 청년들은 일자리와 교육 기회를 찾아 떠났고, 남은 지역에서는 병원과 학교가 줄어들어 ㉡ 소득뿐 아니라 의료·교육 등 생활 전반의 격차가 커졌다. 이에 정부는 ㉢ 수도권의 공공 기관을 지방으로 옮기는 정책을 추진하는
    한편, 공공 기관이 신규 직원을 뽑을 때 해당 지방 대학 출신을 일정 비율 이상 채용하도록 하는 ㉣ 제도를 도입하였다.
  options:
  - ㉠은 집중 투자한 지역의 성장 효과가 주변 지역으로 퍼져 나갈 것을 기대한 방식이다.
  - ㉡은 공간 불평등이 사회 불평등과 맞물려 나타날 수 있음을 보여 준다.
  - ㉢은 개발에서 소외되었던 지역에 일자리를 만들어 국토의 균형 발전을 꾀하는 정책이다.
  - ㉣은 실질적 기회의 평등을 보장하려는 조치이지만 역차별 논란이 생길 수 있다.
  - ㉠과 달리 ㉢은 형평성보다 효율성을 우선하는 지역 개발 방식에 해당한다.
  key: 5
  sb: 4
  medium:
  - 1
  negative: true
  why:
  - 성장 거점 개발은 효과가 주변으로 확산하도록 하는 방식이다.
  - 경제적 격차가 교육·의료 등 생활 전반의 격차로 이어진다.
  - 공공 기관 지방 이전은 지역 격차 완화 정책이다.
  - 지역 출신 채용 비율 할당은 적극적 평등 실현 조치의 성격을 가지며 역차별 문제가 제기될 수 있다.
  - 효율성을 우선한 것은 ㉠(성장 거점 개발)이고, ㉢은 균형 발전(형평성)을 추구한다.
- id: A1-07
  d: D4
  fam: PRINCIPLE_APPLICATION
  scope: TEXTBOOK-p54
  stem: 표는 우리나라 사회 복지 제도 A~C를 질문에 따라 구분한 것이다. 이에 대한 설명으로 옳은 것은?
  table:
    header:
    - 질문
    - A
    - B
    - C
    rows:
    - - 보험료를 미리 내 두었다가 위험이 생기면 지원받는 방식인가?
      - 예
      - 아니요
      - 아니요
    - - 상담·재활·돌봄 등 비금전적 지원을 제공하는 것이 중심인가?
      - 아니요
      - 아니요
      - 예
    weights:
    - 0.58
    - 0.14
    - 0.14
    - 0.14
  options:
  - A는 사회적 위험이 생긴 뒤 생활이 어려워진 사람만을 골라 지원한다.
  - B의 사례로 소득 인정액이 기준 이하인 노인에게 매월 지급하는 연금을 들 수 있다.
  - C의 사례로 일정 소득이 있는 사람이 가입하여 노후에 받는 국민연금을 들 수 있다.
  - 국민 건강 보험은 B에, 장애인 활동 지원은 C에 해당한다.
  - A와 달리 C는 비용을 개인·사업주·정부가 나누어 부담하는 방식이다.
  key: 2
  sb: 3
  medium:
  - 4
  why:
  - A는 사회 보험으로 위험에 사전에 대처하며, 일정 소득이 있는 사람이 보험료를 낸다.
  - 기초 연금은 이름에 '연금'이 있지만 소득 기준으로 지급하는 공공 부조(B)이다.
  - 국민연금은 보험료를 내는 사회 보험(A)이다.
  - 국민 건강 보험은 사회 보험(A)이다.
  - 보험료 분담은 사회 보험(A)의 특징이다.
- id: A1-08
  d: D4
  fam: RIGHTS_CONFLICT
  scope: TEXTBOOK-p56,58-59
  stem: 다음 사례에 대한 갑, 을의 주장으로 가장 적절한 것은?
  passage:
  - □□ 대학원은 입학생의 약 15%를 사회적 소수 집단에서 선발하는 정책을 시행하였다. 대학 성적과 입학시험 점수가 높았던 지원자 A는 자신보다 점수가 낮은 소수 집단 지원자가 합격하고 자신은 불합격하자 소송을 제기하였다.
