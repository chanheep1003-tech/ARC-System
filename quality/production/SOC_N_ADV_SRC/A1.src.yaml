  - ㉡과 ㉢은 모두 무력 충돌을 지탱하는 자원의 흐름을 끊으려 했다는 공통점이 있다.
  - ㉡은 회원국 정부의 위임을 받아 국가 간 이해관계를 조정하는 것을 주된 역할로 한다.
