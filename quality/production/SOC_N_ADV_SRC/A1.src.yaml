  - 국제 연합은 총선거로 통일 정부를 세우는 방안을 마련하였으나 소련과 북한이 거부하였다.
  - 군사 대립 비용을 줄여 경제 발전을 이룰 수 있다는 것이 평화 통일의 이점이다.
