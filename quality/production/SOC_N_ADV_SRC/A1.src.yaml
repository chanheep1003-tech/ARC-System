    - 0.15
    - 0.15
  options:
  - A는 구조적 폭력과 문화적 폭력까지 제거된 상태이다.
  - B는 전쟁과 테러가 없더라도 실현되지 않았을 수 있다.
  - A가 실현되면 B도 함께 실현된다.
  - 테러의 위협이 사라졌다는 사실만으로 B가 실현되었다고 볼 수 있다.
