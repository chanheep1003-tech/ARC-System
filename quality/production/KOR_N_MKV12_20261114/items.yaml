- item_id: KOR-MKW-03
  stem: <보기>의 설명을 참고할 때, ㉠~㉣에 들어갈 중세 국어의 형태를 바르게 짝지은 것은?
  view:
  - '''ㅎ'' 종성 체언 뒤에 ''ㄱ''이나 ''ㄷ''으로 시작하는 조사가 오면, ''ㅎ''이 뒤의 ''ㄱ, ㄷ''과 합쳐져 ''ㅋ, ㅌ''으로 나타난다.'
  - (예) 돌ㅎ + 과 → 돌콰
  - • 하ᄂᆞᆯㅎ + 도 → ㉠      • 하ᄂᆞᆯㅎ + ᄋᆞᆯ → ㉡
  - • 내ㅎ + 과 → ㉢        • 하ᄂᆞᆯㅎ (단독으로 쓰일 때) → ㉣
  options:
  - ㉠ 하ᄂᆞᆯ도   ㉡ 하ᄂᆞᆯᄒᆞᆯ   ㉢ 내콰   ㉣ 하ᄂᆞᆯ
  - ㉠ 하ᄂᆞᆯ토   ㉡ 하ᄂᆞᆯᄒᆞᆯ   ㉢ 내콰   ㉣ 하ᄂᆞᆯ
  - ㉠ 하ᄂᆞᆯ토   ㉡ 하ᄂᆞᄅᆞᆯ   ㉢ 내콰   ㉣ 하ᄂᆞᆯ
  - ㉠ 하ᄂᆞᆯ토   ㉡ 하ᄂᆞᆯᄒᆞᆯ   ㉢ 내과   ㉣ 하ᄂᆞᆯ
  - ㉠ 하ᄂᆞᆯ토   ㉡ 하ᄂᆞᆯᄒᆞᆯ   ㉢ 내콰   ㉣ 하ᄂᆞᆶ
  answer: 2
  second_best: 3
  difficulty: D3
  family: CONDITION_CHANGE
