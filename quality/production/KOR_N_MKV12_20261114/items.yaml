- item_id: KOR-MKW-02
  stem: <보기>는 수업 시간에 다루지 않은 중세 국어 자료이다. 배운 내용을 바탕으로 <보기>를 탐구한 내용으로 적절한 것은?
  view:
  - 나라히 破亡ᄒᆞ니 뫼콰 ᄀᆞᄅᆞᆷᄲᅮᆫ 잇고 잣 안 보ᄆᆡ 플와 나모ᄲᅮᆫ 기펫도다
  - '[나라가 망하니 산과 강만 있고, 성 안의 봄에는 풀과 나무만 우거져 있도다]'
  - '- 「두시언해」 초간본, 「춘망」 (방점 생략)'
  options:
  - '''나라히''를 보니, ''나라''가 ''ㅎ''을 끝소리로 가진 체언이어서 주격 조사 앞에서 ''ㅎ''이 드러났군.'
  - '''나모ᄲᅮᆫ''을 보니, ''나모''는 뒤에 어떤 조사가 오든 ''ㄱ''이 덧생긴 형태로 바뀌었군.'
  - '''ᄀᆞᄅᆞᆷᄲᅮᆫ''의 ''ᄲ''은 ''ᄠᅳ들''의 ''ㅳ''처럼 두 자음이 모두 소리 나는 어두 자음군이군.'
  - '''보ᄆᆡ''를 보니, ''봄''에 관형격 조사가 결합하여 ''봄의''라는 뜻을 나타냈군.'
  - '''ᄲᅮᆫ''은 현대 국어의 의존 명사 ''뿐''과 같은 말이어서 앞말과 띄어 썼군.'
  answer: 1
