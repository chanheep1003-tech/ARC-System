  - v: 'FALSE'
    c: MEDIUM
    axis: tg_view
    claim: poverty_from_disaster
    ev:
    - L22
    - L23
    why: 풍년이어도 배부르지 않다는 것은 궁핍이 자연재해 때문이 아님을 드러낸다.
  - v: 'FALSE'
