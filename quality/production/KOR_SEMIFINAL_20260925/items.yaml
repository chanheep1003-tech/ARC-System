    axis: tg_view
    claim: authority_restored
    ev:
    - L14
    - L15
    why: 앞부분은 맞지만 화자가 종들의 불만을 누르는 과정은 없다.
  - v: 'FALSE'
    c: STRONG
    axis: tg_view
    claim: ancients_as_enjoying_dao
    ev:
    - L5
    - L6
    why: 안표·원헌은 자신의 가난이 그들보다 심하다는 것을 드러내기 위한 비교 대상이며, 도를 즐기는 모습은 없다. <보기>의 안빈낙도를 끌어와 고르기 쉽다.
  - v: 'FALSE'
