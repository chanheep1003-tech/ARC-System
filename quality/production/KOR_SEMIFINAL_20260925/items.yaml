  reasoning_steps: 3
  immediate_elimination: 1
  points: 3.5
  view:
  - 조선 후기에는 향촌에 머물던 사대부가 경제적으로 몰락하면서, 이전 시가에서 관념적으로 노래되던 안빈낙도(安貧樂道)와는 달리 자신이 겪는 생활의 궁핍을 구체적으로 형상화한 가사가 창작되었다. 이러한 작품에서 화자는 가난을 벗어나려 애쓰는 모습과 함께, 선비로서 지켜야 할 도리와 현실 사이의 괴리를 드러내기도 한다.
