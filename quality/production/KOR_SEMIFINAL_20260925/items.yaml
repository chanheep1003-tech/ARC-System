  - 22~23행은 풍년이 들어도 형편이 나아지지 않는 현실을 보여 주며, 화자의 궁핍이 자연재해에서 비롯되었음을 드러낸다.
  - 14~15행에서 종들이 불만을 드러내는 모습은 몰락한 사대부의 처지를 보여 주며, 화자가 이를 누르고 상전의 권위를 지켜 내는 과정이 드러난다.
  - 5~6행에서 안표와 원헌을 끌어오는 것은 안빈낙도의 관념을 본받으려는 태도로, 화자가 궁핍 속에서도 도를 즐기고 있음을 보여 준다.
  - 26~27행에서 제사와 접대를 걱정하는 것은 선비의 도리를 짐으로 여기는 것으로, 화자가 그 도리에서 벗어나려 함을 보여 준다.
  answer: 1
  second_best: 4
