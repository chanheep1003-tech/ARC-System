  stem: 다음 글의 요지로 가장 적절한 것은?
  passage:
  - Post-traumatic stress syndrome became common knowledge but not the concept of post-traumatic growth, which is actually far more widespread. Most people who undergo trauma ultimately feel that the experience has made them stronger, wiser, more mature, more tolerant and understanding, or in some other way better people. The influential psychologist Martin Seligman has often lamented that so much attention is lavished on post-traumatic stress syndrome rather than post-traumatic growth because it causes people to mistakenly expect that bad events will have mainly negative effects. After being exposed to a terrifying event, at least 80 percent of people do not experience post-traumatic stress syndrome. Even though a single bad event is more powerful than a good event, over time people respond in so many constructive ways that they typically emerge more capable than ever of confronting life's challenges. Bad can make us stronger in the end.
  options:
  - Experts should pay more attention to post-traumatic stress syndrome.
  - A single bad event usually has less impact on us than a good one.
  - 외상을 겪은 사람 대부분은 전문적인 심리 치료를 받아야 한다.
  - 외상 경험 뒤에는 부정적 영향보다 성장이 더 흔하게 나타난다.
  - People who avoid terrifying events tend to become more mature.
  answer: 4
  second_best: 1
  difficulty: D2
  family: MAIN_IDEA
