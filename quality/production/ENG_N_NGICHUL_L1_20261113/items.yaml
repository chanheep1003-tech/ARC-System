  - Imagine yourself as a predator, perhaps a hawk. From on high, you spot what appears to be a tasty snake. If you hesitate for even a few seconds, your meal might be gone. Time is of the essence, and you must act quickly. But there's a twist—a major one. If you mistake a venomous coral snake for a non-venomous king snake, it will cost your life. In the tradeoff between a meal and your life, the choice is obvious. For a predator, natural selection has shaped this decision-making process to favor the conservative choice—long-term benefits of survival over short-term benefits of a single meal. Thus, there is no need for the king snake to be a perfect mimic of the coral snake's colors to win this round of the evolutionary arms race. The same logic applies when you're deciding whether or not to eat a wild mushroom. If you are not absolutely sure, don't let yourself fall prey to thoughts of tasty reward. The cost of your life would be too heavy a price to pay.
