source: 『N기출 고난도 독해 Level 1』 Part 3 Mini 모의고사 04~06회 (3-4-1~3-6-4)
source_ref: Drive 1eXT9Wz1AqFuvfDiY33Y4M085V77yxebu_icpQrveAtE PART 2 (OCR 정제본, 인쇄 오탈자 교정 포함)
passages:
- code: 3-4-1
  source_text_id: NGICHUL-L1-3-4-1
  topic_kr: 고객 가치·만족 창출과 기업 수익성 유지 사이의 미묘한 균형 (마케팅의 목적)
  text: 'For companies interested in delighting customers, exceptional value and service become part of the overall company culture. For example, year after year, Pazano ranks at or near the top of the hospitality industry in terms of customer satisfaction. The company''s passion for satisfying customers is summed up in its credo, which promises that its luxury hotels will deliver a truly memorable experience. Although a customer-centered firm seeks to deliver high customer satisfaction relative to competitors, it does not attempt to maximize customer satisfaction. A company can always increase customer satisfaction by lowering its price or increasing its services. But this may result in lower profits. Thus, the purpose of marketing is to generate customer value profitably. This requires a very delicate balance: the marketer must continue to generate more customer value and satisfaction but not ''give away the house''.'
- code: 3-4-2
  source_text_id: NGICHUL-L1-3-4-2
  topic_kr: 외상 후 스트레스 증후군(PTSS)보다 실제로 훨씬 더 광범위하게 나타나는 외상 후 성장(Post-traumatic growth)
  text: Post-traumatic stress syndrome became common knowledge but not the concept of post-traumatic growth, which is actually far more widespread. Most people who undergo trauma ultimately feel that the experience has made them stronger, wiser, more mature, more tolerant and understanding, or in some other way better people. The influential psychologist Martin Seligman has often lamented that so much attention is lavished on post-traumatic stress syndrome rather than post-traumatic growth because it causes people to mistakenly expect that bad events will have mainly negative effects. After being exposed to a terrifying event, at least 80 percent of people do not experience post-traumatic stress syndrome. Even though a single bad event is more powerful than a good event, over time people respond in so many constructive ways that they typically emerge more capable than ever of confronting life's challenges. Bad can make us stronger in the end.
- code: 3-4-3
  source_text_id: NGICHUL-L1-3-4-3
  topic_kr: 이사로 인해 스트레스를 겪는 어린아이(특히 3~6세)를 위해 과거 경험 인정과 새로운 환경 적응 지원 사이의 균형을 잡는 것의 중요성
  text: While moving is difficult for everyone, it is particularly stressful for children. They lose their sense of security and may feel disoriented when their routine is disrupted and all that is familiar is taken away. Young children, ages 3-6, are particularly affected by a move. Their understanding at this stage is quite literal, and it is difficult for them to imagine beforehand a new home and their new room. Young children may have worries such as "Will I still be me in the new place?" and "Will my toys and bed come with us?" It is important to establish a balance between validating children's past experiences and focusing on helping them adjust to the new place. Children need to have opportunities to share their backgrounds in a way that respects their past as an important part of who they are. This contributes to building a sense of community, which is essential for all children, especially those in transition.
- code: 3-4-4
  source_text_id: NGICHUL-L1-3-4-4
  topic_kr: 감정적 자극에 따른 무의식적 발한(땀샘 활동)과 피부 전기 전도도 변화를 이용한 주관적 감정 강도의 객관적 수치화
  text: Our skin conducts electricity more or less efficiently, depending on our emotions. We know that when we're emotionally stimulated—stressed, sad, any intense emotion, really—our bodies sweat a tiny bit, so little we might not even notice. And when those tiny drops of sweat appear, our skin gets more electrically conductive. This change in sweat gland activity happens completely without your conscious mind having much say in the matter. If you feel emotionally intense, you're going to notice an increase in sweat gland activity. This is particularly useful from a scientific viewpoint, because it allows us to put an objective value on a subjective state of mind. We can actually measure your emotional state by tracking how your body subconsciously sweats, by running a bit of electricity through your skin. We can then turn the subjective, subconscious experience of emotional intensity into an objective number by figuring out how good your skin gets at transferring an electrical current.
- code: 3-4-5
  source_text_id: NGICHUL-L1-3-4-5
  topic_kr: 기술 혁신으로 인한 음악의 대중적 이용 가능성 확대가 개인에게 부여한 음향 통제권과 그에 수반되는 음악 탐색·선택의 상당한 노력
  text: Due to technological innovations, music can now be experienced by more people, for more of the time than ever before. Mass availability has given individuals unheard-of control over their own sound-environment. However, it has also confronted them with the simultaneous availability of countless genres of music, in which they have to orient themselves. People start filtering out and organizing their digital libraries like they used to do with their physical music collections. However, there is the difference that the choice lies in their own hands. Without being restricted to the limited collection of music-distributors, nor being guided by the local radio program as a 'preselector' of the latest hits, the individual actively has to choose and determine his or her musical preferences. The search for the right song is thus associated with considerable effort.
- code: 3-4-6
  source_text_id: NGICHUL-L1-3-4-6
  topic_kr: 인간이 상상의 사다리 꼭대기 위치를 유지하기 위해 전문 용어로 인간과 동물의 유사성을 평가절하하는 '언어적 거세(linguistic castration)'
  text: The famous primatologist Frans de Waal, of Emory University, says humans downplay similarities between us and other animals as a way of maintaining our spot at the top of our imaginary ladder. Scientists, de Waal points out, can be some of the worst offenders—employing technical language to distance the other animals from us. They call "kissing" in chimps "mouth-to-mouth contact"; they call "friends" between primates "favorite affiliation partners"; they interpret evidence showing that crows and chimps can make tools as being somehow qualitatively different from the kind of toolmaking said to define humanity. If an animal can beat us at a cognitive task—like how certain bird species can remember the precise locations of thousands of seeds—they write it off as instinct, not intelligence. This and so many more tricks of language are what de Waal has termed "linguistic castration." The way we use our tongues to disempower animals, the way we invent words to maintain our spot at the top.
- code: 3-4-7
  source_text_id: NGICHUL-L1-3-4-7
  topic_kr: 초기 산업화 시대와 유사하게 자동화·전산화 시대에 진보의 혜택에서 소외되고 상향 이동 경로가 차단된 중산층 제조업 노동자들
  text: Like in the early days of industrialization, workers today are no longer reaping the gains of progress. Worse, many have been left behind in the backwaters of progress. In the same way that opportunity dried up for middle-income artisans as a consequence of the industrialization process, the age of automation has meant diminishing opportunities for the American middle class. Like the victims of the early factories, many Americans have adjusted to the computerization of work by unwillingly shifting into lower-paying jobs or have failed to adjust and dropped out of the workforce completely. And similar to the victims of the factories, the losers to automation have primarily been men in the prime of life. Up until the 1980s, manufacturing jobs allowed ordinary working men to attain a middle-class lifestyle without going to college. As employment opportunities in manufacturing receded, a path of upward mobility was closed to many citizens.
- code: 3-4-8
  source_text_id: NGICHUL-L1-3-4-8
  topic_kr: 단기적 한 끼 식사보다 장기적 생존을 우선시하는 포식자의 보수적 선택(자연선택)으로 인해 독성 산호뱀을 완벽히 모방할 필요가 없는 무독성 왕뱀
  text: Imagine yourself as a predator, perhaps a hawk. From on high, you spot what appears to be a tasty snake. If you hesitate for even a few seconds, your meal might be gone. Time is of the essence, and you must act quickly. But there's a twist—a major one. If you mistake a venomous coral snake for a non-venomous king snake, it will cost your life. In the tradeoff between a meal and your life, the choice is obvious. For a predator, natural selection has shaped this decision-making process to favor the conservative choice—long-term benefits of survival over short-term benefits of a single meal. Thus, there is no need for the king snake to be a perfect mimic of the coral snake's colors to win this round of the evolutionary arms race. The same logic applies when you're deciding whether or not to eat a wild mushroom. If you are not absolutely sure, don't let yourself fall prey to thoughts of tasty reward. The cost of your life would be too heavy a price to pay.
- code: 3-4-9
  source_text_id: NGICHUL-L1-3-4-9
  topic_kr: 직접 설명하기보다 암시·함축하는 문학 작품의 특성과 '텍스트가 무엇을 암시하는가'를 묻는 문학 해석의 의의
  text: Literary works, by their nature, suggest rather than explain; they imply rather than state their claims boldly and directly. This broad generalization, however, does not mean that works of literature do not include direct statements. Depending on when they were written and by whom, literary works may contain large amounts of direct telling and lesser amounts of suggestion and implication. But whatever the proportion of a work's showing to telling, there is always something for readers to interpret. Thus we ask the question "What does the text suggest?" as a way to approach literary interpretation, as a way to begin thinking about a text's implications. What a text implies is often of great interest to us. And our work of figuring out a text's implications tests our analytical powers. In considering what a text suggests, we gain practice in making sense of texts.
- code: 3-4-10
  source_text_id: NGICHUL-L1-3-4-10
  topic_kr: 실제 온도가 아닌 열전달률을 감지하는 인간 감각(정성적 지표)의 비신뢰성과 온도계를 통한 정량적(quantitative) 온도 측정의 필요성
  text: We often associate the concept of temperature with how hot or cold an object feels when we touch it. In this way, our senses provide us with a qualitative indication of temperature. Our senses, however, are unreliable and often mislead us. For example, if you stand in bare feet with one foot on carpet and the other on a tile floor, the tile feels colder than the carpet even though both are at the same temperature. The two objects feel different because tile transfers energy by heat at a higher rate than carpet does. Your skin "measures" the rate of energy transfer by heat rather than the actual temperature. What we need is a reliable and reproducible method for measuring the relative hotness or coldness of objects rather than the rate of energy transfer. Scientists have developed a variety of thermometers for making such quantitative measurements.
- code: 3-4-11
  source_text_id: NGICHUL-L1-3-4-11
  topic_kr: 선천적 시각 장애인이 비시각적 감각의 경험과 기억을 조합하여 정상 시력인 못지않게 생생하고 상상력 넘치는 꿈을 꾸는 방식
  text: Humans born without sight are not able to collect visual experiences, so they understand the world entirely through their other senses. As a result, people with blindness at birth develop an amazing ability to understand the world through the collection of experiences and memories that come from these non-visual senses. The dreams of a person who has been without sight since birth can be just as vivid and imaginative as those of someone with normal vision. They are unique, however, because their dreams are constructed from the non-visual experiences and memories they have collected. A person with normal vision will dream about a familiar friend using visual memories of shape, lighting, and colour. But, a blind person will associate the same friend with a unique combination of experiences from their non-visual senses that act to represent that friend. In other words, people blind at birth have similar overall dreaming experiences even though they do not dream in pictures.
- code: 3-4-12
  source_text_id: NGICHUL-L1-3-4-12
  topic_kr: 작은 실수도 용납하지 않는(unforgiving) 항공 비행 시스템의 특성과 추락을 막기 위해 모든 구성원이 최적 수준으로 일해야 하는 필요성
  text: To make an aircraft fly is a constant struggle against physics. An airliner traveling six hundred miles per hour at thirty thousand feet is not something that happens naturally. It's not a fail-safe act, meaning the default is to crash—it's up to our ingenuity and decision-making to prevent it from happening. It's a unique environment that's highly unforgiving. Whereas a loss of power in a car typically results in a few hours on the side of a road, a loss of power in the air is often disastrous. Even in business, bet-the-company decisions are rare, and when encountered, only a fraction of the employees take part in them. Aviation, however, relies on everyone working at an optimum level just to keep the aircraft flying. It's an unstable system where even a single person forgetting to do their job, or doing it improperly, can lead to catastrophic results.
- code: 3-5-1
  source_text_id: NGICHUL-L1-3-5-1
  topic_kr: 의도적인 설계자가 아니라 오랜 세월에 걸친 유리한 우연의 무의식적 축적(자연선택)이 만들어 내는 지적 설계의 환상(설계자 없는 설계)
  text: 'The concept of natural selection is the single most important tool in our Darwinian toolkit. And the most important thing to remember about natural selection is that natural selection creates an illusion of intelligent design, or what Richard Dawkins calls design without a designer. Adaptations look as if they were invented by a conscious agent for a particular purpose: hands for grasping; eyes for seeing. But they weren''t; Darwin stuck a pitchfork in that hypothesis. The design in nature comes not from a designer but from the mindless accumulation of favorable accidents over vast periods of time. The only genuine intelligent design found in the biological world comes from us, in the shape of our dogs and cows and other organisms which we''ve deliberately modified via selective breeding. Beyond that, the apparent intelligent design in nature is a forgery perpetrated by natural selection. Conscious intentions play no role.'
- code: 3-5-2
  source_text_id: NGICHUL-L1-3-5-2
  topic_kr: 서구 앵글로 문화(존중의 표시)와 호주 원주민·아시아 문화(무례함의 표시) 간 시선 맞춤(eye contact)에 대한 신념 차이로 인해 교실에서 발생하는 오해
  text: Difficulties may arise for students when the beliefs of the home and school differ. When an individual's behaviour is interpreted from a cultural perspective that is different from that of the individual in question, misunderstandings and conflict can result. Malcolm and his colleagues described a number of ways in which this can happen for Aboriginal students in mainstream Australian classrooms. In Western Anglo culture, looking people in the eye when you speak to them is a mark of respect, and shows you are attending to them. However, in many other cultures, including some Aboriginal and Asian groups, this would be a mark of disrespect—particularly if shown by a younger person to someone in a position of authority. Without this understanding, teachers might assume that students from cultures that do not favour eye contact are not listening or are not interested. Similarly, teachers who insist on eye contact without explaining that it denotes respect in their culture risk some students and parents assuming that those teachers do not want to be respected.
- code: 3-5-3
  source_text_id: NGICHUL-L1-3-5-3
  topic_kr: 우정에 이르는 지름길로서 대중적 유명세(publicity/fame)를 추구하는 것의 위험성과 세상에 잊힌 채 소수의 진정한 친구와 상호적 유대를 쌓는 안전한 삶
  text: The search for publicity is, at heart, a quest for a shortcut to friendship. Yet real kindness is never available in a public sphere. It is the fruit of a few intimate and reciprocal connections. It cannot be won remotely or one-sidedly. If it is safety one seeks, one must definitively and immediately cease to strive to be known to people one doesn't know and concentrate instead on building up genuine bonds that can survive one's errors and endure for life. Paradoxically and poignantly, it is most often the very anxious who feel a particular longing for the embrace of fame; but it is especially they (given their fragility) who should be warned away from its ultimately always revengeful arms. Being entirely forgotten by the world is no curse or sign of failure; it is the very basis for a contented and safe life in which one swaps the prospect of followers and mean-minded detractors for the deeper satisfaction of true friends.
- code: 3-5-4
  source_text_id: NGICHUL-L1-3-5-4
  topic_kr: 과학자들이 새로운 발견과 데이터를 독점하지 않고 공개하여 검증·반박 및 후속 가설 수립을 가능케 하는 과학 지식의 공유와 상호 의존성
  text: When scientists make an important new discovery or experimentally prove some hypothesis, they do not, in general, keep that information to themselves so that they alone can consider its meaning and derive additional theories from it. Instead, they publish their results and make their data available for inspection. This makes it possible for other scientists to reconsider their data and possibly refute their conclusions. More important, though, it makes it possible for other scientists to use that data to construct new hypotheses and perform new experiments. The assumption is that society as a whole will end up knowing more if information is spread as widely as possible, rather than being limited to a few people. In a strict sense, every scientist depends on the work of other scientists.
- code: 3-5-5
  source_text_id: NGICHUL-L1-3-5-5
  topic_kr: 일반적인 통념과 달리 시간이 촉박하고 중대한 위급 상황에서 세상을 파악하는 더 나은 수단이 되는 빠른 인지(rapid cognition)와 즉각적 판단(snap judgments)
  text: 'Most of us are suspicious of rapid cognition. We believe that the quality of the decision is directly related to the time and effort that went into making it. That''s what we tell our children: "Haste makes waste." "Look before you leap." "Stop and think." "Don''t judge a book by its cover." We believe that we are always better off gathering as much information as possible and spending as much time as possible in careful consideration. But there are moments, particularly in time-driven, critical situations, when haste does not make waste, when our snap judgments and first impressions can offer better means of making sense of the world. Survivors have somehow learned this lesson and have developed and sharpened their skill of rapid cognition.'
- code: 3-5-6
  source_text_id: NGICHUL-L1-3-5-6
  topic_kr: 신비감과 위계적 거리감으로 상징되는 전통적 엘리트 유명인과 달리, 일상적 상호작용과 관심 척도(구독자·팔로워·좋아요·클릭 수)로 명성의 의미를 재구성하는 소셜 미디어의 평범한 유명인(ordinary celebrity)
  text: While social media attention is potentially an instrument to achieve ends like elite celebrity, some content creators desire ordinary fame as a social end in itself. Not unlike reality television stars, social media celebrities are often criticized for not having skills and talents associated with traditional, elite celebrity, such as acting or singing ability. This criticism highlights the fact that digital content creators face real barriers to crossing over to the sphere of elite celebrity. However, the criticism also misses the point that the phenomenon of ordinary celebrity reconstructs the meaning of fame. The elite celebrity is symbolized by the metaphor of the star, characterized by mystery and hierarchical distance and associated with naturalized qualities of talent and class. The ordinary celebrity attracts attention through regular and frequent interactions with other ordinary people. Achieving ordinary fame as a social media celebrity is like doing well at a game, because in this sphere, fame is nothing more nor less than relatively high scores on attention scales, the metrics of subscribers, followers, Likes, or clicks built into social media applications.
- code: 3-5-7
  source_text_id: NGICHUL-L1-3-5-7
  topic_kr: 능력(지적 역량·재능·매력)이 어떻게 정의되든 그것이 한 사람의 자기 가치(self-worth)를 결정하는 유일한 요인이 되어 수행 결과만으로 사람을 평가할 때 발생하는 문제
  text: For many people, ability refers to intellectual competence, so they want everything they do to reflect how smart they are—writing a brilliant legal brief, getting the highest grade on a test, writing elegant computer code, saying something exceptionally wise or witty in a conversation. You could also define ability in terms of a particular skill or talent, such as how well one plays the piano, learns a language, or serves a tennis ball. Some people focus on their ability to be attractive, entertaining, up on the latest trends, or to have the newest gadgets. However ability may be defined, a problem occurs when it is the sole determinant of one's self-worth. The performance becomes the only measure of the person; nothing else is taken into account. An outstanding performance means an outstanding person; an average performance means an average person. Period.
- code: 3-5-8
  source_text_id: NGICHUL-L1-3-5-8
  topic_kr: 어린 시절(4~5세경) 부모가 돈에 대해 무심코 던진 말이나 대답이 아이의 '돈에 대한 청사진(money blueprint)'에 각인되어 성인기 일에 대한 집착이나 과소비 성향으로 이어지는 과정
  text: When we are young, we see our parents as people who always know the answers. That's probably why as soon as we can think independently, around the ages of 4-5, we start asking a lot of questions. Parents try to answer these questions in a way that a young mind can comprehend. However, when it comes to learning lessons about money, our parents' answers to these questions get written into a money blueprint. Even worse, a passing comment about money in the kitchen or at the dinner table can have a lasting effect. For example, a common phrase used by parents in response to a child's request for something is "No, we can't afford that." Think for a moment about how a young mind might interpret that. The message could be interpreted as "we don't have enough money" or "there isn't enough money." These beliefs about money can lead to an entire life designed around making sure there is always enough money through an obsession around work. It could lead to someone feeling deprived and a propensity for overspending in adulthood to avoid the feeling of deprivation.
- code: 3-5-9
  source_text_id: NGICHUL-L1-3-5-9
  topic_kr: 오프라인 매장(brick-and-mortar stores)의 공간적 한계를 넘어 다양한 도서 선택권과 공격적 할인을 앞세운 온라인 서점에서 시작해 거대 산업으로 성장한 전자상거래(e-commerce)
  text: Roughly twenty years ago, brick-and-mortar stores began to give way to electronic commerce. For good or bad, the shift fundamentally changed consumers' perception of the shopping experience. Nowhere was the shift more obvious than with book sales, which is how online bookstores got their start. Physical bookstores simply could not stock as many titles as a virtual bookstore could. There is only so much space available on a shelf. In addition to greater variety, online bookstores were also able to offer aggressive discounts thanks to their lower operating costs. The combination of lower prices and greater selection led to the slow, steady rise of online bookstores. Before long, the e-commerce book market naturally expanded to include additional categories, like CDs and DVDs. E-commerce soon snowballed into the enormous industry it is today, where you can buy everything from toilet paper to cars online.
- code: 3-5-10
  source_text_id: NGICHUL-L1-3-5-10
  topic_kr: 마그마가 식으며 원자들이 결합해 광물을 형성할 때, 마그마에 포함된 원소의 종류·양 및 마그마의 냉각 속도(느린 냉각=큰 결정, 빠른 냉각=작은 결정)가 광물 결정에 미치는 영향
  text: Natural processes form minerals in many ways. For example, hot melted rock material, called magma, cools when it reaches the Earth's surface, or even if it's trapped below the surface. As magma cools, its atoms lose heat energy, move closer together, and begin to combine into compounds. During this process, atoms of the different compounds arrange themselves into orderly, repeating patterns. The type and amount of elements present in a magma partly determine which minerals will form. Also, the size of the crystals that form depends partly on how rapidly the magma cools. When magma cools slowly, the crystals that form are generally large enough to see with the unaided eye. This is because the atoms have enough time to move together and form into larger crystals. When magma cools rapidly, the crystals that form will be small. In such cases, you can't easily see individual mineral crystals.
- code: 3-5-11
  source_text_id: NGICHUL-L1-3-5-11
  topic_kr: 문명 초기부터 신화·문화적 정체성의 원천이 되었을 뿐 아니라 시간 기록·달력 제작(농사·수확 보조) 및 항해 도구로서 실용적 가치를 제공해 온 밤하늘
  text: We are connected to the night sky in many ways. It has always inspired people to wonder and to imagine. Since the dawn of civilization, our ancestors created myths and told legendary stories about the night sky. Elements of those narratives became embedded in the social and cultural identities of many generations. On a practical level, the night sky helped past generations to keep track of time and create calendars—essential to developing societies as aids to farming and seasonal gathering. For many centuries, it also provided a useful navigation tool, vital for commerce and for exploring new worlds. Even in modern times, many people in remote areas of the planet observe the night sky for such practical purposes.
- code: 3-5-12
  source_text_id: NGICHUL-L1-3-5-12
  topic_kr: 검증되지 않은 학업 적성 정보(파란 눈 vs 갈색 눈 우열 암시)가 학생들의 학습 동기와 학업 성취도를 즉각 변화시킨 미국의 초등학생 심리 실험 (피그말리온/플라시보 효과)
  text: 'Here is an interesting experiment which was conducted on a group of elementary students in the U.S. over thirty years ago. The teacher who participated in the experiment told her students: "According to a recent study, children with blue eyes have a higher learning aptitude than children with brown eyes." After telling her students this bit of uncertified information, she had the children write the color of their eyes on a card and hang them around their necks. The children were monitored for a week and the results were as follows. Learning motivation for children with brown eyes dropped, and the blue-eyed children became drastically better in class. Then, the teacher told the students, "There have been reports that the experimental results were wrong. In fact, brown-eyed children do better in class than blue-eyed children." What were the results? This time the children with brown eyes excelled in class, while the learning motivation for the children with blue eyes decreased.'
- code: 3-6-1
  source_text_id: NGICHUL-L1-3-6-1
  topic_kr: '''고객은 항상 옳다''는 통념을 넘어, 상품을 남용하거나 어떤 조치에도 만족하지 않는 고객에게는 거절(''no'')하거나 관계를 끊고(''fire a customer'') 성공의 원천인 나머지 고객에게 집중해야 한다는 경영 원칙'
  text: Is the customer always right? When customers return a broken product to a famous company, which makes kitchen and bathroom fixtures, the company nearly always offers a replacement to maintain good customer relations. Still, "there are times you've got to say 'no,'" explains the warranty expert of the company, such as when a product is undamaged or has been abused. Entrepreneur Lauren Thorp, who owns an e-commerce company, says, "While the customer is 'always' right, sometimes you just have to fire a customer." When Thorp has tried everything to resolve a complaint and realizes that the customer will be dissatisfied no matter what, she returns her attention to the rest of her customers, who she says are "the reason for my success."
- code: 3-6-2
  source_text_id: NGICHUL-L1-3-6-2
  topic_kr: 가상 환경이나 기계 매개 환경(비디오 게임의 사실성 향상, 군인 훈련 프로그램 등)에서 신빙성 있는 촉각을 재현하기 위해 '고통(pain)' 자극을 전달하는 기술의 필요성과 유용성
  text: One important point related to the possibility of reproducing believable tactile sensations in virtual or machine-mediated environments lies in the role of "pain." Certainly, a number of real interactions can never be entirely believable without the presence of painful stimulation. However, one might wonder whether reproducing such kinds of stimulation would ever be of any use within virtual or mediated interactions. Shouldn't a "virtual" world be, in some sense, "better" without pain? Even if not immediately intuitive, there are a (admittedly small) number of situations in which the ability to deliver painful stimulation comes in handy within mediated environments. In fact, numerous attempts have been made over the course of the last few years to reproduce these aspects of our perception as well. This may occur in video games to increase the realism of the simulation or even more importantly in training programs for soldiers where pain is an occupational hazard and will need to be dealt with.
- code: 3-6-3
  source_text_id: NGICHUL-L1-3-6-3
  topic_kr: 사용할수록 고갈되고 공유할수록 나뉘는 물리적 자원과 달리, 공유해도 줄어들지 않고 모두를 부유하게 만드는 비제로섬(non-zero-sum) 정보 자원으로서 지식(아이디어)의 본질적 풍부함(inherently abundant)
  text: Knowledge—the output of human innovation—is unique among all resources. It's not a physical resource. It's an information resource. Where all physical resources are depleted by use, and are divided by sharing, knowledge is different. A wheel may break or wear out, but the idea of the wheel will keep on working. A wheel can only be used in one place and one time, but the design for a wheel can be shared with an infinite number of people, all of whom can benefit from it. Ideas aren't zero-sum. That means the world isn't zero-sum. One person or nation's gain doesn't have to be another's loss. By creating new ideas, we can enrich all of us on the planet, while impoverishing none. Knowledge plays by different rules than physical resources, rules that make it inherently abundant.
- code: 3-6-4
  source_text_id: NGICHUL-L1-3-6-4
  topic_kr: 위대한 작곡가들이 당대에 이해받지 못했던 이유인 '생소함(unfamiliarity)'과 살리에리가 좋은 작곡가였음에도 위대한 작곡가가 되지 못한 결정적 이유인 '독창성(originality)의 부재'
  text: You hear again and again that some of the greatest composers were misunderstood in their own day. Not everyone could understand the compositions of Beethoven, Brahms, or Stravinsky in their day. The reason for this initial lack of acceptance is unfamiliarity. The musical forms, or ideas expressed within them, were completely new. And yet, this is exactly one of the things that makes them so great. Effective composers have their own ideas. Have you ever seen the classic movie Amadeus? The composer Antonio Salieri is the "host" of this movie; he's depicted as one of the most famous non-great composers—he lived at the time of Mozart and was completely overshadowed by him. Now, Salieri wasn't a bad composer; in fact, he was a very good one. But he wasn't one of the world's great composers because his work wasn't original. What he wrote sounded just like what everyone else was composing at the time.
