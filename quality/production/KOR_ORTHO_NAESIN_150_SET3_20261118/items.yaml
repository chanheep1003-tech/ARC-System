- item_id: KOR-ON3-005
  archetype: A6_RULE_CASE_EXPLANATION
  stem: '[제47항] <보기>를 바탕으로 탐구한 내용으로 적절하지 않은 것은?'
  view:
  - 제47항 보조 용언은 띄어 씀을 원칙으로 하되, 경우에 따라 붙여 씀도 허용한다.
  - 다만, 앞말에 조사가 붙거나 앞말이 합성 용언인 경우, 그리고 중간에 조사가 들어갈 적에는 그 뒤에 오는 보조 용언은 띄어 쓴다.
  - ※ 붙여 쓰기가 허용되는 것은 '-아/-어' 뒤에 연결되는 보조 용언과, 의존 명사에 '-하다'나 '-싶다'가 붙어서 된 보조 용언이다.
  options:
  - '""날이 점점 밝아 온다"는 ''밝아온다''로 붙여 쓸 수도 있다.'
  - '"나도 그 일을 하고 싶다"는 보조 용언이므로 ''하고싶다''로 붙여 쓸 수 있다.'
  - '"편지를 다시 읽어 보았다"는 ''읽어보았다''로 붙여 쓸 수도 있다.'
  - '"종이배가 떠내려가 버렸다"는 앞말이 합성 용언이므로 붙여 쓸 수 없다.'
  - '"그가 올 듯도 하다"는 중간에 조사가 들어갔으므로 붙여 쓸 수 없다.'
  answer: 2
