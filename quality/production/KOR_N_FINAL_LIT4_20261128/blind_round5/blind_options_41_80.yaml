    3: {v: T, ev: "Line 10 '별들이여'."}
    4: {v: T, ev: "Lines 3 '새.' and 8 '눈.' end on nouns."}
    5: {v: T, ev: "Lines 12-13 '죽음이 아니다.' is assertive."}
  answer: 1
  notes: "Clean. Overlaps items 52 and 56 (same ending-type facts)."

