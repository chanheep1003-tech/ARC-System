# Blind solve, items 41-80. Line numbers follow the 〔5〕 markers.
# (가) 보석 1: 1 화석 속엔 한 마리 / 2 새가 난다. / 3 결코 지상으로…새. / 4 내가 흘린 눈물도 / 5 쥐라기 지층 어느 하늘 아래 /
#   6 하나의 보석으로 반짝거릴까, / 7 가령 죽음이라든가, / 8 죽음 앞에서 초롱초롱 빛나던 눈. / 9 스스로 불에 타서 소멸을 선택하는 /
#   10 지상의 별들이여 / 11 묻혀라 화석에. / 12 영원히 죽는 것은 이미 / 13 죽음이 아니다.
# (나) 얼굴: 1 눈이 피곤… 얼굴을 가렸다 / 2 …어둠이 손에 배자 / 3 해골이 만져졌다 / 4 신기한 것을 감지한 듯 / 5-6 아까워하며 조금씩 조금씩 /
#   7 차갑고 무뚝뚝하고 무관심한 그 물체를 / 8 튼튼한 폐허를 / 9 해골의 껍데기에 붙어서 / 10 생글거리고…얼굴이여 / 11 마음처럼 얇디얇은 얼굴이여 /
#   12 ~일 없이 x3 / 13 내 해골은 늘 너를 보고 있네 / 14 잠시 동안만 피다 지는 얼굴을 / 15-16 뻗어 있는 긴 시간을 / 17 선글라스만한…보고 있네 /
#   18 손을 풀었다 / 19 햇빛은 살로 변하여 / 20 얼굴이 되었다 / 21 뒤집어쓴 얼굴이 어색하여 / 22 눈동자를 되찾아 / 23 서둘러 서류 속의 숫자에 초점

