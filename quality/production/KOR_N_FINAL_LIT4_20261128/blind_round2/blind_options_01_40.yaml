    2: {verdict: T, evidence: "A 신야 농사/위빈 낚시 before meeting 탕/문왕; B 직신·의사 = 신하 자세; C 범려 은거·소광 천일금 after 공명 (35-37)."}
    3: {verdict: F, evidence: "A/B swapped."}
