# Blind option verdicts, items 1-40. Verse line numbers follow the 〔5〕 markers:
# 1 녹수청산 ... 7 나도 또한 신선 ... 11 이 놀음 다한 후에 ... 16 풍운 ... 19 나도 또한 그 아니랴 ... 25 ㉣들으시면 ... 28 한림원/ⓒ ... 30 당우 ... 33 오현금 | (중략) | 35 공명을 크게 ... 46 질병 없이.
# LAYOUT NOTE: numbering jumps 33 -> 35 across (중략) (the 중략 marker absorbs line 34). No item cites line 34, so no answer is affected, but students may be confused.
notes_global:
  - "원유가 line numbering skips 34 at the (중략) marker; harmless for items 1-20 but worth stating in the stem or renumbering."
  - "Most items are single-evidence (D2); distractors are often contradicted by a single word (기쁘게, 못 얻어서, 차마, 참는다, 협조를 얻지 못한 채)."
items:
- item_id: KOR-NF4-001
  polarity: positive
  options:
    1: {verdict: F, evidence: "37 '소광의 천일금을 담양군에 흩어두고' - speaker scatters/gives gold; does not receive it from hometown people."}
    2: {verdict: F, evidence: "13-14: the 소년들 ask the speaker '늦게 옴은 웬일인고'; speaker does not ask/teach them."}
    3: {verdict: F, evidence: "25 '들으시면' hypothetical; 의정부 scene is imagined, not recollected."}
    4: {verdict: T, evidence: "1-2 삼간초당, 1-10 풍류, 11-12 '공명을 기약하고 ... 서울 거리 찾아가니'."}
    5: {verdict: F, evidence: "Ending 43-46 is cheerful; no regret about retiring."}
- item_id: KOR-NF4-002
