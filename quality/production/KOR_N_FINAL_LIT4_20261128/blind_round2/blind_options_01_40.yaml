    2: {verdict: T, evidence: "17-18 이윤/여상, 22-23 급암/노중련 used to assert speaker's 뜻."}
    3: {verdict: T, evidence: "42 '깨지 마오', 43 '아이야 술 부어라'."}
    4: {verdict: T, evidence: "7 '앉아보고 서서 보니', 21 '바라나니 성군이요 생각하니 명주로다', 39 '형 오소 아우 오소'."}
