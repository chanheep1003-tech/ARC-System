- item_id: KOR-NF4-024
  polarity: positive (pairing)
  verdicts:
    ㄱ: "'세상에 펴낼 가치가 없는 거니까 그러죠' → '가치가 없다니…' → 눈이 휘둥그레진다."
    ㄴ: "Explanation of 조판/옵세트 → '알아듣지도 못하는 터이라… 이맛살'."
    ㄷ: "'한문투성인 책을 누가 거들떠보기나' → '잠시 말문이 막힌다'."
  options: {1: F, 2: F, 3: T, 4: F, 5: F}
  note: "The slot-majority choice gives option 5, so there is no surface cue."
- item_id: KOR-NF4-025
  polarity: positive
  verdicts:
