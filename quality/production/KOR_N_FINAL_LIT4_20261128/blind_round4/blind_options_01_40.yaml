- item_id: KOR-NF4-020
  polarity: positive
  verdicts:
    1: {tf: F, ev: "35-46 has no '나도 또한'; 범려·소광 are models, not explicit self-comparison."}
    2: {tf: F, ev: "No ideal-land metaphor for home and no 설의 exclamation about it; '꿈결인가' is about the 놀음."}
    3: {tf: T, ev: "11 기약 vs 35 공명을 크게 닦고."}
    4: {tf: F, ev: "Unsupported comparison of intensity; 10 says he sits with the 통소 after the wine is gone."}
    5: {tf: F, ev: "꿈결 is not night; there is no day-cycle structure."}
- item_id: KOR-NF4-021
  polarity: positive
  verdicts:
