    2: {tf: F, ev: "Chronological; the 중략 is a summary, not a flashback."}
    3: {tf: F, ev: "Both minds are shown ('괘씸하기 짝이 없다', '명준은… 생각한다')."}
    4: {tf: T, ev: "Omniscient third person: '송 노인은 눈언저리가 화끈해지는 느낌이다', '명준은 웃음이 나오려는 것을 참는다'."}
    5: {tf: F, ev: "Dialogue-centred; little background description."}
