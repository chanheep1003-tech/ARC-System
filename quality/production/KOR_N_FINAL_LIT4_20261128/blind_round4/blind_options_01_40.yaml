solver: independent blind solver (no key consulted)
line_map_note: "원유가 verse lines read from the 〔5〕 markers: 1 녹수청산 … 7 나도 또한 신선이다, 9 화전난무, 10 통소, 11 이 놀음 다한 후에, 12 서울 거리, 13 소년들, 14 ㉡출세가, 15 자네로세, 16 기쁘게 대답하되, 17 이윤, 18 여상, 19 나도 또한 그 아니랴/㉢, 20 충효, 21 바라나니 성군, 22 급암, 23 노중련, 24 황하수/성상, 25 ㉣이 노래 들으시면, 26 삼고초려, 27 제갈량/조보, 28 의정부, 29 하교하되, 30 당우, 31 고요직설, 32 초야, 33 오현금; (중략) takes number 34; 35 공명을 크게 닦고, 36 범려/한강수, 37 소광/담양군, 38 감군은, 39 형 오소, 40 그도 그러하거니와, 41 좋은 벗, 42 그대, 43 아이야 술 부어라/㉤, 44 꿈결인가, 45 광명한, 46 질병 없이."
items:
- item_id: KOR-NF4-001
  polarity: positive
  verdicts:
    1: {tf: F, ev: "The boys ask (13-14 '늦게 옴은 웬일인고'); the speaker answers and does not question them."}
    2: {tf: T, ev: "1-10 삼간초당 풍류 → 11 '이 놀음 다한 후에 공명을 기약하고' → 12 '서울 거리 찾아가니'."}
    3: {tf: F, ev: "The 의정부 scene is hypothetical (25 '들으시면'), not something remembered."}
    4: {tf: F, ev: "37 '소광의 천일금을 담양군에 흩어두고': the speaker gives the money out; he does not receive it from villagers."}
    5: {tf: F, ev: "Ends with 45-46 '질병 없이 살아감을 진실로 바라노라'; no regret about retiring."}
- item_id: KOR-NF4-002
  polarity: negative
  verdicts:
    1: {tf: F, ev: "No seasonal progression. 9행 mentions 여름/가을 inside one 한문 line, and 석양 (3) is a time of day. Weak but defensible distractor."}
    2: {tf: T, ev: "이윤·여상·급암·노중련 (17-23) used to stress the speaker's resolve."}
    3: {tf: T, ev: "43 '아이야 술 부어라', 42 '깨지 마오'."}
    4: {tf: T, ev: "21 '바라나니 성군이요 생각하니 명주로다', 39 '형 오소 아우 오소'."}
    5: {tf: T, ev: "6 '무릉도원이 여기 아닌가'."}
- item_id: KOR-NF4-003
  polarity: positive
  verdicts:
    1: {tf: F, ev: "ⓐ is the starting place before 공명 (2); the place he returns to is 담양."}
    2: {tf: F, ev: "ⓑ is where the boys welcome him; he is not hiding."}
    3: {tf: F, ev: "ⓒ belongs to the imagined summons; '실제로' is false."}
    4: {tf: T, ev: "35-36 '벼슬 그만 아뢴 후에 범려의 오호주로 한강수 건너와서'."}
    5: {tf: F, ev: "ⓔ is where he scatters wealth after retiring (37)."}
- item_id: KOR-NF4-004
  polarity: positive (ㄱㄴㄷㄹ)
  verdicts:
    ㄱ: {tf: F, ev: "15 '부르나니 자네로세' = the speaker; 42 '그대에게 권한 한 잔 오래 취해 깨지 마오' = the speaker offers a cup to a companion, so 그대 ≠ the speaker."}
    ㄴ: {tf: T, ev: "13-15 the boys speak; 16 '기쁘게 대답하되'."}
    ㄷ: {tf: T, ev: "24 '우리 성상 나계시니' → 25 '들으시면' → 29 '하교하되' → 30-33 the king speaks."}
    ㄹ: {tf: T, ev: "40-42: he looks at the people around him, '좋은 벗', and offers '그대' a cup."}
  options: {1: F, 2: F, 3: F, 4: T, 5: F}
  note: "ㄱ hinges on who says line 42. The reading 'friends address the speaker as 그대' is possible but weak, because 43 '아이야 술 부어라' keeps the speaker as host. Q12-5 tests the same point."
- item_id: KOR-NF4-005
  polarity: positive
  verdicts:
    1: {tf: F, ev: "㉠ (6) is in the nature section, before the boys appear."}
    2: {tf: T, ev: "㉡ is the boys' line to the speaker; 16-19 he answers with the 이윤·여상 고사."}
    3: {tf: F, ev: "㉢ (19) is the speaker describing himself, not the king."}
    4: {tf: F, ev: "㉣ (25) is a hypothetical in the pre-appointment section, not a memory after retirement."}
    5: {tf: F, ev: "㉤ (43) comes after retirement at home, not on arrival in Seoul."}
- item_id: KOR-NF4-006
  polarity: positive (pairing)
  verdicts:
    A: "이윤 신야 농사 / 여상 위빈 낚시 before meeting 탕·문왕 = 등용되기 이전의 처지 (parallel to his own late rise). '신하로서 지닐 자세' is partly arguable, but no option pairs it with a correct B."
    B: "급암 직신, 노중련 의사 = 신하로서 지닐 자세."
    C: "범려 오호주, 소광 천일금 after 벼슬 그만 = 공명을 이룬 이후의 삶."
  options: {1: "F (B wrong)", 2: "F", 3: "F", 4: "F", 5: "T"}
- item_id: KOR-NF4-007
  polarity: positive (pairing)
  verdicts:
    ㄱ: "'내 벌써 하려 하나' = meant to achieve it but has not yet (since he lacked worthy ministers)."
    ㄴ: "'고요직설 못 얻어서' = the cause is not having found worthy ministers."
    ㄷ: "32 '이날에야 만났으니' → 33 asks when the 남풍시 age will come = hope of achieving it with the speaker."
  options: {1: F, 2: F, 3: T, 4: F, 5: F}
  note: "Choosing the majority value in each slot gives option 5, so there is no surface cue."
- item_id: KOR-NF4-008
  polarity: positive (ㄱㄴㄷㄹ)
  verdicts:
    ㄱ: {tf: T, ev: "25 '이 노래 들으시면' → 26-33 the appointment scene."}
    ㄴ: {tf: F, ev: "26-27 compare the king to 유비/송 태조 and the speaker to 제갈량/조보; the speaker has not met them."}
    ㄷ: {tf: T, ev: "35-37 범려·소광."}
    ㄹ: {tf: F, ev: "'꿈결인가 잠결인가' (44) expresses rapture; it does not reveal that everything was a dream."}
  options: {1: F, 2: T, 3: F, 4: F, 5: F}
  note: "ㄹ cites '43~44행' but the phrase is only in 44. The range is harmless but imprecise. Line 26 '도원결의 송 태조' is odd in the source (도원결의 belongs to 유비) and is not tested."
- item_id: KOR-NF4-009
  polarity: positive (pairing)
  verdicts:
    ㄱ: "'기쁘게 대답하되' (16). '늦게 옴은 웬일인고' is the boys' question."
    ㄴ: "'충신열사 후예로서' (19). '바라나니 성군이요' concerns the king."
    ㄷ: "'우리 성상 나계시니' (24). '들으시면' is hypothetical."
  options: {1: F, 2: F, 3: T, 4: F, 5: F}
