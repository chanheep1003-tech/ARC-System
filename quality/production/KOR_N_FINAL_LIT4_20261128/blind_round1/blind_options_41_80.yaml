    3: {verdict: FALSE, evidence: "'도' aligns the tears with the bird (eternal), not contrasts them."}
    4: {verdict: TRUE, evidence: "4~6행 '눈물도…하나의 보석으로 반짝거릴까'."}
    5: {verdict: FALSE, evidence: "'~ㄹ까' is a wish or doubt, not a certainty that it cannot happen."}
