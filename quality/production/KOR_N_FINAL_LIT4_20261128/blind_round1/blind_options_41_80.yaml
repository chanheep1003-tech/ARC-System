# Blind option verdicts, items 41-80. Line numbers: (가) 1-13 (〔5〕=쥐라기 행, 〔10〕=지상의 별들이여); (나) 1-23 (〔5〕 한꺼번에, 〔10〕 생글거리고, 〔15〕 얼굴 뒤로, 〔20〕 곧 얼굴이 되었다).
# Polarity: POS = pick the true one; NEG = pick the false one.
global_notes:
  - "Cross-item cueing: the phrase '보석처럼 남기를 바라는 것의 예' appears in 45③ (TRUE), 48③ (key) and 60⑤ (key); 43②, 47④, 54② and 49⑤ all state the same 'transience to eternity' thesis. Inside one set, a student who solves one gets the others for free."
  - "51 and 76 reuse an identical <보기>."
  - "Most distractors in 41-80 are refuted by one false clause (e.g. 공포, 체념, 후회, 꿈, 위로); difficulty is mostly D2."
items:
- item_id: KOR-NF4-041
  polarity: NEG
  options:
    1: {verdict: TRUE, evidence: "3행 '…내려오지 않는 새.' and 8행 '…빛나던 눈.' end in nouns."}
    2: {verdict: TRUE, evidence: "6행 '반짝거릴까' expresses a hesitant wish."}
    3: {verdict: TRUE, evidence: "10행 '지상의 별들이여' addresses the object."}
    4: {verdict: TRUE, evidence: "12~13행 '…이미 / 죽음이 아니다.' is a declarative ending."}
    5: {verdict: FALSE, evidence: "No question-and-answer dialogue between the object and the speaker; 6행 is a single self-directed question."}
  note: ""
- item_id: KOR-NF4-042
  polarity: POS
  options:
    1: {verdict: FALSE, evidence: "1~2행 '화석 속엔…새가 난다': something remains and moves."}
    2: {verdict: FALSE, evidence: "3행 '결코 지상으로 내려오지 않는 새': it never falls."}
    3: {verdict: FALSE, evidence: "11행 '묻혀라 화석에': a wished-for place, not one to escape."}
    4: {verdict: FALSE, evidence: "No memories are recalled."}
    5: {verdict: TRUE, evidence: "11~13행: burial in the fossil makes death '죽음이 아니다'."}
  note: "Distractors are weak; the key can be guessed from general knowledge (flag c)."
- item_id: KOR-NF4-043
  polarity: POS
  options:
    1: {verdict: FALSE, evidence: "12~13행 deny that death is an end; no futility."}
    2: {verdict: TRUE, evidence: "6행 '보석으로 반짝거릴까', 11행 '묻혀라 화석에'."}
    3: {verdict: FALSE, evidence: "The poem affirms 'chosen extinction', 9행 '스스로…소멸을 선택하는'."}
    4: {verdict: FALSE, evidence: "The speaker wants burial in the fossil, not flight to the sky."}
    5: {verdict: FALSE, evidence: "No nostalgia for the past."}
  note: ""
- item_id: KOR-NF4-044
  polarity: POS
  options:
    1: {verdict: FALSE, evidence: "Stanza 1 is a present image ('새가 난다'), not a recollection."}
    2: {verdict: FALSE, evidence: "Stanza 1 shows no sorrow."}
    3: {verdict: TRUE, evidence: "St1 fossil bird; st2 '내가 흘린 눈물도…반짝거릴까'; st3 '별들이여 묻혀라'."}
    4: {verdict: FALSE, evidence: "No line repeats between stanza 1 and stanza 3."}
    5: {verdict: FALSE, evidence: "St1 already sits in the fossil (underground); there is no sky-to-earth descent."}
  note: ""
- item_id: KOR-NF4-045
  polarity: NEG
  options:
    1: {verdict: FALSE, evidence: "㉣ '지상의 별들' are stars on the earth, not high in the sky looking down."}
    2: {verdict: TRUE, evidence: "5행 '지층 어느 하늘 아래': a sky inside the strata."}
    3: {verdict: TRUE, evidence: "7~8행 '가령…' gives examples of what should shine like jewels."}
    4: {verdict: TRUE, evidence: "3행 '결코 지상으로 내려오지 않는'."}
    5: {verdict: TRUE, evidence: "11행 '묻혀라 화석에' is inverted ('화석에 묻혀라')."}
  note: ""
- item_id: KOR-NF4-046
  polarity: POS
  options:
    1: {verdict: FALSE, evidence: "The 10행 지상 holds the valued 별들; it is not a rejected space."}
    2: {verdict: TRUE, evidence: "3행 '지상으로 내려오지 않는 새' and 9~10행 '소멸을 선택하는 / 지상의 별들'."}
    3: {verdict: FALSE, evidence: "Neither longing nor fear is stated."}
    4: {verdict: FALSE, evidence: "'결코…내려오지 않는': the bird never has to return."}
    5: {verdict: FALSE, evidence: "The 10행 지상 is where things vanish; the fossil is where they remain, so they are not equivalent."}
  note: "In ②, '새가 벗어난' implies the bird was once on earth; the text says only that it never comes down. This is a small looseness but does not change the key."
- item_id: KOR-NF4-047
  polarity: POS
  options:
