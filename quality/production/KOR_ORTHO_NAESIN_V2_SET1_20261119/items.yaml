- item_id: KOR-OV1-002
  archetype: A5_EXAMPLE_MULTI_JUDGMENT
  stem: <보기>의 ㄱ~ㅁ 중 판단과 근거가 모두 적절한 것은 몇 개인가?
  view:
  - 제5항 한 단어 안에서 뚜렷한 까닭 없이 나는 된소리는 다음 음절의 첫소리를 된소리로 적는다. (1) 두 모음 사이에서 나는 된소리 (2) 'ㄴ, ㄹ, ㅁ, ㅇ' 받침 뒤에서 나는 된소리. 다만, 'ㄱ, ㅂ' 받침 뒤에서 나는 된소리는, 같은 음절이나 비슷한 음절이 겹쳐 나는 경우가 아니면 된소리로 적지 아니한다.
  - 제13항 한 단어 안에서 같은 음절이나 비슷한 음절이 겹쳐 나는 부분은 같은 글자로 적는다.
  - ㄱ. '쌉쌀하다'는 'ㅂ' 받침 뒤의 된소리이지만 비슷한 음절이 겹쳐 나므로 된소리로 적는다.
  - ㄴ. '쓱싹쓱싹'의 '싹'은 'ㄱ' 받침 뒤의 된소리이므로 제5항 다만에 따라 '삭'으로 적어야 한다.
  - ㄷ. '똑똑하다'를 '똑독하다'로 적지 않는 것은 한 단어 안에서 겹쳐 나는 부분을 같은 글자로 적기 때문이다.
  - ㄹ. '산뜻하다'는 'ㄴ' 받침 뒤의 된소리이므로 제5항 다만에 따라 '산듯하다'로 적는다.
  - ㅁ. '국밥'[국빱]의 된소리는 뚜렷한 까닭 없이 나는 된소리이므로 '국빱'으로 적는다.
  options:
  - 1개
  - 2개
  - 3개
  - 4개
  - 5개
