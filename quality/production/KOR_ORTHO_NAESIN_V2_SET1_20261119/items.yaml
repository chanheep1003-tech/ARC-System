- item_id: KOR-OV1-005
  archetype: A3_CONDITION_CLASSIFICATION
  stem: <보기 1>을 바탕으로 <보기 2>의 ㉠~㉤에서 따옴표로 표시한 음절을 분류한 결과로 옳은 것은?
  view:
  - '[참고 조항]'
  - 제10항 한자음 '녀, 뇨, 뉴, 니'가 단어 첫머리에 올 적에는 두음 법칙에 따라 '여, 요, 유, 이'로 적는다. [붙임 1] 단어의 첫머리 이외의 경우에는 본음대로 적는다. [붙임 2] 접두사처럼 쓰이는 한자가 붙어서 된 말이나 합성어에서, 뒷말의 첫소리가 'ㄴ' 소리로 나더라도 두음 법칙에 따라 적는다.
  - 제11항 한자음 '랴, 려, 례, 료, 류, 리'가 단어의 첫머리에 올 적에는 두음 법칙에 따라 '야, 여, 예, 요, 유, 이'로 적는다. [붙임 1] 단어의 첫머리 이외의 경우에는 본음대로 적는다. 다만, 모음이나 'ㄴ' 받침 뒤에 이어지는 '렬, 률'은 '열, 율'로 적는다.
  - 제12항 한자음 '라, 래, 로, 뢰, 루, 르'가 단어의 첫머리에 올 적에는 두음 법칙에 따라 '나, 내, 노, 뇌, 누, 느'로 적는다. [붙임 1] 단어의 첫머리 이외의 경우에는 본음대로 적는다. [붙임 2] 접두사처럼 쓰이는 한자가 붙어서 된 단어는 뒷말을 두음 법칙에 따라 적는다.
  - <보기 1>
  - 한자음의 두음 법칙(제10~12항)은
  - Ⓐ단어의 첫머리에서 적용하고,
  - Ⓑ단어의 첫머리가 아니면 본음대로 적되,
