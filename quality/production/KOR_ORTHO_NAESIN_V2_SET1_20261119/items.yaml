- item_id: KOR-OV1-001
  archetype: A1_GENERAL_RULE_MAPPING
  stem: <보기>의 조항과 발음 자료를 바탕으로 판단한 내용으로 가장 적절한 것은?
  view:
  - 제1항 한글 맞춤법은 표준어를 소리대로 적되, 어법에 맞도록 함을 원칙으로 한다.
  - 제14항 체언은 조사와 구별하여 적는다.
  - 제15항 용언의 어간과 어미는 구별하여 적는다.
  - 제27항 둘 이상의 단어가 어울리거나 접두사가 붙어서 이루어진 말은 각각 그 원형을 밝히어 적는다.
  - '[발음 자료] 꽃이[꼬치]  꽃잎[꼰닙]  넋이[넉씨]  앉아[안자]  앉고[안꼬]'
  options:
  - '''넋이''를 [넉씨]로 적지 않는 것은 용언의 어간과 어미를 구별해 적는 원칙에 따른 것이다.'
  - '''꽃이''는 체언과 조사를, ''꽃잎''은 합성어의 각 단어를 구별하여 ''꽃''의 형태를 고정한 것이다.'
  - '''앉아''와 ''앉고''는 발음이 서로 다르므로 어간을 ''안-''과 ''앉-''으로 나누어 적는 것이 어법에 맞다.'
  - '''꽃잎''의 [ㄴ]은 덧난 소리이므로 소리대로 적는 원칙에 따라 ''꽃닢''으로 고쳐 적어야 한다.'
  - '''꽃이''를 소리대로 ''꼬치''로 적어도 ''꽃''이라는 형태는 그대로 유지되므로 뜻 파악에 지장이 없다.'
