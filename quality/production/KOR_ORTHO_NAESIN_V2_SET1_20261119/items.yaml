- item_id: KOR-OV1-003
  archetype: A1_GENERAL_RULE_MAPPING
  stem: <보기>의 조항과 사전 자료를 바탕으로 판단할 때, 바르게 설명한 것은?
  view:
  - 제6항 'ㄷ, ㅌ' 받침 뒤에 종속적 관계를 가진 '-이(-)'나 '-히-'가 올 적에는, 그 'ㄷ, ㅌ'이 'ㅈ, ㅊ'으로 소리 나더라도 'ㄷ, ㅌ'으로 적는다.
  - 제7항 'ㄷ' 소리로 나는 받침 중에서 'ㄷ'으로 적을 근거가 없는 것은 'ㅅ'으로 적는다.
  - '[사전 자료] 곧이: ''바로 그대로''의 뜻. 형용사 ''곧다''의 어간에 ''-이''가 붙은 말 / 걷잡다: ''거두어 잡다''에서 온 말 / 핫옷: 솜을 두어 지은 옷, ''핫-''은 ''솜을 둔''의 뜻을 더하는 접두사 / 엇셈: 서로 주고받을 것을 비겨 없애는 셈'
  - '[발음 자료] 곧이[고지]  걷잡다[걷짭따]  핫옷[하돋]  엇셈[얻쎔]  샅샅이[삳싸치]'
  options:
  - '''핫옷''의 ''핫''은 [핟]으로 소리 나므로 ''ㄷ''으로 적을 근거가 있어 ''핟옷''으로 적는다.'
  - '''걷잡다''는 ''ㄷ''으로 적을 근거가 없으므로 제7항에 따라 ''것잡다''로 적는다.'
  - '''엇셈''의 받침은 [ㄷ]으로 소리 나므로 ''ㄷ''으로 적어 ''얻셈''으로 고쳐야 한다.'
  - '''샅샅이''는 ''ㅌ'' 받침 뒤 ''-이''가 [치]로 소리 나므로 ''삳사치''로 적는다.'
  - '''곧이''는 [고지]로 소리 나도 ''곧-''의 형태를 밝혀 적으므로 제6항의 사례이다.'
