- item_id: KOR-OV1-047
  meets_rubric: true
  your_answer: ㉠은 '열'과 '역학'이 결합한 합성어이므로 뒷말 '역학'이 단어의 첫머리로 간주되어 두음 법칙에 따라 '역'으로 적는다.
    ㉡은 합성어가 아닌 한 단어로서 '力'이 단어의 첫머리가 아닌 자리에 있어 본음대로 '력'으로 적는다.
  flags: []
