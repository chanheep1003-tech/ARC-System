  your_answer: 고쳐야 할 것은 ㉠과 ㉢이다. ㉠은 '기회'의 뜻이므로 '한번'으로 붙여 '기회가 되면 한번 들러라'로 쓴다. ㉢은 횟수를
    뜻하므로 '한 번'으로 띄어 '이번에는 한 번 더 확인했다'로 쓴다.
