- item_id: KOR-OV1-046
  meets_rubric: true
  your_answer: 두 단어는 모두 고유어 '머리'(끝소리가 모음)에 고유어가 결합한 합성어이다. 머릿돌은 뒷말 '돌'이 [머리똘]로 된소리가
    나므로 사이시옷을 받쳐 적고, 머리말은 [머리말]로 된소리나 'ㄴ' 덧남이 없으므로 사이시옷을 적지 않는다.
  flags: []
