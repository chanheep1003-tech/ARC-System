- item_id: KOR-OV1-049
  meets_rubric: true
  your_answer: ㉠ 익숙지 않다, ㉡ 정결타. '익숙'의 '숙' 받침 소리가 [ㄱ]이므로 '하'가 아주 줄어 '익숙지'로 적는다. '정결'의
    '결' 받침 소리는 [ㄹ]이라 [ㄱ, ㄷ, ㅂ]이 아니므로 '하'의 'ㅏ'만 줄고 'ㅎ'이 'ㄷ'과 어울려 거센소리 '정결타'가 된다.
  flags: []
  difficulty: D3
- item_id: KOR-OV1-050
