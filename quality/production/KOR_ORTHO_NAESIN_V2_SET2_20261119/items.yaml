- item_id: KOR-OV2-003
  archetype: A3_CONDITION_CLASSIFICATION
  stem: <보기 1>을 바탕으로 <보기 2>의 ㉠~㉤에서 따옴표로 표시한 음절을 분류한 것으로 가장 적절한 것은?
  view:
  - <보기 1>
  - Ⓐ단어의 첫머리에 온 한자음 '녀, 뇨, 뉴, 니', '랴, 려, 례, 료, 류, 리', '라, 래, 로, 뢰, 루, 르'는 두음 법칙에 따라 적는다.
  - Ⓑ단어의 첫머리 이외의 경우에는 본음대로 적는다.
  - Ⓒ접두사처럼 쓰이는 한자가 붙어서 된 말이나 합성어에서는 뒷말의 첫머리에 두음 법칙을 적용한다. 단어의 짜임은 뜻을 이루는 단위로 판단한다.
  - <보기 2>
  - '㉠ 고''랭''지(高冷地: 고랭+지)'
  - '㉡ 공''염''불(空念佛: 공+염불)'
  - ㉢ 남'녀'(男女)
  - '㉣ 몰''이''해(沒理解: 몰+이해)'
  - ㉤ '낙'원(樂園)
  options:
  - Ⓐ ㉤   Ⓑ ㉢   Ⓒ ㉠, ㉡, ㉣
  - Ⓐ ㉠, ㉤   Ⓑ ㉢   Ⓒ ㉡, ㉣
  - Ⓐ ㉤   Ⓑ ㉠, ㉢, ㉣   Ⓒ ㉡
  - Ⓐ ㉡, ㉤   Ⓑ ㉠, ㉢   Ⓒ ㉣
  - Ⓐ ㉤   Ⓑ ㉠, ㉢   Ⓒ ㉡, ㉣
