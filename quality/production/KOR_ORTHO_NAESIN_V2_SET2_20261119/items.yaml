- item_id: KOR-OV2-002
  archetype: A5_EXAMPLE_MULTI_JUDGMENT
  stem: <보기>의 ㄱ~ㅁ 중 판단과 근거가 모두 적절한 것은 몇 개인가?
  view:
  - ㄱ. '잔뜩'은 'ㄴ' 받침 뒤에서 뚜렷한 까닭 없이 나는 된소리이므로 된소리로 적는다.
  - ㄴ. '꽃대'[꼳때]의 된소리는 받침 뒤에서 규칙적으로 일어나는 된소리되기이므로 표기에 반영하지 않는다.
  - ㄷ. '산뜻하다'와 '살짝'은 받침의 종류는 다르지만 제5항의 같은 항목에 근거하여 된소리로 적는다.
  - ㄹ. '쓱싹쓱싹'은 'ㄱ' 받침 뒤의 된소리이지만 같은 음절이 겹쳐 나는 경우이므로 된소리로 적는다.
  - ㅁ. '낮잠'[낟짬]은 받침 뒤에서 까닭 없이 나는 된소리이므로 제5항에 따라 '낟짬'으로 적는다.
  options:
  - 1개
  - 2개
  - 3개
  - 4개
  - 5개
