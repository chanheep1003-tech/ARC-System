- item_id: KOR-OV2-001
  archetype: A1_GENERAL_RULE_MAPPING
  stem: <보기>의 자료를 바탕으로 표기 원리를 탐구한 내용으로 가장 적절한 것은?
  view:
  - '[참고 조항]'
  - 제1항 한글 맞춤법은 표준어를 소리대로 적되, 어법에 맞도록 함을 원칙으로 한다.
  - 제10항 한자음 '녀, 뇨, 뉴, 니'가 단어 첫머리에 올 적에는 두음 법칙에 따라 '여, 요, 유, 이'로 적는다. [붙임 1] 단어의 첫머리 이외의 경우에는 본음대로 적는다. [붙임 2] 접두사처럼 쓰이는 한자가 붙어서 된 말이나 합성어에서, 뒷말의 첫소리가 'ㄴ' 소리로 나더라도 두음 법칙에 따라 적는다.
  - 제12항 한자음 '라, 래, 로, 뢰, 루, 르'가 단어의 첫머리에 올 적에는 두음 법칙에 따라 '나, 내, 노, 뇌, 누, 느'로 적는다. [붙임 1] 단어의 첫머리 이외의 경우에는 본음대로 적는다. [붙임 2] 접두사처럼 쓰이는 한자가 붙어서 된 단어는 뒷말을 두음 법칙에 따라 적는다.
  - '[발음 자료] 노인(老人)[노ː인]   굳이[구지]   무릎이[무르피]   며칠[며칠]   덮개[덥깨]'
  - ※ '며칠'은 '몇'과 '일'로 형태를 나눌 근거가 분명하지 않은 말이다. '노(老)'의 본음은 '로'이다.
  options:
  - '''굳이''는 실제 발음을 따라 소리대로 적었고, ''무릎이''는 체언과 조사를 구별하여 적었다.'
  - '''덮개''와 ''굳이''는 모두 실제 발음을 그대로 반영하여 적은 말이다.'
  - '''무릎이''를 [무르피]대로 적지 않은 것은 표준어가 아닌 발음을 피하기 위해서이다.'
  - '''노인''은 두음 법칙에 따른 소리대로, ''며칠''은 형태를 밝힐 근거가 없어 소리대로 적었다.'
  - '''며칠''은 ''몇''과 ''일''의 원형을 밝혀 적은 것으로 어법에 맞도록 적은 사례이다.'
  answer: 4
  second_best: 1
