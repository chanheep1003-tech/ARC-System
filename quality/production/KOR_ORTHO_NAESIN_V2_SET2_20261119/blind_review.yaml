- item_id: KOR-OV2-046
  meets_rubric: true
  your_answer: ㉠ 시쳇말과 ㉡ 인사말은 모두 한자어와 순우리말로 된 합성어인데, ㉠은 [시첸말]로 'ㅁ' 앞에서 'ㄴ' 소리가 덧나므로
    사이시옷을 받치어 적고, ㉡은 [인사말]로 소리 변화가 없어 사이시옷을 적지 않는다.
  flags: []
  difficulty: D3
- item_id: KOR-OV2-047
  meets_rubric: true
  your_answer: ㉠ 서슴지, ㉡ 섭섭지. ㉠은 기본형이 '서슴다'라 '하'가 줄어든 것이 아니라 어간 '서슴-'에 '-지'가 붙은 것이므로
    '서슴지'이고, ㉡은 '하' 앞 받침 소리가 [ㅂ]이라 '하'가 아주 줄어 '섭섭지'로 적는다.
  flags: []
  difficulty: D2
- item_id: KOR-OV2-048
  meets_rubric: true
  your_answer: ㉠의 '조렸다'를 '졸였다'로 고친다. 마음을 태우며 초조해한다는 뜻이므로 '졸이다'이다. ㉡의 '앉혔다'를 '안쳤다'로
    고친다. 밥 재료를 솥에 넣고 불 위에 올린다는 뜻이므로 '안치다'이다.
  flags: []
  difficulty: D2
- item_id: KOR-OV2-049
  meets_rubric: true
  your_answer: ㉠ 띄어 씀('들은 바와'), ㉡ 붙여 씀('확인한바'). ㉡은 '-니까, -는데'로 바꾸어도 뜻이 통하는 연결 어미이고,
    ㉠은 그렇게 바꿀 수 없고 '것'의 뜻이므로 의존 명사이다.
  flags: []
  difficulty: D2
- item_id: KOR-OV2-050
  meets_rubric: true
  your_answer: ㉠ 붙여 쓸 수 있음('나가버렸다'), ㉡ 붙여 쓸 수 없음. ㉠ 본용언 활용형 '나가'는 두 음절이라 붙여 쓸 수 있고,
    ㉡ 합성어 '떠내려가'는 네 음절이라 띄어 쓴다.
  flags: []
