- item_id: KOR-ON1-002
  archetype: A6_RULE_CASE_EXPLANATION
  stem: '[제1·6·14·15·19·21항] <보기>는 옛 표기로 쓴 글이다. ㉠~㉤을 현대 맞춤법에 맞게 고치고 그 근거를 설명한 것으로 적절하지 않은 것은?'
  view:
  - '[참고 조항]'
  - 제1항 한글 맞춤법은 표준어를 소리대로 적되, 어법에 맞도록 함을 원칙으로 한다.
  - 제6항 'ㄷ, ㅌ' 받침 뒤에 종속적 관계를 가진 '-이(-)'나 '-히-'가 올 적에는, 그 'ㄷ, ㅌ'이 'ㅈ, ㅊ'으로 소리 나더라도 'ㄷ, ㅌ'으로 적는다.
  - 동무와 ㉠가티 들길을 걸었다.
  - 길가에 핀 것은 ㉡꼬치 아니라 ㉢닙사귀뿐이었다.
  - 집까지는 길이 ㉣머러서 ㉤거름을 재촉하였다.
  options:
  - ㉠은 '같이'로 고친다. 'ㅌ' 받침 뒤 '-이'가 [치]로 소리 나더라도 원형을 밝혀 적기 때문이다.
  - ㉡은 '꽃이'로 고친다. 체언과 조사를 구별하여 적기 때문이다.
  - ㉢은 '잎사귀'로 고친다. 자음으로 시작하는 접미사 앞에서 명사의 원형을 밝혀 적기 때문이다.
  - ㉣은 '멀어서'로 고친다. 용언의 어간과 어미를 구별하여 적기 때문이다.
  - ㉤은 '거름'을 그대로 둔다. '걷다'의 본뜻에서 멀어진 말은 소리대로 적기 때문이다.
  answer: 5
