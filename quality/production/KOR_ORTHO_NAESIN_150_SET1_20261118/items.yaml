  - '''믿음''은 ㉢을, 본뜻에서 멀어진 ''고름[膿]''은 ㉡을 따른 표기이다.'
  - '''나비''처럼 한 형태소로 된 말은 소리와 표기가 같으므로 ㉢만 적용된 것이다.'
