- item_id: KOR-ON1-003
  archetype: A1_GENERAL_RULE_MAPPING
  stem: '[제5항] <보기>의 한글 맞춤법 조항을 바탕으로 탐구한 내용으로 가장 적절한 것은?'
  view:
  - 제5항 한 단어 안에서 뚜렷한 까닭 없이 나는 된소리는 다음 음절의 첫소리를 된소리로 적는다.
  - ㉮ 두 모음 사이에서 나는 된소리
  - ㉯ 'ㄴ, ㄹ, ㅁ, ㅇ' 받침 뒤에서 나는 된소리
  - ㉰ 다만, 'ㄱ, ㅂ' 받침 뒤에서 나는 된소리는, 같은 음절이나 비슷한 음절이 겹쳐 나는 경우가 아니면 된소리로 적지 아니한다.
  options:
  - '''깍두기''는 ㉰에 따라 예사소리로 적고, ''몹시''는 ㉯에 따라 예사소리로 적는다.'
  - '''씁쓸하다''는 ㉰의 예외 조건에 따라 된소리로 적고, ''딱지''도 같은 조건에 따라 ''딱찌''로 적는다.'
  - '''산뜻하다''는 ㉯에 따라 된소리로 적고, ''갑자기''는 ㉮에 따라 된소리로 적지 않는다.'
  - '''거꾸로''는 ㉮에 따라, ''훨씬''은 ㉯에 따라 된소리로 적는다.'
  - '''어깨''는 ㉯에 따라, ''잔뜩''도 ㉯에 따라 된소리로 적는다.'
  answer: 4
  second_best: 1
  difficulty: D3
  family: VIEW_APPLICATION
