- item_id: KOR-ON1-001
  archetype: A6_RULE_CASE_EXPLANATION
  stem: '[제1항] <보기>를 바탕으로 ㉠~㉣의 표기에 대해 탐구한 내용으로 적절하지 않은 것은?'
  view:
  - '[참고 조항]'
  - 제1항 한글 맞춤법은 표준어를 소리대로 적되, 어법에 맞도록 함을 원칙으로 한다.
  - 한글 맞춤법은 표준어를 소리대로 적되, 어법에 맞도록 함을 원칙으로 한다.
  - ㉠ 읽고[일꼬]
  - ㉡ 굳이[구지]
  - ㉢ 마중
  - ㉣ 깨끗이[깨끄시]
  options:
  - ㉠은 [일꼬]로 소리 나지만 어간 '읽-'과 어미 '-고'를 구별해 어법에 맞도록 적었다.
  - ㉡은 구개음화로 [구지]로 소리 나지만 어간 '굳-'의 형태를 밝혀 적었다.
  - ㉢은 '맞-'에 '-이'나 '-음' 이외의 모음으로 시작하는 접미사가 붙어 원형을 밝히지 않았다.
  - ㉣은 [깨끄시]로 소리 나는 대로 적은 것이므로 '소리대로' 적는 원칙만 적용되었다.
  - ㉠과 ㉡은 모두 실제 발음과 표기가 일치하지 않는다.
  answer: 4
