  - '''몹시''는 ''ㅂ'' 받침 뒤이지만 비슷한 음절이 겹치므로 ''몹씨''로 적는다.'
  - '''산뜻하다''는 ''ㄴ'' 받침 뒤의 된소리이므로 ㉰에 따라 된소리로 적지 않는다.'
