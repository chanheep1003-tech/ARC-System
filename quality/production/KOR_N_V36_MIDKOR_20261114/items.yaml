  archetype: A1_GENERAL_RULE_MAPPING
  level: V6
  stem: <보기>의 ㉠~㉤에 대한 설명으로 적절한 것은?
  view:
  - 나랏 ㉠말ᄊᆞ미 ㉡中듀ᇰ國귁에 달아 ㉢文문字ᄍᆞᆼ와로 서르 ㉣ᄉᆞᄆᆞᆺ디 ㉤아니ᄒᆞᆯᄊᆡ
  - '- 『훈민정음』 언해본 서문 (방점 생략)'
  options:
  - ㉠은 체언 '말ᄊᆞᆷ'에 주격 조사 '이'가 결합한 것을 이어 적었다.
  - ㉡의 '에'는 앞말의 모음이 양성 모음이어서 선택된 부사격 조사이다.
  - ㉢의 '와로'를 통해 '字ᄍᆞᆼ'이 실제로는 자음으로 끝나는 말이었음을 알 수 있다.
  - ㉣의 받침 'ㅅ'은 8종성법에 어긋나는 표기이다.
  - ㉤의 '-ㄹᄊᆡ'는 이유를 나타내는 종결 어미이다.
  answer: 1
  second_best: 2
  difficulty: D3
  family: VIEW_APPLICATION
  balance: CORE_EXAM_POINT
  reasoning_steps: 2
  immediate_elimination: 1
  transfer: false
  stem_polarity: POSITIVE
  judgments:
