  - ㉠의 '나라'는 무정 명사이므로 'ㅅ'이 쓰였다.
  - ㉡의 '부텨'는 높임의 대상인 유정 명사이므로 'ㅅ'이 쓰였다.
  - ㉢에서 '의'가 아니라 'ᄋᆞ'가 쓰인 것은 앞말의 모음이 음성 모음이기 때문이다.
  - ㉣의 '世尊'은 높임의 대상인 유정 명사이므로 'ㅅ'이 쓰였다.
  - ㉢의 '사ᄅᆞᆷ'은 높임의 대상이 아닌 유정 명사이므로 'ᄋᆞ'가 쓰였다.
