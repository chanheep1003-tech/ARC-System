  - <보기 2> ㉠ 사ᄅᆞ미(사ᄅᆞᆷ+주격 조사)  ㉡ 부톄(부텨+주격 조사)  ㉢ 내(나+주격 조사)  ㉣ 다리(다리+주격 조사)  ㉤ ᄇᆡ(ᄇᆡ[배]+주격 조사)
  options:
  - Ⓐ ㉠   Ⓑ ㉡, ㉢   Ⓒ ㉣, ㉤
  - Ⓐ ㉠   Ⓑ ㉡, ㉢, ㉤   Ⓒ ㉣
  - Ⓐ ㉠, ㉣   Ⓑ ㉡, ㉢   Ⓒ ㉤
  - Ⓐ ㉠   Ⓑ ㉢   Ⓒ ㉡, ㉣, ㉤
  - Ⓐ ㉠, ㉤   Ⓑ ㉡   Ⓒ ㉢, ㉣
