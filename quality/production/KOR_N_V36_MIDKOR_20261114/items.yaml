  view:
  - 15세기 국어의 관형격 조사 'ᄋᆞ/의'는 높임의 대상이 아닌 유정 명사 뒤에, 'ㅅ'은 무정 명사나 높임의 대상인 유정 명사 뒤에 쓰였다.
  - ㉠ 나랏 말ᄊᆞᆷ  ㉡ 부텻 말  ㉢ 사ᄅᆞᄆᆞ ᄠᅳᆮ  ㉣ 世尊ㅅ 일
