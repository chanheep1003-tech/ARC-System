    - OPTION3
    v: false
    why: '''와''는 모음 뒤에 쓰이는 형태이므로 ''字ᄍᆞᆼ''의 ''ㅇ''은 소리 없는 형식적 종성이다.'
    trap: T4_SAME_FORM_OTHER_FUNCTION
  - axis: middle_korean
