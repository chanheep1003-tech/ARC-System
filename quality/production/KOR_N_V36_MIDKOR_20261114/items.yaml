- item_id: KOR-MK-005
  archetype: A1_GENERAL_RULE_MAPPING
  level: V6
  stem: <보기>를 바탕으로 훈민정음 초성 글자의 제자 원리를 설명한 것으로 적절한 것은?
  view:
  - 초성 기본자 'ㄱ, ㄴ, ㅁ, ㅅ, ㅇ'은 발음 기관의 모양을 본떠 만들었고, 소리가 세어짐에 따라 획을 더하여 가획자를 만들었다. 'ㆁ, ㄹ, ㅿ'은 획을 더하였지만 소리가 세어지는 의미가 없는 이체자이다.
  options:
  - '''ㅋ''은 ''ㄱ''에, ''ㅌ''은 ''ㄷ''에 획을 더한 것으로 둘 다 가획의 원리가 적용되었다.'
  - '''ㆁ''은 ''ㅇ''에 획을 더해 소리가 세어진 것을 나타낸 가획자이다.'
  - '''ㅂ''은 ''ㅁ''에 획을 더한 것이고, ''ㅍ''은 ''ㅂ''에 획을 더한 이체자이다.'
  - '''ㄹ''은 ''ㄴ''에 획을 더해 소리가 더 세어짐을 나타낸 가획자이다.'
  - '''ㅿ''은 ''ㅅ''에 획을 더해 소리가 세어진 ''ㅈ''과 같은 원리로 만든 가획자이다.'
  answer: 1
  second_best: 2
  difficulty: D3
  family: VIEW_APPLICATION
  balance: CORE_EXAM_POINT
  reasoning_steps: 2
  immediate_elimination: 1
  transfer: false
  stem_polarity: POSITIVE
  judgments:
  - axis: middle_korean
    c: CORRECT
    claim: mk05_o1
    ev:
    - VIEW
    - OPTION1
    v: true
    why: '''ㄱ→ㅋ'', ''ㄴ→ㄷ→ㅌ''은 모두 소리의 세기에 따른 가획이다.'
  - axis: middle_korean
    c: STRONG
    claim: mk05_o2
    ev:
    - VIEW
    - OPTION2
    v: false
    why: '''ㆁ''은 이체자이다.'
    trap: T1_RIGHT_CONCEPT_WRONG_CASE
  - axis: middle_korean
    c: MEDIUM
    claim: mk05_o3
    ev:
    - VIEW
    - OPTION3
    v: false
    why: '''ㅍ''은 ''ㅂ''에 획을 더한 가획자이다.'
    trap: T3_ONE_OF_TWO_WRONG
  - axis: middle_korean
    c: STRONG
    claim: mk05_o4
    ev:
    - VIEW
    - OPTION4
    v: false
    why: '''ㄹ''은 이체자이다.'
    trap: T1_RIGHT_CONCEPT_WRONG_CASE
  - axis: middle_korean
    c: WEAK
    claim: mk05_o5
    ev:
    - VIEW
    - OPTION5
