    why: ㉠ 자음 뒤 '이'(Ⓐ), ㉡ '부텨'·㉢ '나'는 'ㅣ' 이외의 모음 뒤 'ㅣ'(Ⓑ), ㉣ '다리'는 'ㅣ', ㉤ 'ᄇᆡ'는 반모음 'ㅣ'로 끝나 Ø(Ⓒ)이다.
