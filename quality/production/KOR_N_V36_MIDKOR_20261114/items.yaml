    - OPTION1
    v: true
    why: '''말ᄊᆞᆷ+이''를 이어 적어 ''말ᄊᆞ미''가 되었다.'
  - axis: middle_korean
    c: STRONG
    claim: mk01_o2
    ev:
    - VIEW
    - OPTION2
    v: false
    why: '''귁''의 모음은 음성 모음이므로 ''에''가 쓰였다.'
