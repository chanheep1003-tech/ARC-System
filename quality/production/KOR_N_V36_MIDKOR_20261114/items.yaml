- item_id: KOR-MK-004
  archetype: A5_EXAMPLE_MULTI_JUDGMENT
  level: V3
  stem: <보기>의 자료를 바탕으로 한 설명 중 옳은 것만을 있는 대로 고른 것은?
  view:
  - '[자료] 나라ㅎ+이 → 나라히 / 나라ㅎ+ᄋᆞᆯ → 나라ᄒᆞᆯ / 나라ㅎ+도 → 나라토 / 나라ㅎ+과 → 나라콰 / 나라ㅎ+ㅅ → 나랏'
  - (가) 나라히 破亡ᄒᆞ니 뫼콰 ᄀᆞᄅᆞᆷᄲᅮᆫ 잇고 - 두보, 「춘망」, 『두시언해』 초간본 (방점 생략)
  - ㄱ. 'ㅎ' 종성 체언은 단독으로 쓰이거나 관형격 조사 'ㅅ' 앞에서는 'ㅎ'이 드러나지 않는다.
  - ㄴ. '나라콰'는 'ㅎ'과 조사 '과'의 'ㄱ'이 축약되어 거센소리가 된 것이다.
  - ㄷ. 「용비어천가」의 '내히'는 '내'에 주격 조사 '히'가 결합한 것이다.
  - ㄹ. (가)의 '뫼콰'를 통해 '뫼'도 'ㅎ' 종성 체언임을 알 수 있다.
  - ㅁ. 현대 국어 '안팎', '머리카락'에는 'ㅎ' 종성 체언의 흔적이 남아 있다.
