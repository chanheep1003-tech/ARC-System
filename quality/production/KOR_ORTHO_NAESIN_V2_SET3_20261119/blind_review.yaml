- item_id: KOR-OV3-046
  meets_rubric: true
  your_answer: ㉠ '구년도'는 '구년'+'도'로 '년'이 단어의 첫머리가 아니어서 본음 '년'으로 적고, ㉡ '상노인'은 접두사처럼 쓰이는
    '상-' 뒤의 '노인'이 단어의 첫머리에 오므로 두음 법칙에 따라 '노'로 적는다.
  flags: []
  difficulty: D3
- item_id: KOR-OV3-047
  meets_rubric: true
  your_answer: ㉠ '널따랗다'는 어간 '넓-'의 겹받침 끝소리 'ㅂ'이 [널따라타]에서 드러나지 않아 소리대로 적고, ㉡ '굵다랗다'는
    어간 '굵-'의 겹받침 끝소리 'ㄱ'이 [국따라타]에서 드러나 원형을 밝혀 적는다.
  flags: []
  difficulty: D3
- item_id: KOR-OV3-048
  meets_rubric: false
  your_answer: 공통 어간을 보기 자료만으로 확정하기 어려움(걸음은 걷-, 거름은 걸-로 추정되어 '공통 어간' 조건과 충돌). 억지로
    쓰면 '걸-'에 '-음'이 붙은 ㉠은 어간의 본뜻이 살아 있어 원형을 밝히고 ㉡은 본뜻에서 멀어져 소리대로 적었다.
  flags:
  - d
  - b
  difficulty: D4
- item_id: KOR-OV3-049
  meets_rubric: true
  your_answer: ㉠ '만만찮다', ㉡ '적잖은'. ㉠은 '만만하지 않-'에서 '-하지 않-'이, ㉡은 '적지 않-'에서 '-지 않-'이
    줄어 각각 '-찮-', '-잖-'이 된 것이다.
  flags: []
  difficulty: D2
- item_id: KOR-OV3-050
  meets_rubric: true
  your_answer: ㉠의 '올걸'은 추측을 나타내는 어미 '-ㄹ걸'이므로 앞말에 붙여 쓰고(제41항과 무관한 어미), ㉡의 '걸'은 의존 명사
    '것'+조사 '을'이 줄어든 말이므로 제42항에 따라 앞말과 띄어 쓴다.
  flags: []
  difficulty: D2
