  stem: <보기>를 바탕으로 표기 원리를 탐구한 내용으로 가장 적절한 것은?
  view:
  - 제1항 한글 맞춤법은 표준어를 소리대로 적되, 어법에 맞도록 함을 원칙으로 한다.
  - 제27항 [붙임 2] 어원이 분명하지 아니한 것은 원형을 밝히어 적지 아니한다.
  - '[자료] ''며칠, 골병, 부리나케''는 어원이 분명하지 않은 말로 보아 사전에 올라 있다. ''노인(老人)''의 ''노''는 한자음 ''로''가 단어 첫머리에서 [노]로 소리 나는 대로 적은 것이다.'
  options:
  - '''며칠''을 ''몇 일''로 적지 않는 것은 어법에 맞도록 적은 것이고, ''꽃이''를 ''꼬치''로 적지 않는 것도 어법에 맞도록 적은 것이다.'
  - '''노인''을 ''로인''으로 적지 않는 것은 소리대로 적은 것이고, ''굳이''를 ''구지''로 적지 않는 것은 어법에 맞도록 적은 것이다.'
  - '''무덤''을 ''묻엄''으로 적지 않는 것은 어법에 맞도록 적은 것이고, ''먹어''를 ''머거''로 적지 않는 것은 소리대로 적은 것이다.'
  - '''골병''을 ''곯병''으로 적지 않는 것은 어법에 맞도록 적은 것이고, ''부엌에''를 ''부어케''로 적지 않는 것도 같은 원리이다.'
  - '''부리나케''를 ''불이나케''로 적지 않는 것은 소리대로 적은 것이고, ''얼음''을 ''어름''으로 적지 않는 것도 소리대로 적은 것이다.'
