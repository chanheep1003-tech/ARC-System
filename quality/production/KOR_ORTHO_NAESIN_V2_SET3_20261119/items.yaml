- item_id: KOR-OV3-003
  archetype: A5_EXAMPLE_MULTI_JUDGMENT
  stem: <보기>의 ㄱ~ㅁ 중 판단과 근거가 모두 적절한 것은 몇 개인가?
  view:
  - '[참고 조항]'
  - 제6항 'ㄷ, ㅌ' 받침 뒤에 종속적 관계를 가진 '-이(-)'나 '-히-'가 올 적에는, 그 'ㄷ, ㅌ'이 'ㅈ, ㅊ'으로 소리 나더라도 'ㄷ, ㅌ'으로 적는다.
  - 제7항 'ㄷ' 소리로 나는 받침 중에서 'ㄷ'으로 적을 근거가 없는 것은 'ㅅ'으로 적는다.
  - 제29항 끝소리가 'ㄹ'인 말과 딴 말이 어울릴 적에 'ㄹ' 소리가 'ㄷ' 소리로 나는 것은 'ㄷ'으로 적는다.
  - '[자료] ''걷잡다''는 ''거두어 잡다''에서 온 말이다. ''반짇고리''는 ''바느질+고리''에서 ''ㄹ''이 ''ㄷ'' 소리로 바뀐 말이다.'
  - ㄱ. '걷잡다'의 '걷'은 'ㄷ'으로 적을 근거가 있으므로 'ㄷ'으로 적는다.
  - ㄴ. '엇셈'의 '엇'은 'ㄷ' 소리로 나지만 'ㄷ'으로 적을 근거가 없으므로 'ㅅ'으로 적는다.
  - ㄷ. '핥이다'는 [할치다]로 소리 나지만 'ㄾ' 받침의 'ㅌ'을 밝혀 적는다.
  - ㄹ. '반짇고리'는 'ㄷ'으로 적을 근거가 없으므로 '반짓고리'로 적어야 한다.
  - ㅁ. '덧저고리'의 '덧'은 'ㄷ' 소리로 나므로 'ㄷ'으로 적어 '덛저고리'로 적어야 한다.
  options:
  - 1개
  - 2개
  - 3개
  - 4개
  - 5개
  answer: 3
