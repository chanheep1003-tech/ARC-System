- item_id: KOR-OV3-002
  archetype: A3_CONDITION_CLASSIFICATION
  stem: <보기 1>의 기준에 따라 <보기 2>의 ㉠~㉤을 분류한 것으로 적절한 것은?
  view:
  - '[참고 조항]'
  - 제5항 한 단어 안에서 뚜렷한 까닭 없이 나는 된소리는 다음 음절의 첫소리를 된소리로 적는다. (1) 두 모음 사이에서 나는 된소리 (2) 'ㄴ, ㄹ, ㅁ, ㅇ' 받침 뒤에서 나는 된소리. 다만, 'ㄱ, ㅂ' 받침 뒤에서 나는 된소리는, 같은 음절이나 비슷한 음절이 겹쳐 나는 경우가 아니면 된소리로 적지 아니한다.
  - <보기 1>
  - Ⓐ두 모음 사이나 'ㄴ, ㄹ, ㅁ, ㅇ' 받침 뒤에서 까닭 없이 나는 된소리를 된소리로 적은 것
  - Ⓑ'ㄱ, ㅂ' 받침 뒤에서 나는 된소리를 예사소리로 적은 것
  - Ⓒ'ㄱ, ㅂ' 받침 뒤이지만 같거나 비슷한 음절이 겹쳐 나서 된소리로 적은 것
  - <보기 2>
  - ㉠ 듬뿍[듬뿍]
  - ㉡ 법석[법썩]
  - ㉢ 쌉쌀하다[쌉쌀하다]
  - ㉣ 깍두기[깍뚜기]
  - ㉤ 몽땅[몽땅]
  options:
  - Ⓐ ㉠   Ⓑ ㉡, ㉣   Ⓒ ㉢, ㉤
  - Ⓐ ㉠, ㉤   Ⓑ ㉡   Ⓒ ㉢, ㉣
  - Ⓐ ㉠, ㉤   Ⓑ ㉡, ㉣   Ⓒ ㉢
  - Ⓐ ㉤   Ⓑ ㉠, ㉡, ㉣   Ⓒ ㉢
  - Ⓐ ㉠, ㉢, ㉤   Ⓑ ㉡, ㉣   Ⓒ 없음
