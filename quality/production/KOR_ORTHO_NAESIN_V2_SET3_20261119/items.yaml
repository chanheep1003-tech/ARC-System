  stem: <보기>의 ㉠, ㉡의 표기가 다른 까닭을 [뜻 자료]를 근거로 서술하시오.
  view:
  - '[참고 조항]'
  - 제19항 어간에 '-이'나 '-음/-ㅁ'이 붙어서 명사로 된 것과 '-이'나 '-히'가 붙어서 부사로 된 것은 그 어간의 원형을 밝히어 적는다. 다만, 어간에 '-이'나 '-음'이 붙어서 명사로 바뀐 것이라도 그 어간의 뜻과 멀어진 것은 원형을 밝히어 적지 아니한다. [붙임] 어간에 '-이'나 '-음' 이외의 모음으로 시작된 접미사가 붙어서 다른 품사로 바뀐 것은 그 어간의 원형을 밝히어 적지 아니한다.
  - '[뜻 자료] 걸음: ''걷다(步)''의 어간 ''걷-''(모음 앞에서 ''걸-'')에 ''-음''이 붙은 말. 두 발을 번갈아 옮겨 놓는 동작. / 거름: ''(땅이) 걸다(기름지다)''의 어간 ''걸-''에 ''-음''이 붙은 말. 식물이 잘 자라도록 땅에 주는 영양 물질.'
  - ㉠ 발걸음이 가볍다.
  - ㉡ 밭에 거름을 주었다.
  conditions:
  - 1. 두 말의 어간을 각각 밝힐 것.
  - 2. '본뜻'이라는 말을 포함할 것.
  - 3. 두 문장 이내로 쓸 것.
  model_answer: ㉠ '걸음'은 '걷-(걸-)'에 '-음'이 붙어 걷는다는 본뜻이 유지되므로 원형을 밝혀 적는다. ㉡ '거름'은 '(땅이) 걸다'의 '걸-'에 '-음'이 붙었지만 비료라는 뜻으로 본뜻에서 멀어졌으므로 소리대로 적는다.
