  stem: 발음과 표기가 다른 까닭을 설명한 것으로 적절하지 않은 것은?
  view:
  - '[참고 조항]'
  - 제5항 한 단어 안에서 뚜렷한 까닭 없이 나는 된소리는 다음 음절의 첫소리를 된소리로 적는다. (1) 두 모음 사이에서 나는 된소리 (2) 'ㄴ, ㄹ, ㅁ, ㅇ' 받침 뒤에서 나는 된소리. 다만, 'ㄱ, ㅂ' 받침 뒤에서 나는 된소리는, 같은 음절이나 비슷한 음절이 겹쳐 나는 경우가 아니면 된소리로 적지 아니한다.
  - 제6항 'ㄷ, ㅌ' 받침 뒤에 종속적 관계를 가진 '-이(-)'나 '-히-'가 올 적에는, 그 'ㄷ, ㅌ'이 'ㅈ, ㅊ'으로 소리 나더라도 'ㄷ, ㅌ'으로 적는다.
  - '[발음 자료] 잔뜩[잔뜩]  국수[국쑤]  낮잠[낟짬]  같이[가치]  몹시[몹씨]'
  options:
  - '''잔뜩''은 ''ㄴ'' 받침 뒤에서 까닭 없이 나는 된소리이므로 표기에 반영했다.'
  - '''국수''는 ''ㄱ'' 받침 뒤에서 나는 된소리이고 음절이 겹치지 않으므로 표기에 반영하지 않았다.'
  - '''낮잠''의 된소리는 받침 뒤에서 규칙적으로 일어나는 현상이므로 표기에 반영하지 않았다.'
  - '''같이''는 ''ㅌ'' 받침 뒤에 ''-이''가 와 [치]로 소리 나도 원형을 밝혀 적었다.'
  - '''몹시''는 ''ㅂ'' 받침 뒤이지만 비슷한 음절이 겹쳐 나므로 된소리를 표기에 반영하지 않았다.'
