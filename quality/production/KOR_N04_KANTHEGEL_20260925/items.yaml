    - P2S2
    why: 앞부분은 참이지만, 인간이 이성적 존재라는 사실이 현상계에서 부정된다는 내용은 없다. 인간은 이성적 존재로서 예지계에서 자기 입법 능력을 지닌다고 할 뿐이다.
