    c: MEDIUM
    axis: answerability
    claim: kant_noumenon_empirical_proof
    ev:
    - P1S2
    why: 예지계는 경험적으로 인식되지 않는 영역으로만 제시되어, 경험적 확인 근거라는 전제 자체가 글과 어긋난다.
  - v: false
