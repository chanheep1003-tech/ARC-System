  stem: 윗글을 읽고 답할 수 있는 질문으로 가장 적절한 것은?
  options:
  - 칸트는 예지계가 존재한다는 것을 어떤 경험을 근거로 확인하였는가?
  - 헤겔은 가족 단계의 약한 제도적 보장을 보완할 구체적인 방법으로 무엇을 제시하였는가?
  - 헤겔은 시민 사회에서 제도가 생겨나는 배경을 개인의 어떤 활동에서 찾았는가?
  - 칸트는 보편성을 갖추지 못한 준칙에 따른 행위를 어떻게 평가하였는가?
  - 헤겔은 추상적 자유가 공동체의 질서를 해친 사례로 무엇을 들었는가?
