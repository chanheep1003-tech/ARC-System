- item_id: KOR-N04-002
  difficulty: D1
  family: EXCEPT_INCORRECT
  coverage: TEXT_OR_ARGUMENT_STRUCTURE
  core_exam_point: true
  stem: 윗글의 2문단에 대한 설명으로 적절하지 않은 것은?
  options:
  - 1문단에서 구분한 두 영역 가운데 한쪽에 자유를 귀속시키며 시작한다.
  - 핵심 용어의 뜻을 풀이한 뒤, 그것이 도덕 법칙이 되기 위한 조건을 밝힌다.
  - ‘보편성’의 뜻을 ‘~이란 ~을 말한다’와 같은 방식으로 규정하고 있다.
  - 문단 끝의 예시는 1문단의 예시와 짝을 이루어, 의지를 규정한 원인에 따라 행위가 달리 판단됨을 보여 준다.
  - 칸트의 견해가 지닌 한계를 지적하여 헤겔의 견해로 넘어갈 근거를 마련한다.
  answer: 5
  second_best: 4
  judgments:
  - v: true
    c: MEDIUM
    axis: paragraph2_method
    claim: attributes_freedom_to_noumenon
    ev:
    - P2S1
    - P1S2
    why: 2문단 첫 문장이 1문단의 현상계/예지계 가운데 예지계에 자유를 둔다.
  - v: true
    c: STRONG
    axis: paragraph2_method
    claim: define_maxim_then_condition
    ev:
    - P2S3
    why: 준칙의 뜻을 풀이한 뒤 도덕 법칙이 되기 위한 조건(보편성)을 제시한다. '그것'의 지시 대상 확인이 필요해 틀린 선지로 오인되기 쉽다.
  - v: true
    c: MEDIUM
    axis: paragraph2_method
    claim: define_universality_formula
    ev:
    - P2S4
    why: '''보편성이란 ~것을 말하며''로 규정한다.'
  - v: 'TRUE'
    c: STRONG
    axis: paragraph2_method
    claim: example_pairs_with_p1
    ev:
    - P1S5
    - P2S6
    why: 1문단 예시는 욕구가 원인이 된 타율적 행위, 2문단 예시는 이성이 원인이 되어 자유를 의식하는 행위로, 원인에 따라 판단이 달라진다. 문단 바깥을 언급해 틀린 선지로 오인되기 쉽다.
  - v: false
    c: CORRECT
    axis: paragraph2_method
    claim: critique_of_kant_transition
    ev:
    - P2S1
    - P3S1
    why: 2문단에는 칸트에 대한 평가나 한계 지적이 없고, 3문단은 '한편'으로 화제를 전환할 뿐이다.
  reasoning_steps: 1
  immediate_elimination: 1
  transfer: false
  passage: P1
