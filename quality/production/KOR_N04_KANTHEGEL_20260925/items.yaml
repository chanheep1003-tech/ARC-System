  family: INFERENCE
  coverage: KEY_CONCEPT_RELATION_OR_CONTRAST
  core_exam_point: true
  stem: 윗글을 바탕으로, 칸트가 자유를 현상계가 아니라 예지계에 속하는 개념으로 본 까닭을 추론한 것으로 가장 적절한 것은?
  options:
  - 현상계의 행위는 모두 타율적이므로, 칸트는 인간이 도덕 법칙에 따라 행위하는 일이 실제로는 일어나지 않는다고 보았기 때문이다.
  - 현상계에서는 의지가 늘 이성이 아닌 앞선 원인에 의해 규정되므로, 이성이 원인이 되어 의지를 규정하는 자유는 그 안에 자리할 수 없기 때문이다.
  - 예지계는 이성에 의해 사유될 뿐 경험적으로 인식되지 않으므로, 자유가 실제로 있는지는 누구도 알 수 없다고 보았기 때문이다.
  - 도덕 법칙은 모든 이성적 존재자에게 모순 없이 적용되어야 하므로, 사람마다 다른 감각 경험이 쌓이는 현상계에서는 만들어질 수 없기 때문이다.
  - 현상계에서 의지는 이성이 아닌 것에 의해 규정되므로, 인간이 이성적 존재라는 사실 자체가 현상계에서는 인정되지 않기 때문이다.
  answer: 2
  second_best: 4
  judgments:
