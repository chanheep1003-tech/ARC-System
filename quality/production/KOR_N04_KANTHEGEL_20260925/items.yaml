    why: '''개인이 권리와 이익을 추구하면서 각종 제도가 수립되어''에서 개인의 활동(권리와 이익 추구)을 찾아 답할 수 있다. 지문 표현을 바꿔 물어 대응 관계를 확인해야 한다.'
  - v: false
