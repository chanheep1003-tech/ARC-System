  - ㉢은 받침의 'ㅈ'을 'ㅅ'으로 바꾸어 적어 8종성법을 따른 예이다.
  - ㉣은 'ㄷ'이 반모음 'ㅣ' 앞에서도 'ㅈ'으로 바뀌지 않은 형태이다.
  - ㉤은 형태가 같은 현대어 '여름'과 달리 '열매'를 뜻한다.
