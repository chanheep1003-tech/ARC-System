    c: MEDIUM
    claim: M03_opt1
    ev:
    - VIEW
    - OPTION1
    v: false
    why: ㉠의 '-움'은 명사형 어미다(거짓).
  - axis: orthography
    c: STRONG
    claim: M03_opt2
    ev:
    - VIEW
    - OPTION2
    v: false
    why: '''여름''은 파생 명사로 서술성이 없다(거짓).'
  - axis: orthography
    c: CORRECT
    claim: M03_opt3
    ev:
    - VIEW
    - OPTION3
    v: true
    why: '''ᄡᅳ-''의 ''ㅡ''는 음성 모음 → ''-움''(참 → 정답).'
  - axis: orthography
    c: STRONG
    claim: M03_opt4
    ev:
    - VIEW
    - OPTION4
    v: false
    why: '보충자료: 이 시기 ''-음''은 오직 접미사(거짓).'
  - axis: orthography
    c: MEDIUM
