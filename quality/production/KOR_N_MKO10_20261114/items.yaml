- item_id: KOR-MKO-M01
  stem: <보기>에 나타난 중세 국어의 특징을 이해한 내용으로 적절하지 않은 것은?
  view:
  - 나랏 말ᄊᆞ미 中듕國귁에 달아 文문字ᄍᆞᆼ와로 서르 ᄉᆞᄆᆞᆺ디 아니ᄒᆞᆯᄊᆡ 이런 젼ᄎᆞ로 어린 百ᄇᆡᆨ姓셩이 니르고져 홇 배 이셔도 ᄆᆞᄎᆞᆷ내 제 ᄠᅳ들 시러 펴디 몯ᄒᆞᇙ 노미 하니라 … 날로 ᄡᅮ메 便뼌安ᅙᅡᆫ킈 ᄒᆞ고져 ᄒᆞᆯ ᄯᆞᄅᆞ미니라
  - '- 「세종어제훈민정음」 (방점 생략)'
  options:
  - '''말ᄊᆞ미''를 보니, 앞말의 받침을 뒤 음절의 첫소리로 옮겨 적는 이어 적기를 하였음을 알 수 있군.'
  - '''中듕國귁에''를 보니, 현대 국어의 ''과''가 쓰일 자리에 비교의 부사격 조사 ''에''가 쓰였음을 알 수 있군.'
  - '''ᄠᅳ들''을 보니, 단어의 첫머리에 서로 다른 두 자음이 함께 소리 나는 어두 자음군이 있었음을 알 수 있군.'
  - '''ᄯᆞᄅᆞ미니라''를 보니, ''ᄠᅳ들''과 마찬가지로 단어의 첫머리에 어두 자음군이 쓰였음을 알 수 있군.'
  - '''노미''를 보니, 일반적인 사람을 가리키던 말이 현대 국어에서는 낮잡아 이르는 말로 의미가 축소되었음을 알 수 있군.'
  answer: 4
  second_best: 3
  difficulty: D2
  family: EXCEPT_INCORRECT
  balance: CORE_EXAM_POINT
  reasoning_steps: 2
  immediate_elimination: 1
  transfer: false
  stem_polarity: NEGATIVE
  blueprint:
    unit: 3-1 변화하는 국어의 모습
    content: 합용 병서의 음가
    behavior: 이해
    difficulty: D2
    points: 3.5
  teaching_anchor: 보충자료1 p.3 어두 자음군 ※ 'ㅅ계 합용병서는 왜 어두 자음군이 아닐까?'(★핵심 필기), p.6~7 본문 적용
  distractor_misconceptions:
    1: '''말ᄊᆞ미''의 ''ᄊ''을 각자 병서로만 보고 연철 여부를 놓침'
    2: '''에''를 처소의 부사격 조사로만 알고 비교의 ''에''를 모름'
    3: ㅂ계 합용 병서도 된소리 표기라고 착각
    5: '''놈''의 의미 변화를 ''이동''으로 잘못 분류'
  appeal_check: PASS
