- item_id: KOR-MKO-M03
  stem: <보기>의 ㉠, ㉡에 대해 탐구한 내용으로 가장 적절한 것은?
  view:
  - • 날로 ㉠ᄡᅮ메 便뼌安ᅙᅡᆫ킈 ᄒᆞ고져 ᄒᆞᆯ ᄯᆞᄅᆞ미니라  [날마다 쓰는 데 편하게 하고자 할 따름이다]  - 「세종어제훈민정음」
  - • 곶 됴코 ㉡여름 하ᄂᆞ니  [꽃 좋고 열매 많으니]  - 「용비어천가」 제2장
  options:
  - ㉠의 '-움'과 ㉡의 '-음'은 모두 용언의 어간에 붙어 새로운 명사를 만드는 접미사이다.
  - ㉡은 '열다'의 어간에 명사형 어미가 결합한 것으로, 문장에서 서술성을 지닌다.
  - ㉠은 어간 'ᄡᅳ-'의 모음이 음성 모음이어서 '-옴'이 아닌 '-움'이 결합한 것이다.
  - 중세 국어에서는 '-음'이 명사형 어미로도 널리 쓰였으므로 ㉡의 문법적 성격은 문맥 없이 판별할 수 없다.
  - ㉠의 '-움'은 현대 국어의 명사형 어미 '-기'와 함께 중세 국어 시기부터 쓰였다.
  answer: 3
  second_best: 4
  difficulty: D4
  family: KEY_WORD_FUNCTION
  balance: ADVANCED_DISCRIMINATION
  reasoning_steps: 3
  immediate_elimination: 0
  transfer: false
  stem_polarity: POSITIVE
  blueprint:
    unit: 3-1
    content: 명사형 어미와 명사 파생 접미사
    behavior: 분석
    difficulty: D4
    points: 4.0
  teaching_anchor: 보충자료1 p.5 (9) 명사형 전성 어미의 변천 + ※ 명사형 어미와 명사 파생 접미사의 구분(어룸/어름), p.7 'ᄡᅮ메', p.8 '여름'
  distractor_misconceptions:
    1: 형태가 비슷한 '-움'과 '-음'을 같은 기능으로 묶음
    2: '''여름''을 ''열다''의 활용형으로 보아 서술성이 있다고 착각'
    4: 현대 국어처럼 중세 국어에서도 '-음'이 어미와 접미사로 모두 쓰였다고 착각
    5: '''-기''의 등장 시기를 중세 국어로 착각'
  appeal_check: PASS
  judgments:
