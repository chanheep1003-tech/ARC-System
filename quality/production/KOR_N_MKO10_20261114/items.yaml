  stem: <보기>는 중세 국어 '나모'에 조사가 결합한 모습을 정리한 학습 활동지이다. ㉠~㉤ 중 적절하지 않은 것은?
  view:
  - 나모 + 주격 조사 '이' → ㉠ 남기
  - 나모 + 비교의 부사격 조사 '와' → ㉡ 남ᄀᆞ와
  - 나모 + 목적격 조사 'ᄋᆞᆯ' → ㉢ 남ᄀᆞᆯ
  - 나모 + 보조사 '도' → ㉣ 나모도
  - 나모 + 서술격 조사 'ㅣ라' → ㉤ 남기라
  options:
  - ㉠
  - ㉡
  - ㉢
  - ㉣
  - ㉤
  answer: 2
  second_best: 4
  difficulty: D3
  family: ERROR_CORRECTION
  balance: CORE_EXAM_POINT
  reasoning_steps: 2
  immediate_elimination: 0
  transfer: false
  stem_polarity: NEGATIVE
  blueprint:
    unit: 3-1
    content: ㄱ 종성 체언의 곡용
    behavior: 적용
    difficulty: D3
    points: 3.5
  teaching_anchor: 보충자료1 p.5 (8) ㄱ 종성 체언 표, ※ 비교의 부사격 조사 '와' 예외(★동북고 특화 예외)
  distractor_misconceptions:
    1: 주격 조사 '이' 앞에서도 'ㄱ'이 덧나지 않는다고 착각
    3: 양성 모음 조사 'ᄋᆞᆯ'이 붙으면 체언이 바뀌지 않는다고 착각
    4: '''도''도 조사이므로 ''ㄱ''이 덧나야 한다고 과잉 일반화'
    5: 서술격 조사는 조사가 아니라서 곡용이 없다고 착각
