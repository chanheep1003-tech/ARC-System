- item_id: KOR-V6N-006
  archetype: A6_RULE_CASE_EXPLANATION
  stem: <보기>를 바탕으로 ㉠~㉣에 대해 탐구한 내용으로 적절하지 않은 것은?
  view:
  - 제41항 조사는 그 앞말에 붙여 쓴다.  제42항 의존 명사는 띄어 쓴다.
  - ㉠ 그는 아는 대로 다 말했다.   ㉡ 약속대로 일을 마쳤다.
  - ㉢ 우리는 사흘 만에 집에 돌아왔다.   ㉣ 그 비밀은 동생만 알고 있다.
  options:
  - ㉠의 '대로'는 관형사형 '아는' 뒤에서 '그와 같이'의 뜻을 나타내므로 제42항에 따라 띄어 썼다.
  - ㉡의 '대로'는 체언 '약속' 뒤에 붙어 근거의 뜻을 더하는 조사이므로 제41항에 따라 붙여 썼다.
