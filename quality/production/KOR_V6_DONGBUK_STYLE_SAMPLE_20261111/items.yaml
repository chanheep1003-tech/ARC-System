  stem: <보기>의 한글 맞춤법 총칙을 바탕으로 탐구한 내용으로 가장 적절한 것은?
  view:
  - ㉠표준어를 ㉡소리대로 적되, ㉢어법에 맞도록 함을 원칙으로 한다.
  - '- 한글 맞춤법 제1항'
  options:
  - '''꽃이''를 [꼬치]로 적지 않고 ''꽃이''로 적는 것은 ㉡에 따른 것이다.'
  - '''며칠''은 ''몇''과 ''일''로 형태를 밝힐 근거가 분명하지 않아 ㉡에 따라 적은 것이다.'
  - '''늘어나다''와 ''드러나다''는 모두 ㉢에 따라 앞말의 원형을 밝혀 적은 것이다.'
  - '''덮개''를 소리 나는 [덥깨]로 적지 않는 것은 표음주의를 따른 ㉡의 사례이다.'
  - 표준어가 아닌 지역 방언도 ㉠에 포함되므로 맞춤법에 따라 적어야 한다.
