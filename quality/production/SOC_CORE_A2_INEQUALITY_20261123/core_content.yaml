  CHAPTER_THESIS: 불평등은 계층의 양극화, 공간 불평등, 사회적 약자 차별로 나타나고 서로 맞물려 다중 격차를 만든다. 이를 줄이는 제도는 사회 복지 제도, 지역 격차 완화 정책, 적극적 평등 실현 조치이며, 시민의 실천이 함께 필요하다.
  DOMINANT_ORGANIZATION: PROBLEM_SOLUTION
