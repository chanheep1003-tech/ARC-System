    advanced_extension_sources: 고2 사회와 문화(불평등 지표·복지 제도 비교), 고2 지리(성장 거점 개발과 균형 개발, 역류 효과), 공유지의 비극 해결 방안(오스트롬). 학생용에 '심화' 표지.

units:
  - unit_kicker: A파트 · CORE 02 · 교과서 50~61쪽
    title: 사회 및 공간 불평등과 정의로운 사회를 위한 제도
    sections:

      - no: '01'
        heading: 불평등의 세 얼굴 — 이 장의 지도
        blocks:
          - type: prose
            text: 교과서는 영화 〈기생충〉으로 시작한다(50쪽). 언덕 위 저택의 박 사장네와 끝없이 이어진 계단 아래 반지하의 기택네. 같은 폭우가 한 집에는 캠핑의 낭만이고 다른 집에는 침수다. 경제적 격차가 공간의 격차로, 다시 삶 전체의 격차로 이어지는 모습이다.
          - type: callout
            style: key
            label: 사회 불평등 현상이란 (51쪽)
            text: |-
              · 부·권력·명예 같은 희소한 자원이 개인이나 집단에 차등적으로 분배되어, 구성원들의 위치가 서열화된 현상
              · 모두가 원하는 만큼 가질 수는 없으므로 어느 정도의 불평등은 불가피하다. 그러나 정도가 심해지면 정의로운 사회라고 할 수 없다.
          - type: steps
            label: 이 장의 흐름 — 문제 세 가지, 해결 세 가지
            items:
              - title: '문제: 사회 계층의 양극화 / 공간 불평등 / 사회적 약자 차별'
                body: 세 현상은 따로 있지 않고 서로 맞물려 '다중 격차'를 만든다.
              - title: '제도: 사회 복지 제도 / 지역 격차 완화 정책 / 적극적 평등 실현 조치'
                body: 각 문제에 대응하는 제도를 짝지어 기억한다.
              - title: '실천: 시민으로서의 관심·존중·참여'
                body: 제도만으로는 부족하고 개인의 실천이 함께 필요하다.

      - no: '02'
        heading: 사회 계층의 양극화 — 가운데가 얇아진다
        blocks:
          - type: table
            headers: [개념, 뜻 (51쪽)]
            weights: [1.0, 3.2]
            rows:
              - [사회 계층, '사회적 자원과 기회가 차등 분배되어, 비슷한 수준의 자원을 가진 사람들이 위계적인 층을 이룬 것']
              - [사회 계층의 양극화, '중간 계층의 비중이 줄고 상층과 하층의 비중이 늘어나 양극단으로 쏠리는 현상']
              - [대표 원인, '재산과 소득 차이에 따른 경제적 격차 → 교육·취업·주거·여가·건강까지 영향']
              - [문제점, '계층 간 위화감 조성, 계층 이동이 어려워짐 → 계층 간 갈등']
          - type: disc
            title: '헷갈림 주의 — 양극화 ≠ 하층이 늘어나는 것'
            body: 양극화의 핵심은 '중간 계층의 감소'와 '상층·하층 비중의 동시 증가'다. "하층의 비중만 늘어나는 현상"이나 "모든 계층의 소득이 함께 줄어드는 현상"은 양극화의 정의가 아니다.
          - type: callout
            label: 교과서 자료 — 소득 5분위 배율 (51쪽)
            text: |-
              · 상위 20%의 평균 소득 ÷ 하위 20%의 평균 소득. 값이 클수록 빈부 격차가 크고 소득 불평등이 심하다.
              · 2023년 1분기: 상·하위 20% 가구의 월평균 소득 격차 약 10.7배, 균등화 처분가능소득 기준 5분위 배율 6.45배
              · 균등화 처분가능소득: 가구가 번 소득에 연금 등을 더하고 세금·사회 보험료 등을 뺀 소득
          - type: table
            caption: '심화 · 고2 사회와 문화 — 불평등 지표 한 번에 정리'
            headers: [지표, 계산, 해석]
            weights: [1.1, 2.0, 1.6]
            rows:
              - ['소득 5분위 배율', '상위 20% 평균 소득 ÷ 하위 20% 평균 소득', '클수록 불평등']
              - ['10분위 분배율', '하위 40% 소득 점유율 ÷ 상위 20% 소득 점유율 (0~2)', '클수록 평등 (방향 반대 주의!)']
              - ['지니 계수', '로렌츠 곡선과 완전 평등선 사이 면적으로 계산 (0~1)', '1에 가까울수록 불평등']
              - ['상대적 빈곤율', '중위 소득의 50% 미만 소득 가구(인구)의 비율', '높을수록 빈곤층 비중이 큼']

      - no: '03'
        heading: 공간 불평등 — 어디에 사느냐가 삶을 가른다
        blocks:
          - type: callout
            style: key
            label: 핵심 정리 (52쪽)
            text: |-
              · 뜻: 지역 간에 사회적·경제적·문화적 격차가 발생하는 현상
              · 유형: 선진국과 개발 도상국, 수도권과 비수도권, 도시와 촌락, 도시 지역 내 격차
              · 기본 원인: 지역마다 자연환경과 생산 요소가 다르다.
              · 심화 원인: 어떤 지역 개발 방식을 쓰느냐에 따라 불평등이 커진다.
              · 문제: 소득뿐 아니라 교육·의료·문화 등 생활 전반의 불평등 → 지역 갈등, 사회 통합 저해
          - type: steps
            label: 우리나라 공간 불평등이 커진 과정
            items:
              - title: 성장 거점 개발
                body: 빠른 성장을 위해 성장 잠재력이 큰 수도권과 대도시를 집중 육성하고, 그 효과가 주변으로 퍼지기를 기대했다.
              - title: 인구와 자본이 한쪽으로
                body: 수도권과 대도시로 인구와 자본이 유입되어 경제가 성장했다.
              - title: 나머지 지역은 침체
                body: 그 외 지역은 인구가 빠져나가고 경제가 침체되어 공간 불평등이 심화되었다.
          - type: contrast
            left_title: 심화 — 성장 거점 개발 (하향식)
            left_body: 효율성 중시. 투자 효과가 빠르다. 그러나 효과가 주변으로 퍼지기보다 주변의 인구·자본을 빨아들이는 역류 효과가 나타나면 지역 격차가 커진다.
            right_title: 심화 — 균형 개발 (상향식)
            right_body: 형평성 중시. 낙후 지역을 포함해 고르게 개발하고 지역 주민의 참여를 중시한다. 지역 격차 완화에 유리하지만 성장 속도는 느릴 수 있다.

      - no: '04'
        heading: 사회적 약자에 대한 차별과 다중 격차
        blocks:
          - type: contrast
            left_title: 사회적 약자 (52쪽)
            left_body: 사회에서 신체적·정치적·경제적·사회적·문화적으로 소외되어 인간다운 삶을 영위하는 데 어려움을 겪는 개인이나 집단. 불리한 위치에 있는 사람 모두를 가리킨다. 예) 장애인, 노인, 빈곤층
            right_title: 사회적 소수자 (52쪽)
            right_body: 사회적 약자의 '일부'. 특정 집단의 구성원이라는 이유만으로 차별받으며, 스스로 차별받는 집단에 속해 있다는 의식을 가진 사람
          - type: callout
            label: 차별은 왜 생기고, 왜 심각한가
            text: |-
              · 원인: 성별·나이·신체 조건·국적·민족·소득 수준 등에 따른 선입견과 편견, 그리고 주류 집단과 다르다는 비합리적 이유
              · 문제: 인간 존엄성과 기본적 권리를 침해할 수 있다.
              · 교과서 사례(52쪽): 무인 정보 단말기(키오스크)에 익숙하지 않은 노인이 식당 이용에서 배제된다 → '과거에는 없던 배제와 차별'
          - type: callout
            style: key
            label: 다중 격차 — 격차는 꼬리를 문다 (53쪽)
            text: |-
              소득 격차 → 자산 불평등 → 주거 불평등 → 교육 불평등 → 대학 진학 → 다시 소득 격차
              한국 사회의 불평등은 단순한 빈부 격차가 아니라 소득·자산·주거·교육·문화·건강 등 여러 영역의 격차가 서로를 키우는 '다중 격차'로 나타난다.
          - type: table
            caption: 교과서 53쪽 그래프 읽기 — 그래프마다 '무엇과 무엇의 관계인가'를 먼저 본다
            headers: [그래프, 교과서가 짚는 내용]
            weights: [1.3, 2.9]
            rows:
              - ['도시·농촌 가구 소득 (2021)', '농촌 가구 소득은 도시 근로자 가구 소득의 약 64%']
              - ['지역별 학업 성취도 (2021)', "고2 '보통 학력 이상' 비율은 국어·수학·영어 모두 대도시가 읍·면보다 높다"]
              - ['부모 소득별 대학 진학 (2020)', '부모 소득이 높을수록 자녀의 대학 진학률이 높다']
              - ['학력별 월평균 임금 (2022)', '학력이 높을수록 월평균 임금이 높다 → 교육이 다시 소득 격차로']
          - type: disc
            title: 그래프 선지의 함정
            body: 그래프는 '경향'을 보여 줄 뿐이다. "부모 소득이 높은 학생은 모두 대학에 진학한다"처럼 개인에게 단정하거나, "학력 차이가 소득 차이의 유일한 원인이다"처럼 원인을 하나로 몰면 ×다.

      - no: '05'
        heading: 해결 ① 사회 복지 제도 — 모두에게 최소한의 인간다운 삶을
        blocks:
          - type: prose
            text: 능력과 업적에 따른 불평등은 일할 동기를 주기도 한다. 그러나 불평등이 환경적·구조적 원인에서 생기거나 분배가 지나치게 한쪽에 쏠리면 능력을 발휘할 기회 자체가 사라진다(54쪽). 사회 복지 제도는 모든 구성원이 기본적 욕구를 충족하고 최소한의 인간다운 삶을 살도록 지원하며, 계층 양극화를 완화하는 데 도움이 된다.
          - type: table
            caption: 우리나라 사회 복지 제도 세 가지 (54쪽)
            headers: [제도, 뜻, 대표 예]
            weights: [0.9, 2.3, 1.6]
            rows:
              - ['사회 보험', '사회적 위험(질병·노령·실업·산업 재해)에 보험 방식으로 미리 대처. 소득이 있는 개인과 정부·사업주가 보험료를 분담', '국민연금, 국민 건강 보험, 고용 보험, 산업 재해 보상 보험']
              - ['공공 부조', '국가와 지방 자치 단체의 책임 아래 생활 유지 능력이 없거나 생활이 어려운 국민의 최저 생활 보장과 자립 지원', '국민 기초 생활 보장 제도, 기초 연금, 의료 급여']
              - ['사회 서비스', '도움이 필요한 국민에게 상담·재활·돌봄·복지 시설 이용·사회 참여 지원 등을 제공', '노인 돌봄 서비스, 장애인 활동 지원, 가사·간병 서비스']
          - type: table
            caption: '심화 · 고2 사회와 문화 — 사회 보험 vs 공공 부조 (최다 빈출 비교)'
            headers: [기준, 사회 보험, 공공 부조]
            weights: [1.0, 1.7, 1.7]
            rows:
              - [대상, '보험료를 내는 가입자 (일정 소득이 있는 국민)', '생활이 어려운 저소득층']
              - [재원, '가입자·사업주·정부가 분담하는 보험료', '조세 (국가·지자체 재정)']
              - [가입·수급, '대부분 강제 가입, 보험료 납부에 따라 수급', '자산·소득 조사를 거쳐 선정']
              - [수혜자 비용 부담, '있음', '없음']
              - [성격, '사전 예방적, 상호 부조', '사후 구제적, 국가 책임']
              - [소득 재분배 효과, '상대적으로 작음', '상대적으로 큼']
              - [한계, '보험료를 못 내는 사람은 소외될 수 있음', '재정 부담, 근로 의욕 저하·낙인감 우려']
          - type: callout
            label: 교과서 자료 — 기초 연금 (54쪽)
            text: |-
              · 65세 이상 노인 중 가구의 소득 인정액이 선정 기준 이하인 노인에게 매월 연금을 지급 → 소득 조사를 거치므로 공공 부조에 해당
              · 2014년 도입. 이후 2020년에 처음으로 노인의 상대적 빈곤율이 30%대로 떨어졌고, 기초 연금이 크게 이바지한 것으로 분석된다.
          - type: disc
            title: '함정 — "연금"이라는 이름에 속지 말 것'
            body: 국민연금은 보험료를 내는 사회 보험이고, 기초 연금은 소득 인정액 기준으로 지급하는 공공 부조다. 교과서 60쪽 퀴즈의 기초 연금·국민 건강 보험·노인 돌봄 서비스·국민 기초 생활 보장 제도는 모두 사회 복지 제도에 해당한다(4개).

      - no: '06'
        heading: 해결 ② 지역 격차 완화 정책 — 공간 불평등을 줄이는 방법
        blocks:
          - type: steps
            label: 교과서가 제시하는 정책 (55쪽)
            items:
              - title: 지방 중심의 균형 개발
                body: 소외되었던 지방을 중심으로 개발해 국토의 균형 발전을 꾀한다. 성장 거점 개발로 심해진 공간 불평등 완화에 도움이 된다.
              - title: 공공 기관·기업의 지방 이전
                body: 공공 기관을 지방으로 옮기고, 수도권 기업에 세금 감면·규제 완화 혜택을 주어 지방 이전을 유도 → 지방 일자리 창출
              - title: 지역 특성을 살린 발전 전략
                body: 지방 자치 단체가 주민과 함께 지역 특성을 살린 전략을 세워 투자를 유치하고 경쟁력을 확보
              - title: 도시 내 낙후 지역 개선
                body: 주택 재개발 사업, 주거 환경 개선 사업으로 도시 내부의 공간 불평등을 완화
          - type: table
            caption: 교과서 속 사례 정리 (55쪽)
            headers: [사례, 핵심 내용]
            weights: [1.1, 3.1]
            rows:
              - ['혁신 도시', '2005년 10대 혁신 도시 지정(세종·충남·대전 제외 지역). 이전 공공 기관과 지역 대학·연구소·산업체·지자체가 협력하는 미래형 도시']
              - ['1차 공공 기관 지방 이전', '2014~2019년 154개 기관 이전. 그러나 여전히 40%가 넘는 공공 기관이 수도권에 있고 대다수 혁신 도시가 계획 인구를 달성하지 못함 → 2차 이전 추진 예정']
              - ['세종특별자치시', '수도권 과밀 해소와 국토 균형 발전을 위해 2012년 행정 중심 복합 도시로 출범']
              - ['고향사랑 기부제', '현재 주소지를 제외한 지자체에 기부하면 세금 감면과 지역 특산품 답례 → 지역 경제 활성화, 재정 확충, 국가 균형 발전']

      - no: '07'
        heading: 해결 ③ 적극적 평등 실현 조치 — 출발선을 맞추려는 '기울어진' 지원
        blocks:
          - type: callout
            style: key
            label: 핵심 정리 (56쪽)
            text: |-
              · 뜻: 오랫동안 사회적으로 차별받아 온 사회적 약자에게 직간접적으로 혜택을 주는 정책
              · 목적: 취업·입학 등에서 약자를 우대하여 '실질적인 기회의 평등'을 보장
              · 예: 장애인 의무 고용 제도, 국회 의원 비례 대표 후보 추천 시 여성 할당제
              · 문제: 역차별 → 시행에는 사회적 합의가 필요
              · 역차별: 차별을 시정하려는 제도가 너무 강해 도리어 반대편이 차별받게 되는 경우
          - type: contrast
            left_title: 장애인 의무 고용 제도 — 의의 (57쪽)
            left_body: 국가·지자체와 50명 이상 근로자를 둔 공공 기관·민간 기업에 장애인 고용 의무를 부과(민간 3.1%, 공공 3.6%, 2023). 장애인의 경제적 자립과 사회 참여, 삶의 질 향상, 사회적·경제적 가치 창출
            right_title: 장애인 의무 고용 제도 — 한계 (57쪽)
            right_body: 기업 규모와 관계없이 같은 비율을 적용한다. 그래서 대기업은 중소기업보다 장애인을 더 많이 고용해도 근로자 수가 많아 의무 고용률에 미달하는 경우가 많아 불만이 크다.
          - type: callout
            label: 1장과 연결 — 소수 집단 우대 정책(58쪽 홉우드 사례)
            text: |-
              · 사례: 성적이 높았던 백인 홉우드가 불합격하고, 입학생의 약 15%를 소수 집단에서 뽑는 정책으로 점수가 비슷하거나 낮은 소수 집단 학생은 합격했다.
              · 찬성 근거: 과거 차별의 보상, 법조계 내 소수 집단 비율의 격차, 다양성 증대
              · 반대 근거: 입학 기준의 불공정, 백인 지원자의 권리 침해, 현재 세대는 차별의 당사자가 아님, 소수 집단 학생의 자부심 손상
              · 정의관 연결: 롤스는 실질적 기회 보장 쪽, 노직은 개인 권리 침해 쪽 근거를 찾기 쉽다.
          - type: disc
            title: "헷갈림 주의 — 적극적 평등 실현 조치의 '평등'"
            body: 이 정책이 노리는 것은 결과의 완전한 평등이 아니라 '실질적인 기회의 평등'이다. 또 교과서는 이 조치를 무조건 옳다고 하지 않고 역차별 문제와 사회적 합의의 필요성을 함께 제시한다. "적극적 평등 실현 조치는 역차별 문제를 일으키지 않는다" → ×

      - no: '08'
        heading: 시민의 실천과 공유지의 비극
        blocks:
          - type: steps
            label: 정의로운 사회를 위한 시민의 실천 (56쪽)
            items:
              - title: 관심 갖기
                body: 다양한 불평등 현상에 관심을 갖고 사회적 노력이 적절히 이루어지는지 살핀다.
              - title: 존중과 공감
                body: 선입견과 편견에서 벗어나 모든 사람을 존중하고, 약자의 고통에 공감·배려한다.
              - title: 참여
                body: 기부, 캠페인, 봉사 활동으로 약자의 자립을 돕는다. 예) 한국 해비타트 주거 개선 봉사, 시민이 계단 정보를 모은 '계단 뿌셔 클럽'의 계단 정복 지도(57쪽)
          - type: callout
            label: 교과서 속 사상가 — 싱어 (56쪽)
            text: |-
              · 최대 다수의 최대 행복을 추구하는 현대의 공리주의 실천 윤리학자
              · 세계 시민으로서 빈곤·기아·질병으로 고통받는 지구촌 사람들을 돕는 것은 '의무'라고 보았다.
              · 〈물에 빠진 아이 구하기〉: 불필요한 소비에는 돈을 쓰면서 기부하지 않는 것은 구할 수 있는 아이를 죽게 내버려 두는 것과 같다.
              · 비교 포인트: 싱어에게 기부는 칭찬받을 선택이 아니라 의무다. 노직에게 기부는 자발적 선택이다.
          - type: callout
            style: key
            label: 공유지의 비극 (61쪽 단원 마무리)
            text: |-
              · 하딘: 모두가 함께 써야 할 자원(지하자원·초원·공기·바다의 물고기)을 각자 자기 이익만 좇아 마구 쓰면 결국 고갈되어 공동체 전체가 피해를 본다.
              · 핵심 메시지: 사익의 극대화가 공익에 악영향을 끼친다.
          - type: table
            caption: 교과서가 제시한 세 가지 해결 방안과 장단점
            headers: [방안, 장점, 단점]
            weights: [1.6, 1.4, 1.4]
            rows:
              - ['㉮ 목초지를 개인에게 나누어 자율 관리 (사유화)', '자기 땅이므로 아껴 쓸 유인이 생김', '나누기 어려운 자원(공기·바다)에는 적용 곤란, 분배의 형평성 문제']
              - ['㉯ 정부가 적정 가축 수를 정하고 과잉 방목에 벌금 (규제)', '강제력이 있어 효과가 확실함', '감시 비용, 개인 자율성 제약']
              - ['㉰ 공유자들이 자발적으로 합의해 적정 수를 정함 (자율 관리)', '공동체의 자율과 협력 증진', '합의가 깨지거나 무임승차할 위험']
          - type: callout
            label: '심화 — 세 방안과 정의관 연결'
            text: ㉮는 개인의 소유권을 중시하는 자유주의적 해법, ㉰는 구성원의 유대와 공동선을 중시하는 공동체주의적 해법에 가깝다. 오스트롬은 공동체가 스스로 규칙을 만들어 공유 자원을 오랫동안 잘 관리한 사례를 연구해, 사유화나 정부 규제가 아닌 제3의 길이 가능함을 보였다.

      - no: '09'
        heading: 선지 분석 — 불평등 현상과 해결 제도
        blocks:
          - type: prose
            text: '이유를 가리고 먼저 O/× 판단한 뒤 확인하자. [ ] 안은 함정 유형이다.'
          - type: checks
            items:
              - statement: '① 사회 계층의 양극화는 중간 계층의 비중이 줄고 상층과 하층의 비중이 늘어나는 현상이다. → ○'
                why: 교과서 51쪽.
              - statement: '② 소득 5분위 배율이 높아졌다면 소득 불평등이 완화된 것이다. → ×'
                why: '[방향 뒤집기] 높을수록 불평등이 심하다. 심화: 10분위 분배율은 반대로 높을수록 평등.'
              - statement: '③ 공간 불평등은 자연환경과 생산 요소의 차이로만 발생한다. → ×'
                why: "[원인 축소] 어떤 지역 개발 방식을 쓰느냐에 따라 심화되기도 한다(성장 거점 개발)."
              - statement: '④ 성장 거점 개발은 수도권과 대도시의 성장에 기여했지만 공간 불평등을 심화시켰다. → ○'
                why: 교과서 52쪽.
              - statement: '⑤ 사회적 소수자는 사회적 약자를 포함하는 더 넓은 개념이다. → ×'
                why: '[포함 관계 뒤집기] 사회적 소수자가 사회적 약자의 일부다.'
              - statement: '⑥ 사회 보험은 국가와 지방 자치 단체가 조세로 저소득층의 최저 생활을 보장하는 제도이다. → ×'
                why: '[제도 바꿔치기] 공공 부조의 설명이다. 사회 보험은 보험료를 분담한다.'
              - statement: '⑦ 국민 건강 보험과 고용 보험은 사회 보험에 해당한다. → ○'
                why: 교과서 54쪽.
              - statement: '⑧ 기초 연금은 보험료를 낸 사람에게만 지급하는 사회 보험이다. → ×'
                why: "[이름 함정] 소득 인정액 기준으로 지급하는 공공 부조다."
              - statement: '⑨ 심화: 공공 부조는 사회 보험보다 소득 재분배 효과가 크다. → ○'
                why: 조세로 저소득층에 집중 지원하기 때문이다.
              - statement: '⑩ 노인 돌봄 서비스와 장애인 활동 지원은 사회 서비스에 해당한다. → ○'
                why: 교과서 54쪽.
              - statement: '⑪ 1차 공공 기관 지방 이전으로 대부분의 혁신 도시가 계획 인구를 달성하였다. → ×'
                why: '[사실 왜곡] 대다수 혁신 도시가 계획 인구 목표를 달성하지 못해 2차 이전이 추진된다.'
              - statement: '⑫ 고향사랑 기부제는 현재 주소지의 지방 자치 단체에 기부하는 제도이다. → ×'
                why: '[조건 뒤집기] 현재 주소지를 제외한 지자체에 기부한다.'
              - statement: '⑬ 적극적 평등 실현 조치는 사회적 약자에게 실질적인 기회의 평등을 보장하려는 정책이다. → ○'
                why: 교과서 56쪽.
              - statement: '⑭ 적극적 평등 실현 조치는 역차별 논란이 없으므로 사회적 합의 없이 시행할 수 있다. → ×'
                why: '[결론 뒤집기] 역차별 문제가 있어 사회적 합의가 필요하다.'
              - statement: '⑮ 장애인 의무 고용 제도는 기업 규모에 따라 의무 고용률을 다르게 적용한다. → ×'
                why: '[사실 왜곡] 같은 비율을 적용해서 대기업의 불만이 크다는 것이 교과서의 한계 설명이다.'
              - statement: '⑯ 싱어는 지구촌의 빈곤한 사람을 돕는 것이 개인의 선택일 뿐 의무는 아니라고 본다. → ×'
                why: '[사상가 입장 뒤집기] 싱어는 돕는 것을 의무라고 보았다.'
              - statement: '⑰ 공유지의 비극은 사익의 극대화가 공익에 악영향을 끼칠 수 있음을 보여 준다. → ○'
                why: 교과서 61쪽.
              - statement: '⑱ 다중 격차란 소득 격차 하나가 다른 영역과 무관하게 커지는 현상이다. → ×'
                why: '[개념 왜곡] 소득·자산·주거·교육 등 여러 영역의 격차가 서로 연결되어 커지는 현상이다.'

      - no: '10'
        heading: 서술형 대비와 한 장 정리
        blocks:
          - type: callout
            style: key
            label: '예시 — 적극적 평등 실현 조치의 의미와 한계를 사례를 들어 서술하시오.'
            text: |-
              적극적 평등 실현 조치는 오랫동안 차별받아 온 사회적 약자에게 직간접적인 혜택을 주어 실질적인 기회의 평등을 보장하려는 정책이다. 예를 들어 장애인 의무 고용 제도는 일정 규모 이상의 기관과 기업에 장애인을 일정 비율 이상 고용하도록 하여 장애인의 경제적 자립과 사회 참여를 돕는다. 그러나 이러한 조치가 지나치면 반대편이 차별받는 역차별 문제가 생길 수 있으므로 사회적 합의가 필요하다.
          - type: disc
            title: 감점 포인트
            body: |-
              · '실질적인 기회의 평등'을 '결과의 평등'으로 쓰기
