  - 'no': '02'
    heading: '서술 방식과 비언어적 표현: 행동 하나에 심리를 읽어 낸다'
    prose: 학평 39번의 정답은 '이야기 밖 서술자가 상황에 대한 인물의 판단과 심리를 서술하고 있다'였다. 예컨대 서술자는 '한 번 본 적도 없는 증조부가 멀지 않다니 그럼 누가 멀단 말인가'처럼 명준의 속생각을 그대로 보여 주고, '녀석의 입에서 그런 말밖에 안 나올 줄 알았지만, 괘씸하기 짝이 없다'처럼 송 노인의 내면도 직접 서술한다. 인물의 표정과 동작도 심리를 드러내는 장치다. '눈언저리가 화끈해지는 느낌'은 분노와 당혹, '주둥이를 삐죽 빼문다'는 불만, '문집을 아무렇게나 팔랑팔랑 넘겨본다'는 문집을 가볍게 여기는 태도, '이맛살을 약간 찌푸리며 슬그머니 고개를 돌린다'는 알아듣지 못하는 말 앞에서 기분이 상한 반응이다. 다만 학평 41번에서 보듯, 고개를 돌린 직후 '돈이 좀 들더라도 좌우간 만들어야겠어'라고 말하므로 이 장면을 '의욕을 잃었다'로 읽으면 틀린다.
    tables:
    - headers:
      - 표현
      - 인물
      - 드러나는 심리·태도
      rows:
      - - 눈언저리가 화끈해지는 느낌
