  - 'no': '02'
    heading: 표현 기법과 '햇빛이 살로 변하여'의 함정
    prose: '''튼튼한 폐허''는 무너진 잔해를 뜻하는 ''폐허''에 ''튼튼하다''를 붙인 역설로, 해골이 오래 지속된다는 속성을 부각한다. 도치는 1연 끝 ''더듬어나갔다 / … 그 물체를 / … 그 튼튼한 폐허를''과 2연의 ''늘 너를 보고 있네 / 잠시 동안만 피다 지는 얼굴을''에서 확인된다. ''뻗어 있는 긴 시간을 … 보고 있네''는 추상적인 시간을 눈에 보이는 것처럼 구체화한다. 가장 중요한 함정은 마지막의 ''햇빛은 살로 변하여''이다. 학평 45번은 이것을 ''생명력 회복에 대한 의지''로 본 선지를 오답으로 했다. 다시 생긴 얼굴은 ''잠시 동안만 피다 지는'' 덧없는 것이고, 화자는 그 얼굴이 ''어색하여'' 눈을 깜박이다가 서류 속 숫자로 돌아간다. 희망이나 생명의 회복이 아니라 낯선 인식에서 벗어나 일상으로 복귀하는 과정으로 읽어야 한다. 학평 44번도 ⓑ ''숫자''를 ''화자가 일상으로 돌아와 적응하려는 과정에서 나타나는 반응''으로 설명했다.'
    discriminations:
    - title: 변별 포인트 1  |  말을 건넴 ≠ 대화
      body: '''얼굴이여'', ''너를 보고 있네''처럼 말을 건네는 어조가 있지만 응답하는 상대가 없다. ''대화 형식''이라는 선지는 틀린다. ''검은 눈''이 있어도 색채 대비는 아니다.'
    - title: 변별 포인트 2  |  감각의 전환
      body: '''어둠이 손에 배자''(시각 → 촉각), ''햇빛은 살로 변하여''(빛의 물질화), ''긴 시간을 보고 있네''(추상의 시각화). 모두 비현실적 상상을 구체화하는 장치이다.'
    - title: ◇ 본문 표기 메모
      body: 학평·학교 프린트는 '선글라스만한 구멍 뚫린 크고 검은 눈으로'이다. 잡지 수록본은 '선글라스만 한 … 커다란 눈으로'로 다르므로 시험은 프린트 표기를 따른다.
    option_checks:
    - statement: 선지 점검  “'튼튼한 폐허'는 모순된 표현으로 해골의 지속성을 부각한다.”  →  [적절 ○]
      why: 역설로 소멸의 잔해에 지속성을 부여한다.
    - statement: 선지 점검  “'햇빛'이 '살'로 변하는 장면은 생명력을 되찾으려는 화자의 의지를 드러낸다.”  →  [부적절 ×]
      why: 다시 생긴 얼굴은 덧없고 어색하며, 화자는 일상으로 복귀할 뿐이다.
    - statement: 선지 점검  “'서류 속의 숫자'에 초점을 맞추는 것은 일상으로 돌아와 적응하는 모습이다.”  →  [적절 ○]
      why: 학평 44번 ⓑ 해설과 같다.
  - 'no': '03'
    heading: '서술형 대비: 대비 구조와 결말의 의미를 정확한 말로 쓴다'
    prose: 「얼굴」의 서술형은 '얼굴'과 '해골'의 대비를 설명하게 하거나, 마지막 장면의 의미를 쓰게 하는 형태가 유력하다. 대비를 쓸 때는 두 대상의 속성을 시구로 하나씩 짚고, 그 대비가 무엇을 드러내는지(인간 존재의 유한성과 시간의 흐름)까지 이어 써야 한다. 결말을 쓸 때는 '생명력 회복', '희망' 같은 말을 쓰지 않도록 주의한다.
    callouts:
    - label: 모범 답안 틀
      text: '• 대비: ''잠시 동안만 피다 지는'' 얼굴과 ''튼튼한 폐허''인 해골을 대비하여, 감정에 따라 변하는 얼굴의 덧없음과 오래 지속되는 해골을 통해 인간 존재의 유한성을 드러낸다.

        • 역설: ''튼튼한 폐허''는 모순되는 말을 결합한 역설로, 해골이 오랜 시간 형태를 유지하는 지속성을 부각한다.

        • 결말: 손을 떼자 햇빛이 살로 변해 얼굴이 되고 화자가 서류 속 숫자에 초점을 맞추는 것은, 낯선 인식에서 벗어나 일상으로 돌아와 적응하는 과정을 보여 준다.'
    discriminations:
    - title: 감점 방지  |  결말 해석의 금지어
      body: '''생명력을 회복하려는 의지'', ''희망을 되찾음'', ''현실에 대한 저항''은 학평 해설과 어긋나는 해석이다. ''일상으로의 복귀·적응''을 핵심어로 쓴다.'
- unit_kicker: UNIT 05 · 통합
  title: ▶ 추가 자료(문학적 표현론)로 「보석 1」과 「얼굴」을 함께 읽는다
  sections:
  - 'no': '01'
    heading: 추가 자료의 세 가지 장치를 두 작품에 대응시킨다
    prose: 프린트 4쪽의 추가 자료는 문학적 표현의 원리를 세 가지로 정리한다. 첫째, 현실에서 불가능한 상황을 의도적으로 재구성하는 방법이 있으며, 여기에는 공간·시간의 비현실적 재구성과 시적 대상의 비현실적 변화가 포함된다. 둘째, 서로 대비되는 시어나 시구가 연결되어 새로운 의미가 생긴다. 셋째, 이런 표현들은 화자의 인식과 태도를 드러내 주제를 구현한다. 기말 문항은 이 자료를 <보기>로 주고 두 시에 적용하게 할 가능성이 크다. 각 장치가 두 시의 어느 구절에 해당하는지 미리 짝지어 두면 3점짜리 <보기> 문항을 빠르게 판정할 수 있다.
    tables:
    - headers:
      - 추가 자료의 장치
      - 「보석 1」
      - 「얼굴」
      rows:
      - - 공간의 비현실적 재구성
        - 쥐라기 지층 어느 하늘 아래
        - (해당 약함) 손바닥 아래 얼굴 속 해골
      - - 시간의 비현실적 재구성
        - (해당 약함)
        - 얼굴의 기억이 지워진 뒤에도 뻗어 있는 긴 시간을 보고 있음
      - - 대상의 비현실적 변화
        - 눈물 → 보석, 화석 속에서 나는 새
        - 햇빛 → 살 → 얼굴
      - - 대비되는 시어의 연결
        - 지상 ↔ 새, 소멸 ↔ 영원(역설)
        - 얼굴 ↔ 해골, 튼튼한 ↔ 폐허(역설)
      - - 화자의 인식·태도
        - 소멸을 넘어 영원히 남기를 바람
        - 인간 존재의 유한성을 성찰하고 일상으로 복귀
      weights:
      - 1.2
      - 1.4
      - 1.6
    contrasts:
    - left_title: 두 시의 공통점
      left_body: '• 비현실적 상상을 활용함

        • 역설(죽음이 아니다 / 튼튼한 폐허)과 도치(묻혀라 화석에 / 그 물체를)

        • 유한함과 지속·영원의 대비'
      right_title: 두 시의 차이점
      right_body: '• 「보석 1」: 영원성에 대한 ''소망''과 명령형·단정적 어조

        • 「얼굴」: 유한성에 대한 ''성찰''과 일상 복귀, 체험을 서술하는 어조'
    option_checks:
    - statement: 선지 점검  “(보석 1)과 (얼굴) 모두 도치를 활용하여 대상에 주목하는 화자의 태도를 드러낸다.”  →  [적절 ○]
      why: 학평 43번 정답과 같다.
    - statement: 선지 점검  “두 시 모두 감정을 이입한 대상을 통해 화자의 슬픔을 드러낸다.”  →  [부적절 ×]
      why: 두 시 모두 감정이입이 쓰이지 않았다.
    - statement: 선지 점검  “「얼굴」에서 얼굴이 해골로 바뀌는 것은 시간이 비현실적으로 재구성된 것이다.”  →  [부적절 ×]
      why: 해골이 만져지는 것은 대상 인식의 비현실적 변화에 가깝다. 시간의 재구성은 '긴 시간을 보고 있네' 부분이다.
