  - 'no': '02'
    heading: '고사는 장식이 아니라 ''근거''다: 인물별로 무엇을 정당화하는지 구별한다'
    prose: 이 작품의 고사 인용은 화자의 생각을 강조하는 기능을 한다. 2026년 10월 고1 학평 34번의 정답도 '고사를 활용하여 표현하고자 하는 바를 강조하고 있다'였다. 고사를 묶어서 외우지 말고, 각 고사가 화자의 어떤 주장을 뒷받침하는지 짝지어 두어야 선지 판단이 빨라진다. 이윤과 여상은 오래 초야에 있다가 성군을 만나 발탁된 인물이므로, 출세가 늦은 화자가 때를 기다린 것일 뿐이라고 스스로를 정당화하는 근거가 된다. 급암과 노중련은 곧은 신하와 절의를 지킨 선비로서 화자가 지향하는 충신의 모습을 보여 준다. 유비의 삼고초려와 송 태조는 임금이 인재를 극진히 구하는 장면으로, 화자가 상상하는 등용 장면과 이어진다. 범려와 소광은 공을 이룬 뒤 물러난 인물로 마지막 은거 단계를 뒷받침한다.
    tables:
    - headers:
      - 고사 인물
      - 프린트 각주의 요지
      - 작품 안에서의 기능
      rows:
      - - 이윤 · 여상(강태공)
        - 성군을 섬긴 충신
        - 늦은 출사를 정당화, 때를 기다린 인재로서의 자기 인식
      - - 급암 · 노중련
        - 직언한 충신, 절의를 지킨 의사
        - 화자가 지향하는 충의 가치 강조
      - - 유비(삼고초려) · 송 태조
        - 인재를 등용하려 한 임금
        - 임금이 화자를 극진히 부르는 장면(상상)과 연결
      - - 고요직설 · 오현금 남풍시
        - 요순을 모신 어진 신하, 백성의 평안을 노래한 시
        - 태평성대에 대한 이상
      - - 범려(오호주) · 소광(천일금)
        - 공을 이룬 뒤 은거, 하사금을 고향과 나눔
        - 공명 후 미련 없는 은퇴와 나눔
      weights:
      - 1.1
      - 1.3
      - 1.6
    contrasts:
    - left_title: 실제로 겪는 장면
      left_body: '• 산골 초당에서 경치를 보고 시를 읊으며 술과 퉁소를 즐김

        • 서울 거리에서 소년들의 질문을 받음'
      right_title: 화자가 상상·소망하는 장면
      right_body: '• 임금이 노래를 듣고 한림원·의정부로 불러 하교함

        • 공명을 이룬 뒤 벼슬을 그만두고 고향에서 벗들과 즐김

        → ''바라노라''로 끝나는 소망의 틀 안에 있음'
  - 'no': '03'
    heading: '인물 지칭과 상상 장면: 학평·내신 함정이 몰리는 지점'
    prose: 학평 35번은 '소년들'과 '자네'를 '화자가 교훈을 전달하고자 하는 인물'로 본 선지를 오답으로 처리했다. '소년들'은 화자에게 출세가 늦은 이유를 묻는 서울의 평범한 사람들이고, '자네'는 그 소년들이 화자를 부르는 말이다. 이처럼 누가 누구에게 하는 말인지를 바꾸는 선지가 가장 흔한 함정이다. 또 하나의 함정은 상상과 실제를 뒤섞는 것이다. 임금이 화자를 불러 하교하는 대목과 공명 후 은거하는 대목은 화자가 실제로 겪은 일이 아니라 바라는 삶을 그린 것이다. 그래서 '임금에게 등용되어 정치적 업적을 이룬 경험을 회고한다' 같은 진술은 틀린다. 마지막으로 마지막 구절의 '질병 없이 살아감'은 앞부분(학평 미수록 서두)의 질병 언급과 호응하며, 이상적 삶의 마지막 조건이 건강이라는 점을 보여 준다.
    discriminations:
    - title: 변별 포인트 1  |  말하는 사람과 듣는 사람
      body: 소년들 → 화자에게 질문하는 사람. 자네 → 소년들이 화자를 부르는 말. 성상(임금) → 화자를 부르는 사람(상상). 좋은 벗 → 은거 후 함께 즐기는 사람. 이 네 짝을 뒤바꾼 선지는 바로 지운다.
    - title: 변별 포인트 2  |  '체념'이 아니라 '조화'
      body: 자연 풍류와 출세 의지는 대립하지 않는다. '자연에 묻혀 벼슬을 거부한다', '출세를 위해 자연을 버린다'처럼 한쪽만 고르는 해석은 작품 전체의 흐름(풍류 → 공명 → 은거)과 맞지 않는다.
    - title: ◇ 자료 확인 메모
      body: Drive의 '전문 전사 리포트'에는 '종산', '이백' 등 원본과 다른 구절이 있다. 학교 프린트 원본 스캔과 학평 지문은 '이윤의 신야 농사', '충신열사 후예로서', '급암의 와회양도'이다. 공부는 원본 기준으로 한다.
    option_checks:
    - statement: 선지 점검  “화자는 고사를 활용하여 자신이 충신의 자질을 지녔음을 드러내고 있다.”  →  [적절 ○]
      why: 이윤·여상·급암·노중련 고사로 '충신열사 후예'라는 자기 인식을 뒷받침한다.
    - statement: 선지 점검  “'소년들'은 화자가 깨달음을 전하려는 대상이다.”  →  [부적절 ×]
      why: '''소년들''은 화자에게 출세가 늦은 이유를 묻는 사람들이다. 교훈의 대상이 아니다.'
    - statement: 선지 점검  “화자는 임금에게 등용되어 업적을 쌓았던 과거를 회상하고 있다.”  →  [부적절 ×]
      why: 등용 장면은 과거 회상이 아니라 소망이 투영된 상상이다.
- unit_kicker: UNIT 02 · 현대 소설
  title: 하근찬, 「조상의 문집」 — 같은 책을 두고 세 세대가 서로 다른 가치를 본다
  sections:
  - 'no': '01'
    heading: '갈등의 축: 정신적·전통적 가치 대 실용성·경제성'
    prose: 1984년 발표된 하근찬의 단편이다. 송 노인은 증조부(명준 기준)이자 자신의 조부가 남긴 문집을 책으로 펴내려 하고, 아들 명준은 반대한다. 둘의 대립은 '조상과 문집의 가치를 무엇으로 판단하느냐'에서 생긴다. 송 노인은 조부를 '학식이 높은 선비면서 애국자'로 기억하고, 많은 사람이 읽지 않더라도 몇 사람만 그 가치를 알면 족하다고 말한다. 일자무식이지만 문집에 가치 있는 글이 담겨 있다는 것은 자신이 누구보다 잘 안다는 확신이 있다. 반면 명준은 증조부를 '멀고 서먹한' 존재로 느끼며, 한문투성이 책은 아무도 읽지 않고(실용성) 조판비·옵세트 인쇄비가 많이 든다(경제성)고 맞선다. 결국 송 노인은 아들의 도움 없이 고향 사람들의 도움으로 『매산문집』을 간행한다. 그러나 손자 윤국은 '순 한문 아냐, 후졌다'며 킬킬거리고 나가 버린다. 문집은 나왔지만 다음 세대로 이어지지 못하는 결말이 이 작품의 씁쓸한 핵심이다.
    callouts:
    - label: 핵심 정리(학교 프린트)
      text: '• 갈래: 현대 소설, 단편 소설   • 성격: 사실적, 비판적, 세태 반영적

        • 주제: 조상의 문집을 둘러싼 갈등을 통해 드러나는 전통적 가치에 대한 세대 간의 인식 차이

        • 특징: ① 이야기 밖 서술자가 인물의 행동·판단·내면 심리를 직접 서술 ② 대화 중심으로 전통적 가치관과 실용성·경제성 중시 가치관의 대립 ③ ''문집''이라는 핵심 소재로 조상 존중과 전통 계승 문제를 드러냄'
    tables:
    - headers:
