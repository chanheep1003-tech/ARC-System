  - 'no': '03'
    heading: 학평 정답 논리로 정리하는 고난도 판정 기준
    prose: 학평 40번은 명준과 송 노인이 '모두 자신만 알고 상대방은 모를 것이라고 생각하는 정보를 바탕으로 자신의 생각을 드러낸다'는 선지를 정답으로 했다. 명준은 조판·옵세트 같은 출판 실무 지식을, 송 노인은 조부의 인품과 애국심을 근거로 내세운다. 둘 다 상대가 모르는 정보로 자기 입장을 세운다는 점이 같다. 학평 42번은 송 노인이 '족보도 다 한문으로 된 거 아니냐'고 말한 것을 '새로운 가치관과의 공존을 꾀하는 태도'로 본 선지를 오답으로 했다. 이 말은 한문 책의 가치를 옹호하는 전통적 관점의 연장일 뿐 타협이 아니다. 결말의 아이러니도 중요하다. 송 노인은 간행에는 성공했지만 손자 대에서 다시 외면당하므로, 전통적 가치가 산업화 이후 다음 세대로 계승되기 어려운 현실이 부각된다.
    contrasts:
    - left_title: 부분 사실 (맞는 부분)
      left_body: '• 송 노인은 이맛살을 찌푸린다 → 기분이 상함

        • 송 노인은 족보를 예로 든다 → 한문 책의 가치를 옹호'
      right_title: 판단 오류 (틀린 부분)
      right_body: '• → ''간행 의욕을 잃었다''(X): 곧바로 만들겠다고 말함

        • → ''새 가치관과 공존을 꾀한다''(X): 전통적 관점을 고수함'
    option_checks:
    - statement: 선지 점검  “서술자는 작품 밖에서 인물의 내면 심리를 직접 드러내고 있다.”  →  [적절 ○]
      why: 명준의 속생각, 송 노인의 괘씸한 마음이 서술자를 통해 직접 제시된다.
    - statement: 선지 점검  “명준은 문집의 학문적 가치를 인정하면서도 비용 때문에 반대한다.”  →  [부적절 ×]
      why: 명준은 '세상에 펴낼 가치가 없는 거'라고 말한다. 가치 자체를 인정하지 않는다.
    - statement: 선지 점검  “윤국의 반응은 송 노인의 노력이 다음 세대에 이어지지 못함을 보여 준다.”  →  [적절 ○]
      why: '''후졌다'', ''틀렸다''며 웃고 나가는 모습으로 전통 계승의 어려움이 드러난다.'
    - statement: 선지 점검  “송 노인은 고향 사람들의 도움을 받고 아들의 생각에 동의하게 된다.”  →  [부적절 ×]
      why: 고향 사람들의 도움으로 간행했을 뿐 아들의 생각에 동의한 것이 아니다.
- unit_kicker: UNIT 03 · 현대시
  title: 오세영, 「보석 1」 — 소멸을 넘어 영원히 남기를 바라는 상상
  sections:
  - 'no': '01'
    heading: '세 연의 흐름: 불가능한 장면 → 눈물의 보석화 → ''지상의 별''에 대한 명령과 역설'
    prose: 1연에서 화자는 '화석 속엔 한 마리 / 새가 난다'는 현실에서 불가능한 장면을 제시한다. 생명이 멈춘 화석 속에서 새가 날고, 그 새는 '결코 지상으로 내려오지 않는다'. 유한하고 세속적인 '지상'과 대비되는 초월적 존재가 형상화된다. 2연에서는 '내가 흘린 눈물도 / 쥐라기 지층 어느 하늘 아래 / 하나의 보석으로 반짝거릴까'라고 묻는다. 땅속 지층 안에 하늘이 있다는 공간의 비현실적 재구성을 통해, 금방 마르는 눈물(순간의 슬픔)이 영원한 가치(보석)로 남기를 바라는 마음이 드러난다. 3연에서 화자는 '스스로 불에 타서 소멸을 선택하는 / 지상의 별들이여'라고 부르고, '묻혀라 화석에'라고 명령한다. 마지막 '영원히 죽는 것은 이미 / 죽음이 아니다'는 역설로 주제를 집약한다. 소멸을 스스로 선택한 존재가 화석 속에 묻혀 영원히 남는다면, 그것은 더 이상 사라짐이 아니라는 인식이다.
    callouts:
    - label: 핵심 정리(학교 프린트)
      text: '• 갈래: 자유시, 서정시   • 성격: 관념적, 상징적, 사색적

        • 주제: 소멸을 넘어 영원한 존재로 남고자 하는 소망

        • 특징: ① 비현실적 상상을 통해 영원성에 대한 소망을 형상화 ② 대비, 역설, 도치 등 다양한 표현으로 주제 의식 강조'
