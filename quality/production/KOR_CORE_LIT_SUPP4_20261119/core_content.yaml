    prose: 화자는 눈이 피곤해 두 손으로 얼굴을 가린다. '곧 어둠이 손에 배자 / 손바닥 가득 해골이 만져졌다'. 시각적 어둠을 손에 스며드는 것처럼 촉각화한 감각적 표현이다. 화자는 그 뼈를 '아까워하며 조금씩 조금씩' 더듬고, 해골을 '차갑고 무뚝뚝하고 무엇에도 무관심한 그 물체', '그 튼튼한 폐허'라고 부른다. 둘째 부분에서 화자는 표정을 만들던 '얼굴'에 말을 건넨다. 얼굴은 '마음처럼 얇디얇은', '잠시 동안만 피다 지는' 존재이고, 해골은 '자는 일 없이 생각하는 일 없이 슬퍼하는 일 없이' 얼굴과 그 뒤로 뻗은 긴 시간을 '보고' 있다. 셋째 부분에서 손을 풀자 '순식간에 햇빛은 살로 변하여' 해골을 덮고 얼굴이 된다. 화자는 어색하게 눈을 깜박이다가 '서류 속의 숫자에 초점을 맞추기 시작'한다. 비현실적 체험 끝에 일상으로 돌아와 적응하는 장면으로 끝난다.
