  - 'no': '02'
    heading: '''소멸을 선택하는''은 체념이 아니라 주체적 의지다'
    prose: 고난도 선지는 '불에 타서 소멸을 선택하는'을 좌절이나 체념으로 읽게 만든다. 하지만 '스스로' 선택한다는 점에서 이 행위는 타의에 의한 패배가 아니라 주체적 결단이다. 학평 44번도 ⓐ '불에 타서'를 '시적 대상이 선택한 바가 이루어지는 과정에서 나타나는 상황'으로 설명했다. 화자는 그런 존재들에게 화석에 묻히라고 권함으로써 소멸이 곧 영원으로 이어지는 길을 제시한다. 또 '지상의 별들이여'처럼 말을 건네는 어조가 있지만 응답이 없으므로 대화 형식은 아니다. 감정이입이나 색채어 대비 같은 선지도 이 시에는 해당하지 않는다.
    discriminations:
    - title: 변별 포인트 1  |  도치의 위치
      body: '도치는 3연 ''묻혀라 화석에''이다. 정상 어순은 ''화석에 묻혀라''이며, 도치로 ''화석''이 강조된다. 학평 43번 정답: (나)와 (다) 모두 도치로 대상에 주목하는 태도를 드러냄.'
    - title: 변별 포인트 2  |  서술형 단골 두 문장
      body: '① ''쥐라기 지층 어느 하늘 아래''가 비현실적인 이유: 땅속 지층 안에 하늘이 있다는 공간의 재구성. ② ''영원히 죽는 것은 이미 죽음이 아니다''의 의미: 소멸을 통해 영원히 남게 되므로 진정한 소멸이 아니라는 역설.'
    - title: ◇ 작품 혼동 주의
      body: 오세영의 다른 시 「보석」('그것을 불러 보석이라 이름한다' 계열)과 혼동하지 않는다. 기말 범위는 학평에 실린 「보석 1」이다.
    option_checks:
    - statement: 선지 점검  “현실에서 불가능한 상황을 제시하여 영원성에 대한 소망을 드러낸다.”  →  [적절 ○]
      why: 화석 속에서 새가 나는 장면, 지층 속의 하늘 등 비현실적 상상이 쓰였다.
    - statement: 선지 점검  “'소멸을 선택하는' 존재를 통해 삶에 대한 체념을 드러낸다.”  →  [부적절 ×]
      why: '''스스로'' 선택하는 주체적 결단이며 화석 속 영원으로 이어진다. 체념이 아니다.'
    - statement: 선지 점검  “말을 건네는 방식을 통해 대상과 대화를 나누고 있다.”  →  [부적절 ×]
      why: 돈호법으로 부르지만 응답이 없으므로 대화 형식이 아니다.
  - 'no': '03'
    heading: '서술형 대비: 조건에 맞춰 한두 문장으로 쓰는 연습'
    prose: 기말 서답형은 4문항 20점이다. 시 작품에서는 표현 방법의 이름과 그 효과를 한 문장 안에 함께 쓰는 형태가 가장 자주 나온다. 표현 이름만 쓰거나 효과만 쓰면 감점되기 쉬우므로, '○○법을 활용하여 ~을 강조/드러낸다'의 틀을 기본으로 삼는다. 「보석 1」에서는 역설과 도치, 공간의 비현실적 재구성, 눈물과 보석의 대비가 서술형 재료가 된다.
    callouts:
    - label: 모범 답안 틀
      text: '• 역설: ''영원히 죽는 것은 이미 죽음이 아니다''는 역설을 활용하여, 스스로 소멸을 선택한 존재가 화석 속에 영원히 남는다면 그것은 사라짐이 아니라는 인식을 드러낸다.

        • 도치: ''묻혀라 화석에''는 어순을 바꾸어 ''화석''을 강조함으로써 영원히 남는 공간에 주목하는 화자의 태도를 드러낸다.

        • 공간 재구성: ''쥐라기 지층 어느 하늘 아래''는 땅속에 하늘이 있다는 비현실적 공간을 제시하여, 눈물이 보석으로 남기를 바라는 상상을 형상화한다.'
    discriminations:
    - title: 감점 방지  |  빠뜨리기 쉬운 요소
      body: ① 표현 방법의 정확한 이름(역설·도치·대비·돈호법) ② 시구를 그대로 인용 ③ 효과를 '영원성에 대한 소망'과 연결. 세 요소 중 하나라도 빠지면 부분 점수가 된다.
