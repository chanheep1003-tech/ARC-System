- unit_kicker: UNIT 01 · 고전 시가(가사)
  title: 남석하, 「원유가(願遊歌)」 — 풍류·출사·은거가 한 삶 안에서 이어진다
  sections:
  - 'no': '01'
    heading: '작품의 뼈대: 자연 속 풍류 → 출세 포부와 등용 상상 → 공명 후 은거와 무병 소망'
    prose: 「원유가」는 조선 후기 재야 사대부 남석하(호 추담)가 지은 가사이다. 학교 프린트에 실린 부분은 세 덩어리로 읽으면 흐름이 잡힌다. 먼저 화자는 '녹수청산 깊은 데로' 들어가 삼간초당에 머물며 폭포와 복사꽃 흐르는 물을 보고 '무릉도원이 여기 아닌가', '나도 또한 신선이다'라고 말한다. 자연 속 풍류와 만족감이 드러나는 부분이다. 이어 '이 놀음 다한 후에 공명을 기약하고' 서울로 올라가는데, 소년들이 출세가 늦은 이유를 묻자 화자는 이윤·여상(강태공)·급암·노중련의 고사를 들어 자신을 '충신열사 후예'로 규정한다. 그리고 임금이 자신의 노래를 듣고 한림원·의정부로 불러 태평성대를 함께 이루자고 하교하는 장면을 그린다. 마지막으로 공명을 이룬 뒤 범려·소광처럼 미련 없이 벼슬에서 물러나 고향에서 벗들과 술을 나누고, '질병 없이 살아감'을 바라며 끝맺는다. 세 단계는 서로 충돌하지 않는다. 자연 풍류, 충효를 통한 공명, 공명 후 은거가 하나의 이상적인 삶으로 이어진다는 점이 이 작품의 핵심이다.
    callouts:
    - label: 핵심 정리(학교 프린트)
      text: '• 갈래: 가사   • 성격: 서정적, 풍류적, 이상적, 유교적

        • 주제: 자연 속에서 풍류를 즐기고 충효를 실천하여 공명을 이룬 뒤 한가롭게 살아가고자 하는 소망

        • 특징: ① 자연 경관을 감각적으로 묘사하고 ''무릉도원''에 비유 ② ''이윤, 여상, 급암, 노중련'' 등 고사 활용 ③ ''충신열사 후예''라는 자기 인식, 임금에게 등용되는 상황을 상상 ④ 공명 후 물러나 벗들과 풍류를 즐기는 이상적 삶'
    tables:
    - headers:
