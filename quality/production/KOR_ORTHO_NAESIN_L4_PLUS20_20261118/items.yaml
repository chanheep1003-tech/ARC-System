  archetype: A1_GENERAL_RULE_MAPPING
  stem: '[제30항] <보기>의 한글 맞춤법 조항을 바탕으로 탐구한 내용으로 가장 적절한 것은?'
  view:
  - 제30항 사이시옷은 다음과 같은 경우에 받치어 적는다.
  - 순우리말로 된 합성어 또는 순우리말과 한자어로 된 합성어로서 앞말이 모음으로 끝난 경우
  - '  ㉠뒷말의 첫소리가 된소리로 나는 것'
  - '  ㉡뒷말의 첫소리 ''ㄴ, ㅁ'' 앞에서 ''ㄴ'' 소리가 덧나는 것'
  - '  ㉢뒷말의 첫소리 모음 앞에서 ''ㄴㄴ'' 소리가 덧나는 것'
  - 다만, 두 음절로 된 한자어 '곳간, 셋방, 숫자, 찻간, 툇간, 횟수'는 사이시옷을 받치어 적는다.
  options:
  - '''제삿날''은 ㉡에 해당하고, ''양칫물''은 [양친물]로 소리 나므로 ㉢에 해당한다.'
  - '''훗일''은 ㉢에 해당하고, ''예삿일''은 한자어끼리 결합한 말이므로 사이시옷을 적지 않는다.'
  - '''셋방''은 ''다만''의 예외에 해당하고, ''전세방''도 같은 이유로 ''전셋방''으로 적는다.'
  - '''귓병''과 ''콧병''은 순우리말과 한자어의 합성어로 뒷말이 된소리로 나므로 모두 ㉠에 따라 사이시옷을 적는다.'
  - '''뒤뜰''은 뒷말이 이미 된소리라 사이시옷을 적지 않고, ''뒷머리''는 ㉢에 따라 사이시옷을 적는다.'
