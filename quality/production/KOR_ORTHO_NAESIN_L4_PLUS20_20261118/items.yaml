- item_id: KOR-ON4-006
  archetype: A1_GENERAL_RULE_MAPPING
  stem: '[제47항] <보기>의 한글 맞춤법 조항을 바탕으로 탐구한 내용으로 가장 적절한 것은?'
  view:
  - 제47항 보조 용언은 띄어 씀을 원칙으로 하되, 경우에 따라 붙여 씀도 허용한다.
  - 다만, 앞말에 조사가 붙거나 앞말이 합성 용언인 경우, 그리고 중간에 조사가 들어갈 적에는 그 뒤에 오는 보조 용언은 띄어 쓴다.
  - ※ 붙여 쓰기가 허용되는 것은 '-아/-어' 뒤에 연결되는 보조 용언과, 의존 명사에 '-하다'나 '-싶다'가 붙어서 된 보조 용언이다.
  options:
  - '''아는 척하다''는 ''아는척하다''로 붙여 쓸 수 있고, ''비가 올 듯하다''는 ''올듯하다''로 붙여 쓸 수 없다.'
  - '''그릇을 깨뜨려 버렸다''는 ''깨뜨려버렸다''로 붙여 쓸 수 있고, ''덤벼들어 보아라''도 ''덤벼들어보아라''로 붙여 쓸 수 있다.'
  - '''불이 꺼져 간다''는 ''꺼져간다''로 붙여 쓸 수 있고, ''책을 읽어도 보았다''는 ''읽어도보았다''로 붙여 쓸 수 없다.'
  - '''책을 읽고 싶다''는 ''읽고싶다''로 붙여 쓸 수 없고, ''비가 올 성싶다''도 ''올성싶다''로 붙여 쓸 수 없다.'
  - '''책을 읽어는 보았다''는 ''읽어는보았다''로 붙여 쓸 수 있고, ''잘난 체하다''는 ''잘난체하다''로 붙여 쓸 수 있다.'
  answer: 3
