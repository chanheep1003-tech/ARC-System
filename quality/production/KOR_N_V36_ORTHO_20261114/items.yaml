  - <보기 2> ㉠ 곰곰이 생각했다.  ㉡ 손을 깨끗이 씻었다.  ㉢ 그 홀쭉이도 밥은 잘 먹는다.  ㉣ 일찍이 집을 나섰다.  ㉤ 꾸준히 연습했다.
