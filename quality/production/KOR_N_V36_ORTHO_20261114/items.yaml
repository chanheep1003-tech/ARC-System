- item_id: KOR-OR-001
  archetype: A1_GENERAL_RULE_MAPPING
  level: V6
  stem: <보기>의 ㉠~㉢을 바탕으로 단어의 표기를 탐구한 내용으로 적절한 것은?
  view:
  - 한글 맞춤법은 ㉠표준어를 ㉡소리대로 적되, ㉢어법에 맞도록 함을 원칙으로 한다. - 한글 맞춤법 제1항
  options:
  - '''마중''은 동사 ''맞다''와 관련이 있지만 그 원형을 밝히지 않고 ㉡에 따라 적은 말이다.'
  - '''굳이''를 소리 나는 대로 ''구지''로 적지 않은 것은 ㉡을 따른 결과이다.'
  - '''늙은이''는 [늘그니]로 발음되므로 ㉢보다 ㉡을 우선하여 적은 말이다.'
  - '''얼음''과 ''노름''은 모두 ㉢에 따라 어간의 원형을 밝혀 적은 말이다.'
  - '''쓰레기''는 ''쓸-''의 원형을 밝혀 ''쓸에기''로 적어야 ㉢에 맞는다.'
  answer: 1
  second_best: 2
  difficulty: D3
  family: VIEW_APPLICATION
  balance: CORE_EXAM_POINT
  reasoning_steps: 2
  immediate_elimination: 1
  transfer: false
  stem_polarity: POSITIVE
  judgments:
  - axis: orthography
    c: CORRECT
    claim: or01_o2
    ev:
    - VIEW
    - OPTION1
    v: true
    why: '''마중''은 어간에 ''-이, -음'' 이외의 모음 접미사가 붙은 말이어서 원형을 밝히지 않고 소리대로 적는다(제19항 붙임).'
  - axis: orthography
    c: STRONG
    claim: or01_o1
    ev:
    - VIEW
    - OPTION2
    v: false
    why: '''굳-''의 형태를 밝혀 적은 것이므로 ㉢(어법에 맞도록)에 따른 것이다.'
    trap: T1_RIGHT_CONCEPT_WRONG_CASE
  - axis: orthography
    c: MEDIUM
    claim: or01_o3
    ev:
    - VIEW
    - OPTION3
    v: false
    why: '''늙은이''는 ''늙-''의 원형을 밝혀 적은 말로 ㉢에 따른 것이다.'
    trap: T1_RIGHT_CONCEPT_WRONG_CASE
  - axis: orthography
    c: STRONG
    claim: or01_o4
    ev:
    - VIEW
    - OPTION4
    v: false
    why: '''얼음''은 원형을 밝혔지만 ''노름''은 본뜻(놀다)에서 멀어져 소리대로 적는다(제19항 다만).'
    trap: T3_ONE_OF_TWO_WRONG
  - axis: orthography
    c: WEAK
    claim: or01_o5
    ev:
    - VIEW
    - OPTION5
    v: false
    why: '''쓰레기''는 ''-에기''가 붙은 말로 원형을 밝히지 않고 소리대로 적는다(제19항 붙임).'
    trap: T1_RIGHT_CONCEPT_WRONG_CASE
