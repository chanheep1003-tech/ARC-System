    - P2S1
    why: ㄴ도 옳고 ㄷ은 틀리다.
    mis: KM04
  reasoning_steps: 3
  immediate_elimination: 1
  view:
  - <자료> 므리(= 물이), 내(= 내가), 새(= 새가), 불휘(= 뿌리가)
  - ㄱ. '므리'는 '믈'에 주격 조사 '이'가 이어 적기로 결합한 형태이다.
  - ㄴ. '내'는 '나'가 'ㅣ' 이외의 모음으로 끝나 주격 조사 'ㅣ'가 결합한 형태이다.
