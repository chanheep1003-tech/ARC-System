  stem: 윗글을 바탕으로 <보기>의 ㄱ~ㄹ에 대해 판단한 내용으로 옳은 것만을 있는 대로 고른 것은?
  options:
  - ㄱ, ㄴ
  - ㄱ, ㄴ, ㄹ
  - ㄴ, ㄷ, ㄹ
  - ㄱ, ㄷ
  - ㄱ, ㄷ, ㄹ
  answer: 2
  second_best: 3
  judgments:
  - v: false
    c: STRONG
    axis: application
    claim: o1
    ev:
    - P1S1
    - P2S1
    why: ㄹ도 옳다.
    mis: KM09
  - v: true
    c: CORRECT
    axis: application
    claim: o2
    ev:
    - P1S1
    - P2S1
    why: ㄱ, ㄴ, ㄹ이 옳다.
  - v: false
    c: STRONG
    axis: application
    claim: o3
    ev:
    - P1S1
    - P2S1
    why: ㄷ은 '새'가 'ㅣ' 모음으로 끝나 영형태가 쓰였으므로 틀리다.
    mis: KM15
  - v: false
    c: MEDIUM
    axis: application
    claim: o4
    ev:
    - P1S1
    - P2S1
    why: ㄴ과 ㄹ이 옳다.
