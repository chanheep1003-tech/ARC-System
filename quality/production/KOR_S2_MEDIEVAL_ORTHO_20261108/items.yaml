  - 띄어쓰기를 하지 않아 단어의 경계를 글자 사이의 간격으로 구별하였다.
  - 체언에 조사가 붙을 때에도 모음 조화가 잘 지켜졌다.
  - 이어 적기가 일반적으로 쓰이다가 후에 끊어 적기와 함께 쓰이기도 하였다.
