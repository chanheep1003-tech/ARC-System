  reasoning_steps: 3
  immediate_elimination: 1
  table:
    header:
    - 구분
    - 중세 국어 → 현대 국어
    - 분석
    - 변화 설명
    rows:
    - - ㉠
      - 노미 → 놈이
      - 놈 + 이
      - 이어 적기가 끊어 적기로 바뀌었다.
    - - ㉡
      - 므리 → 물이
      - 믈 + 이
      - 이어 적기가 끊어 적기로 바뀌고, 'ㅁ' 뒤에서 'ㅡ'가 'ㅜ'로 바뀌었다.
    - - ㉢
      - 내 → 내가
      - 나 + ㅣ
