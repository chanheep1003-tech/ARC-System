  - no: '07'
    heading: 금융 자산과 자산 관리의 원칙
    blocks:
      - type: contrast
        left_title: 실물 자산 (81쪽)
        left_body: 토지, 건물, 기계처럼 형태가 있는 자산
        right_title: 금융 자산 (81쪽)
        right_body: 현금, 예금, 채권, 주식, 펀드, 보험, 연금 등
      - type: table
        caption: 대표 금융 자산 (81쪽)
        headers: [자산, 뜻, 얻는 수익]
        weights: [0.8, 2.6, 1.5]
        rows:
          - ['요구불 예금', '필요하면 수시로 입출금 가능', '이자 (낮음)']
          - ['저축성 예금', '일정 기간 맡기면 약속된 이자. 정기 예금(한꺼번에), 정기 적금(매달)', '이자 (요구불보다 높음)']
          - ['채권', '정부·기업·은행 등이 정해진 시점에 이자와 원금을 주기로 약속하고 돈을 빌린 증서. 금액·이자율·만기일을 정함', '이자 + 시세 차익']
          - ['주식', '주식회사가 자금을 조달하려고 투자자에게 돈을 받고 발행한 증서. 보유자는 주주가 되어 경영 의사 결정에 참여', '배당금 + 시세 차익']
          - ['펀드', '전문 기관이 모은 자금을 주식·채권 등에 투자하는 간접 투자', '투자 수익 (원금 손실 위험)']
          - ['보험·연금', '보험: 사고에 대비해 보험료를 내고 보험금을 받음 / 연금: 노후 대비 적립(국민·퇴직·개인 연금)', '보험은 수익보다 손실 방지']
      - type: callout
        style: key
        label: 자산 관리의 세 원칙 (82쪽)
        text: |-
          · 수익성: 가격 상승이나 이자 수익을 기대할 수 있는 정도 → 대체로 주식 > 채권 > 예금
          · 유동성(환금성): 필요할 때 쉽게 현금으로 바꿀 수 있는 정도 → 예금이 높고, 주식·채권은 상대적으로 낮음
          · 안전성: 가치가 손실 없이 보전되는 정도 → 예금 > 채권 > 주식
          · 수익성과 안전성은 상충 관계: 고수익 상품은 고위험, 저위험 상품은 저수익
          · 세 원칙을 모두 갖춘 자산은 찾기 어렵고 한 곳에만 투자하면 위험 → 여러 자산에 나누어 담는 포트폴리오(분산 투자)
      - type: callout
        label: 금리 변화와 선택 (83쪽 탐구)
        text: |-
          · "달걀을 한 바구니에 담지 말라" → 분산 투자, 경제 상황에 따라 포트폴리오를 주기적으로 조정
          · 금리 상승 → 예금 이자가 유리해져 예금 선호
          · 금리 하락 → 예금 이자가 줄어 상대적으로 수익성이 높은 채권·주식 선호
      - type: disc
        title: '함정 — 주식 vs 채권'
        body: 주식 보유자는 회사의 '주인(주주)'이 되어 배당금을 받고 경영에 참여한다. 채권 보유자는 돈을 빌려준 '채권자'로 이자와 원금을 받는다. "채권을 보유하면 기업의 경영 의사 결정에 참여할 수 있다" → ×. "주식은 예금보다 안전성이 높다" → ×

  - no: '08'
    heading: 선지 분석 — 시장경제와 금융
    blocks:
      - type: checks
        items:
          - statement: '① 자본주의는 사유 재산권을 법적으로 보장한다. → ○'
            why: 교과서 65쪽.
          - statement: '② 애덤 스미스는 국가가 시장에 적극적으로 개입해야 한다고 주장했다. → ×'
            why: '[사상가 바꿔치기] 자유방임주의, 작은 정부. 적극 개입은 케인스.'
          - statement: '③ 수정 자본주의는 1929년 대공황을 계기로 등장했다. → ○'
            why: 교과서 67쪽.
          - statement: '④ 신자유주의는 민영화·규제 완화·자유 무역을 지향한다. → ○'
            why: 교과서 67쪽. 빈부 격차 심화 비판도 함께 기억.
          - statement: '⑤ 계획경제 체제에서는 생산 수단을 주로 개인이 소유한다. → ×'
            why: '[체제 바꿔치기] 정부가 대부분 소유.'
          - statement: '⑥ 우리나라는 시장경제를 기본으로 하면서 필요할 때 정부가 개입하는 혼합 경제 체제이다. → ○'
            why: 헌법 제119조.
          - statement: '⑦ 기회비용은 명시적 비용과 암묵적 비용을 합한 것이다. → ○'
            why: 교과서 73쪽.
          - statement: '⑧ 합리적 선택을 할 때는 매몰 비용을 반드시 고려해야 한다. → ×'
            why: '[원칙 뒤집기] 매몰 비용은 고려하지 않는다.'
          - statement: '⑨ 공공재는 무임승차자 문제 때문에 시장에서 과소 공급된다. → ○'
            why: 교과서 74쪽.
          - statement: '⑩ 부정적 외부 효과가 발생하면 해당 재화는 사회적 적정 수준보다 과소 생산된다. → ×'
            why: '[방향 뒤집기] 과다 생산. 과소 생산은 긍정적 외부 효과.'
          - statement: '⑪ 누진세는 소득이 커질수록 높은 세율을 적용하는 소득 재분배 정책이다. → ○'
            why: 교과서 76쪽.
          - statement: '⑫ 단체 교섭권은 파업 등 쟁의 행위를 할 수 있는 권리이다. → ×'
            why: '[권리 바꿔치기] 쟁의 행위는 단체 행동권.'
          - statement: '⑬ 소비자 주권이란 소비자의 선택이 생산을 결정하는 권한을 말한다. → ○'
            why: 교과서 78쪽.
          - statement: '⑭ 주식은 예금보다 수익성은 높지만 안전성은 낮다. → ○'
            why: 수익성과 안전성의 상충 관계(82쪽).
          - statement: '⑮ 유동성은 금융 자산의 가치가 손실 없이 보전되는 정도이다. → ×'
            why: '[원칙 바꿔치기] 안전성의 설명. 유동성은 현금으로 바꾸기 쉬운 정도.'
          - statement: '⑯ 금리가 상승하면 일반적으로 예금보다 주식을 더 선호하게 된다. → ×'
            why: '[방향 뒤집기] 금리 상승 시 예금 선호, 하락 시 채권·주식 선호.'

