          - ['단체 교섭권', '노동조합이 근로 조건에 관해 사용자와 집단적으로 교섭할 수 있는 권리']
          - ['단체 행동권', '교섭이 원만하지 않을 때 파업 등 쟁의 행위를 할 수 있는 권리']
      - type: disc
