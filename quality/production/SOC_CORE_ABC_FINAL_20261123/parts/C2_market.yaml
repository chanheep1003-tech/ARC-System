unit_kicker: C파트 · CORE 06 · 교과서 64~83쪽
title: 자본주의와 시장경제, 합리적 선택과 경제 주체, 금융 자산
sections:
  - no: '01'
    heading: 자본주의의 의미와 특징
    blocks:
      - type: prose
        text: 교과서는 품절 대란이 났던 빵 이야기로 시작한다(64쪽). 빵을 얼마나 만들고 얼마에 팔지는 누가 정할까? 정부가 아니라 소비자의 선택과 기업의 판단이 시장에서 만나 결정된다. 이것이 우리가 사는 자본주의의 모습이다.
      - type: callout
        style: key
        label: 자본주의 (65쪽)
        text: |-
          · 뜻: 사유 재산 제도를 바탕으로 자원의 효율적인 배분을 추구하는 경제 원리
          · 특징 ①: 개인과 기업에 경제 활동의 자유를 최대한 보장한다 → 시장 경쟁 속에서 이익을 자유롭게 추구
          · 특징 ②: 사유 재산권을 법적으로 보장한다 → 자본 축적과 투자로 사회 전체의 부 증가
          · 특징 ③: 시장에서 결정된 가격에 따라 거래가 이루어진다.
          · 사유 재산 제도: 특히 토지·공장·기계 같은 생산 수단을 소유하고 처분할 권리를 법으로 보장
      - type: callout
        label: 베버 — 프로테스탄트 윤리와 자본주의 정신 (65쪽)
        text: 부의 축적을 죄악시한 당시 로마 가톨릭과 달리, 프로테스탄트(개신교)는 성실한 노동과 근검절약으로 재산을 모으는 것을 종교적 소명으로 여겼다. 베버는 이 윤리가 직업 활동을 도덕적 행위로 인식하게 하고 이윤 추구를 윤리적으로 정당화하여 자본주의 발전의 토대가 되었다고 보았다.

  - no: '02'
    heading: 자본주의의 역사적 전개 — 정부의 역할이 커졌다 작아졌다
    blocks:
      - type: prose
        text: 자본주의는 상업 자본주의 → 산업 자본주의 → 수정 자본주의 → 신자유주의 순으로 전개되었다(66~67쪽). 각 단계는 앞 단계의 문제를 해결하려는 과정에서 나타났다. 정부의 역할이 '작은 정부 → 큰 정부 → 다시 작은 정부'로 바뀐 흐름을 잡으면 순서와 사상가를 함께 기억할 수 있다.
      - type: table
        caption: 자본주의 전개 4단계 (66~67쪽)
        headers: [단계, 배경, 핵심 내용, 정부]
        weights: [1.0, 1.5, 2.2, 0.8]
        rows:
          - ['상업 자본주의 (16~18세기)', '신항로 개척, 절대 왕정', '중상주의 정책. 상품 유통·무역으로 이윤 추구, 식민지 개척. 축적된 자본이 산업 자본주의의 밑거름', '국가 보호·개입 (중상주의)']
          - ['산업 자본주의 (18~19세기)', '영국 산업 혁명, 대량 생산', '생산 과정에서 이윤. 애덤 스미스: 시장 가격 기능 = 보이지 않는 손, 자유방임주의', '작은 정부']
          - ['수정 자본주의 (20세기)', '독점 기업 출현 → 시장 실패, 1929년 대공황', '케인스: 국가가 적극 개입해 시장 실패 해결. 공공사업·복지 정책(뉴딜 정책)', '큰 정부']
          - ['신자유주의 (20세기 말)', '1970년대 석유 파동 → 스태그플레이션, 정부 실패', '하이에크: 지나친 개입 비판, 민간의 자유. 민영화·규제 완화·자유 무역(레이건·대처). 효율성은 높이지만 빈부 격차 심화 비판', '작은 정부']
      - type: callout
        label: 경제학자의 말로 구별하기 (68쪽)
        text: |-
          · 애덤 스미스: "개인은 자신의 사적 이익을 추구하는 과정에서 사회적 공익을 효과적으로 증진하는 경우가 많다." (『국부론』)
          · 케인스: "민간 투자의 부족을 보충하기 위해 정부가 끼어들지 못할 이유가 없다. 정부가 일자리를 창출하고 구매력을 늘려야 경제가 살아난다."
          · 하이에크: "누구든 자유롭게 생산하고, 팔릴 수 있는 어떤 것도 생산하여 팔고 살 수 있어야 한다." (『노예의 길』)
          · 마르크스(66쪽): 산업 자본주의의 빈부 격차를 비판하며 사회주의 주장. 생산 수단의 사적 소유 폐지, 공동 생산과 공동 분배
      - type: callout
        label: '심화 · 고2 경제 — 용어 정확히'
        text: |-
          · 시장 실패: 시장에 맡겼더니 자원이 효율적으로 배분되지 못하는 현상 → 정부 개입의 근거(수정 자본주의)
          · 정부 실패: 정부가 개입했더니 오히려 비효율이 생기는 현상 → 시장 자유 회복의 근거(신자유주의)
          · 스태그플레이션: 경기 불황(스태그네이션)과 물가 상승(인플레이션)이 동시에 나타나는 현상
          · 민영화: 국가가 운영하던 공공 기관·공기업을 민간이 운영하도록 하는 것
      - type: disc
        title: 최다 빈출 함정
        body: |-
          · "하이에크는 수정 자본주의를 주장했다" → × (신자유주의. 교과서 96쪽 퀴즈)
          · "케인스는 시장의 자율 조정을 강조하며 정부 개입을 반대했다" → × (적극적 개입 주장)
          · "대공황은 신자유주의 등장의 배경이다" → × (수정 자본주의의 배경. 신자유주의의 배경은 석유 파동과 스태그플레이션)

  - no: '03'
    heading: 경제 체제 — 시장경제, 계획경제, 그리고 혼합 경제
    blocks:
      - type: prose
        text: 어느 사회나 자원의 희소성 때문에 '무엇을 얼마나, 어떻게 생산하고, 누구에게 분배할 것인가'라는 기본적인 경제 문제에 부딪힌다(69쪽). 경제 체제는 이 문제를 해결하는 방식에 따라 나뉜다.
      - type: table
        caption: 시장경제 체제 vs 계획경제 체제 (70쪽)
        headers: [구분, 시장경제 체제, 계획경제 체제]
        weights: [1.0, 1.8, 1.8]
        rows:
          - ['생산 수단의 소유', '개인', '정부']
          - ['경제 문제 해결 방식', '시장의 원리 (가격은 수요와 공급으로 결정)', '정부의 계획과 통제']
          - ['의사 결정 주체', '개별 경제 주체 (가계·기업)', '정부']
          - ['장점', '자원의 효율적 배분, 자유로운 이익 추구와 창의성 발휘', '정책 목표의 효과적 달성, 분배의 평등 추구']
          - ['단점', '빈부 격차, 환경 오염 등 사회 문제 (예: 1952년 런던 스모그)', '개인의 자유로운 선택 제한, 다양한 욕구 반영 곤란, 경제 활동 유인·창의성 부족 → 효율성 감소 (예: 소련의 5개년 계획과 강제 징발)']
      - type: callout
        style: key
        label: 혼합 경제 체제 (71쪽)
        text: |-
          · 현실에서 완벽한 시장경제나 계획경제를 채택한 나라는 없다. 많은 국가가 두 체제의 요소를 결합한 혼합 경제 체제를 택한다.
          · 우리나라: 시장경제 체제를 기반으로 하면서 필요한 경우 정부가 개입
          · 헌법 제119조 ① 경제상의 자유와 창의 존중이 기본 → 시장경제 / ② 균형 있는 성장, 적정한 소득 분배, 시장 지배와 경제력 남용 방지, 경제 민주화를 위한 규제와 조정 → 정부 개입
          · 정부의 역할: 공정 경쟁의 규칙과 제도, 공공재 생산, 조세·사회 보장 제도로 소득 분배 개선
          · 단, 개입이 지나치면 비효율이 생기므로 시장과 정부가 상호 보완하며 균형을 이루어야 한다.
      - type: callout
        label: 탐구 — 수해로 농산물이 부족할 때 (71쪽)
        text: |-
          · 가격이 올라 소비자가 적게 산다 → 시장경제 체제
          · 정부가 배급량을 줄인다 → 계획경제 체제
          · 정부가 보조금으로 가격을 안정시킨다 → 혼합 경제 체제

  - no: '04'
    heading: 합리적 선택 — 기회비용과 매몰 비용
    blocks:
      - type: callout
        style: key
        label: 합리적 선택의 구조 (73쪽)
        text: |-
          · 선택이 필요한 이유: 사람의 욕구에 비해 자원이 상대적으로 부족한 자원의 희소성
          · 합리적 선택: 최소한의 비용으로 최대의 편익을 얻는 선택
          · 편익: 선택으로 얻는 이익. 금전적 이익뿐 아니라 만족감 같은 비금전적 이익도 포함
          · 기회비용 = 명시적 비용(직접 지출한 비용) + 암묵적 비용(포기한 다른 대안의 가치)
          · 매몰 비용: 이미 지출해 회수할 수 없는 비용 → 합리적 선택에서는 고려하지 않는다.
      - type: table
        caption: 교과서 예시 — 예린이의 공연 관람 기회비용 (73쪽)
        headers: [항목, 금액, 구분]
        weights: [1.6, 1.0, 1.6]
        rows:
          - ['공연 관람비 + 교통비', '20만 원', '명시적 비용']
          - ['포기한 하루 임금', '10만 원', '암묵적 비용']
          - ['기회비용', '30만 원', '공연의 편익이 30만 원보다 크면 관람이 합리적']
      - type: callout
        label: '심화 · 고2 경제 — 기회비용 계산 3단계'
        text: |-
          1단계: 이 선택 때문에 실제로 지출하는 돈(명시적 비용)을 모두 더한다.
          2단계: 포기한 대안들 중 가장 가치가 큰 '하나'의 순편익을 암묵적 비용으로 잡는다. 포기한 대안을 모두 더하지 않는다.
          3단계: 이미 써 버려 돌려받을 수 없는 돈(매몰 비용)은 빼고 계산한다.
          예) 환불 불가 영화표 1만 원을 산 뒤 더 재미있는 약속이 생겼다 → 1만 원은 매몰 비용이므로, 남은 선택의 편익만 비교한다.
      - type: disc
        title: '헷갈림 주의 — 매몰 비용의 함정'
        body: '"창업에 들어간 돈이 아까우니 손실이 나도 사업을 계속한다"는 매몰 비용을 고려한 비합리적 선택이다(73쪽). 또 "기회비용은 명시적 비용만 포함한다" → ×'

  - no: '05'
    heading: 합리적 선택의 한계 — 시장 실패
    blocks:
      - type: prose
        text: 각 경제 주체가 합리적으로 선택해도 사회 전체로는 비효율적인 결과가 나올 수 있다. 자원이 비효율적으로 배분되는 이 현상을 시장 실패라고 한다(74쪽).
      - type: table
        caption: 시장 실패의 원인과 정부의 대응 (74·76쪽)
        headers: [원인, 무엇이 문제인가, 정부의 대응]
        weights: [1.0, 2.3, 1.9]
        rows:
          - ['독과점', '하나 또는 소수 기업이 시장을 지배 → 공급량을 줄이고 가격을 올려 이윤 극대화', '독점 규제 및 공정 거래에 관한 법률, 공정 거래 위원회 규제']
          - ['담합', '판매자끼리 가격·생산량·거래 조건을 제한하는 불공정 행위 → 소비자 피해 (예: 아이스크림 업체 가격 담합, 과징금 1천억 원대)', '공정 거래 위원회 적발·제재']
          - ['공공재', '비용을 내지 않은 사람의 소비를 막을 수 없고, 한 사람의 소비가 다른 사람의 소비를 제한하지 않음 → 무임승차 때문에 시장에서 필요한 만큼 공급되지 않음', '정부가 국방·치안·공원·도서관 등 공급']
          - ['외부 효과', '의도하지 않은 이득이나 손해를 주면서 보상이 없음 → 바람직한 것은 과소 공급, 바람직하지 않은 것은 과다 공급', '부정적 외부 효과에는 세금·벌금, 긍정적 외부 효과에는 세금 감면·보조금']
      - type: contrast
        left_title: 부정적 외부 효과 (외부 불경제)
        left_body: 다른 사람에게 손해를 끼치지만 보상하지 않는다. 예) 공장 매연, 환경 오염 → 사회적으로 바람직한 수준보다 과다 생산
        right_title: 긍정적 외부 효과 (외부 경제)
        right_body: 다른 사람에게 혜택을 주지만 대가를 받지 않는다. 예) 신기술 개발, 과수원 옆 양봉 → 사회적으로 바람직한 수준보다 과소 생산
      - type: callout
        label: '심화 · 고2 경제 — 공공재와 공유 자원'
        text: |-
          · 공공재: 비배제성(돈 안 낸 사람을 막을 수 없음) + 비경합성(내가 써도 남의 몫이 줄지 않음) 예) 국방, 치안
          · 공유 자원: 비배제성은 있지만 경합성이 있다(내가 쓰면 남의 몫이 줄어든다). 예) 바다의 물고기, 공유 목초지 → A파트 2장의 '공유지의 비극'이 일어나는 자원이다.
      - type: disc
        title: '함정 — 외부 효과의 "방향"'
        body: "\"긍정적 외부 효과가 발생하면 정부는 세금을 부과한다\" → ×. 긍정적 외부 효과는 장려해야 하므로 세금 감면·보조금을, 부정적 외부 효과는 억제해야 하므로 세금·벌금을 쓴다. 또 \"공공재를 시장에 맡기면 사회적으로 필요한 만큼 공급된다\" → × (교과서 96쪽 퀴즈)"

  - no: '06'
    heading: 지속가능발전을 위한 경제 주체의 역할과 책임
    blocks:
      - type: callout
        style: key
        label: 지속가능발전 (75쪽)
        text: |-
          · 미래 세대가 자신들의 필요를 충족할 능력을 저해하지 않으면서 현재 세대의 필요를 충족하는 발전
          · 각 경제 주체가 사적 이익과 효율성만 추구하면 빈부 격차·환경 오염·자원 고갈이 생기므로, 자신의 선택이 사회 전체에 미치는 영향을 고려해야 한다.
          · 1992년 UN 환경 개발 회의에서 기본 규범으로 채택, 2012년 '지속가능한 생산과 소비'로 확장, 2015년 17개 목표, 우리나라는 국가 지속가능발전 목표(K-SDGs) 수립
      - type: table
        caption: 경제 주체별 역할과 책임 (76~78쪽)
        headers: [주체, 역할과 책임]
        weights: [0.8, 3.6]
        rows:
          - ['정부', '경제 활동 제도 확립, 시장 기능 지원, 문제 발생 시 조정자로 개입 / 독과점·담합 규제 / 공공재 공급 / 외부 효과 교정(세금·벌금, 감면·보조금) / 사회 보장 제도와 누진세(소득이 많을수록 높은 세율)로 소득 재분배']
          - ['기업', '생산 요소(노동·자본·토지)를 공급받고 임금·이자·지대 지급, 재화·서비스 공급과 일자리 창출 / 기업가 정신: 위험과 불확실성을 감수하고 혁신 / 기업의 사회적 책임: 환경 보호, 소비자 안전, 노동자 권리 존중, 기업 윤리(예: 돌고래 안전 라벨)']
          - ['노동자', '노동을 제공하고 임금으로 생활, 경제 성장에 기여 / 근로의 권리와 노동 삼권을 헌법이 보장 / 근로 기준법·최저 임금제 / 근로 계약에 따른 성실한 업무, 전문성 개발, 사용자와 협력']
          - ['소비자', '소비자 주권: 소비자의 선택이 생산을 결정하는 권한 / 권리를 지킬 지식·정보 습득 / 합리적 소비 + 윤리적 소비(공정 무역 상품, 친환경 상품, 로컬 푸드, 불공정 기업 불매)']
      - type: table
