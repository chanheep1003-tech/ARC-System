unit_kicker: C파트 · CORE 05 · 교과서 25~26쪽
title: 국내 인권 문제 — 사회적 소수자 차별과 청소년 노동권
sections:
  - no: '01'
    heading: 사회적 소수자 차별 — 누가, 왜, 어떻게 차별받는가
    blocks:
      - type: callout
        style: key
        label: 사회적 소수자 (25쪽)
        text: |-
          · 뜻: 신체적·문화적 특징 때문에 다른 집단과 구별되고 차별받으며, 자신이 차별받는 집단에 속한다는 의식을 가진 사람
          · 핵심 요소 세 가지: 식별 가능성(구별되는 특징), 차별의 경험, 집단 소속 의식
          · 차별 이유: 성별, 연령, 인종, 국적, 장애 등
          · A파트 2장(52쪽)과 연결: 사회적 소수자는 사회적 약자의 '일부'다.
      - type: table
        caption: 차별의 모습 (25쪽)
        headers: [대상, 차별의 예]
        weights: [1.0, 3.4]
        rows:
          - ['성별·연령', '성별에 따라 특정한 사회적 역할을 요구, 나이를 이유로 한 부당한 대우(예: 60세 미만만 지원 가능한 채용 공고, 24쪽)']
          - ['외국인', '문화적 차이에 따른 불편, 차별적인 노동 조건으로 노동권 침해']
          - ['장애인', '이동권 제약, 교육·취업에서의 차별']
      - type: steps
        label: 해결 방안 — 세 차원 (25쪽)
        items:
          - title: 개인적 차원
            body: 사회적 소수자의 입장을 이해하고 다양성을 존중하는 태도를 기른다.
          - title: 사회적 차원
            body: 지속적인 인권 교육과 의식 개선 활동
          - title: 법적·제도적 차원
            body: 차별 금지 법률 제정, 다양한 지원 제도와 정책 시행
      - type: table
        caption: 사회적 소수자 관련 법률 (25쪽)
        headers: [법률, 목적]
        weights: [1.6, 2.8]
        rows:
          - ['양성평등 기본법', '국가와 지방 자치 단체의 책무 등을 규정해 정치·경제·사회·문화 모든 영역에서 양성평등 실현']
          - ['다문화 가족 지원법', '다문화 가족 구성원의 삶의 질 향상과 사회 통합']
          - ['장애인 차별 금지 및 권리 구제 등에 관한 법률', '장애인의 완전한 사회 참여와 평등권 실현, 인간으로서의 존엄과 가치 구현']
      - type: callout
        label: 교과서 사례 — 외국인 근로자의 인권 침해와 권리 구제 (25쪽)
        text: |-
          · 침해: 깻잎 농장의 외국인 근로자가 하루 할당량에 모자라면 임금을 공제한다는 동의서에 강제로 서명, 계약상 휴식 3시간이 실제로는 1시간. 외국인 근로자의 30.8%가 임금 체불·장시간 노동 호소
          · 구제 경로: 사업장 내 고충 처리 기관 상담, 고용 노동부 진정, 노동 위원회 구제 신청, 국가 인권 위원회 진정, 사법 기관의 재판, 대한 법률 구조 공단 지원
      - type: disc
        title: '헷갈림 주의 — 사회적 소수자는 "수가 적은" 사람인가?'
        body: 사회적 소수자를 가르는 기준은 숫자가 아니라 차별 경험과 소속 의식이다. 수가 많아도 차별받는 집단이라면 사회적 소수자가 될 수 있다. "사회적 소수자는 인구수가 적은 집단만을 의미한다" → ×

  - no: '02'
    heading: 청소년 노동권 — 성인과 같은 권리, 그리고 더 강한 보호
    blocks:
      - type: callout
        style: key
        label: 청소년 노동권의 핵심 (26쪽)
        text: |-
          · 노동 경험의 의미: 삶의 의미와 보람, 소득의 가치를 이해
          · 청소년의 노동권은 성인이 보장받는 노동 조건에 대한 권리와 '동일하게' 보장된다.
          · 동시에 성인보다 '강한' 보호를 받는다: 위험하거나 유해한 일 금지, 노동 시간 제한
          · 권리를 보장받으려면 〈근로 기준법〉에 따라 근로 계약서를 쓰고 일해야 한다.
          · 근로 계약서: 임금·근로 시간·근로 조건 등을 명시해야 한다.
      - type: table
        caption: 〈근로 기준법〉 핵심 조항 (26쪽 탐구)
        headers: [조항, 내용]
        weights: [1.1, 3.3]
        rows:
          - ['제43조 임금 지급', '임금은 통화로 직접 근로자에게 그 전액을 지급해야 한다.']
          - ['제54조 휴게', '근로 시간 4시간이면 30분 이상, 8시간이면 1시간 이상의 휴게 시간을 근로 시간 도중에 준다.']
          - ['제66조 연소자 증명서', '18세 미만은 연령 증명서(가족 관계 기록 사항 증명서)와 친권자·후견인 동의서를 사업장에 갖춘다.']
          - ['제69조 근로 시간', '15세 이상 18세 미만은 1일 7시간, 1주 35시간 초과 금지. 합의하면 1일 1시간, 1주 5시간까지 연장 가능']
      - type: steps
        label: 탐구 — 17세 유정이의 근로 계약서에서 잘못 찾기 (26쪽)
        items:
          - title: '근로 시간 — 9시~19시 (휴게 1시간 포함)'
            body: 실제 근로 9시간 → 18세 미만 한도(1일 7시간, 합의 시 최대 8시간)를 넘는다. 위반
          - title: '임금 — 50%는 최저 시급, 50%는 카페 이용권'
            body: 임금은 '통화'로 '전액' 지급해야 한다(제43조). 이용권 지급은 위반. 또 최저 임금보다 적게 받는 셈이 된다.
          - title: '휴게 1시간'
            body: 8시간 이상 근로라면 1시간 이상 휴게는 맞지만, 근로 시간 자체가 한도를 넘었으므로 근로 시간을 고쳐야 한다.
      - type: callout
        label: 침해되었을 때 (26쪽)
        text: |-
          · 사용자: 노동자의 권리를 인식하고 관련 규정 준수
          · 국가: 청소년 노동권 보장을 위한 제도적 지원
          · 청소년 스스로: 자신의 노동권을 정확히 알고, 침해되면 고용 노동부, 중앙 노동 위원회(노사 간 분쟁을 판정·조정하는 행정 기관), 대한 법률 구조 공단 등에 문의해 적극 대응
      - type: disc
        title: '함정 — "청소년은 성인보다 노동권 보장 범위가 좁다"'
        body: ×. 성인과 동일한 권리를 보장받고 여기에 더해 더 강한 보호를 받는다. 또 "근로 계약서는 성인만 작성한다"도 ×. 청소년도 반드시 근로 계약서를 써야 한다.

  - no: '03'
    heading: 선지 분석 — 사회적 소수자와 청소년 노동권
    blocks:
      - type: checks
        items:
          - statement: '① 사회적 소수자는 자신이 차별받는 집단에 속한다는 의식을 가진다. → ○'
            why: 교과서 25쪽.
          - statement: '② 사회적 소수자 차별은 사회 통합을 저해할 수 있다. → ○'
            why: 인간 존엄성을 훼손하고 갈등을 유발한다(25쪽).
          - statement: '③ 다문화 가족 지원법은 장애인의 사회 참여와 평등권 실현을 목적으로 한다. → ×'
            why: '[법률 바꿔치기] 장애인 차별 금지 및 권리 구제 등에 관한 법률의 목적.'
          - statement: '④ 사회적 소수자 차별 해결에는 법적·제도적 장치만 필요하고 개인의 노력은 필요 없다. → ×'
            why: '[한쪽만 강조] 개인적·사회적·제도적 차원의 노력이 함께 필요하다.'
          - statement: '⑤ 청소년은 위험하거나 유해한 일을 할 수 없다. → ○'
            why: 교과서 26쪽. 성인보다 강한 보호.
          - statement: '⑥ 17세 근로자는 당사자 합의가 있으면 하루 10시간까지 일할 수 있다. → ×'
            why: '[수치 함정] 1일 7시간 + 합의 시 1시간 연장 = 최대 8시간.'
          - statement: '⑦ 임금의 일부를 상품권이나 이용권으로 지급할 수 있다. → ×'
            why: '[조항 위반] 임금은 통화로 직접 전액 지급(제43조).'
          - statement: '⑧ 근로 시간이 4시간이면 30분 이상의 휴게 시간을 주어야 한다. → ○'
            why: 제54조.
          - statement: '⑨ 외국인 근로자는 국가 인권 위원회에 진정할 수 없다. → ×'
            why: '[구제 경로 누락] 교과서가 제시한 구제 경로에 국가 인권 위원회 진정이 포함된다.'
