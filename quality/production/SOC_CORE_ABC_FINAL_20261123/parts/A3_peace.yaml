unit_kicker: A파트 · CORE 03 · 교과서 108~123쪽
title: 평화와 국제 사회, 남북 분단과 동아시아 역사 갈등
sections:
  - no: '01'
    heading: 평화란 무엇인가 — 소극적 평화와 적극적 평화
    blocks:
      - type: prose
        text: 교과서는 콜롬비아 내전으로 고향을 떠나 난민이 된 마리아의 이야기로 시작한다(108쪽). 총성이 멈추었다고 해서 마리아가 평화를 되찾은 것일까? 이 질문에 답하는 개념이 소극적 평화와 적극적 평화다.
      - type: contrast
        left_title: 소극적 평화 (109쪽)
        left_body: '범죄·테러·전쟁 같은 직접적·물리적 폭력이 없는 상태. 인류가 생존 위협에서 벗어나 안전하게 살 수 있는 환경을 만든다. 그러나 이것만으로는 진정한 평화가 아니다.'
        right_title: 적극적 평화 (109쪽)
        right_body: '직접적 폭력뿐 아니라 구조적 폭력(빈곤·정치적 억압·경제적 착취)과 문화적 폭력(종교·사상·언어·예술 영역의 폭력)까지 제거된 상태. 인간답게 살아갈 수 있게 해 준다.'
      - type: callout
        style: key
        label: 갈퉁 — 현대 평화학의 창시자 (109쪽)
        text: |-
          · 폭력은 직접적·물리적 행위만이 아니라 비의도적이고 간접적인 구조와 문화의 요소를 포함한다.
          · 따라서 소극적 평화를 넘어 구조적·문화적 폭력까지 사라진 적극적 평화를 추구해야 한다.
          · "목적이 수단을 정당화할 수 없듯이, 평화는 평화적 수단으로만 이루어져야 한다."
      - type: table
        caption: '심화 · 고3 윤리와 사상 — 갈퉁의 세 가지 폭력'
        headers: [폭력, 특징, 예]
        weights: [0.9, 2.0, 1.6]
        rows:
          - ['직접적 폭력', '가해자가 분명하고 눈에 보인다', '전쟁, 테러, 범죄, 폭행']
          - ['구조적 폭력', '사회 구조에서 생겨 가해자가 분명하지 않고 간접적이다', '빈곤, 정치적 억압, 경제적 착취, 차별적 제도']
          - ['문화적 폭력', '종교·사상·언어·예술이 다른 폭력을 정당화하거나 당연하게 여기게 만든다', '특정 집단을 열등하게 그리는 표현, 혐오를 부추기는 이념']
      - type: callout
        label: 교과서 보충 자료
        text: |-
          · 피카소 〈게르니카〉(1937): 에스파냐 내전의 참상을 알리기 위해 그렸다.
          · 손무(『손자병법』): "싸우지 않고 적을 굴복시키는 것이 최상이다." 갈퉁은 손무를 평화학의 창시자라고 불렀다.
      - type: disc
        title: '헷갈림 주의 — "전쟁이 없으면 평화로운 사회다"'
        body: 전쟁이 없는 것은 소극적 평화일 뿐이다. 빈곤이나 정치적 억압 같은 구조적 폭력이 남아 있다면 적극적 평화는 실현되지 않았다. "소극적 평화가 실현되면 진정한 평화가 실현된다" → ×

  - no: '02'
    heading: 국제 사회의 갈등과 협력 — 분쟁은 왜 일어나고, 어떻게 풀리나
    blocks:
      - type: prose
        text: 오늘날 국제 사회에서는 자원, 영토, 민족, 인종, 종교 등 다양한 원인이 복잡하게 얽혀 갈등과 분쟁이 일어난다(110쪽). 사례마다 '주된 원인'을 짚어 두면 자료형 문제를 빨리 풀 수 있다.
      - type: table
        caption: 교과서 속 분쟁 사례와 원인 (110쪽)
        headers: [분쟁, 내용, 핵심 원인]
        weights: [1.3, 2.6, 1.0]
        rows:
          - ['이스라엘-팔레스타인', '유대인과 팔레스타인 사람들 간 영토 분쟁에서 시작해 민족적·종교적 정체성 갈등으로 심화', '영토 → 민족·종교']
          - ['카슈미르 분리 분쟁', '주민 대부분이 이슬람교인 카슈미르가 힌두교도가 많은 인도에 편입되며 발생', '종교']
          - ['에티오피아 내전', '80여 개 민족 간 종교·언어 차이, 경제적·정치적 차별', '민족·종교·차별']
          - ['포클랜드 분쟁', '주변에 석유가 매장된 포클랜드 제도의 소유권을 두고 영국과 아르헨티나가 충돌', '자원·영토']
      - type: callout
        style: key
        label: 국제 갈등은 왜 함께 풀어야 하나 (110쪽)
        text: |-
          · 갈등과 분쟁은 인류의 안전과 생존을 위협하고, 빈곤·기아·차별이 인간의 당연한 권리를 빼앗는다.
          · 상호 의존성이 높은 오늘날에는 국제 갈등이 전 세계에 영향을 미치므로 한 국가의 노력만으로는 해결하기 어렵다.
          · 해결 노력: 당사국 간 협력, 여러 기구를 통한 갈등 조정, 국제 협약 체결, 국제 스포츠 대회 개최
          · 협력 사례 — 남극 조약: 남극 영유권 분쟁이 심해지자 12개국이 체결. 어떤 국가도 영유권을 주장할 수 없고 과학 연구·교류 목적으로만 이용
      - type: steps
        label: 코트디부아르 내전으로 보는 소극적·적극적 평화 (111쪽 탐구)
        items:
          - title: 원인
            body: 뿌리 깊은 남북 지역 간 경제·종족·종교 갈등(남부 가톨릭 vs 북부 이슬람), 북쪽 외국인 이주민에 대한 차별
          - title: 소극적 평화를 향한 노력
            body: 2006년 축구 선수의 휴전 호소 → 월드컵 기간 휴전, 2007년 평화 협정, 2011년 국제 연합(UN)과 프랑스의 군사 작전으로 민간인 살상 저지
          - title: 적극적 평화를 향한 노력
            body: 한국국제협력단(KOICA)이 청소년의 심리적·신체적 상처 치유를 위한 협력 센터를 짓고 체육·문화·교육을 지원

  - no: '03'
    heading: 국제 사회를 움직이는 행위 주체와 바람직한 역할
    blocks:
      - type: table
        caption: 국제 사회의 행위 주체 (112쪽)
        headers: [행위 주체, 특징, 예]
        weights: [0.9, 2.6, 1.4]
        rows:
          - ['국가', '일정한 영토와 국민을 바탕으로 주권을 가진 가장 기본적인 행위 주체. 국제법상 지위가 있고 공식 활동 가능. 자국의 이익을 최우선으로 추구해 갈등이 생기기도 함', '대한민국 정부(튀르키예 지진 복구 지원)']
          - ['국제기구', '각국 정부를 회원으로 하는 행위 주체. 국가 간 이해관계를 조정하고 경제·사회 협력을 이끌어 냄', '국제 연합(UN), 유니세프, UNHCR, WFP']
          - ['비정부 기구', '개인이나 민간단체 주도로 만들어짐. 특정 개인·기업·국가의 이익이 아닌 생명 존중·인권·환경 등 인류의 보편적 가치를 위해 활동. 시민사회 성장으로 역할 확대', '국경 없는 의사회, 국제앰네스티, 그린피스, 세이브더칠드런']
          - ['그 밖의 주체', '국제적 영향력이 큰 개인, 다국적 기업, 개별 국가 내 지방 정부도 영향력을 행사', 'UN 사무총장, 전직 국가 원수']
      - type: callout
        label: 미얀마 내전 사례로 행위 주체 찾기 (113쪽 탐구)
        text: |-
          · 국제 연합 난민 기구(UNHCR): 실향민에게 구호 물품 배포 → 국제기구
          · 국제앰네스티: 군부로 가는 항공 연료 공급망 폭로 → 비정부 기구
          · P사: 보고서를 받고 미얀마 사업 철수 발표 → 다국적 기업
          · 미국 정부: 미얀마 석유 가스 회사 제재 → 국가
      - type: callout
        style: key
        label: 세계 평화를 위한 바람직한 역할 (114쪽)
        text: |-
          · 국가: 힘의 논리에서 벗어나 대화와 타협으로 갈등을 평화적으로 해결하고, 위기에 처한 나라를 원조
          · 국제기구·비정부 기구: 갈등 중재자 역할과 인도주의적 구호 활동
          · 개인: 한 국가의 구성원이자 지구 공동체의 일원 → 세계시민으로서 캠페인·기부·봉사에 참여
          · 사례: 내전과 대지진을 겪은 시리아에 국제기구·여러 나라·비정부 기구·개인이 함께 지원
      - type: table
        caption: 노벨 평화상으로 보는 평화의 주체 (114쪽)
        headers: [수상자, 수상 연도, 공로]
        weights: [1.4, 0.8, 2.8]
        rows:
          - ['국경 없는 의사회(MSF)', '1999', '인종·종교·이념과 관계없이 인도주의 의료 서비스 제공']
          - ['세계 식량 계획(WFP)', '2020', '기아 퇴치, 굶주림이 전쟁 무기로 쓰이는 것을 막음']
          - ['마리아 레사 (언론인)', '2021', '필리핀 독재 정권의 권력 남용 폭로, 표현의 자유 수호']
      - type: callout
        label: '심화 — 국제기구 문제의 단골 함정'
        text: |-
          · 국제 연합 안전 보장 이사회의 상임 이사국(미국·영국·프랑스·러시아·중국)은 거부권을 가진다. 한 나라라도 반대하면 실질 사항을 결정할 수 없다.
          · 국제 사법 재판소는 분쟁 당사국이 모두 동의해야 재판할 수 있다. 한쪽이 일방적으로 제소한다고 재판이 열리지 않는다.
          · 국제기구의 회원은 '국가(정부)'이고, 비정부 기구는 '민간'이 주도한다. 국제앰네스티를 국제기구로 분류하면 ×

  - no: '04'
    heading: 남북 분단의 배경과 평화 통일을 위한 노력
    blocks:
      - type: steps
        label: 남북 분단의 과정 (117쪽)
        items:
          - mark: '45'
            title: 1945년 광복과 분할 점령
            body: 광복과 동시에 미국과 소련이 북위 38도선을 경계로 한반도를 분할 점령. 국제 사회는 미국(자유주의 진영)과 소련(공산주의 진영)의 냉전 질서로 재편
          - mark: '45'
            title: 1945년 12월 모스크바 3국 외상 회의
            body: 미국·영국·소련 외상이 임시 민주 정부 수립과 미·영·중·소에 의한 최고 5년의 신탁 통치를 결정 → 신탁 통치를 둘러싼 좌우익의 찬반 대립과 이념 갈등 심화
          - mark: '48'
            title: 1948년 남북한에 서로 다른 정부 수립
            body: 국제 연합(UN)이 총선거로 통일 정부를 세우는 방안을 마련했지만, 소련과 북한이 거부
          - mark: '50'
            title: 1950년 6·25 전쟁
            body: 북한의 남침으로 전쟁이 일어나 분단이 더욱 고착
      - type: callout
        label: 분단이 남긴 아픔 — 이산가족 (117쪽)
        text: |-
          · 1985년 최초로 서울·평양 간 이산가족 고향 방문단 교환(65명 상봉)
          · 2000년 남북 정상 회담 → 6·15 남북 공동 선언 합의에 따라 제1차 대면 상봉, 2018년 8월까지 총 21회
          · 2019년 하노이 북·미 정상 회담 결렬 후 5년 가까이 중단. 생존 신청자 4만여 명 중 80세 이상이 약 67%
      - type: contrast
        left_title: 평화 통일이 필요한 이유 (118쪽)
        left_body: 인도주의 차원에서 북한 주민의 삶 개선과 이산가족의 아픔 해소. 군사 대립 비용을 줄여 경제 발전. 태평양과 유라시아를 잇는 물류 중심지로 성장. 한반도 평화와 세계 평화 정착
        right_title: 평화 통일을 위한 노력 (118쪽)
        right_body: 남북 교류·협력의 지속(이산가족 상봉, 문화·예술·체육 교류, 남북 교역, 정상 회담) → 군사적 긴장 완화와 신뢰 회복. 국제 사회의 우호적 환경 조성과 주변국의 지지·협력 확보
      - type: callout
        label: 탐구 자료 — 독일 통일과 분단 비용 (118쪽)
        text: |-
          · 독일 통일의 요인: 동독과 꾸준히 교류한 서독 정부의 노력, 동독의 변화, 냉전 체제 붕괴
          · 통일 후 통일 비용 문제를 겪었지만 격차 해소 정책으로 동독 주민 소득과 노동 생산성이 서독의 85% 수준까지 올라왔다. 오늘날 독일은 유럽 최대 경제 규모
          · 분단 비용: 대한민국은 세계 9위 군사비 지출(2022년, 464억 달러), 북한은 국내 총생산 대비 군사비 지출 세계 1위

  - no: '05'
    heading: 동아시아의 역사 갈등과 해결 방안
    blocks:
      - type: prose
        text: 우리나라, 중국, 일본은 정치·경제 등 여러 분야에서 긴밀한 관계를 맺고 있지만 영토 문제와 역사 인식 문제로 역사 갈등을 겪고 있다(119쪽). 교과서 122쪽 퀴즈에서 '배타적 관계'가 아니라 '긴밀한 관계'라는 점을 확인하자.
      - type: table
        caption: 동아시아 역사 갈등 세 가지 (119쪽)
        headers: [갈등, 핵심 내용]
        weights: [1.0, 3.4]
        rows:
          - ['영토 문제', '청일 전쟁·러일 전쟁 등 얽힌 역사와 해양 자원 경쟁. 제2차 세계 대전 이후 작은 섬들의 영유권 분쟁, 1970년대 이후 해양 자원의 중요성이 커지며 심화. 예) 쿠릴 열도(북방 도서), 센카쿠 열도(댜오위다오), 시사 군도(파라셀 제도), 난사 군도(스프래틀리 군도)']
          - ['동북공정', '중국이 2002년 2월부터 5년간 추진한 동북 3성(헤이룽장성·지린성·랴오닝성) 연구 사업. 고조선·부여·고구려·발해를 중국사의 일부로 주장 → 목적은 소수 민족의 분리 독립 방지. 우리 정부는 역사 주권 침해라고 반발, 학술 교류로 극복하기로 합의했으나 논란 계속']
          - ['일본의 역사 교과서 왜곡', '침략 전쟁과 식민 지배를 미화하고 전쟁 범죄를 은폐. 독도를 일본 영토로 왜곡, 일본군 ‘위안부’·강제 연행을 위안부·징용으로 수정해 침략을 정당화']
      - type: steps
        label: 해결 방안 (120쪽)
        items:
          - title: 역사 인식의 공유와 반성
            body: 갈등의 원인인 역사 왜곡을 바로잡는다. 2002년부터 한일 두 차례 공동 역사 연구, 이후 일중 공동 연구, 한·중·일 학자·교사·시민의 공동 역사 교재
          - title: 국제 연대와 교류
            body: 한·중·일 시민단체의 동아시아 청소년 역사 체험 캠프, 문화·예술 교류로 상호 이해 증진
          - title: 민간의 홍보 활동
            body: 사이버 외교 사절단 반크가 일본 교과서 왜곡의 모순을 카드 뉴스로 알리고, '일본해'를 '동해'로 바로잡는 활동
      - type: callout
        label: 독도는 대한민국의 고유 영토 (123쪽 수행평가)
        text: |-
          · 울릉도에서 87.4km, 맨눈으로 볼 수 있는 거리
          · 『세종실록지리지』(1454): 두 섬이 멀지 않아 날씨가 맑으면 바라볼 수 있다.
          · 『만기요람』(1808): 독도는 울릉도와 함께 우산국의 영토
          · 1877년 일본 최고 행정 기관 태정관이 독도가 일본 영토가 아님을 인정
          · 1900년 대한제국 칙령 제41호로 울릉군수가 독도를 관할

  - no: '06'
    heading: 우리나라의 국제적 위상과 세계 평화 기여
    blocks:
      - type: callout
        style: key
        label: 원조받던 나라에서 원조하는 나라로 (121쪽)
        text: |-
          · 6·25 전쟁 당시 원조를 받던 우리나라는 경제 성장을 이루어 개발 원조 위원회(DAC) 회원국이 되었다. DAC는 경제 협력 개발 기구(OECD) 산하 위원회로 선진국의 개발 도상국 원조 규범을 정한다.
          · 기여 방법: 개발 도상국 기술 지원, 재해·재난 구호, 분쟁 지역 군대 파견으로 국제 연합 평화 유지 활동 지원
          · 지리적 이점: 유라시아와 태평양을 잇는 요충지 → 주변국 갈등 중재, G20 등 국제기구에서 주도적 활동
          · 앞으로: 동아시아 군사적 대립 완화, 분쟁·테러 방지, 빈곤국 원조
      - type: contrast
        left_title: 한국국제협력단(KOICA)
        left_body: 정부의 대외 무상 협력 사업을 전담하는 외교부 산하 기관. 자국 인구 대비 난민이 세계에서 두 번째로 많은 요르단에 난민 아동 학교 설립
        right_title: 공적 개발 원조(ODA)
        right_body: 정부를 포함한 공공 기관이 개발 도상국의 경제 개발과 복지 향상을 위해 제공하는 원조. 예) 농촌진흥청이 케냐에 무병 씨감자와 재배 기술 지원
  - no: '07'
    heading: 선지 분석 — 평화와 국제 사회
    blocks:
      - type: checks
        items:
          - statement: '① 소극적 평화는 직접적·물리적 폭력이 없는 상태를 의미한다. → ○'
            why: 교과서 109쪽.
          - statement: '② 빈곤과 경제적 착취는 문화적 폭력에 해당한다. → ×'
            why: '[개념 바꿔치기] 구조적 폭력이다. 문화적 폭력은 종교·사상·언어·예술 영역의 폭력.'
          - statement: '③ 갈퉁은 평화라는 목적을 위해서라면 폭력적 수단도 정당화된다고 본다. → ×'
            why: '[사상가 입장 뒤집기] "평화는 평화적 수단으로만 이루어져야 한다."'
          - statement: '④ 카슈미르 분쟁은 주로 석유 자원을 둘러싼 갈등이다. → ×'
            why: '[원인 바꿔치기] 종교 갈등. 석유가 원인인 사례는 포클랜드 분쟁.'
          - statement: '⑤ 남극 조약에 따라 남극은 과학 연구와 교류 목적으로만 이용할 수 있다. → ○'
            why: 교과서 110쪽.
          - statement: '⑥ 비정부 기구는 각국 정부를 회원으로 하는 행위 주체이다. → ×'
            why: '[주체 바꿔치기] 국제기구의 설명. 비정부 기구는 개인·민간단체 주도.'
          - statement: '⑦ 국가는 국제 사회에서 법적 지위를 갖는 가장 기본적인 행위 주체이다. → ○'
            why: 교과서 112쪽.
          - statement: '⑧ 개별 국가 내 지방 정부는 국제 사회의 행위 주체가 될 수 없다. → ×'
            why: '[범위 축소] 교과서는 지방 정부, 다국적 기업, 영향력 큰 개인도 행위 주체로 본다(122쪽 퀴즈 정답: 4개 모두).'
          - statement: '⑨ 모스크바 3국 외상 회의에서는 한반도에 대한 최고 5년간의 신탁 통치가 결정되었다. → ○'
            why: 교과서 117쪽.
          - statement: '⑩ 1948년 남북한 정부 수립은 소련과 북한이 UN의 총선거 방안을 거부했기 때문이다. → ○'
            why: 교과서 117쪽.
          - statement: '⑪ 평화 통일을 위해서는 주변국의 협력 없이 남북한의 노력만으로 충분하다. → ×'
            why: '[조건 누락] 주변국의 지지와 협력이 필요하다.'
          - statement: '⑫ 동북공정은 고구려와 발해의 역사를 중국사의 일부로 편입하려는 연구 사업이다. → ○'
            why: 교과서 119쪽. 목적은 소수 민족의 분리 독립 방지.
          - statement: '⑬ 동아시아 3국은 배타적 관계를 맺고 있어 교류가 거의 없다. → ×'
            why: '[사실 왜곡] 여러 분야에서 긴밀한 관계를 맺고 있다(122쪽 퀴즈).'
          - statement: '⑭ 우리나라는 원조를 받던 국가에서 개발 원조 위원회(DAC) 회원국이 되었다. → ○'
            why: 교과서 121쪽.
  - no: '08'
    heading: 서술형 대비와 한 장 정리
    blocks:
      - type: callout
        style: key
        label: '예시 — 코트디부아르 사례에서 소극적 평화와 적극적 평화를 실현하기 위한 노력을 구분하여 서술하시오.'
        text: 축구 선수의 휴전 호소와 평화 협정, 국제 연합과 프랑스의 군사 작전으로 민간인 살상을 막은 것은 직접적·물리적 폭력을 없애는 소극적 평화를 위한 노력이다. 한국국제협력단이 내전으로 상처 입은 청소년을 위한 협력 센터를 짓고 교육·문화를 지원한 것은 구조적 폭력까지 줄여 인간다운 삶을 보장하는 적극적 평화를 위한 노력이다.
      - type: table
        caption: 한 장 정리
        headers: [주제, 핵심]
        weights: [1.0, 3.4]
        rows:
          - ['평화', '소극적(직접적 폭력 없음) → 적극적(구조적·문화적 폭력까지 제거), 갈퉁: 평화적 수단']
          - ['갈등 원인', '자원·영토·민족·인종·종교의 복합 작용']
          - ['행위 주체', '국가(기본) / 국제기구(정부 회원) / 비정부 기구(민간, 보편 가치) / 개인·다국적 기업·지방 정부']
          - ['남북 분단', '분할 점령 → 신탁 통치 갈등 → 1948 두 정부 → 6·25로 고착 / 해결: 교류·협력 + 국제 협력']
          - ['동아시아', '영토 분쟁·동북공정·교과서 왜곡 / 해결: 공동 연구·교재, 국제 연대, 교류']
          - ['우리나라', 'DAC 회원국, ODA·KOICA, PKO, G20, 갈등 중재']
