unit_kicker: B파트 · CORE 04 · 교과서 134~151쪽
title: 에너지 자원과 지속가능한 발전, 미래 사회와 세계시민
sections:
- false: '01'
  heading: 에너지 자원 — 무엇이 있고, 어디에 쓰이나
  blocks:
  - type: prose
    text: 교과서는 태양광 패널과 지열 발전으로 에너지를 직접 생산해 판매까지 하는 '에너지 자립 학교'로 시작한다(134쪽). 이런 학교가 왜 필요한지 이해하려면 우리가 지금 쓰는 에너지가 무엇이고 어떤 문제를 안고 있는지부터 알아야 한다.
  - type: callout
    style: key
    label: 자원과 에너지 자원 (135쪽)
    text: '· 자원: 자연에서 얻을 수 있는 것 중 인간에게 유용하면서 기술적·경제적으로 이용 가능한 것

      · 에너지 자원: 일상생활과 경제 활동에 필요한 에너지를 생산하는 자원

      · 종류: 화석 에너지(석탄·석유·천연가스) / 신·재생 에너지(수력·태양광·풍력 등)

      · 현재 인류가 가장 많이 쓰는 에너지는 대부분 화석 에너지다.'
  - type: table
    caption: 화석 에너지 3종 비교 — 시험에 가장 많이 나오는 표
    headers:
    - 자원
    - 특징
    - 주요 용도
    - 분포·이동
    weights:
    - 0.7
    - 1.9
    - 1.5
    - 1.6
    rows:
    - - 석탄
      - 산업 혁명 이후 증기 기관 연료. 사용 역사가 가장 김
      - 제철 공업, 화력 발전
      - 비교적 여러 지역에 고루 매장 → 국제 이동량이 적음. 생산은 중국이 약 절반(2022)
    - - 석유
      - 세계에서 소비량이 가장 많음
      - 자동차·비행기 등 운송, 산업 연료, 석유 화학 공업 원료
      - 매장량의 절반이 서남아시아 → 아시아 공업국·유럽·미국에서 소비, 국제 이동 활발
    - - 천연가스
      - 연소 시 오염 물질이 적음. 냉동 액화 기술·파이프라인으로 운반·저장이 편리해져 국제 이동량 급증
      - 가정용 연료, 화력 발전
      - 특정 지역에 편재
  - type: contrast
    left_title: 신에너지 (135쪽)
    left_body: 화석 에너지를 변환하거나 화학 반응으로 전기·열을 만든다. 예) 수소 에너지, 석탄 액화·가스화 에너지, 연료 전지
    right_title: 재생 에너지 (135쪽)
    right_body: 자연적으로 재생되는 요소를 에너지로 바꾼다. 예) 수력, 태양광, 태양열, 풍력, 지열, 바이오, 해양 에너지
  - type: callout
    label: 신·재생 에너지의 장점과 한계
    text: '· 장점: 오염 물질이 적고 재생 가능 → 지속가능한 에너지

      · 한계: 아직 에너지 효율이 낮고 지형·기후의 제약이 크다.

      · 입지: 수력은 빙하 지형·급경사 산지가 많거나 강수량이 많아 유량이 풍부한 곳, 태양광·태양열은 비가 적고 일사량이 풍부한 곳'
  - type: disc
    title: 헷갈림 주의 — 신에너지 ≠ 재생 에너지
    body: 수소 에너지와 연료 전지는 '신에너지'다. 자연에서 다시 생기는 에너지가 아니라 변환·화학 반응으로 만든 에너지이기 때문이다. "연료 전지는 재생 에너지에 해당한다" → ×
- false: '02'
  heading: 에너지 자원의 소비 실태와 세 가지 문제
  blocks:
  - type: callout
    style: key
    label: 소비 실태 (137쪽)
    text: '· 인구 증가와 산업 발달로 에너지 소비량은 계속 증가한다.

      · 세계 에너지 소비 구조에서 유한한 화석 에너지의 비중이 매우 크다.

      · 1인당 에너지 소비량이 많은 국가는 주로 선진국이나 자원 매장량이 많은 국가 → 국가 간 격차가 크다.'
  - type: steps
    label: 분포와 소비 실태에서 생기는 문제 (137쪽)
    items:
    - title: 자원 고갈과 부족
      body: 화석 에너지는 한번 쓰면 재생이 어렵고 매장량에 한계가 있다. 가채 연수(확인 매장량 ÷ 그해 연간 생산량)는 석탄 약 139년, 석유 약 53.5년, 천연가스 약 48.8년(2023 자료)
    - title: 국가 간 갈등과 분쟁
      body: 자원 확보와 수송로를 둘러싼 갈등. 자원 보유국이 자원 민족주의를 내세워 가격을 올리거나 수출을 제한하면 해외 의존도가 높은 국가가 어려움에 처한다.
    - title: 환경 오염
      body: 채굴로 생태계가 파괴되고, 석유·석탄 연소로 온실가스인 이산화 탄소가 배출되어 기후변화를 초래한다.
  - type: table
    caption: 심화 · 고2 세계시민과 지리 — 자원의 세 가지 특성
    headers:
    - 특성
    - 뜻
    - 교과서 연결
    weights:
    - 0.9
    - 2.2
    - 1.8
    rows:
    - - 유한성
      - 매장량이 한정되어 언젠가 고갈된다
      - 자원 고갈, 가채 연수
    - - 편재성
      - 특정 지역에 치우쳐 분포한다
      - 석유의 서남아시아 편재, 생산지와 소비지 불일치, 자원 민족주의
    - - 가변성
      - 기술·경제·문화 조건에 따라 자원의 의미와 가치가 달라진다
      - 냉동 액화 기술 발달로 천연가스 국제 이동 증가
  - type: disc
    title: 함정 — 자원 민족주의의 주체
    body: 자원 민족주의는 자원을 '가진' 국가들이 합심해 생산과 공급을 통제하는 경향이다. 자원을 수입하는 국가가 자국 자원을 보호하는 것으로 바꿔 쓰면 ×. 또 교과서 150쪽 퀴즈에서 화석 에너지 소비의 문제점으로 옳은 것은 '기후변화'뿐이고, '탄소 중립 달성', '가채 연수 증가'는 문제점이 아니다.
- false: '03'
  heading: 기후변화에 대한 대응 — 기후 정의와 탄소 중립
  blocks:
  - type: callout
    style: key
    label: 기후변화와 기후 정의 (138쪽)
    text: '· 산업화 이전 대비 지구 평균 기온 1.09℃ 상승(2021년 기준), 인간의 영향일 확률 99~100%(기후변화에 관한 정부 간 협의체)

      · 결과: 빙하 융해, 해수면 상승, 잦아지고 커지는 자연재해, 생태계·사회·경제 전반의 악영향

      · 불평등 심화: 온실가스를 많이 배출해 원인을 제공한 선진국·현세대보다, 관련이 적은 국가·미래 세대·사회적 약자가 더 큰 피해를 입는다.

      · 기후 정의: 기후변화로 생긴 불평등과 양극화를 인식하고 공정하게 바로잡는 것

      · 대응: 지속가능한 에너지 소비 구조로 전환 + 기후변화에 대한 적응력 강화 + 취약 지역·계층 보호'
  - type: table
    caption: 기후변화 대응 국제 협약 비교 (138쪽) — '감축 의무가 누구에게 있는가'가 핵심
    headers:
    - 협약
    - 연도
    - 핵심 내용
    weights:
    - 1.4
    - 0.6
    - 3.0
    rows:
    - - 국제 연합 기후변화 협약
      - '1992'
      - 온실가스 배출을 제한하기 위해 채택한 국제 협약
    - - 교토 의정서
      - '1997'
      - 기후변화 협약의 구체적 이행 방안. 선진국의 온실가스 감축 목표치를 규정
    - - 파리 협정
      - '2015'
      - 195개국이 지구 평균 기온 상승을 1.5℃ 이내로 제한하기로 약속. 모든 국가에 감축 의무
  - type: callout
    label: 탄소 중립과 우리나라의 노력 (138~139쪽)
    text: '· 탄소 중립: 이산화 탄소 배출량을 줄이고 흡수량을 늘려 순 배출량을 ‘0’으로 만드는 것

      · 우리나라: ''2050 탄소 중립 선언'', 2023년 제1차 기본 계획 목표는 2030년까지 2018년 대비 온실가스 40% 감축

      · 이행 방안: 화석 에너지 감축, 신·재생 에너지 확대, 국민 인식 제고, 산림·습지 등 탄소 흡수원 확충, 기후위기 취약 계층 지원'
  - type: contrast
    left_title: 온실가스 배출권 거래제 (139쪽)
    left_body: 정부가 기업별로 연 단위 배출 허용량을 정하고, 남거나 부족한 배출량을 기업끼리 사고팔게 하는 제도. '시장 원리'로 감축을 유도한다. 감축 목표를 높이면 배출권 가격이 오르기도 한다.
    right_title: 열대 우림 보전 (139쪽)
    right_body: '''지구의 허파'' 아마존을 지키기 위해 남아메리카 8개국이 삼림 벌채를 멈추고 탄소 흡수원을 늘리기로 하고, 선진국에 기금 지원을 촉구했다.'
  - type: callout
    label: 심화 · 고2 경제 — 배출권 거래제를 외부 효과로 읽기
    text: 온실가스 배출은 제3자에게 피해를 주지만 대가를 치르지 않는 부정적 외부 효과(C파트 CORE 06 참고)다. 배출권 거래제는 배출에 '가격'을 매겨 기업이 비용을 고려하게 만드는 방법이다. 감축 비용이 싼 기업은 더 줄이고 남는 배출권을 팔아 이익을 얻으므로, 사회 전체의 감축 비용이 줄어든다.
- false: '04'
  heading: 지속가능한 발전 — 의미와 실천 방안
  blocks:
  - type: callout
    style: key
    label: 지속가능한 발전의 의미 (139쪽)
    text: '· 미래 세대가 사용할 자원을 낭비하거나 그 여건을 저해하지 않는 범위 안에서 현세대의 필요를 충족하는 발전

      · 환경 보전, 경제 성장, 사회 안정과 통합이 전체적으로 조화와 균형을 이루는 발전

      · 지속가능 발전 목표(SDGs): 국제 연합이 제시한 17개 목표. 환경·경제·사회를 통합적으로 고려하며 서로 긴밀하게 연결'
  - type: table
    caption: 실천 방안 — 주체별로 정리 (140쪽)
    headers:
    - 주체
    - 노력
    weights:
    - 0.9
    - 3.5
    rows:
    - - 국가
      - '〈지속가능발전 기본법〉, 〈기후위기 대응을 위한 탄소중립·녹색성장 기본법〉 제정 / 신·재생 에너지 공급 의무화 제도(일정 규모 이상 발전 사업자가 총발전량의 일정 비율 이상을 신·재생 에너지로 생산) / 온실가스 배출권 거래제 / 사회 취약 계층 지원(예: 폭염 대응 물품 지원)'
    - - 국제 사회
      - 국제 협약 체결, 국제기구·비정부 기구와 협력해 기후변화·환경·빈곤·기아·불평등 대응
    - - 개인
      - 자원·에너지 절약, 친환경 제품 구매, 윤리적 소비, 취약 계층 지원
    - - 기업·시민사회
      - 기업의 참여와 시민사회의 연대
  - type: callout
    label: 적정 기술 (140쪽)
    text: '· 그 사회 공동체의 정치·문화·환경을 고려해 만든 기술. 저렴하고, 에너지 사용이 적고, 사용법이 간단하고, 현지 재료를 쓰며, 소규모 생산이 가능

      · 예) 소켓: 15분 축구로 충전해 LED 전구 3시간 이상 / 솔라 쿠커: 태양열 조리, 현지 일자리 창출

      · 탄소 발자국(141쪽 탐구): 음식의 생산·수송·조리 전 과정에서 배출되는 온실가스의 양'
- false: '05'
  heading: 미래 사회의 변화 양상과 세계시민으로서 나의 삶
  blocks:
  - type: table
    caption: 미래 사회를 세 측면에서 예측하기 (143~144쪽)
    headers:
    - 측면
    - 예상되는 변화
    - 예상되는 문제
    weights:
    - 1.0
    - 2.2
    - 2.2
    rows:
    - - 정치·경제
      - 분쟁·난민·빈곤·환경 등 지구촌 문제 해결을 위한 정치적 협력, 자유 무역 확대로 상호 의존성 증가
      - 영토·자원·종교 분쟁 지속, 경쟁 심화와 이해관계 대립, 빈부 격차 갈등
    - - 과학기술
      - 생활공간 확대, 자율 주행차·드론 등 무인 운송 수단, 우주 생활공간, 초연결 사회, 인공 지능 로봇, 생명·유전 공학으로 식량 증산과 수명 연장
      - 기기 오작동 안전 문제, 개인 정보 유출·사생활 침해·감시, 일자리 감소, 유전자 조작·복제의 윤리 문제
    - - 생태환경
      - 국제 협력과 과학기술로 생태환경 복원, 멸종 위기종 개체 수 회복
      - 기후변화·사막화·열대 우림 파괴로 생태계 파괴, 생물종 감소, 미래 세대의 생존 위협
  - type: callout
    label: 교과서 탐구 자료
    text: '· 도심 항공 교통(UAM, 143쪽): 수직 이착륙 항공기로 사람·사물을 운송하는 미래형 교통 시스템. 2035년 이후 자율 비행 목표

      · 세계 경제 포럼(WEF)의 장기 위험 요인(145쪽): 5개 분야(환경·사회·기술·지정학·경제), 위험 요인이 서로 연계되어 국경을 넘어 영향을 미치며, 일부 국가의 노력만으로는 해결할 수 없다.'
  - type: callout
    style: key
    label: 세계시민으로서 나의 삶 (146쪽)
    text: '· 지구촌: 전 세계가 하나의 공동체가 되어 간다는 의미. 다른 지역의 일이 우리에게, 우리의 일이 다른 지역에 영향을 미친다.

      · 우리는 스스로를 지역·국가·지구촌과 연결된 세계시민으로 인식하고 세계시민 의식을 지녀야 한다.

      · 미래는 우리의 노력에 따라 달라질 수 있다(150쪽 퀴즈). 가치관과 직업 선택도 미래 사회에 영향을 준다.'
  - type: callout
    label: 지속가능한 지역의 미래 (151쪽 수행평가)
    text: '· 청송군 무료 버스: 고령화·인구 감소로 버스가 줄어 불편해지자 요금을 없앰 → 대중교통 이용률 20~25% 증가, 온실가스 감축 효과

      · 일본 도야마시 압축 도시: 도시 기능을 대중교통 중심의 도심에 모아 적은 비용으로 윤택한 삶 → 상권 부활, 세수 증가, 전입 인구 증가'
