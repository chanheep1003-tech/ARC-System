    text: '교토 의정서(1997)는 기후변화 협약의 구체적 이행 방안으로 선진국에만 온실가스 감축 목표치를 규정하였다. 반면 파리 협정(2015)은 195개국이 지구 평균 기온 상승을 1.5℃ 이내로 제한하기로 약속한 협정으로, 선진국과 개발 도상국을 포함한 모든 국가에 온실가스 감축 의무가 주어졌다.

      감점 포인트: 연도와 협약 이름을 바꿔 쓰거나, ‘모든 국가’와 ‘선진국’의 대비를 빼고 “둘 다 온실가스를 줄이는 협약이다”로만 쓰면 감점된다.'
