  - heading: 서술형 대비와 한 장 정리
    blocks:
    - type: callout
      style: key
      label: 예시 — 적극적 평등 실현 조치의 의미와 한계를 사례를 들어 서술하시오.
      text: 적극적 평등 실현 조치는 오랫동안 차별받아 온 사회적 약자에게 직간접적인 혜택을 주어 실질적인 기회의 평등을 보장하려는 정책이다. 예를 들어 장애인 의무 고용 제도는 일정 규모 이상의 기관과 기업에 장애인을 일정 비율 이상 고용하도록 하여 장애인의 경제적 자립과 사회 참여를 돕는다. 그러나 이러한 조치가 지나치면 반대편이 차별받는 역차별 문제가 생길 수 있으므로 사회적 합의가 필요하다.
    - type: disc
      title: 감점 포인트
      body: '· ''실질적인 기회의 평등''을 ''결과의 평등''으로 쓰기

        · 한계로 ''역차별''을 쓰고 ''사회적 합의의 필요성''을 빼기

        · 사례 없이 개념만 쓰기 (문제에 ''사례를 들어''가 있으면 반드시 제도 이름을 쓴다)'
