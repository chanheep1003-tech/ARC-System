      text: '· 침해: 깻잎 농장의 외국인 근로자가 하루 할당량에 모자라면 임금을 공제한다는 동의서에 강제로 서명, 계약상 휴식 3시간이 실제로는 1시간. 외국인 근로자의 30.8%가 임금 체불·장시간 노동 호소

        · 구제 경로: 사업장 내 고충 처리 기관 상담, 고용 노동부 진정, 노동 위원회 구제 신청, 국가 인권 위원회 진정, 사법 기관의 재판, 대한 법률 구조 공단 지원'
    - type: disc
      title: 헷갈림 주의 — 사회적 소수자는 "수가 적은" 사람인가?
      body: 사회적 소수자를 가르는 기준은 숫자가 아니라 차별 경험과 소속 의식이다. 수가 많아도 차별받는 집단이라면 사회적 소수자가 될 수 있다. "사회적 소수자는 인구수가 적은 집단만을 의미한다" → ×
