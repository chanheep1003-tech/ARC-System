  - heading: 선지 분석 — 불평등 현상과 해결 제도
    blocks:
    - type: prose
      text: 이유를 가리고 먼저 O/× 판단한 뒤 확인하자. [ ] 안은 함정 유형이다.
    - type: checks
      items:
      - statement: ① 사회 계층의 양극화는 중간 계층의 비중이 줄고 상층과 하층의 비중이 늘어나는 현상이다. → ○
        why: 교과서 51쪽.
      - statement: ② 소득 5분위 배율이 높아졌다면 소득 불평등이 완화된 것이다. → ×
        why: '[방향 뒤집기] 높을수록 불평등이 심하다. 심화: 10분위 분배율은 반대로 높을수록 평등.'
      - statement: ③ 공간 불평등은 자연환경과 생산 요소의 차이로만 발생한다. → ×
        why: '[원인 축소] 어떤 지역 개발 방식을 쓰느냐에 따라 심화되기도 한다(성장 거점 개발).'
      - statement: ④ 성장 거점 개발은 수도권과 대도시의 성장에 기여했지만 공간 불평등을 심화시켰다. → ○
        why: 교과서 52쪽.
      - statement: ⑤ 사회적 소수자는 사회적 약자를 포함하는 더 넓은 개념이다. → ×
        why: '[포함 관계 뒤집기] 사회적 소수자가 사회적 약자의 일부다.'
      - statement: ⑥ 사회 보험은 국가와 지방 자치 단체가 조세로 저소득층의 최저 생활을 보장하는 제도이다. → ×
        why: '[제도 바꿔치기] 공공 부조의 설명이다. 사회 보험은 보험료를 분담한다.'
      - statement: ⑦ 국민 건강 보험과 고용 보험은 사회 보험에 해당한다. → ○
        why: 교과서 54쪽.
      - statement: ⑧ 기초 연금은 보험료를 낸 사람에게만 지급하는 사회 보험이다. → ×
        why: '[이름 함정] 소득 인정액 기준으로 지급하는 공공 부조다.'
      - statement: '⑨ 심화: 공공 부조는 사회 보험보다 소득 재분배 효과가 크다. → ○'
        why: 조세로 저소득층에 집중 지원하기 때문이다.
      - statement: ⑩ 노인 돌봄 서비스와 장애인 활동 지원은 사회 서비스에 해당한다. → ○
        why: 교과서 54쪽.
      - statement: ⑪ 1차 공공 기관 지방 이전으로 대부분의 혁신 도시가 계획 인구를 달성하였다. → ×
        why: '[사실 왜곡] 대다수 혁신 도시가 계획 인구 목표를 달성하지 못해 2차 이전이 추진된다.'
      - statement: ⑫ 고향사랑 기부제는 현재 주소지의 지방 자치 단체에 기부하는 제도이다. → ×
        why: '[조건 뒤집기] 현재 주소지를 제외한 지자체에 기부한다.'
      - statement: ⑬ 적극적 평등 실현 조치는 사회적 약자에게 실질적인 기회의 평등을 보장하려는 정책이다. → ○
        why: 교과서 56쪽.
      - statement: ⑭ 적극적 평등 실현 조치는 역차별 논란이 없으므로 사회적 합의 없이 시행할 수 있다. → ×
        why: '[결론 뒤집기] 역차별 문제가 있어 사회적 합의가 필요하다.'
      - statement: ⑮ 장애인 의무 고용 제도는 기업 규모에 따라 의무 고용률을 다르게 적용한다. → ×
        why: '[사실 왜곡] 같은 비율을 적용해서 대기업의 불만이 크다는 것이 교과서의 한계 설명이다.'
      - statement: ⑯ 싱어는 지구촌의 빈곤한 사람을 돕는 것이 개인의 선택일 뿐 의무는 아니라고 본다. → ×
        why: '[사상가 입장 뒤집기] 싱어는 돕는 것을 의무라고 보았다.'
      - statement: ⑰ 공유지의 비극은 사익의 극대화가 공익에 악영향을 끼칠 수 있음을 보여 준다. → ○
        why: 교과서 61쪽.
      - statement: ⑱ 다중 격차란 소득 격차 하나가 다른 영역과 무관하게 커지는 현상이다. → ×
        why: '[개념 왜곡] 소득·자산·주거·교육 등 여러 영역의 격차가 서로 연결되어 커지는 현상이다.'
