      left_body: 사회에서 신체적·정치적·경제적·사회적·문화적으로 소외되어 인간다운 삶을 영위하는 데 어려움을 겪는 개인이나 집단. 불리한 위치에 있는 사람 모두를 가리킨다. 예) 장애인, 노인, 빈곤층
