      text: '· 원인: 성별·나이·신체 조건·국적·민족·소득 수준 등에 따른 선입견과 편견, 그리고 주류 집단과 다르다는 비합리적 이유

        · 문제: 인간 존엄성과 기본적 권리를 침해할 수 있다.

