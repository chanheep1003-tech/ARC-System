        · 동시에 성인보다 ''강한'' 보호를 받는다: 위험하거나 유해한 일 금지, 노동 시간 제한

        · 권리를 보장받으려면 〈근로 기준법〉에 따라 근로 계약서를 쓰고 일해야 한다.

        · 근로 계약서: 임금·근로 시간·근로 조건 등을 명시해야 한다.'
