      - - 문제점
        - 계층 간 위화감 조성, 계층 이동이 어려워짐 → 계층 간 갈등
    - type: disc
      title: 헷갈림 주의 — 양극화 ≠ 하층이 늘어나는 것
      body: 양극화의 핵심은 '중간 계층의 감소'와 '상층·하층 비중의 동시 증가'다. "하층의 비중만 늘어나는 현상"이나 "모든 계층의 소득이 함께 줄어드는 현상"은 양극화의 정의가 아니다.
