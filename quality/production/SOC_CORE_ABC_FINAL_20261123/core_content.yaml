      - statement: ⑦ 기회비용은 명시적 비용과 암묵적 비용을 합한 것이다. → ○
        why: 교과서 73쪽.
      - statement: ⑧ 합리적 선택을 할 때는 매몰 비용을 반드시 고려해야 한다. → ×
        why: '[원칙 뒤집기] 매몰 비용은 고려하지 않는다.'
      - statement: ⑨ 공공재는 무임승차자 문제 때문에 시장에서 과소 공급된다. → ○
        why: 교과서 74쪽.
      - statement: ⑩ 부정적 외부 효과가 발생하면 해당 재화는 사회적 적정 수준보다 과소 생산된다. → ×
        why: '[방향 뒤집기] 과다 생산. 과소 생산은 긍정적 외부 효과.'
      - statement: ⑪ 누진세는 소득이 커질수록 높은 세율을 적용하는 소득 재분배 정책이다. → ○
        why: 교과서 76쪽.
      - statement: ⑫ 단체 교섭권은 파업 등 쟁의 행위를 할 수 있는 권리이다. → ×
        why: '[권리 바꿔치기] 쟁의 행위는 단체 행동권.'
      - statement: ⑬ 소비자 주권이란 소비자의 선택이 생산을 결정하는 권한을 말한다. → ○
        why: 교과서 78쪽.
      - statement: ⑭ 주식은 예금보다 수익성은 높지만 안전성은 낮다. → ○
        why: 수익성과 안전성의 상충 관계(82쪽).
      - statement: ⑮ 유동성은 금융 자산의 가치가 손실 없이 보전되는 정도이다. → ×
        why: '[원칙 바꿔치기] 안전성의 설명. 유동성은 현금으로 바꾸기 쉬운 정도.'
      - statement: ⑯ 금리가 상승하면 일반적으로 예금보다 주식을 더 선호하게 된다. → ×
        why: '[방향 뒤집기] 금리 상승 시 예금 선호, 하락 시 채권·주식 선호.'
