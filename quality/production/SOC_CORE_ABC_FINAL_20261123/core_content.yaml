      text: 능력과 업적에 따른 불평등은 일할 동기를 주기도 한다. 그러나 불평등이 환경적·구조적 원인에서 생기거나 분배가 지나치게 한쪽에 쏠리면 능력을 발휘할 기회 자체가 사라진다(54쪽). 사회 복지 제도는 모든 구성원이 기본적 욕구를 충족하고 최소한의 인간다운 삶을 살도록 지원하며, 계층 양극화를 완화하는 데 도움이 된다.
