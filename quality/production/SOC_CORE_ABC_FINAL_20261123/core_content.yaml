units:
- unit_kicker: A파트 · CORE 01 · 교과서 44~49쪽
  title: 자유주의와 공동체주의 정의관 — 롤스와 노직을 중심으로
  sections:
  - heading: 조상의 잘못을 후손이 책임져야 할까? — 이 장을 꿰는 질문
    blocks:
    - type: prose
      text: 교과서는 미국의 노예제 배상 논쟁으로 이 단원을 시작한다(44쪽). 지금의 후손이 조상의 잘못을 사과하고 배상해야 할까?
    - type: contrast
      left_title: 반대 — 자유주의
      left_body: 배상 책임은 잘못한 사람에게만 있다. 인간은 공동체 구성원이기 이전에 자유롭고 독립된 존재이므로, 자기가 선택한 일에만 책임지면 된다.
      right_title: 찬성 — 공동체주의
      right_body: 독일은 유대인 학살을 후손이 사과·배상했다. 인간은 공동체의 일원으로서 역사적 유산과 책무를 물려받는다.
    - type: callout
      style: key
      label: 이 장의 판단 축 두 개
      text: '· 축 ① 개인이 먼저인가, 공동체가 먼저인가? → 자유주의 vs 공동체주의

        · 축 ② (자유주의 안에서) 불평등은 언제 정당한가? → 롤스 vs 노직

        · 두 입장은 사실이 아니라 인간관에서 갈린다. 노예제가 있었다는 사실은 둘 다 인정한다.'
    'no': '01'
  - heading: 자유주의 — 개인이 먼저, 국가는 개인을 지키는 수단
    blocks:
    - type: callout
      style: key
      label: 핵심 정리 (45쪽)
      text: '· 인간관: 천부 인권을 지닌 존엄한 존재, 합리적 이성으로 삶의 목적을 스스로 선택하는 독립적 존재

        · 자아 정체성: 공동체가 정해 준 역할보다 자신의 선택으로 형성

        · 우선순위: 개인 > 국가·사회, 개인선 > 공동선

        · 국가: 개인의 자유와 권리를 보호·증진하는 수단, 중립적 입장에서 자유로운 삶을 최대한 허용

        · 정의: 개인이 자유와 권리를 최대한 누리며 개인선을 실현하는 것

        · 노예제 배상: 조상의 행위와 후손은 무관 → 후손에게 책임 없음'
    - type: callout
      label: 밀 (교과서 45쪽) + 심화 · 해악의 원리
      text: '· 사상·의견·결사의 자유, 개성에 맞게 삶을 설계할 자유를 강조했다. 타인에게 영향을 미치지 않는 행위에는 절대적 자유를 인정한다.

        · 심화: 국가가 개인의 자유를 간섭해도 되는 경우는 ''타인에게 해악을 끼칠 때''뿐이다(해악의 원리).'
    - type: disc
      title: 헷갈림 주의 — 자유주의 ≠ 이기주의, 자유주의 ≠ 공동체 부정
      body: '· "자유주의는 타인에게 해를 끼치는 행위도 허용한다" → ×

        · "자유주의는 국가와 공동체의 존재 가치를 부정한다" → × (공동체를 ''수단''으로 볼 뿐 필요성은 인정)'
    'no': '02'
  - heading: 공동체주의 — 나는 공동체의 이야기 속에서만 '나'다
    blocks:
    - type: callout
      style: key
      label: 핵심 정리 (46쪽)
      text: '· 인간관: 공동체와 분리된 개인은 없다. 특정 공동체 안에서 태어나 공동체의 덕목을 실천하는 존재

        · 자아 정체성: 주어진 사회적 역할을 수행하며 형성

        · 우선순위: 공동체 > 개인, 공동선 > 개인선

        · 공동체: 권리 보호의 도구가 아니라 좋은 삶의 기반. 공동체 가치의 내면화와 의무 이행을 장려

        · 정의: 유대감을 바탕으로 역할과 의무를 다하며 공동선을 실현하는 것

        · 노예제 배상: 후손의 정체성과 책무는 공동체의 역사에서 물려받음 → 후손에게 책임 있음'
    - type: callout
      label: 매킨타이어 (교과서 46~47쪽) + 심화 · 샌델
      text: '· "내 삶의 역사는 공동체의 역사 속에 편입되어 있다." 가족·민족·국가로부터 빚·유산·의무를 물려받으며, 이것이 ''내 도덕의 출발점''이다.

        · 현대 사회의 분열은 인간을 독립적 존재로만 보는 자유주의적 인간관에서 비롯되었다고 비판했다.

        · 심화: 샌델은 자유주의가 가정하는 인간을 공동체의 연고가 벗겨진 ''무연고적 자아''라고 비판했다.'
    - type: disc
      title: 헷갈림 주의 — 공동체주의 ≠ 전체주의
      body: '"공동체주의는 개인의 권리를 인정하지 않는다" → ×. 공동선에 우선순위를 둘 뿐 개인의 권리 자체를 부정하지 않는다.'
    'no': '03'
  - heading: 두 정의관 비교와 교과서의 결론 '상호 보완'
    blocks:
    - type: table
      headers:
      - 기준
      - 자유주의
      - 공동체주의
      weights:
      - 1.0
      - 1.6
      - 1.6
      rows:
      - - 우선순위
        - 개인선 > 공동선
        - 공동선 > 개인선
      - - 자아 정체성
        - 스스로의 선택
        - 사회적 역할 수행
      - - 국가·공동체
        - 권리 보호의 수단, 가치 중립
        - 좋은 삶의 기반, 덕목 장려
      - - 개발 제한 구역(48쪽)
        - 토지 소유자의 재산권·사익 침해 우려
        - 공동체 환경 보호 의무 → 정책 필요
      - - 님비 현상(46쪽)
        - 개인의 건강권·재산권 주장으로 이해
        - 공동선보다 사익을 앞세운 것으로 비판
      - - 대표 사상가
        - 밀, 롤스, 노직
        - '매킨타이어 (심화: 샌델)'
    - type: callout
      style: key
      label: 교과서의 결론 (48쪽)
      text: '· 두 정의관은 모두 개인의 행복한 삶과 정의로운 사회를 지향하므로 상호 보완적이다. → "양립할 수 없다"는 ×

        · 개발 제한 구역의 조화 방안: 토지 소유자에게 적절한 보상

        · 권리는 의무를, 의무는 권리를 전제한다. 권리만 내세우면 누구도 권리를 누리지 못하고, 공익만 강조하면 개인의 희생을 강요하게 된다.'
    'no': '04'
  - heading: 롤스 ① — "내가 누가 될지 모른다면" 어떤 규칙을 고를까?
    blocks:
    - type: prose
      text: 롤스와 노직은 둘 다 자유주의자로, 개인의 자유와 권리를 보호하는 것을 정의로 본다. 그러나 빈부 격차를 두고 정반대 결론을 내린다. 그 차이는 롤스가 원칙을 '만드는 방식'에서 시작된다. 자르는 사람이 마지막 조각을 갖는 케이크 나누기를 떠올리면 쉽다. 자기 몫을 모르면 공정하게 자르게 된다.
    - type: steps
      label: 롤스가 정의의 원칙을 만드는 과정 (47쪽)
      items:
      - title: 자신에 대한 정보를 가린다 (무지의 베일)
        body: 자신의 사회적 지위, 타고난 재능, 심리적 특성, 가치관을 모른다고 가정한다.
      - title: 그 상태(원초적 입장)에서 규칙을 고른다
        body: 내가 누가 될지 모르니 특정 집단에게만 유리한 규칙을 고를 이유가 없다.
      - title: 그래서 나온 원칙이 가장 공정하다
        body: 교과서 본문에는 '원초적 입장', '무지의 베일'이라는 용어 없이 상황만 나오지만, 시험 제시문에는 자주 쓰인다.
    - type: callout
      label: 교과서 38쪽 롤스 『정의론』 + 심화
      text: '· "사회 제도의 제1덕목은 정의다." "전체 사회의 복지를 이유로도 침해될 수 없는 기본적 권리가 있다." "큰 선을 위해 소수의 자유를 빼앗는 것은 정당화될 수 없다."

        · 심화: 이 구절은 행복의 총량만 따지는 공리주의를 비판한 것이다. 당사자는 ''합리적이고 서로 무관심한'' 사람이며, 최악의 처지를 최대한 낫게 하는 원칙을 고른다(최소 극대화 전략).'
    'no': '05'
  - heading: 롤스 ② — 정의의 두 원칙과 우선순위
    blocks:
    - type: steps
      label: 롤스의 정의의 원칙 (47쪽)
      items:
      - mark: '1'
        title: 평등한 자유의 원칙
        body: 모든 사람은 동등한 기본적 자유를 최대한 누려야 한다.
      - mark: 2a
        title: 기회균등의 원칙
        body: 불평등의 계기가 되는 직책과 지위는 모든 사람에게 개방되어야 한다.
      - mark: 2b
        title: 차등의 원칙
        body: 사회적·경제적 불평등은 최소 수혜자에게 최대의 이익이 될 때만 허용된다.
    - type: callout
      style: key
      label: 핵심 — 롤스는 불평등을 '조건부로 허용'한다
      text: '· 의사에게 높은 보수를 주어 가난한 사람도 더 나은 의료를 받는다면 → 허용

        · 부자만 더 부유해지고 최소 수혜자는 나아지지 않는다면 → 불허

        · 심화(우선순위): 평등한 자유 > 기회균등 > 차등. 경제적 이익을 이유로 기본적 자유를 줄일 수 없다. 교과서 대담은 차등의 원칙을 먼저 말하지만 실제 순서는 기회균등이 앞선다.'
    - type: table
      caption: 직접 판단 — 자유·기회가 같을 때, 롤스가 고를 사회는? (소득, 만 원)
      headers:
      - 사회
      - 최하층
      - 최상층
      - 판단
      weights:
      - 0.8
      - 0.9
      - 0.9
      - 2.6
      rows:
      - - 갑
        - '100'
        - '100'
        - 완전 평등이지만 최하층이 을보다 적다
      - - 을
        - '150'
        - '600'
        - ★ 선택 — 격차는 가장 크지만 최하층이 가장 많다
      - - 병
        - '120'
        - '300'
        - 최하층이 을보다 적다
      - - 정
        - '80'
        - 2,000
        - 총합은 가장 크지만 최하층이 가장 불리 → 롤스는 고르지 않는다
    - type: callout
      label: 심화 — 재능은 누구의 것인가
      text: 롤스는 타고난 재능과 가정환경을 '우연'으로 본다. 그래서 재능의 분포를 사회의 공동 자산처럼 여기고, 그 이익이 불우한 사람에게도 돌아가도록 제도를 짜야 한다고 본다. 재능과 성과를 그 사람의 것으로 보는 노직과 정면으로 부딪히는 지점이다.
    'no': '06'
  - heading: 노직 — 정당하게 얻었다면, 결과가 불평등해도 정의롭다
    blocks:
    - type: steps
      label: 노직의 논리 (47쪽)
      items:
      - title: 취득의 원칙
        body: 타인에게 피해를 주지 않고 정당하게 얻은 소유물에 대해 권리를 가진다.
      - title: 양도의 원칙
        body: 정당하게 넘겨받은 소유물에 대해서도 권리를 가진다.
      - title: 사용은 개인의 자유
        body: 소유물을 어떻게 쓸지는 전적으로 개인의 자유로운 선택이다.
      - title: 빈부 격차는 문제가 아니다
        body: 위 원칙이 지켜졌다면 빈부 격차는 문제가 되지 않는다. 그래서 차등의 원칙에 동의하지 않는다.
    - type: callout
      style: key
      label: 노직의 판단 기준 — 결과가 아니라 과정
      text: '· ''지금 누가 얼마를 가졌는가''(결과)가 아니라 ''어떤 과정으로 얻었는가''(역사)를 본다.

        · 예: 관객 100만 명이 스스로 1만 원씩 내 가수가 큰 부자가 되었다. 강제가 없었으므로 정의롭다. 이 돈을 강제로 거두어 나누는 것이 오히려 소유 권리 침해다.'
    - type: table
      caption: 심화 — 노직을 정확히 이해하는 네 개념
      headers:
      - 개념
      - 내용
      weights:
      - 1.0
      - 3.2
      rows:
      - - 교정의 원칙
        - 부정의한 취득·양도는 바로잡아야 한다 → 노직은 모든 재분배에 반대하지 않는다. (단, 교과서는 노예제 배상에서 자유주의를 "책임 없음"으로 정리하므로 교과서 문항은 그것을 따른다.)
      - - 로크적 단서
        - 처음 취득할 때 그 때문에 타인의 처지가 나빠져서는 안 된다.
      - - 최소 국가
        - 무정부주의가 아니다. 폭력·절도·사기로부터 보호하고 계약을 집행하는 국가만 정당하다.
      - - 과세와 강제 노동
        - 재분배 목적의 노동 소득 과세는 강제 노동과 다르지 않다. 단, 자발적 기부는 정당하다.
    'no': '07'
  - heading: 롤스 vs 노직 — 쟁점별 정면 대결
    blocks:
    - type: callout
      style: key
      label: 공통점
      text: 둘 다 자유주의자로서 개인의 자유와 권리 보호를 정의로 보고, 국가의 존재를 인정하며, 사회 전체의 이익을 이유로 개인을 희생시키는 것에 반대한다.
    - type: table
      headers:
      - 쟁점
      - 롤스
      - 노직
      weights:
      - 1.0
