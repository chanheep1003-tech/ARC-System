    school_emphasis: NONE
    confusion: "'-ㄹ게'를 '-ㄹ께'로, '던지'와 '든지'를 구별하지 못하며, 배기/빼기, 적다/쩍다의 판정 기준(형태소 경계, 받침)을 모른다."
    cause: SURFACE_SIMILARITY
    evidence: "[NIKL 제53~56항 해설 p.122~128]"
    design_hint: "-던/-든지 는 '과거 경험 vs 선택' 의미 판정 조건을 시험지에 주고 정오 판단 문항으로 만든다. 노트상 용례 선택형은 선택형에 없었으므로 출제 가능성은 낮지만 서답형 조건 문항은 가능."
