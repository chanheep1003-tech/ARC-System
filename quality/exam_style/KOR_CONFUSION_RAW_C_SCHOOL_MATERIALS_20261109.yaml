    - "시범 10p 의 일부 주장(곶 = 8종성법 예외 표기, 수고양이 등)은 학교 원문 확인이 안 되어 confidence 를 MEDIUM 으로 낮췄다."
  school_material_structure_summary: "보충자료1은 개념 서술(규칙) -> 예시 표 -> 본문 적용(어절별 문법 요소 주석) -> 연습 2문항(보기 + 현대어 풀이 + 5지 선다) 순서다. 개념마다 박스형 별표 주석을 단 곳이 어두 자음군 vs ㅅ계 합용병서, ㄱ종성 체언의 비교 조사 예외, 명사형 어미 vs 명사 파생 접미사의 세 군데다. 이 세 곳이 교사가 따로 정리한 강조점이다."
entries:
  - id: C-001
    unit: 중세국어
    concept: "향찰 표기: 실질 부분은 훈(뜻), 문법 부분은 음(소리)을 빌림 (서동요 1구 분석)"
    school_emphasis: MID
    confusion: "같은 한자 主가 한 줄에서 '님(훈)'으로도 '주(음)'로도 쓰여, 학생은 문법 요소는 전부 음차라고 뭉뚱그려 판단한다."
    cause: CATEGORY_SWAP
    evidence: "[보충1 p.1] 훈·음 구분 표와 한 줄 요약, [시범 p.3] 선지 판단 연습 1번이 정확히 이 지점을 겨냥"
    design_hint: "새로운 향찰 구절(교과서·서동요 밖)을 제시하고 한자마다 '뜻 빌림/소리 빌림'을 표로 판정하게 하되, 높임 접사와 보조사를 같은 한 줄에 배치한다."
    confidence: HIGH
    outside_textbook_variation: "교사는 서동요 1구 한 줄을 한자 단위로 쪼개 훈·음을 표로 적었다. 교과서 밖 구절(다른 향가)이나 가상 구절을 쓰면 확장이 되므로 시험지 안에서 한자의 훈·음 정보를 제공해야 한다."
    morpheme_analysis_needed: true
    confusing_expression: "문법적 의미를 나타내는 한자는 모두 음을 빌려 표기하였다는 식의 일반화 서술(높임 접사의 훈차가 반례)"
  - id: C-002
    unit: 중세국어
    concept: "초성 17자: 기본자(상형)·가획자(가획)·이체자의 분류, 오음 체계"
    school_emphasis: MID
    confusion: "ㆁ, ㄹ, ㅿ 이 가획의 결과가 아니라 이체자라는 점을 놓치고, ㅇ(목구멍)-ㆆ-ㅎ 의 가획 순서를 헷갈린다."
    cause: CATEGORY_SWAP
    evidence: "[보충1 p.2] 오음 x 기본자·가획자·이체자 표와 두 원리 한 줄 정의, [시범 p.3] 선지 연습 2번"
    design_hint: "자모 목록을 주고 기본자, 가획자, 이체자로 3분류하게 하거나, 새 자음 하나를 '소리가 세어지는가'로 판정하는 조건을 시험지 안에 제시한다."
    confidence: HIGH
    outside_textbook_variation: "표 구성은 교과서와 비슷할 가능성이 크지만 이체자 열을 따로 둔 점이 교사의 정리다(교과서 대조는 미확인)."
    morpheme_analysis_needed: false
    confusing_expression: "ㅇ에 획을 더한 글자이므로 모두 가획자이다라는 식의 판단(옛이응과 ㅇ 혼동)"
  - id: C-003
    unit: 중세국어
    concept: "중성: 상형(·, ㅡ, ㅣ) → 초출자 → 재출자의 합성, 양성·음성 모음의 대립"
    school_emphasis: MID
    confusion: "중성의 글자 확장 원리가 합성인데 가획이라고 말하는 선지, ㅣ를 양성이나 음성으로 분류하는 선지에 속는다."
    cause: TERM_CONFUSION
    evidence: "[보충1 p.2] 상형·합성 표(하늘·땅·사람, 초출자·재출자), [시범 p.3~4]"
    design_hint: "글자 구성도(기본자 + · 1회 / 2회)를 주고 몇 번째 합성인지, 어느 계열인지 판정하는 문항."
    confidence: HIGH
    outside_textbook_variation: "교과서 밖 예문 필요성은 낮다. 변별은 '합성 횟수 세기'와 '대립 계열' 두 층에서 나온다."
    morpheme_analysis_needed: false
    confusing_expression: "중성 초출자 ㅏ, ㅓ는 기본자에 획을 더하는 가획으로 만들었다(원리 이름 바꿔치기)"
  - id: C-004
    unit: 중세국어
    concept: "종성: 초성 글자 재사용(종성부용초성)과 실제 소리 나는 8자(8종성법), ㅅ과 ㄷ의 구별"
    school_emphasis: HIGH
    confusion: "받침에 쓰인 글자가 모두 8자라고 오해하거나, 8종성법을 현대국어 7종성(끝소리 규칙)과 같은 것으로 본다."
    cause: RULE_DIRECTION
    evidence: "[보충1 p.2] 종성 항목 두 줄, [보충1 p.6~7] 어절 주석에서 '8종성법에 의해 어간 말을 ㅅ으로 표기', [2025노트 서답1] 8종성법 서술, [시범 p.4, p.10]"
    design_hint: "새 용언(어간 말 ㅈ, ㅊ)의 표기 변화를 주고 '왜 ㅅ으로 적었는가'를 8종성법과 ㅅ·ㄷ 구별로 판정하게 한다. 현대국어 끝소리 규칙과의 차이를 선지로 대비한다."
    confidence: HIGH
    outside_textbook_variation: "교사는 훈민정음 언해 본문의 어절 하나(ᄉᆞᄆᆞᆺ디)를 8종성법과 구개음화 미적용 두 가지로 동시에 분석했다. 교과서 밖 어절로 같은 구조를 만들면 변별력이 높다."
    morpheme_analysis_needed: true
    confusing_expression: "받침에는 ㄱ, ㄴ, ㄷ, ㄹ, ㅁ, ㅂ, ㅅ, ㆁ 이외의 글자가 올 수 없었다(종성부용초성과 충돌하는 용례가 있어 기준이 모호해짐)"
  - id: C-005
    unit: 중세국어
    concept: "병서(각자병서·합용병서)와 연서: 입술소리 아래 ㅇ을 이어 쓴 글자"
    school_emphasis: MID
    confusion: "각자병서와 합용병서를 글자 수가 아니라 '같은 글자인가 다른 글자인가'로 가르는 기준을 놓치고, 연서를 병서의 일종으로 본다."
    cause: TERM_CONFUSION
    evidence: "[보충1 p.2] 병서 정의, 각자·합용 표, 연서 한 줄(연서는 한 문장으로 짧음)"
    design_hint: "글자 목록을 병서의 종류로 분류하는 표 문항. 연서 글자는 '가로 나열이 아니라 세로 이음'이라는 조건을 시험지에 주고 구별하게 한다."
    confidence: HIGH
    outside_textbook_variation: "연서는 교사 설명이 한 줄뿐이라 출제 가능성은 낮다고 본다. 병서 분류는 교과서 목록과 같을 가능성이 높다."
    morpheme_analysis_needed: false
    confusing_expression: "ㅂ계 합용병서는 세로로 이어 쓴 글자이다(병서와 연서 혼동)"
  - id: C-006
    unit: 중세국어
    concept: "ㅅ계 합용병서는 된소리 표기이고 ㅂ계(와 ㅄ계) 합용병서만 어두 자음군이다"
    school_emphasis: HIGH
    confusion: "겹자음을 나란히 적었으니 두 소리가 다 난다고 보고, ㅅ계 합용병서를 어두 자음군으로 판정한다."
    cause: SURFACE_SIMILARITY
    evidence: "[보충1 p.3] 별표 박스 '계 합용병서는 왜 어두 자음군이 아닐까?', [보충1 p.2] 합용병서 표, [시범 p.4, p.7, p.10] 어절 마지막 단어의 초성 판정 강조"
    design_hint: "표기와 실제 발음을 분리해 보여 주는 보기를 주고 어두 자음군 여부를 어절마다 판정하게 한다. 교과서 밖 어절을 쓰고 병서의 첫 글자(ㅂ, ㅅ)가 선지의 구분 장치가 되게 한다."
    confidence: HIGH
    outside_textbook_variation: "교사가 별표 박스로 직접 풀이를 쓴 개념이다. 이 박스의 예시를 시험에 그대로 내지 말고 다른 어절로 변환한다."
    morpheme_analysis_needed: false
    confusing_expression: "초성에 두 글자가 쓰였으므로 모두 어두 자음군이다 / 현대국어에 어두 자음군이 없으므로 중세에도 없었다"
  - id: C-007
    unit: 중세국어
    concept: "동국정운식 한자음: 받침 없는 한자에 음가 없는 ㅇ 받침을 붙임, 현실음이 아닌 원음 시도"
    school_emphasis: MID
    confusion: "동국정운식 한자음의 받침 ㅇ을 실제 받침 소리 [ŋ]으로 읽거나, 옛이응(ㆁ)과 같은 글자로 본다."
    cause: TERM_CONFUSION
    evidence: "[보충1 p.3] 박스 설명, [보충1 p.6~7] 어절 주석에 '음가 없는 ㅇ 받침', [시범 p.4] 3원칙, [2025노트 §8-1 4번]"
    design_hint: "한자어 어절의 받침이 (가) 음가 없는 ㅇ인지 (나) 실제 비음 받침인지 판정하게 하고, 동국정운이 소멸한 이유(현실음과의 괴리)를 서술형 키워드로 둔다."
    confidence: HIGH
    outside_textbook_variation: "교사 자료의 예시는 세종어제훈민정음의 한자어에 한정된다. 다른 문헌의 한자어로 바꾸면 범위 확장이므로 한자음 표기를 시험지에서 제공한다."
    morpheme_analysis_needed: false
    confusing_expression: "한자어 표기에 쓰인 모든 받침 ㅇ은 [ŋ] 소리를 나타낸다"
  - id: C-008
    unit: 중세국어
    concept: "이어적기(연철, 표음주의)와 끊어적기(분철, 표의주의), 1933 한글 맞춤법 통일안"
    school_emphasis: MID
    confusion: "이어적기를 소리 그대로 적는 방식이라 현대 맞춤법의 소리대로 원칙과 같다고 보고, 끊어적기를 단순히 띄어 쓰기로 오해한다."
    cause: TERM_CONFUSION
    evidence: "[보충1 p.3] 두 방식의 정의와 예시 표, 1933년 통일안 서술, [시범 p.2, p.5]"
    design_hint: "형태소 경계가 보이도록 이어적기 어절을 주고 '끊어적기로 바꾼 형태'를 고르게 한다. 현대 맞춤법 총칙의 소리대로·어법 항목과 짝 문항으로 묶으면 단원 융합이 된다."
    confidence: HIGH
    outside_textbook_variation: "교사는 예시 어절 두 개(말씀이, 놈이)만 표로 제시했다. 새로운 체언·용언 예문으로 변환할 여지가 크다."
    morpheme_analysis_needed: true
    confusing_expression: "이어적기는 어법에 맞도록 형태를 밝혀 적은 표기이다(소리대로와 어법의 방향을 뒤집은 서술)"
  - id: C-009
    unit: 중세국어
    concept: "사라진 글자 ㆆ·ㅸ·ㅿ·ㆁ·ㆍ 의 음가와 변화 (ㅸ→반모음 w, ㅿ→ㅅ 또는 소멸, ㆁ 초성 소멸)"
    school_emphasis: HIGH
    confusion: "ㅸ을 단순한 ㅂ의 변이로, ㅿ을 [ㅅ]으로만 보며, 현대국어 받침 ㅇ이 어느 글자를 이은 것인지(ㅇ과 ㆁ) 헷갈린다."
    cause: TIME_SCOPE
    evidence: "[보충1 p.3] 음가 표([v], [z], [ŋ]와 변화 예시), [시범 p.5] 소멸 시기와 공식"
    design_hint: "중세 어형과 현대 어형을 대응시킨 쌍을 주고 어느 글자의 변화인지 분류하게 한다. 변화 방향(교체/소멸)을 구분하는 선지를 둔다."
    confidence: HIGH
    outside_textbook_variation: "교사는 영어 [v], [z] 음가를 비교로 제시했다. 교과서 밖 예어(덥다→더워, 마음)를 활용한 표다. 새 어형 쌍으로 변형이 쉽다."
    morpheme_analysis_needed: true
    confusing_expression: "ㅿ은 모든 경우 ㅇ으로 소멸하였다 / 현대국어 받침 ㅇ은 중세국어 ㅇ에서 이어졌다(ㆁ과의 대응을 뒤집은 서술)"
  - id: C-010
    unit: 중세국어
    concept: "아래아(ㆍ) 소실의 두 단계: 둘째 음절 이하 ㆍ→ㅡ, 첫째 음절 ㆍ→ㅏ, 예: 마음"
    school_emphasis: MID
    confusion: "첫째 음절이 먼저 바뀌었다고 순서를 뒤집어 생각하거나, 모든 음절에서 ㅏ로 바뀌었다고 본다."
    cause: TIME_SCOPE
    evidence: "[보충1 p.4] 모음 변화 표(두 단계 서술과 변화 사슬 예시), [시범 p.5, p.10] 시기를 16세기, 18세기로 못 박음"
    design_hint: "변화 사슬 중 한 단계를 가린 빈칸 문항, 또는 어형 변화에서 어느 단계가 일어났는지 순서를 판정하는 문항."
    confidence: MEDIUM
    outside_textbook_variation: "교사 예시는 한 단어(마음)에 한정된다. 하다, 다르다 같은 다른 어형으로 변형 가능하다. 시기(16c, 18c)는 시범 노트에만 있어 학교 원문 확인은 못 했다."
    morpheme_analysis_needed: true
    confusing_expression: "첫째 음절의 ㆍ가 ㅡ로 바뀐 뒤 둘째 음절이 ㅏ로 바뀌었다(순서와 모음 방향 동시 혼동)"
  - id: C-011
    unit: 중세국어
    concept: "중세 단모음 7개와 ㅐ·ㅔ·ㅚ·ㅟ 의 이중모음 발음, 이중모음의 단모음화"
    school_emphasis: MID
    confusion: "현대 단모음 ㅐ, ㅔ가 중세에도 단모음이었다고 보며, 중세국어 모음 수를 현대와 같게 센다."
    cause: COUNTING
    evidence: "[보충1 p.4] 7모음 목록과 이중모음 설명 표, [시범 p.5]"
    design_hint: "모음 목록 중 중세 단모음 개수를 세게 하거나, 어형(내, 배)이 '단모음+반모음' 구조임을 판정하게 한다. 현대/중세 목록 대비표를 시험지에 제공한다."
    confidence: HIGH
    outside_textbook_variation: "교과서 수준을 넘어 반모음 j 결합까지 설명했을 가능성이 있다(교과서 미열람). 시험지 안에 정의를 주면 범위 논란을 피한다."
    morpheme_analysis_needed: true
    confusing_expression: "중세국어 단모음은 현대국어의 단모음에서 ㅐ와 ㅔ만 제외한 체계이다(개수 세기 함정)"
  - id: C-012
    unit: 중세국어
    concept: "모음조화: 양성·음성·중성 모음 결합, 용언 활용과 체언+조사 모두에 적용, 소멸 원인"
    school_emphasis: MID
    confusion: "중성모음 ㅣ 뒤에서는 양성·음성 어느 쪽이든 결합 가능한 점을 놓치고, 목적격 조사 형태가 모음조화로만 정해진다고 본다."
    cause: MULTI_CONDITION
    evidence: "[보충1 p.4] 모음조화 서술과 양성·음성·중성 표, 현대 의성어 예시, [보충1 p.9] Q1 ⑤ 해설 방향, [시범 p.7, p.10] 자음·모음 조건과 모음조화 구별"
    design_hint: "조사나 어미 형태가 갈리는 어절 쌍을 주고 '결정 조건이 앞말의 받침 유무인가, 모음의 성질인가'를 판정하게 한다."
    confidence: HIGH
    outside_textbook_variation: "교사는 현대 의성어와 의태어(팔락팔락 계열)를 예로 들었다. 교과서에는 다른 단어가 있을 가능성이 있다. 현대 용언(돌+아/어)도 사용했다."
    morpheme_analysis_needed: true
    confusing_expression: "목적격 조사 형태는 선행 체언의 모음에 따라서만 결정되었다(한정어 '오직/만'이 거짓 장치, 2025 5번 방식)"
  - id: C-013
    unit: 중세국어
    concept: "성조와 방점: 평성(무점), 거성(1점), 상성(2점), 입성(ㄱㄷㅂㅅ 받침, 점은 별도)"
    school_emphasis: MID
    confusion: "입성이 점이 없는 소리라고 오해하고, 방점 개수와 성조 이름의 대응(2점=상성)을 섞는다. 상성의 흔적이 현대 장음임을 잊는다."
    cause: CATEGORY_SWAP
    evidence: "[보충1 p.4] 4성 표와 입성 행('평성, 거성, 상성 중 하나로 표시'), [시범 p.5]"
    design_hint: "방점이 달린 어절을 주고 성조를 판정하게 하되 받침이 ㄱㄷㅂㅅ 인 어절을 섞는다. 입성은 받침 기준이라는 사실을 정오 판단 선지로 묻는다."
    confidence: HIGH
    outside_textbook_variation: "교사의 입성 예시(목, 날, 입 계열)는 한 글자 명사다. 새 한 글자 명사로 변형 가능하다."
    morpheme_analysis_needed: false
    confusing_expression: "입성은 방점을 찍지 않고 받침으로만 나타낸다(점의 유무와 입성 판별 기준의 혼동)"
  - id: C-014
    unit: 중세국어
    concept: "두음 법칙·구개음화의 시기: 중세국어에는 미적용, 구개음화는 근대국어부터 형태소 내부에서도 일어남"
    school_emphasis: MID
    confusion: "중세국어 어절에서 구개음화나 두음 법칙이 적용된 것으로 보는 시기 오류에 빠지며, 근대 구개음화를 '현대 맞춤법의 구개음화 규정'과 같은 개념으로 착각한다."
    cause: TIME_SCOPE
    evidence: "[보충1 p.4] 두음 법칙·구개음화 서술과 변화 예시(부텨, 티다 계열), [2025노트 §8-1 5번] 구개음화 시기 오류를 오답 장치로 확인, [시범 p.5]"
    design_hint: "중세 어절에서 ㄷ, ㅌ + ㅣ 연쇄, 첫머리 ㄴ·ㄹ 어형을 주고 '현대와 달리 ~적용되지 않았음'을 판정하게 한다. 현대 맞춤법 제6항(형태소 경계에서만)과 대비하는 융합 문항도 가능하다."
    confidence: HIGH
    outside_textbook_variation: "2025 기출이 두시언해(교과서 밖 문헌)에서 구개음화 시기 오류를 출제했다. 교사는 두음 법칙에서도 어절(니르고져 계열)을 근거로 썼다."
    morpheme_analysis_needed: true
    confusing_expression: "형태소 내부 구개음화는 근대국어에서도 일어나지 않았다 / 중세국어 어간 말 ㄷ이 ㅣ 앞에서 ㅈ으로 바뀌었다(시기 바꿔치기)"
  - id: C-015
    unit: 중세국어
    concept: "ㅎ종성 체언: 단독형에는 ㅎ이 없고 조사 결합 때 ㅎ이 나타남, 현대어 화석(안팎, 살코기, 수탉, 암평아리)"
    school_emphasis: MID
    confusion: "ㅎ이 나타나는 조건(모음 조사 앞에서 연음, 자음 ㄱ 조사 앞에서 축약)을 구별하지 못하고, 현대어 화석 단어의 구성(암ㅎ+병아리)을 단순 합성으로 본다."
    cause: MULTI_CONDITION
    evidence: "[보충1 p.4] ㅎ종성 체언 서술, 현대어 화석 표(안팎, 머리카락, 살코기, 수탉, 암탉, 암평아리), [시범 p.6] 환경표, [2025노트 §8-1 5번 ㅎ종성 체언]"
    design_hint: "체언의 단독형과 조사 결합형을 주고 'ㅎ종성 체언인가'를 판정하게 한다. 현대어 화석 단어를 형태소 분해해 ㅎ 흔적 위치를 묻는다. 원문 어절은 교과서 밖에서 선정한다."
    confidence: HIGH
    outside_textbook_variation: "교사는 현대어 화석 단어 표를 따로 만들었다(수탉·암탉·암평아리 계열 등 교과서에 모두 있는지는 미확인). 맞춤법 제31항의 수캐·암컷 계열과 직접 이어진다."
    morpheme_analysis_needed: true
    confusing_expression: "수고양이는 수ㅎ+고양이이므로 수코양이로 적는다(제31항 뒤집기 오개념)"
  - id: C-016
    unit: 중세국어
    concept: "ㄱ종성 체언(나모, 구무): 모음 조사 앞에서 끝모음 탈락 + ㄱ 첨가, 단독형·자음 조사 앞에서는 원형, 비교 조사 와 앞에서는 ㄱ 미첨가"
    school_emphasis: HIGH
    confusion: "모음으로 시작하는 조사 앞이면 ㄱ이 무조건 붙는다고 일반화하며, 보조사 '도'(자음 시작)와 비교 조사 '와'(예외)를 구별하지 못한다."
    cause: EXCEPTION_RULE
    evidence: "[보충1 p.5] 결합표(주격·목적격·부사격·서술격·보조사)와 별표 박스 '비교의 부사격 조사 ~와' 예외, [시범 p.6, p.10] 서답형 변환 유형 2"
    design_hint: "조사 결합 표를 시험지에 주고 빈칸을 채우게 하거나, '모음으로 시작하는 조사'라는 조건과 '비교 조사'라는 예외를 동시에 걸어 판정하게 한다. 새 ㄱ종성 체언 하나를 정의해 적용하면 교과서 밖 변형이 된다."
    confidence: HIGH
    outside_textbook_variation: "교사는 예외 규칙(와)을 박스로 따로 강조했다. 교과서에 이 예외가 있는지는 미확인이므로 시험지 안에서 규칙을 제공하는 방식을 택한다."
    morpheme_analysis_needed: true
    confusing_expression: "나모와는 모음으로 시작하는 조사가 결합했으므로 남기와 같이 ㄱ이 첨가된다(예외 규정 정면 충돌)"
  - id: C-017
    unit: 중세국어
    concept: "명사형 어미 -옴/움 과 명사 파생 접미사 -음/ㅁ 의 구별 (어룸 vs 어름, 여름(열매) vs 여루미)"
    school_emphasis: HIGH
    confusion: "중세국어의 -(으)ㅁ 을 모두 명사형 어미로 보아, 파생 명사(어름, 여름)를 용언의 명사형으로 판정한다. 현대 -음 이 양쪽을 겸하는 것과도 헷갈린다."
    cause: TERM_CONFUSION
    evidence: "[보충1 p.5] 별표 박스(명사형 어미는 용언 어간에, 파생 접미사는 어근에 결합해 새 단어를 만듦, 얼음 예시), [시범 p.7] 선행 설명과 짝 단어표, [2025노트 §8-1 7번] 규칙 적용형 최고배점 문항"
    design_hint: "시험지 안에서 '명사형은 -옴/움, 파생 접미사는 -음/ㅁ' 규칙을 새로 제시하고 새 용언 어간(교과서 밖) 어절에 적용해 판정하게 한다. 관형어 수식 vs 부사어 수식이라는 문장 성분 판별 장치를 함께 둔다."
    confidence: HIGH
    outside_textbook_variation: "교사는 얼다(freeze)의 어름/어룸을 교과서 밖 예로 썼다. 2025 기출은 규칙을 시험지에 주고 새 예문에 적용하는 방식이었으므로 같은 구조의 새 어간으로 변환해야 한다."
    morpheme_analysis_needed: true
    confusing_expression: "여름은 열다의 어간에 명사형 어미가 결합한 것이므로 '열매'를 서술하는 말이다(파생 접미사와 명사형 어미 바꿔치기)"
  - id: C-018
    unit: 중세국어
    concept: "단어 의미 변화 3유형: 확대(세수, 영감), 이동(어엿브다, 어리다), 축소(짐승, 얼굴, 놈)"
    school_emphasis: HIGH
    confusion: "이동과 축소/확대를 구별하는 기준(범위가 넓어졌나, 좁아졌나, 다른 의미로 갔나)을 잊고 단어 이름만 외워, 어엿브다는 축소, 놈은 이동이라고 오분류한다."
    cause: CATEGORY_SWAP
    evidence: "[보충1 p.5] 3유형 정의와 단어 표(중세 의미·현대 의미), [시범 p.6] 같은 표, [보충1 p.6~8] 어절 주석에도 의미 축소·이동 표시"
    design_hint: "의미가 바뀐 단어(교과서 밖) 쌍을 주고 3유형으로 분류하는 표 문항. 지시 범위의 넓이를 판단하는 조건을 시험지 안에 정의한다."
    confidence: HIGH
    outside_textbook_variation: "세수·영감·짐승·얼굴·놈은 교사 표의 단어다. 교과서 밖 의미 변화 단어(예: 방석, 어리다 외의 다른 어휘)로 바꾸면 변별력이 커진다. 영감 행의 품계는 판독이 불확실하다."
    morpheme_analysis_needed: false
    confusing_expression: "어엿브다는 '가엾다'에서 '예쁘다'로 범위가 좁아졌다(이동을 축소로 바꾼 서술)"
  - id: C-019
    unit: 중세국어
    concept: "주격 조사: 자음 뒤 이, ㅣ 이외 모음 뒤 ㅣ, ㅣ 모음 뒤 영형태(∅), 현대 가 없음"
    school_emphasis: HIGH
    confusion: "ㅣ 뒤에서 주격 조사가 없음(영형태)을 '주격 조사가 쓰이지 않은 문장'으로 오독하며, 모음 뒤 ㅣ가 앞말과 합쳐져 글자 모양이 바뀌는 것을 어미나 접사로 오해한다."
    cause: MULTI_CONDITION
