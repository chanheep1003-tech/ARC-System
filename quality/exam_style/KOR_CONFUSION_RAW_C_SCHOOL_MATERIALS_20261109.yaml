    outside_textbook_variation: "교과서 밖 용례(쇠어, 쐬어, 꾀어, 외어)는 NIKL에 있다. 형태소 분석(어간 모음 + 어미 -어/-었-)이 핵심이다."
    morpheme_analysis_needed: true
    confusing_expression: "오아라 / 가아서 처럼 준 형태가 필수인 경우와 허용인 경우를 한 선지에 섞은 서술"
  - id: C-042
    unit: 한글맞춤법
    concept: "제36~40항 준말: ㅣ+어→ㅕ(가져, 다쳐, 치여), -지 않-→-잖-/-하지 않-→-찮-(그렇잖은, 만만찮다), 하 줄임(간편케, 생각건대, 깨끗지 않다)"
    school_emphasis: NONE
    confusion: "ㅎ이 거센소리로 남는 경우와 하가 통째로 줄어드는 경우를 앞말 받침 소리(ㄱ·ㄷ·ㅂ vs 그 외)로 구별하지 못하고, 가져를 가저로, 만만찮다를 만만챦다로 쓴다."
    cause: MULTI_CONDITION
    evidence: "[NIKL 제36~40항 해설 p.92~98]"
    design_hint: "받침 소리 분류 기준(ㄱ·ㄷ·ㅂ이면 통째 탈락)을 시험지에 규칙으로 주고 새 어간에 적용하게 한다."
    confidence: MEDIUM
    outside_textbook_variation: "NIKL 예(섭섭지 않다, 못지않다, 결단코)는 교과서 밖에서 자주 오용되는 단어다. 부사화된 단어(결단코, 아무튼)를 예외로 두는 장치가 있다."
    morpheme_analysis_needed: true
    confusing_expression: "섭섭하지 않다가 줄면 섭섭치 않다가 된다(받침 ㅂ 통째 탈락 vs ㅎ 남음 혼동)"
  - id: C-043
    unit: 한글맞춤법
    concept: "띄어쓰기 제41·42항: 조사는 붙이고 의존 명사는 띄움, 뿐·대로·만큼·만·지·듯·차·들·판 등 동음이의 판별(앞말이 체언인지 관형사형인지)"
