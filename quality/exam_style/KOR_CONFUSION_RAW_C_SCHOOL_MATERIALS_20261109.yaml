    concept: "총칙 제1항: 표준어를 소리대로 적되 어법에 맞도록 함 (꽃의 세 가지 발음, 덥고/더워, 한자어 국어·국민)"
    school_emphasis: MID
    confusion: "어법에 맞도록은 모든 활용형을 한 모양으로 고정한다는 뜻으로만 이해해, 형태를 고정할 수 없어 소리대로 적는 경우(더워, 잡아/접어)를 놓친다."
    cause: RULE_DIRECTION
    evidence: "[NIKL 제1항 해설 p.12~15], [2025노트 §8-2 8번] 총칙 세 구절 용어 대응 문항, [보충1 p.3] 이어적기/끊어적기와 연계"
    design_hint: "총칙 구절(표준어, 소리대로, 어법)을 단어 예에 일대일로 대응시키는 문항에서, 새 단어(교과서 밖)와 형태 고정이 불가능한 예(덥다 활용)를 섞는다. 중세국어 이어적기/끊어적기와 짝 문항으로 설계 가능."
    confidence: HIGH
    outside_textbook_variation: "NIKL 해설의 예는 꽃, 늙다, 덥다, 국어다. 교과서 밖 용언(젊다, 맑다)으로 같은 구조를 만들 수 있다."
    morpheme_analysis_needed: true
    confusing_expression: "늙어를 늘거로 적지 않는 것은 소리대로 적는 원칙을 어긴 것이다(두 원칙의 우선순위 뒤집기)"
  - id: C-030
    unit: 한글맞춤법
    concept: "제5항 된소리: 한 형태소 안에서 까닭 없이 나는 된소리는 된소리로 적음, 단 ㄱ·ㅂ 받침 뒤는 안 적음, 복합어는 비적용, 반복 음절은 예외(똑똑하다)"
    school_emphasis: NONE
    confusion: "ㄱ·ㅂ 받침 뒤 된소리를 적는 줄 알고 '국쑤', '깍뚜기'로 쓰며, 눈곱, 발바닥 같은 복합어에서도 제5항이 적용된다고 본다."
    cause: EXCEPTION_RULE
    evidence: "[NIKL 제5항 해설 p.19~21]"
    design_hint: "중세 ㅅ계 합용병서(된소리 표기)와 연계해 '된소리를 표기에 반영하는 환경'을 분류하게 하는 융합 문항. 반복 음절 예외는 새 의성어로 변형한다."
    confidence: MEDIUM
    outside_textbook_variation: "NIKL 예(소쩍새, 산뜻하다, 깍두기, 똑똑하다)는 교과서에도 나올 법하다. 교과서 밖 단어로는 형태소 수가 다른 쌍(한 형태소 vs 복합어)이 변별력을 준다."
    morpheme_analysis_needed: true
    confusing_expression: "발바닥은 발바닥[발빠닥]이므로 제5항에 따라 된소리로 적는다(복합어를 한 단어로 오독)"
  - id: C-031
    unit: 한글맞춤법
    concept: "제6항 구개음화: ㄷ·ㅌ 받침 뒤 형식 형태소 -이/-히-는 ㄷ·ㅌ으로 적음 (맏이, 굳이, 해돋이, 같이, 끝이, 걷히다), 곧이 vs 곧이어"
    school_emphasis: NONE
    confusion: "소리가 [지, 치] 이므로 지, 치로 적는다고 보며, 곧이어를 곧이와 같은 형식 형태소 결합으로 오해한다."
    cause: EXCEPTION_RULE
    evidence: "[NIKL 제6항 해설 p.21~22], [보충1 p.4] 근대 구개음화 서술과 시기 대비"
    design_hint: "구개음화가 형식 형태소와의 결합에서만 일어나는가를 판정하는 문항을 만들고, 중세·근대·현대의 구개음화를 시기별로 비교하는 선지를 둔다. 형태소 내부(마디, 견디다) 비적용 예를 오답 설계에 쓴다."
    confidence: HIGH
    outside_textbook_variation: "교과서 밖 파생·합성 예(핥이다, 곧이어)는 NIKL 해설에 있으며 학생이 접하기 어렵다. 형태소 경계 분석이 핵심이다."
    morpheme_analysis_needed: true
    confusing_expression: "곧이어와 곧이는 둘 다 -이 가 결합했으므로 모두 구개음화가 일어난다(실질/형식 형태소 혼동)"
  - id: C-032
    unit: 한글맞춤법
    concept: "제7항 ㄷ 소리 받침: ㄷ으로 적을 근거가 없으면 ㅅ으로 적음 (덧저고리, 웃어른, 얼핏) vs 근거 있으면 ㄷ (맏이, 곧장, 딛다, 숟가락, 이튿날)"
    school_emphasis: NONE
    confusion: "발음이 [ㄷ]이면 ㄷ으로 적는 줄 알고, 반대로 ㅅ 받침을 일괄 ㅅ으로 적는다고 생각한다. ㄹ→ㄷ(숟가락)을 같은 ㄷ 이라고만 본다."
    cause: EXCEPTION_RULE
    evidence: "[NIKL 제7항 해설 p.23~24], 제29항 ㄹ→ㄷ 연계"
    design_hint: "중세 8종성법의 ㅅ·ㄷ 구별 문항과 짝으로, 현대 맞춤법에서 ㅅ/ㄷ 선택 근거(본래 받침, 준말, ㄹ 연관)를 분류하게 하는 문항."
    confidence: MEDIUM
    outside_textbook_variation: "근거가 되는 어원(도두보다 → 돋보다, 어디에다가 → 얻다가)은 교과서 밖이다. 시험지 안에 본말을 제시해야 형평이 맞는다."
    morpheme_analysis_needed: true
    confusing_expression: "돋보다는 발음이 [돋뽀다]이므로 돋보다로 적을 근거가 없어 돋보다 대신 덧보다이다(근거 판단 혼동)"
  - id: C-033
    unit: 한글맞춤법
    concept: "제8·9항: ㅖ, ㅢ는 다르게 소리 나도 그대로 적음 (계수, 혜택 / 의의, 희망, 무늬, 씌어, 띄어쓰기) 다만 게시판·휴게실은 ㅔ"
    school_emphasis: NONE
    confusion: "발음 [게]를 따라 게시판을 계시판으로, 휴게실을 휴계실로 쓰거나, 계수·핑계는 게로 적는다."
    cause: EXCEPTION_RULE
    evidence: "[NIKL 제8~9항 해설 p.24~27]"
    design_hint: "예외 조항(게송·게시판·휴게실)과 원칙 단어를 섞은 정오 판단 문항. 단원 용어(띄어쓰기)가 단어 이름이자 표기 대상인 점도 활용 가능."
    confidence: MEDIUM
    outside_textbook_variation: "교과서 밖 한자어(連袂, 偈頌)의 한자 구분은 어렵다. 한자를 병기해 변별한다."
    morpheme_analysis_needed: false
    confusing_expression: "게시판은 계시다와 같은 ㅖ 이므로 계시판으로 적는다(한자 揭 본음 혼동)"
  - id: C-034
    unit: 한글맞춤법
    concept: "제10~12항 두음 법칙 기본: 한자음 첫머리 ㄴ·ㄹ 적용, 의존 명사 냥·냥쭝·년·리·량 은 본음, 연도(명사)와 년도(의존 명사)"
    school_emphasis: NONE
    confusion: "생산 연도와 2018년도의 연/년을 구별하지 못하고, 의존 명사인 리(理), 년(年) 은 두음 법칙 예외임을 놓친다."
    cause: EXCEPTION_RULE
    evidence: "[NIKL 제10~12항 해설 p.27~35] 연도/년도 사전 대조 상자 포함"
    design_hint: "중세국어의 두음 법칙 미적용(니르고져 계열)과 현대 두음 법칙의 예외를 함께 묻는 융합 문항. 의존 명사 여부를 앞말 수식 여부로 판정하게 한다."
    confidence: HIGH
    outside_textbook_variation: "연도/년도는 교과서에 없는 경우가 많고 학생이 일상 표기에서 자주 틀리는 쌍이다. NIKL 사전 상자를 근거로 변형 가능."
    morpheme_analysis_needed: true
    confusing_expression: "몇 년도는 년도가 의존 명사이므로 '몇 연도'로 적는다(의존 명사 판별 뒤집기)"
  - id: C-035
    unit: 한글맞춤법
    concept: "제10~12항 붙임: 단어 첫머리 이외는 본음(남녀, 소녀, 쾌락), 접두사처럼 쓰이는 한자 뒤는 두음 적용(신여성, 공염불), 모음·ㄴ 뒤 렬/률은 열/율, 고유어 뒤 한자는 두음 적용(구름양, 어린이난)"
    school_emphasis: NONE
    confusion: "신여성을 신녀성으로, 나열을 나렬로, 능률을 능율로 쓰며, 구름양/어린이난 처럼 고유어 뒤 한자의 독립성을 놓친다."
    cause: MULTI_CONDITION
    evidence: "[NIKL 제10~12항 붙임 해설 p.28~35]"
    design_hint: "받침 조건(모음/ㄴ vs 그 외)을 시험지에 규칙으로 주고 새 단어에 적용하게 하는 문항. 고유어 뒤 한자 독립성은 '결합한 말의 앞이 한자어인가'로 판단하게 한다."
    confidence: HIGH
    outside_textbook_variation: "교과서 밖 예(환율, 이율, 회전율, 에너지양)는 NIKL에 많다. 형태소 경계(접두사처럼 쓰이는 한자 vs 독립 단어)가 핵심이라 분석 요구가 높다."
    morpheme_analysis_needed: true
    confusing_expression: "비율은 비+율이므로 앞이 한자어이므로 비률로 적는다(모음 뒤 규정 반전)"
  - id: C-036
    unit: 한글맞춤법
    concept: "제19항 원형 밝히기: 어간+-이/-음 명사·부사는 원형을 밝힘(걸음, 믿음, 얼음, 깊이), 본뜻에서 멀어지면 소리대로(거름, 노름, 고름), 불규칙 어간은 변한 대로(쉬이, 서러움)"
    school_emphasis: NONE
    confusion: "얼음/어름, 걸음/거름 처럼 같은 어간에서 온 단어를 구별할 기준(본뜻 유지 여부)을 모르고 원형 밝히기만 일괄 적용한다."
    cause: MULTI_CONDITION
    evidence: "[NIKL 제19항 해설 p.57~60], [보충1 p.5] 중세국어 어름/어룸 박스, [NIKL 제57항 해설] 거름/걸음, 노름/놀음 구별쌍"
    design_hint: "현대 규칙(제19항)을 보기에서 제공한 뒤 중세국어 파생 접미사/명사형 어미 문항과 연결하는 3단 구성(2025 7번과 같은 방식). 새 어간(교과서 밖)으로 본뜻 유지 여부를 판정하게 한다."
    confidence: HIGH
    outside_textbook_variation: "교사의 어름/어룸과 NIKL의 얼음/걸음/거름은 같은 형태소 분석 주제로 이어진다. 교과서에 없는 단어 쌍이 많아 변별력이 높다."
    morpheme_analysis_needed: true
    confusing_expression: "거름은 걷다의 어간에 -음이 결합했으므로 걸음으로 적어야 한다(본뜻 유지 판정 반전)"
  - id: C-037
    unit: 한글맞춤법
    concept: "제27항 붙임: 어원이 불분명하면 원형을 밝히지 않음 (며칠, 할아버지, 아재비), 간니·덧니의 니"
    school_emphasis: MID
    confusion: "며칠을 '몇+일'로 분석해 몇일로 쓴다. [며딜]로 소리 나야 한다는 발음 근거(몇 월 [며둴])를 모른다."
    cause: TERM_CONFUSION
    evidence: "[NIKL 제27항 붙임2 해설 p.75~77], [2025노트 §8-4 서답2] 며칠/몇일 탐구 서술형"
    design_hint: "탐구 과정(표기→발음→음운 변동) 서술형은 이미 출제됨. 다른 어원 불분명 단어(할아버지 등)로 변형하되 같은 서술 틀(음운 변동 종류 고르기)을 쓰면 중복 출제로 오해받을 수 있다."
    confidence: MEDIUM
    outside_textbook_variation: "2025 기출이 며칠이었으므로 2026에서는 다른 단어(오라비, 아재비 계열)나 접두사 새-/시- 구별이 나올 수 있다고 추정한다."
    morpheme_analysis_needed: true
    confusing_expression: "며칠은 몇+일의 결합이지만 발음이 [며칠]이므로 소리대로 적었다(분석의 방향 반전)"
  - id: C-038
    unit: 한글맞춤법
    concept: "제30항 사이시옷의 성립 조건: 합성어(파생어 제외) + 고유어 포함(외래어 제외) + 된소리/ㄴ 덧남/ㄴㄴ 덧남, 한자어는 두 음절 6개만(곳간, 셋방, 숫자, 찻간, 툇간, 횟수)"
    school_emphasis: MID
    confusion: "발음이 된소리이면 무조건 사이시옷을 적으며, 한자어끼리의 합성어(개수, 초점, 전세방)나 외래어 포함어(오렌지빛)에도 적는다."
    cause: MULTI_CONDITION
    evidence: "[NIKL 제30항 해설 p.80~83], [2025노트 §8-2 10번] 3조건 분류 문항(4.0점)"
    design_hint: "세 조건 외에 '합성어인가, 고유어 포함인가, 외래어 불포함인가'를 시험지에 규칙으로 제공하고 단어를 분류하게 한다. 새 단어(교과서 밖)로 만들되 한자어 6개 예외를 오답 장치로 쓴다."
    confidence: HIGH
    outside_textbook_variation: "NIKL 예(고양잇과, 햇빛, 절댓값, 죗값, 등굣길, 보랏빛)는 교과서 밖 단어가 많다. 분류 문항은 형태소 분석(합성어/파생어, 고유어/한자어/외래어 판별)이 반드시 필요하다."
    morpheme_analysis_needed: true
    confusing_expression: "해님은 해와 님의 합성어이므로 햇님으로 적는다(파생 접미사를 합성 요소로 오독)"
  - id: C-039
    unit: 한글맞춤법
    concept: "사이시옷 헷갈림 쌍: 윗길·윗물 vs 위턱·위쪽, 그넷줄 vs 가로줄, 고양잇과 vs 외과·국어과, 찻잔(차를 고유어로 처리), 갯수(×) 개수, 촛점(×) 초점, 전셋방(×) 전세방"
    school_emphasis: NONE
    confusion: "같은 어근이 결합하는데 뒷말 첫소리에 따라 사이시옷이 갈리는 쌍(윗길/위쪽)과, 한자어 '과'의 앞말이 고유어인지에 따라 갈리는 쌍(고양잇과/외과)을 외우지 못한다."
    cause: EXCEPTION_RULE
    evidence: "[NIKL 제30항 해설 p.82~83] 더 알아보기 '차의 사이시옷 표기'"
    design_hint: "정오 판단 문항에서 쌍 중 하나를 오답으로 두고 이유를 조건(된소리/ㄴ 덧남 여부, 앞말 성격)으로 설명하는 선지를 만든다. 오류 위치 찾기 형태로 일기글에 섞는 방식도 가능(2025 9번 구성)."
    confidence: HIGH
    outside_textbook_variation: "NIKL 해설에 교과서보다 많은 쌍 예시가 있다. 학생이 일상에서 오용하는 단어(갯수, 촛점)를 오답으로 쓰는 것이 자연스럽다."
    morpheme_analysis_needed: true
    confusing_expression: "찻잔은 한자어 茶盞이므로 사이시옷을 적지 않는다(차의 고유어 처리 기준과 충돌)"
  - id: C-040
    unit: 한글맞춤법
    concept: "제31항 ㅂ·ㅎ 덧남은 소리대로(볍씨, 햅쌀, 살코기, 수캐, 수탉, 안팎, 암탉), 수고양이·암고양이는 ㅎ 덧남 아님"
    school_emphasis: MID
    confusion: "ㅎ이 덧나는 단어와 안 나는 단어(수고양이)를 구별하지 못하고, 모든 수/암 합성어에 ㅎ 을 적는다."
    cause: EXCEPTION_RULE
    evidence: "[NIKL 제31항 해설 p.83~84], [보충1 p.4] 현대어 ㅎ종성 체언 흔적 표(안팎, 살코기, 수탉 등)"
    design_hint: "중세 ㅎ종성 체언 문항과 연결해 '현대어 화석 단어 중 ㅎ 흔적이 있는 것'을 분류하게 한다. 수고양이 등 예외 단어를 오답에 둔다."
    confidence: HIGH
    outside_textbook_variation: "학교 자료의 현대어 화석 표가 맞춤법 제31항 예와 거의 겹친다. 두 단원을 잇는 학교 의도로 보이며(추정), 교과서 밖 어휘(암캉아지, 수키와)로 변형 가능하다."
    morpheme_analysis_needed: true
    confusing_expression: "수고양이는 수ㅎ+고양이이므로 수코양이가 표준 표기이다(ㅎ 흔적 일반화)"
  - id: C-041
    unit: 한글맞춤법
    concept: "제34~35항 준말: ㅏ·ㅓ 어간은 반드시 준 대로(가아→가, 서어→서), ㅐ·ㅔ 어간은 줄지 않는 것도 허용(매어/매), ㅗ·ㅜ 어간은 둘 다 허용, 되어→돼, 뵈어→봬, 놓아→놔 (좋아→좌 아님), 오아→와 만 허용"
