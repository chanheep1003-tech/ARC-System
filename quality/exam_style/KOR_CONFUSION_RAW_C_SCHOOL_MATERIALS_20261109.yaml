    - "이미지: 보충1 PDF 를 pymupdf 로 렌더링해 표(초성·중성·변천·격조사·의미 변화)와 p.9 연습 문항을 육안 판독. 작업물은 /tmp/claude-0/kor_school/ 아래에만 저장."
