# KOR_CONFUSION_RAW_C_SCHOOL_MATERIALS_20261109
# 동북고 1학년 공통국어2 기말(3단원: 중세국어·한글 맞춤법) 학교 보충자료 + 국립국어원 해설 정리 (원자료 C)
# 학교 저작물이므로 원문을 옮기지 않고 구조·강조점만 서술한다. 따옴표 인용은 모두 15자 이내.
# 사용 목적: ARC N 문항 설계 시 출제 가능성이 높은 지점과 헷갈리는 지점을 가늠하는 지도. 문항 원문 복제 금지(D-21).
