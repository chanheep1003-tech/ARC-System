    morpheme_analysis_needed: true
    confusing_expression: "문을 힘껏 닫쳤다와 문이 저절로 닫혔다를 모두 닫히다로 적는다(피동/강세 혼동)"
summary_for_coordinator:
  key_findings:
    - "학교 보충자료는 규칙 + 예시 표 + 어절별 문법 주석 + 연습 2문항(보기와 현대어 풀이) 구조이며, 별표 박스로 따로 강조한 곳은 어두자음군 vs ㅅ계 된소리, ㄱ종성 체언의 비교 조사 예외, 명사형 어미 vs 파생 접미사 세 군데다."
    - "연습 2문항의 정답(부적절 선지)은 목적격 조사의 결정 조건을 모음조화로 둔갑시킨 서술과 보미를 관형격으로 본 서술이며, 2025 기출의 한정어·시기 바꿔치기 장치와 같은 방향이다."
    - "맞춤법 분량은 NIKL 해설에서 기출(총칙, 띄어쓰기, 사이시옷, 며칠)과 이어지는 예외·붙임(제5~7, 10~12, 19, 27, 30, 31, 34~42, 47, 57항)을 우선했다."
  caveats:
    - "교과서 원문 미열람, 시범 10p는 제3자 노트, NIKL 제13~18항·제22~26항은 미독, 스캔 OCR에 고어 글자 노이즈가 있다."
