library_id: ARC_EXAM_STRUCTURE_LIBRARY_V1.0
version: 1.0
date: 2026-11-08
status: ACTIVE_DEV
decision: D-22/D-23
purpose: >
  난이도별로 실제 시험이 쓰는 문항 구조(템플릿)를 등록한다. ARC N 문항은 template 코드를 기록해야 하고,
  라벨(D2/D3/D4)은 템플릿이 허용하는 범위 안이어야 한다. 구조 점수(structure score)는 판단 횟수·자료 가공·비교 대상 수·계산을
  세는 결정적 지표이며, AI 풀이자의 체감 난이도와 별개로 문항 구조의 난이도 하한을 확인한다.
evidence:
  - quality/exam_style/README_EXAM_STYLE_SUMMARY_20261108.md
  - quality/exam_style/SOC_MOCK_AND_HAKPYEONG_STYLE_NOTES_20261108.md
  - quality/exam_style/ETHICS_LIVING_ETHICS_STYLE_NOTES_20261108.md
  - quality/exam_style/DONGBUK_SCI_KOR_2025_2_STYLE_NOTES_20261108.md
  - quality/exam_style/SOC_DONGBUK_2025_2_FINAL_STYLE_NOTES_20261108.md
note: >
  KOR 템플릿의 difficulty 범위는 D-25 기출 대응 등급(reference.tier)을 포함하도록 2026-11-09에 정렬했다.
  KOR 템플릿의 reference 는 동북고 2025-2 기말 공통국어2 실제 문항의 배점 대역(3.5~3.7=D2, 3.8~3.9=D3, 4.0~4.2=D4, 사용자 승인 전 제안값)으로 정한 기출 대응 등급이다. reference 가 없는 KOR 템플릿(K8, K11~K13 등 확장형)은 D3 를 넘는 라벨을 받을 수 없다.
  difficulty 범위는 출제 방식 분석에서 나온 가설이다(PROVISIONAL). observed_solver 는 이 시스템에서 실제 AI 풀이자 평가를 받은 표본이며
  표본이 1~3개이므로 범위를 바꾸는 근거가 아니라 참고값이다.

structure_score:
  # 문항 필드에서 읽는 결정적 지표. 합산 점수 → 구조 밴드.
  weights:
    reasoning_steps: 1.0        # item.reasoning_steps (최대 5까지 인정)
    table_or_diagram: 1.0       # item.table 있음, 또는 view 에 [그림] 도식
    long_material: 1.0          # view 줄 수 4 이상
    statements_3: 1.0           # ㄱㄴㄷ/학생 A~C/㉠~ 판단 진술 3개 이상
    statements_4: 1.0           # 추가: 4개 이상
    entity_extra: 1.0           # 사상가/주체 등 비교 대상 수가 2 이상이면 1, 3 이상이면 2 (entity_terms 기준)
    computation: 2.0            # 템플릿이 computation: true
    low_elimination: 1.0        # immediate_elimination <= 1
    exception_rule: 1.0        # KOR: item.exception_rules 개수(최대 2)
    large_table: 1.0           # KOR: 표 칸 수 12 이상
    supplied_concept: 1.5       # item.supplied_concepts 가 있고 view 에서 정의를 주어 학생이 추론해 적용하게 한 경우(D-24)
  bands:
    D2: [0, 6.0]                # score <= 6.0
    D3: [6.0, 9.0]              # 6.0 < score <= 9.0
    D4: [9.0, 99]               # score > 9.0
  calibration_note: >
    밴드 경계는 SOC S2 v1~v3 60문항의 구조 점수와 AI 풀이자 라벨 분포를 비교해 정한 잠정값이다(tooling/production/test_item_structure_gate.py 참고).
    실제 학생 정답률 자료가 생기면 재보정한다. 측정: 구조 밴드와 AI 풀이자 라벨의 일치 45/60(75%), 불일치 14건 중 구조가 더 낮게 본 것이 6건, 더 높게 본 것이 8건.
  entity_terms:
    SOC: ["롤스", "노직", "밀", "매킨타이어", "자유주의", "공동체주의", "칸트", "베카리아", "벤담", "싱어", "왈처"]
    SCI: ["HCl", "NaOH", "H⁺", "OH⁻", "Na⁺", "Cl⁻"]
    KOR: []

feasibility:
  # 요청 단계에서 범위 대비 D4+ 비중이 가능한지 확인한다. 범위 프로필(scope_profile.subunit_count)이 필요하다.
  rule: "D45 cap = base_cap + per_extra_subunit × (subunit_count - 1), 최대 max_cap"
  base_cap: 0.10
  per_extra_subunit: 0.10
  max_cap: 0.40
  evidence: >
    SOC S2 한 소단원(Ⅱ-2, subunit_count=1) 20문항을 v1~v3 세 번 만들어 AI 풀이자 평가로 D4 0개였다. 같은 풀이자는 실제 동북고 기출 중
    단원 밖 지식(노동법)이 섞인 응답표만 D4로 평가했다. 동북고 SOC 4개 시험 전체의 D4+ 평균 비중은 약 22%(quality/anchors/SOC_DONGBUK_MULTI_EXAM_DIFFICULTY_ANCHOR_V1.0.yaml)로,
    시험 전체에서 달성하는 비중이지 한 소단원에서 나오는 비중이 아니다. 잠정값이며 사용자가 acknowledged 하면 넘어갈 수 있다.

