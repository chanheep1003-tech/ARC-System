supplied_concept_rule:
  # D-24: 교과서 밖 개념은 학생이 외웠다고 가정하지 않는다. 문항 안(view)에서 정의해 주고 적용·추론하게 하는 경우만 허용한다.
  allowed: "view 에 '~라 한다/라고 한다/를 뜻한다/를 의미한다' 형태로 정의를 주고, item.supplied_concepts 에 그 개념을 기록"
  definitional_markers: ["이라 한다", "라 한다", "라고 한다", "라고 부른다", "를 뜻한다", "을 뜻한다", "를 의미한다", "을 의미한다"]
  outside_terms:       # 천재 통합사회2 Ⅱ-2 본문에서 확인되지 않은 용어(2026-11-08 Drive 검색 기준, 불확실하면 목록에 둔다)
    SOC: ["원초적 입장", "무지의 베일", "정형적 분배", "역사적 원리", "응분", "최소국가", "최소 국가", "축차적", "공정한 기회균등", "형식적 기회균등"]
    SCI: []
    KOR: []

kor_combined_basis:
  # D-25: 국어 맞춤법/문법/중세국어는 AI 풀이자 난이도가 포화(SOLVER_SATURATED)이므로 request_spec.difficulty_basis: KOR_COMBINED_V1 일 때
  # 기출 대응 + 구조 점수 + 오답 유도 3축의 최저 등급을 문항 난이도로 본다. 풀이자 난이도는 참고(advisory)다.
  levels:
    reference: "템플릿 reference.tier (reference 없는 템플릿은 D3 상한). D4 라벨은 item.reference_exam_item 에 같은 기출 문항 id 를 기록해야 한다"
    structure: "structure score 밴드(D2 ≤6, D3 ≤9, D4 >9)"
    misconception: "경쟁(STRONG/MEDIUM) 오답 중 misconception 코드가 붙은 수: 0~1개 D2, 2개 D3, 3개 이상 D4"
    exception: "D4 는 item.exception_rules 가 1개 이상이어야 한다(없으면 D3 상한)"
    novelty: "교과서 밖 낯선 예문·단어(item.novel_examples): 0개 D2, 1개 D3, 2개 이상이면서 item.morpheme_analysis 가 true(형태소 경계 분석 필요)이면 D4 (D-26)"
  assessed_level: "min(reference, structure, misconception, exception, novelty)"
  fail_if: "라벨 > assessed_level"
