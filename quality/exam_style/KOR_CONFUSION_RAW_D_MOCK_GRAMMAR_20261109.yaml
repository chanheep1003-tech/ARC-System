    downscale_hint: "고1은 규칙 2개(받침 뒤, 관형사형 뒤)만 쓰고, 단어를 짧은 구로 보이며, 조항 이름을 규칙 카드로 준다."
    out_of_scope: false
    confidence: MEDIUM
    morpheme_analysis_needed: true
    outside_textbook_variation: "문장 속 신문, 얹지만, 훑었다처럼 용언 어간+어미 단어를 골라 조항이 서로 다른 된소리를 넣는다"
    confusing_expression: "표면은 모두 된소리인데 근거 조항 번호만 다르다"

  - id: D-009
    unit: 음운
    concept: "보기에 제시된 표준 발음 조항으로 답할 수 없는 질문 가려내기 (Step A 음운 10)"
    killer_structure: "'보기로 답변하기 어려운 것'을 묻는다. 5개 질문 중 4개는 보기의 조항 3개로 답할 수 있고 1개는 보기 밖(예: 표기 그대로 읽는 단어 판별)이라 보기 범위를 정확히 알아야 풀 수 있다."
