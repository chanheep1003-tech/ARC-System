    morpheme_analysis_needed: true
    outside_textbook_variation: "흙일, 넓죽하다, 직행열차, 꽃잎도, 널따랗다 같은 합성/파생어와 조사 결합 단어를 쓴다"
    confusing_expression: "조항 기호 ⓐ~ⓕ 조합이 한 칸 차이로 비슷하다"

  - id: D-008
    unit: 음운
