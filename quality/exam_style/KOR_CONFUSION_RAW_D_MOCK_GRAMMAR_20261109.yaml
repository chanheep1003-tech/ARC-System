  overlap_inventory:
    note: 번호는 교재 Step 내부 문항 번호다. 개수는 읽힌 범위 안의 개수다.
    음운변동_표준발음: "Step A 음운 07~44 중 약 33문항(구조 분석 대상 아닌 자음·모음 체계 13, 22, 23 제외), Step B 음운 06, 08, 09 등 약 4문항"
    사이시옷: "Step A 음운 12 (1문항). 사이시옷 표기 규정 자체를 묻는 문항은 읽힌 범위에 없음"
    한글맞춤법_띄어쓰기: "Step A 단어 10, 13, 14, 15 (4문항). 맞춤법 중 두음 법칙, 소리대로/어법 표기, 사이시옷 표기 규정 문항은 읽힌 범위에 없음"
    중세국어_국어사: "국어사 도전문제 01~05 (5문항), Step A 단어 07 (ㅎ·ㅂ 흔적 접두사), Step B 음운 07, 09 (통시적 변화 2문항)"
    killer_level_distribution_in_entries: "entries 40개 중 level 3 = 24개, level 2 = 14개, level 1 = 2개. 정답률이 없는 구조 기반 추정이라 level 3 이 많은 것은 읽은 범위가 Step B와 도전문제 중심인 영향도 있다"
  killer_level_definition:
    1: 보통. 규칙 하나를 한 번 적용하거나 개념 확인 수준.
    2: 어려움. 규칙 둘 이상을 교차하거나 표·조건을 대조해야 함.
    3: 킬러. 새 규칙/정의를 읽고 여러 예에 동시 적용, 변동 횟수·개수 세기, 5개 선지 각각이 다중 판단을 요구함.

entries:

  - id: D-001
    unit: 음운
    concept: "동화의 방향(순행/역행)과 결과(완전/부분)를 한 문항에서 함께 판정 (Step A 음운 17, 31)"
    killer_structure: "한 단어에 대해 방향과 결과라는 두 속성을 동시에 맞혀야 하고, 선지 5개가 모두 단어 2개의 속성 쌍이라 판단 10개가 걸린다."
    confusion: "'달+는'처럼 먼저 ㄹ 탈락을 한 뒤 남은 소리를 두고 동화 방향을 말하거나, 칼날[칼랄]과 물난리[물랄리]를 같은 방향으로 본다."
    killer_level: 2
    correct_rate: NONE
    distractor_pattern: "맞는 방향에 틀린 결과를 붙이거나, 두 단어 중 한쪽만 틀린 속성을 넣는다. '모두 순행' 같은 일반화 문장(KM02)과 물난리처럼 순행과 역행이 같이 일어나는 단어를 끼운다."
    downscale_hint: "고1은 순행/역행 한 속성만 묻고, 단어는 신라, 종로, 국물 정도로 제한한다. 방향을 화살표 표로 주고 학생이 표를 읽게 한다."
    out_of_scope: false
    confidence: MEDIUM
    morpheme_analysis_needed: true
    outside_textbook_variation: "교과서 예시 대신 달+는, 칼날, 물난리처럼 변동이 겹치는 합성/활용 단어를 쓴다"
    confusing_expression: "순행/역행과 완전/부분 같은 쌍 개념이 한 선지에 함께 들어간다"

  - id: D-002
    unit: 음운
    concept: "보기에서 비음화의 범위를 넓게 새로 정의한 뒤 사례에 적용 (Step A 음운 25)"
    killer_structure: "보기가 'ㄹ→ㄴ' 도 비음화에 포함한다고 교과서와 다른 정의를 주고, 학생이 그 정의대로 종로, 국물, 입는, 믿는, 떡 만들다 를 분류해야 한다."
    confusion: "교과서의 비음화 정의(파열음→비음)와 보기의 확장 정의가 충돌하여, 종로[종노]를 비음화로 보는 순간 당황한다."
    killer_level: 3
    correct_rate: NONE
    distractor_pattern: "확장 정의를 무시하고 종로[종노]를 유음화나 다른 현상으로 말하는 선지, 방향이 다른 비음화를 '방향이 모두 같다'로 단정하는 선지(KM08, KM02)."
    downscale_hint: "범위를 넓히는 새 정의 대신, 고1은 '보기가 준 용어 정의 한 줄'을 읽고 단어 3개에 적용하게 한다. 정의는 교과서와 충돌하지 않게 짠다."
    out_of_scope: false
    confidence: MEDIUM
    morpheme_analysis_needed: true
    outside_textbook_variation: "떡 만들다처럼 두 단어 사이, 입는, 믿는 같은 활용형을 써서 어간 끝 받침을 먼저 판단하게 한다"
    confusing_expression: "비음화라는 같은 이름이 방향·조건이 다른 현상에 붙는다"

  - id: D-003
    unit: 음운
    concept: "음운 변동 순서 (자음군 단순화 → 음절의 끝소리 규칙 → 비음화) (Step A 음운 25 흙만, 있는; 39 규칙 순서)"
    killer_structure: "겉으로는 한 번에 일어난 것처럼 보이는 발음을 변동 2~3단계로 쪼개서, 어느 단계가 먼저인지 규칙 순서를 묻는다."
    confusion: "흙만[흥만]을 ㄱ+ㅁ 비음화 한 번으로 보고, 앞에서 ㄹ이 탈락한 단계를 놓친다."
    killer_level: 3
    correct_rate: NONE
    distractor_pattern: "순서를 뒤집은 선지('비음화가 먼저 일어난 뒤 ㄹ 탈락'). 한 단계를 빼먹은 선지. 어떤 규칙이 다른 규칙의 조건을 만든다는 문장을 '서로 무관하다'로 바꾸는 선지."
    downscale_hint: "고1은 2단계(끝소리 규칙 → 비음화: 있는, 부엌만)까지만 쓴다. 단계 표를 빈칸으로 주고 순서 번호를 채우게 한다. 자음군 단순화 단계는 쓰지 않는다."
    out_of_scope: false
    confidence: MEDIUM
    morpheme_analysis_needed: true
    outside_textbook_variation: "흙만, 있는 같은 겹받침 또는 ㅆ 받침 어간+어미 단어를 써서 어간 받침 확인을 요구한다"
    confusing_expression: "'~가 먼저 일어난다'와 '~로 인해 일어난다'처럼 선후와 인과가 한 문장에 섞인다"

  - id: D-004
    unit: 음운
    concept: "변동 전후 음운 개수 세기 (Step A 음운 21, 43; Step B 음운 08)"
    killer_structure: "단어마다 교체, 탈락, 첨가, 축약이 몇 번 일어나는지와 음운이 몇 개 늘고 줄었는지 두 가지를 선지 한 줄에서 동시에 판단하며, 실수 하나가 정답을 바꾼다."
    confusion: "칡하고[치카고]처럼 겹받침 탈락과 거센소리되기가 겹치면 개수 감소를 -1 로 센다(실제로는 -2). 축약이 1회 일어난 걸 교체로 센다."
    killer_level: 3
    correct_rate: NONE
    distractor_pattern: "유형은 맞게 쓰고 개수만 한 개 틀리게 한 선지(KM12). '각각 두 개 줄었다'처럼 두 단어에 같은 숫자를 붙여 한쪽만 틀리게 만든다."
    downscale_hint: "고1은 단어 1~2개, 변동 1~2회로 제한한다. 보기에서 '음운 개수 = 자모 개수에서 센다' 계산법을 정의하고, 개수 표를 직접 채우게 한 뒤 선지는 '맞는 것'에서 고른다."
    out_of_scope: false
    confidence: MEDIUM
    morpheme_analysis_needed: true
    outside_textbook_variation: "칡하고, 죽하다, 설익다 같은 접미사/접두사 결합 단어로 교과서에 없는 변동 조합을 만든다"
    confusing_expression: "'교체 및 축약', '탈락 및 첨가'처럼 유형 조합 이름과 숫자를 함께 쓴다"

  - id: D-005
    unit: 음운
    concept: "단어 쌍 비교로 변동 유형, 횟수, 첨가 음운, 개수 변화를 가려내기 (Step B 음운 08)"
    killer_structure: "선지 5개가 모두 단어 쌍(훑는/없는, 알약/밭이랑, 겉도는/샀는데, 닭과/닭이, 먹히다/굳히다) 비교라 각 선지에 변동 분석 2개가 들어 있다. 총 판단 10건이다."
    confusion: "닭과[닥꽈]에서 자음군 단순화 뒤 된소리되기가 일어나 개수가 줄어드는데, 닭이[달기]는 변동이 없다는 대조를 놓친다. 먹히다는 ㄱ+ㅎ 축약만 있고 굳히다는 축약 뒤 구개음화까지 있다."
    killer_level: 3
    correct_rate: NONE
    distractor_pattern: "두 단어가 같은 횟수라는 선지와 다르다는 선지를 한 항에 섞는다. 첨가되는 음운이 같다/다르다를 반대로 말한다."
    downscale_hint: "고1은 쌍 비교를 3개 선지로 줄이고 단어는 닭이/닭과, 밭이랑/밭만 등 변동이 선명한 것으로 한정한다. 비교 항목을 변동 횟수 한 가지로 고정한다."
    out_of_scope: false
    confidence: MEDIUM
    morpheme_analysis_needed: true
    outside_textbook_variation: "훑는, 겉도는, 샀는데처럼 어간 받침과 과거 시제 선어말 어미가 낀 단어를 쓴다"
    confusing_expression: "'변동 횟수는 다르나 첨가되는 음운은 동일'처럼 같고 다름이 한 문장에 겹친다"

  - id: D-006
    unit: 음운
    concept: "음운 규칙의 적용 순서와 선행 규칙이 후행 규칙의 조건을 만들거나 없애는 관계 (Step A 음운 39)"
    killer_structure: "보기가 규칙 순서라는 새 개념을 설명하고, 일-+-고, 뚫+-는, 갚-+-는, 졸-+-는, 알-+-으니 5개의 활용형에 각각 어느 규칙이 먼저인지를 적용한다."
    confusion: "놓고[노코]를 음절의 끝소리 규칙이 먼저라고 보면 [녿고]로 되는데 이 반례를 스스로 떠올리지 못한다. 알-+-으니의 ㄹ 탈락 뒤에 매개모음 탈락이 오는지 헷갈린다."
    killer_level: 3
    correct_rate: NONE
    distractor_pattern: "순서를 거꾸로 뒤집은 설명, '~가 먼저 적용되어야 한다'를 '~로 인해 적용된다'로 인과 방향만 바꾼 설명(KM08)."
    downscale_hint: "고1은 보기에서 규칙 순서 한 쌍(예: 끝소리 규칙 → 비음화)을 설명하고, 선후를 바꾸면 틀린 발음이 나오는 단어 2개만 판정하게 한다."
    out_of_scope: true
    confidence: MEDIUM
    morpheme_analysis_needed: true
    outside_textbook_variation: "일-+-고, 뚫+-는, 졸-+-는, 알-+-으니의 어간·어미 경계에서 규칙 순서를 묻는다"
    confusing_expression: "'선행 규칙이 후행 규칙을 막는다/가능하게 한다'를 반대로 바꾼 문장"

  - id: D-007
    unit: 음운
    concept: "표준 발음법 조항 여러 개(된소리, 비음화, ㄴ 첨가, 거센소리)를 단어 5개에 중복 매핑 (Step B 음운 06)"
    killer_structure: "보기 1이 조항 4~6개를 ⓐ~ⓕ 기호로 주고, 보기 2의 단어 5개(흙일, 넓죽하다, 직행열차, 꽃잎도, 널따랗다)가 각각 어느 조항 조합으로 발음되는지 판단하며, 한 단어에 조항이 2~3개 겹친다."
    confusion: "넓죽하다[넙쭈카다]에서 자음군 단순화, 된소리되기, 거센소리되기가 모두 일어나는데 둘만 센다. 직행열차[지캥녈차]처럼 거센소리와 ㄴ 첨가와 유음화가 이어지는 단어에서 조항 순서가 헷갈린다."
    killer_level: 3
    correct_rate: NONE
    distractor_pattern: "필요한 조항 하나를 빼거나 불필요한 조항 하나를 더한 조합. 기호 조합이 비슷해서(ⓑ, ⓒ vs ⓑ, ⓓ) 한 칸 차이로 속인다(KM12)."
    downscale_hint: "고1은 조항 3개(ⓐ 끝소리, ⓑ 비음화, ⓒ 된소리)와 단어 4개로 줄이고, 각 단어에 조항이 최대 2개만 걸리게 한다. 조항은 규정 번호 없이 쉬운 말로 준다."
