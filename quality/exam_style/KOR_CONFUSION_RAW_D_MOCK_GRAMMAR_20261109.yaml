    morpheme_analysis_needed: true
    outside_textbook_variation: "가+-아서, 퍼+-어서, 치르+-어도, 키+-어서처럼 어간 끝 모음과 어미 첫 모음의 결합을 쓴다"
    confusing_expression: "'동일 모음 탈락'과 '반모음 ㅣ 탈락'처럼 이름이 비슷한 현상"

  - id: D-018
    unit: 음운
    concept: "여러 변동이 겹친 단어 묶기 (읽는, 귤잎만, 밭이랑, 색연필의 공통 변동; 꽃잎, 엎는, 빚다…의 변동 분류) (Step A 음운 28, 30, 44)"
    killer_structure: "단어 4~6개에서 공통으로 일어나는 음운 변동을 찾거나 각 단어를 변동 분류 칸에 넣는 문항이다. 단어마다 변동이 2~3개이고 겹치는 변동이 서로 달라 교집합을 구해야 한다."
    confusion: "읽는[잉는], 귤잎만[굴림만], 밭이랑[반니랑], 색연필[생년필]이 모두 비음화를 포함한다는 걸 보지 못하고 '자음 탈락' 쪽으로 간다."
    killer_level: 2
    correct_rate: NONE
    distractor_pattern: "일부 단어에만 일어나는 변동을 공통이라고 말하는 선지(KM09). 같은 이름의 변동이 다른 조건에서 일어났다는 점을 무시한 선지."
    downscale_hint: "고1은 단어 3개에서 공통 변동 1가지(끝소리 규칙 또는 비음화)를 찾게 한다. 두 번 이상 변동되는 단어는 한 개만 넣는다."
    out_of_scope: false
    confidence: MEDIUM
    morpheme_analysis_needed: true
    outside_textbook_variation: "읽는, 귤잎만, 밭이랑, 색연필, 늦여름, 홑이불처럼 합성/파생과 조사 결합 단어를 섞는다"
    confusing_expression: "같은 이름의 변동이 다른 조건에서 일어난 것을 '공통'이라 부른다"

  - id: D-019
    unit: 중세국어
    concept: "구개음화의 통시적 사례와 공시적 사례 구별 (Step A 음운 26; Step B 음운 09)"
    killer_structure: "ㄷ 구개음화(디다>지다), ㄱ 구개음화(기름>지름), ㅎ 구개음화(힘>심), 구개음화가 일어나지 않은 예(마디, 기러기)를 한 보기에 놓고 어느 것이 역사적이고 어느 것이 형태소 내부/경계인지 분류한다."
    confusion: "마디[마디]와 기러기에서 구개음화가 일어나지 않은 이유를 '역사적으로 ㅣ가 아닌 모음에서 변화했기 때문'으로 설명하지 못하고 예외로 외운다. 밑이[미치]를 통시적 변화로 오해한다."
    killer_level: 3
    correct_rate: NONE
    distractor_pattern: "시기를 바꿔치기한 선지(KM03): 현대의 형태소 경계 구개음화를 역사적 구개음화로, 역사적 사례를 현대 사례로 설명. 형태소 내부와 경계 구분을 맞바꾼 선지(KM04)."
    downscale_hint: "고1은 ㄷ 구개음화 하나만 쓰고, 통시(디다>지다)와 공시(굳이[구지])를 두 칸 표로 구분한다. ㄱ, ㅎ 구개음화는 쓰지 않는다."
    out_of_scope: true
    confidence: MEDIUM
    morpheme_analysis_needed: true
    outside_textbook_variation: "기름>지름, 마디, 기러기, 딤치>김치처럼 현대 표준어와 옛 단어를 짝으로 보인다"
    confusing_expression: "'구개음화가 일어났다'와 '일어나지 못했다'를 이유와 함께 쓴다"

  - id: D-020
    unit: 중세국어
    concept: "모음 축약 현상의 통시적 변화(사이>새, 아이>애)와 장단 연결 (Step B 음운 07)"
    killer_structure: "새로운 글 한 편(모음 축약 개념)을 읽고 단모음 연쇄 축약, 이중 모음 축약, 방언 발음(메느리, 꽁)을 5개 선지에서 적용하며, 첫음절 장음 같은 비분절 음운 조건이 섞인다."
    confusion: "피+어서[피여서]가 축약인지, 단모음과 반모음의 축약인지 구분하지 못하고 장단 조건을 같이 챙기지 못한다."
    killer_level: 3
    correct_rate: NONE
    distractor_pattern: "학술적 용어(단모음 연쇄, 상향 이중 모음)를 맞바꾼 서술. 첫음절 장음 조건을 무시한 서술."
    downscale_hint: "쓰지 않는다. 필요하면 '사이>새' 한 쌍만 보여 주고 음운 개수가 줄었다는 사실만 묻는다."
    out_of_scope: true
    confidence: LOW
    morpheme_analysis_needed: false
    outside_textbook_variation: "며느리>메느리, 꿩>꽁처럼 방언형과 표준형을 대비한다"
    confusing_expression: "'단모음 연쇄의 축약'과 '이중 모음 축약'처럼 용어가 비슷하다"

  - id: D-021
    unit: 음운
    concept: "음성 인식 기술 지문과 음운/음성 개념 융합 (Step B 음운 11, 12)"
    killer_structure: "두 개의 보기 지문(기준 패턴, 음소 추정 구간, 특징 벡터)을 읽고 꽃병, 닭가슴살의 구간 개수 등 사례에 적용하는 융합 문항으로, 용어가 모두 낯설다."
    confusion: "음운(심리적, 분절)과 음성(물리적, 연속)의 차이를 개념으로는 알아도 기술 지문의 용어에 적용하지 못한다. 구간 개수를 음운 개수와 같다고 단정한다."
    killer_level: 3
    correct_rate: NONE
    distractor_pattern: "지문의 정의를 반대로 사용한 추론. 사람마다 다른 정보를 쓴다/쓰지 않는다를 맞바꾼 선지."
    downscale_hint: "고1은 지문에서 낯선 용어를 정의로 주고(D-24 공급 자료 추론), 음운 개수 세기(꽃병 6개) 한 가지만 적용하게 한다. 기술 용어는 2개 이하."
    out_of_scope: true
    confidence: MEDIUM
    morpheme_analysis_needed: false
    outside_textbook_variation: "꽃병, 닭가슴살, 오디오/오지오처럼 기술 지문 속 새 예시를 쓴다"
    confusing_expression: "음운/음성, 구간/음소 같은 비슷한 용어가 연속된다"

  - id: D-022
    unit: 한글맞춤법
    concept: "데/지(의존 명사 vs 연결 어미)와 보조 용언 띄어쓰기 (Step A 단어 10)"
    killer_structure: "사전 뜻풀이로 데, 지의 의존 명사와 어미 구별 기준을 주고, 문장 5개에서 띄어쓰기 표시(V)가 적절하지 않은 것을 고르는데, 한 문장에 데/지, 의존 명사, 보조 용언 '않다/못하다' 판단이 2~3개 겹친다."
    confusion: "'건넜는데'의 -는데는 어미인지, '다하는데 이틀'의 데는 의존 명사인지를 문맥으로 구분하지 못하고, 부정 보조 용언 '않니', '못했어'를 띄어야 하는지 붙이는지 헷갈린다."
    killer_level: 3
    correct_rate: NONE
    distractor_pattern: "붙여야 할 어미를 띄어 쓰거나, 띄어야 할 의존 명사를 붙여 쓰는 표기 변형(KM01, KM11). 한 문장 안에 맞는 띄어쓰기와 틀린 띄어쓰기를 섞는 정오 혼합(KM11)."
    downscale_hint: "고1은 규정 카드(제41항 조사, 제42항 의존 명사)를 주고, 데/지는 ㄴ 데 한 쌍(의존 명사 '곳')만 쓴다. 문장 4개에서 틀린 띄어쓰기를 찾게 하며 보조 용언은 뺀다."
    out_of_scope: false
    confidence: MEDIUM
    morpheme_analysis_needed: true
    outside_textbook_variation: "데/지를 의존 명사와 어미로 사전 뜻풀이와 함께 제시하고 낯선 문장 5개에 적용한다"
    confusing_expression: "표면이 같은 데/지가 의존 명사와 어미로 번갈아 나온다"

  - id: D-023
    unit: 한글맞춤법
    concept: "만큼, 대로 등 조사와 의존 명사 구분, 본용언/보조 용언 구분 (Step A 단어 14)"
    killer_structure: "띄어쓰기 규정 4개를 주고 문장 5개를 탐구하는 선지에서 만큼(의존 명사/조사), 적어 둔다(보조 용언), 들고 가셨다(둘 다 본용언), 못하다(형용사)를 동시에 판정한다."
    confusion: "공부할 만큼(의존 명사, 띄어 씀)과 대궐만큼(조사, 붙여 씀)을 앞말이 체언인지 용언인지로 구분하지 못한다. 들고 가셨다에서 '가다'가 보조 용언이라고 오해한다."
    killer_level: 2
    correct_rate: NONE
    distractor_pattern: "표면이 같은 조사와 의존 명사의 띄어쓰기를 서로 바꾼다(KM01). 보조 용언 여부를 틀리게 규정한 선지."
    downscale_hint: "고1은 만큼/대로/뿐 중 하나를 골라, 앞말이 체언이면 조사(붙임), 관형어 뒤이면 의존 명사(띄움)라는 판정 표를 주고 문장 3개를 분류하게 한다."
    out_of_scope: false
    confidence: HIGH
    morpheme_analysis_needed: true
    outside_textbook_variation: "만큼/대로를 앞말 품사로 가려내고, 적어 둔다, 들고 가셨다처럼 본용언/보조 용언 경계를 묻는다"
    confusing_expression: "같은 '만큼'이 조사인지 의존 명사인지 표면으로 구분되지 않는다"

  - id: D-024
    unit: 한글맞춤법
    concept: "보조 용언 띄어쓰기의 원칙과 허용, 그리고 예외 조건 (Step A 단어 15)"
    killer_structure: "보기에 '원칙은 띄움, 허용은 붙임, 합성 용언 뒤는 띄움, 아/어 이외 연결 어미 뒤는 띄움'이 조건 4개로 주어지고 ㉠~㉤ 표기를 원칙과 허용으로 대응시킨다."
    confusion: "'덤벼들어보아라'가 합성 용언 뒤라 붙이면 안 되는 이유와 '먹어버렸다'가 허용이어서 붙일 수도 있다는 점을 한 번에 가려내지 못한다."
    killer_level: 3
    correct_rate: NONE
    distractor_pattern: "'붙여 써야만 하는군', '띄어 써야만 하는군'처럼 허용이 있는 항목에 필연성 한정어를 붙인 선지(KM02, KM09). 합성 용언 조건을 놓친 선지."
    downscale_hint: "고1은 '원칙은 띄운다, 붙여도 된다' 두 문장만 주고, '~야만' 같은 단정이 허용 규정과 충돌하는지 판단하게 한다. 합성 용언 조건은 뺀다."
    out_of_scope: true
    confidence: HIGH
    morpheme_analysis_needed: true
    outside_textbook_variation: "덤벼들어보아라, 들고가다, 먹어버렸다처럼 합성 용언과 연결 어미 경계를 묻는다"
    confusing_expression: "'붙여 써야만 하는군'처럼 허용과 원칙을 필연성 표현으로 단정한다"

  - id: D-025
    unit: 한글맞춤법
    concept: "단위를 나타내는 명사의 띄어쓰기(의존 명사 vs 일반 명사가 단위로 쓰임) (Step A 단어 13)"
    killer_structure: "의존 명사로만 쓰이는 단위(군데, 명)와 일반 명사이면서 단위로도 쓰이는 단어(사람, 뿌리, 자루, 발)를 보기에서 구분하고 선지 5개에서 해당하는 사례를 고른다."
    confusion: "'다섯 사람'의 사람이 의존 명사가 아니라 일반 명사라는 사실, '파 한 뿌리'의 뿌리가 단위로 쓰이는 일반 명사라는 사실을 구별하지 못한다."
    killer_level: 2
    correct_rate: NONE
    distractor_pattern: "일반 명사가 단위로 쓰이는 예를 의존 명사 사례로 넣는 선지(KM04)."
    downscale_hint: "고1은 의존 명사 단위(개, 명, 권)와 일반 명사(사람)를 표에서 구분하게 하고, 띄어쓰기는 모두 '수 관형사+단위=띄움'으로 통일한다."
    out_of_scope: false
    confidence: LOW
    morpheme_analysis_needed: false
    outside_textbook_variation: "파 한 뿌리, 옥수수 열 자루처럼 교과서에 없는 단위 표현을 쓴다"
    confusing_expression: "일반 명사가 단위로 쓰이는 경우와 의존 명사가 형태가 같다"

  - id: D-026
    unit: 중세국어
    concept: "접두사의 통시적 이형태: 중세 국어 ㅎ 종성 체언과 ㅂ 흔적 (암돼지, 수탉, 햅쌀, 멥쌀) (Step A 단어 07)"
    killer_structure: "'암ㅎ' 형태의 흔적을 알려 주는 보기에서 통시적 변화의 결과로 이형태가 생긴 것과 모음 대립처럼 공시적 차이를 구분한다."
    confusion: "새빨갛다/시뻘겋다처럼 모음 대립 차이를 통시적 변화로 보거나, 햅쌀의 ㅂ을 현대어의 단순한 첨가로 본다."
    killer_level: 2
    correct_rate: NONE
    distractor_pattern: "표면적으로 같은 모양의 접두사 쌍(해콩-햅쌀, 휘갈기다-휩싸이다)을 섞어서 흔적인지 단순 이형태인지 가린다(KM03)."
    downscale_hint: "고1은 암+ㅎ(암탉, 암캐) 한 가지의 흔적만 쓰고, 중세 국어 ㅎ 종성 체언이라는 설명을 보기에 줘서 현대어 단어에 적용하게 한다."
    out_of_scope: true
    confidence: LOW
    morpheme_analysis_needed: true
    outside_textbook_variation: "암돼지, 수탉, 햅쌀, 멥쌀처럼 접두사+어근 결합에 숨은 통시적 형태를 묻는다"
    confusing_expression: "'접두사의 이형태'와 '어근의 변화'가 같은 말처럼 쓰인다"

  - id: D-027
    unit: 중세국어
    concept: "중세 국어 관형격 조사(ㅣ, 의/의, ㅅ)의 선택 조건 (Step A 국어사 04)"
    killer_structure: "보기 1이 관형격 조사를 명사의 유정/무정, 높임 여부, 끝음절 모음 양성/음성으로 구분한 표를 주고, 보기 2의 중세어 문장 5개(노미, 거붑의, 大王ㅅ, 나모ㅅ 등)에 동시에 적용한다."
    confusion: "끝음절 모음의 양성/음성과 유정/무정 기준 중 무엇을 먼저 보는지 몰라 ㅣ와 의를 혼동하고, 높임 대상을 사람이면 무조건 ㅅ으로 놓는다."
    killer_level: 3
    correct_rate: NONE
    distractor_pattern: "표의 조건 한 칸을 바꾼 대응(예: 무정물에 ㅣ), 현대어 풀이를 중세어 문법과 어긋나게 연결(KM05, KM08)."
    downscale_hint: "고1은 표를 2×2(유정물 평칭 ㅣ, 높임 ㅅ, 무정물 ㅅ)로 줄이고, 양성/음성 구분은 빼며, 문장 3개에 적용하게 한다. 이 구조가 고1 3단원에 가장 잘 이식되는 킬러다."
    out_of_scope: false
    confidence: MEDIUM
    morpheme_analysis_needed: false
    outside_textbook_variation: "원문 구절은 교재 밖 자료(노미 뜻, 거붑의, 大王ㅅ 등)를 보기로 제시한다"
    confusing_expression: "'끝음절 모음 + 유정 여부 + 높임' 세 기준이 표 안에 섞여 있다"

  - id: D-028
    unit: 중세국어
    concept: "아래아, ㅿ, ㅸ의 소실과 변화 양상 (Step A 국어사 03)"
    killer_structure: "ㆍ가 첫음절에서는 ㅏ로, 둘째 음절에서는 ㅡ로 변한 사실(무술>마을), ㅿ와 ㅸ의 소실과 ㅸ>ㅗ/ㅜ 변화 자료를 주고, 이를 현대어 활용(ㅂ 불규칙)과 연결해 판단한다."
    confusion: "ㆍ가 위치와 상관없이 같은 모음으로 변한다고 단정하고, ㅸ>ㅗ/ㅜ가 어미의 모음 양상에 따라 달라지는 것(고와/더워)을 모음조화로 연결하지 못한다."
    killer_level: 3
    correct_rate: NONE
    distractor_pattern: "음절 위치별 차이를 지운 서술(KM10)과 ㅸ 활용을 모두 불규칙으로 묶는 서술(KM04)."
    downscale_hint: "고1은 ㆍ의 소실(첫음절 ㅏ) 하나만 다루고, '둘째 음절은 ㅡ' 대비는 보기에 자료로 줘서 비교하게 한다. ㅸ, ㅿ는 쓰지 않는다."
    out_of_scope: true
    confidence: LOW
    morpheme_analysis_needed: true
    outside_textbook_variation: "무술>마을, 더ᄫᅥ>더워, 고ᄫᅡ>고와처럼 어간과 어미 결합에서 ㅸ 변화를 확인한다"
    confusing_expression: "'불규칙 활용'과 '음운 변화에 의한 활용'이 같은 말로 쓰인다"

  - id: D-029
    unit: 중세국어
    concept: "훈민정음 제자 원리 (기본자, 가획, 이체자, 초출자/재출자, 종성부용초성) (Step A 국어사 02)"
    killer_structure: "발표 자료 5개(자음 기본자와 가획, 모음 초출자와 재출자, 종성 규정 등)에 대해 '자료 활용 방안' 5개를 맞게/틀리게 판정한다."
    confusion: "기본자 총 8개(자음 5+모음 3)에서 모음 기본자 3개를 센다. 이체자(ㅇ, ㄹ, ㅿ)는 가획과 별도라는 점과, 재출자가 초출자에 ㆍ를 더한 것임을 구분하지 못한다."
    killer_level: 2
    correct_rate: NONE
    distractor_pattern: "초출자/재출자 생성 원리를 맞바꾼 서술('초출자가 결합하여')(KM04). 이체자를 가획자로 설명하는 서술."
    downscale_hint: "고1은 기본자 5+3=8, 가획의 조음 위치 대응 표 하나를 주고 5개 선지 중 사실과 다른 것을 고르게 한다. 재출자 원리는 쓰지 않는다."
    out_of_scope: false
    confidence: LOW
    morpheme_analysis_needed: false
    outside_textbook_variation: "훈민정음 해례 구절과 현대어 풀이를 발표 자료로 재구성한다"
    confusing_expression: "'기본자', '가획자', '이체자', '초출자/재출자'가 이름이 비슷하다"

  - id: D-030
    unit: 중세국어
    concept: "중세 국어 특징 종합 문항(용병서, 두음법칙 부재, 이어적기/끊어적기, 어두 자음군, 성조, 문자, 어휘 의미 차이, 주격 조사 ㅣ 표기) (Step A 국어사 01, 05)"
    killer_structure: "보기에 훈민정음 언해, 용비어천가 등 원문 두세 구절과 현대어 풀이를 주고, '특징 – 근거 단어' 표를 5개 선지에 대응시켜 맞지 않는 것을 찾는다."
    confusion: "어리다(어리석다)처럼 의미가 달라진 단어, 주격 조사 ㅣ가 표기에 반영되지 않는 경우, 어두 자음군이 현대에서 된소리로 바뀌었는지(ㅅ계, ㅂ계, ㅄ계) 등 사실이 많아 하나만 거짓인 걸 못 찾는다."
    killer_level: 3
    correct_rate: NONE
    distractor_pattern: "근거 단어를 엉뚱한 특징에 대응(KM05). 현대에도 같다고 단정(KM10). 현대에 있는 현상(두음법칙)을 그 시기에 있었다고 말하는 선지(KM03)."
    downscale_hint: "고1은 보기 구절 하나에 특징 3개(이어적기, 어휘 의미, 성조)만 두고 근거 단어를 짝짓게 한다. 어두 자음군과 주격 조사 ㅣ는 쓰지 않는다."
    out_of_scope: false
    confidence: LOW
    morpheme_analysis_needed: true
    outside_textbook_variation: "불휘, 기픈, 노미, 거붑의처럼 교과서에 없는 중세어 어절을 쓰고 체언+조사/어간+어미 경계를 묻는다"
    confusing_expression: "'소리 나는 대로 표기'와 '형태소를 밝혀 표기'가 주격 조사 표기와 함께 나온다"

  - id: D-031
    unit: 중세국어
    concept: "이어적기/끊어적기와 표음적/표의적 표기, 7종성/8종성 정리표 (국어사 개념 도표)"
    killer_structure: "개념 도표에서 이어적기(연철), 끊어적기(분철), 거듭적기(중철), 7종성 표기와 종성 발음의 불일치가 한 표에 정리되어 있어, 후속 문항에서 시대별 표기를 대조하게 만드는 구조다."
    confusion: "연철과 중철, 분철을 구분하지 못하고, 중세 국어는 이어적기가 원칙이라 표음적이고 근대 국어에서 끊어적기/중철이 나타난다는 시간 순서가 헷갈린다."
    killer_level: 2
    correct_rate: NONE
    distractor_pattern: "시기를 바꿔치기한 서술(KM03). 표음/표의 범주를 맞바꾼 서술(KM06)."
    downscale_hint: "고1은 중세 국어의 이어적기만 쓰고 현대어 풀이와 비교해 '받침이 뒤 음절로 옮겨 적힌다'는 사실을 확인하게 한다. 중철, 7종성 표기는 쓰지 않는다."
    out_of_scope: true
    confidence: MEDIUM
    morpheme_analysis_needed: false
    outside_textbook_variation: "사람+이>사르미 같은 이어적기 예시 외 자료를 개념 정리표로만 제시한다"
    confusing_expression: "이어적기, 끊어적기, 거듭적기가 이름이 비슷하다"

  - id: D-032
    unit: 공통
    concept: "자음 체계와 모음 체계 개념 문항(조음 위치, 방법, 이중 모음 구성) (Step A 음운 13, 22, 23; Step B 음운 01, 02)"
    killer_structure: "개념 확인형인데 선지에서 '~만 있다', '~과 달리'처럼 한정과 대조 표현이 많고 표를 읽어야 한다."
    confusion: "ㅈ을 마찰음과 파열음의 특징을 함께 지닌다고 보는 서술이나, 단모음 ㅣ를 고모음이 아니라 입을 크게 벌리는 모음으로 말하는 서술을 가려낸다."
    killer_level: 1
    correct_rate: NONE
    distractor_pattern: "분류 기준을 맞바꾼 서술(조음 위치 vs 조음 방법)(KM04). 한정어 첨가(KM02)."
    downscale_hint: "고1은 3단원 범위가 아니므로 쓰지 않는다. 필요하면 조음 위치 하나를 표로 주고 분류 이름만 맞히게 한다."
    out_of_scope: true
    confidence: MEDIUM
    morpheme_analysis_needed: false
    outside_textbook_variation: "교재에 없는 설명 문장으로 자음·모음 체계를 일반화한다"
    confusing_expression: "'~만 있다', '~과 달리' 같은 한정과 대조 표현이 많다"

  - id: D-033
    unit: 음운
    concept: "음운 변동의 유형 분류 문항(교체, 탈락, 첨가, 축약)과 용례 표 (Step A 음운 07, 08, 09)"
    killer_structure: "학습 활동 표에서 용례를 유형별로 분류한 결과를 평가하는 형식. 신라[실라]를 교체에, 첫눈[천눈]을 교체와 첨가 둘 중 어디에 넣을지 같은 분류 오류를 찾는다."
    confusion: "첫눈[천눈]은 끝소리 규칙에 따른 교체이지 ㄴ 첨가가 아닌데 '첨가'로 분류한 표를 그대로 믿는다. 국화[구콰]는 축약, 막히면[마키면]은 축약."
    killer_level: 1
    correct_rate: NONE
    distractor_pattern: "분류 칸을 바꿔 넣은 표(KM04). 사례가 두 가지 유형에 걸칠 때 한쪽만 말하는 서술."
    downscale_hint: "고1에서 가장 쉽게 이식되는 구조다. 용례 표를 먼저 주고 분류가 틀린 칸을 찾게 하며, 단어는 맏형, 첫눈, 국화 정도로 제한한다."
    out_of_scope: false
    confidence: HIGH
    morpheme_analysis_needed: true
    outside_textbook_variation: "좋아[조아], 넣은[너은], 국화[구콰], 막히면[마키면]처럼 학습 활동표 용례를 쓴다"
    confusing_expression: "첫눈[천눈]처럼 한 가지 변동으로 보이는 단어를 다른 유형에 넣는다"

  - id: D-034
    unit: 음운
    concept: "음운 개수를 기준으로 한 보기 정의(막일[망닐] 늘고 앉다[안따] 줄고…)와 사례 대응 (Step A 음운 21)"
    killer_structure: "보기가 이미 모범 풀이 4개를 보여 주고(늘다/줄다/변하지 않음), 학생은 같은 방식으로 새 단어 쌍 5개를 판정한다. 모범 풀이를 '학습'한 뒤 적용하는 구조라 D-004 와 같은 계산이 필요하다."
    confusion: "모범 풀이를 따라 하다가 새 단어에서 겹받침 탈락이 한 번 더 들어간 걸 놓친다."
    killer_level: 3
    correct_rate: NONE
    distractor_pattern: "모범 풀이와 같은 틀의 문장에 숫자만 바꾼 서술(KM12)."
    downscale_hint: "고1은 이 형식을 그대로 가져온다. 보기에 모범 풀이 2개를 주고 새 단어 3개의 개수 증감을 맞히게 하는 방식이 가장 안정적이다."
    out_of_scope: false
    confidence: MEDIUM
    morpheme_analysis_needed: true
    outside_textbook_variation: "맡는, 부엌문, 옷맵시, 칡하고처럼 교체/탈락/축약이 겹치는 어간·합성 단어를 쓴다"
    confusing_expression: "모범 풀이 문장과 같은 틀에 숫자만 바꾼 선지"

  - id: D-035
    unit: 음운
    concept: "종합: 선지 한 줄에 판단 2건 이상이 들어가는 5지선다의 정답 구조 (Step B 전반)"
    killer_structure: "Step B 문항은 선지마다 '단어 A는 ~이고 단어 B는 ~이다' 형태라, 한 줄을 맞게 읽으려면 두 단어를 모두 분석해야 하고 하나만 틀려도 선지가 거짓이다."
    confusion: "한쪽 단어만 확인하고 선지를 맞다고 판단하는 조기 종료 실수가 가장 흔하다."
    killer_level: 3
    correct_rate: NONE
    distractor_pattern: "앞 단어는 맞고 뒤 단어에서 틀리게 한 반쪽 오류 선지."
    downscale_hint: "고1은 선지 한 줄에 판단 1~2건으로 제한하고, 거짓 선지의 틀린 위치를 앞/뒤 중 뒤에 둬서 끝까지 읽게 한다."
    out_of_scope: false
    confidence: MEDIUM
    morpheme_analysis_needed: true
    outside_textbook_variation: "선지 한 줄에 단어 2개(훑는/없는 등)를 넣어 각각 형태소 경계를 판단하게 한다"
    confusing_expression: "한쪽 단어는 맞고 다른 쪽에서 틀리는 반쪽 오류 문장"

  - id: D-036
    unit: 공통
    concept: "형태가 같은 접미사 '-기'를 뜻에 따라 구별 (피동/사동 -기-, 명사화 -기, 기운 -기, 기록 -기) (Step A 단어 18)"
    killer_structure: "사전 뜻풀이로 같은 모양 접사 4종을 주고, 문장 5개의 밑줄 '-기'가 어느 종류인지 경계를 분석해 가려낸다."
    confusion: "남기는(어간+피동/사동 접사), 가기는(어간+명사형 어미), 소금기(명사+접미사), 여행기(명사+접미사)를 글자 모양만 보고 한 종류로 본다."
    killer_level: 3
    correct_rate: NONE
    distractor_pattern: "문장 속 -기를 엉뚱한 뜻풀이에 대응시키는 귀속 바꿔치기(KM05). 어미와 접미사를 맞바꾸는 범주 바꿔치기(KM04)."
    downscale_hint: "고1은 접사 2종(명사화 -기, 기운 -기)과 뜻풀이 카드로 줄이고, 사동/피동은 빼며, 밑줄 단어를 '어근+접사'로 나눈 표를 먼저 주고 종류를 고르게 한다."
    out_of_scope: false
    confidence: MEDIUM
    morpheme_analysis_needed: true
    outside_textbook_variation: "남기다, 봉투가 뜯기어, 소금기, 여행기처럼 교과서에 없는 일상 단어와 문장으로 접사를 가려내게 한다"
    confusing_expression: "모양이 같은 '-기'가 접미사, 어미, 피동/사동 접사로 번갈아 나온다"

  - id: D-037
    unit: 공통
    concept: "'-하다' 파생: 어근의 성격(상태성/동작성/부사/의존 명사)에 따라 형용사 또는 동사 (Step A 단어 08)"
    killer_structure: "보기가 '하-'의 파생 규칙을 주고, 건강하다, 공부하다, 미끈미끈하다, 좋아하다, 척하다, 듯하다를 어근 품사와 의미(상태/동작)로 분해해 5개 서술을 판정한다."
    confusion: "좋아하다·무서워하다를 어근 '좋아·무서워'+하다로 보고 '-아/어하'가 형용사에 붙어 동사가 되는 파생임을 놓친다. 척하다·듯하다의 어근이 의존 명사인지도 헷갈린다."
    killer_level: 3
    correct_rate: NONE
    distractor_pattern: "어근 품사를 맞바꾼 서술(KM04), 동사/형용사 결과를 반대로 쓴 서술(KM08)."
    downscale_hint: "고1은 어근 명사+하다(공부하다, 건강하다)만 쓰고 상태성/동작성 판단 카드를 준다. 부사 어근, 의존 명사 어근, '-아/어하'는 쓰지 않는다."
    out_of_scope: true
    confidence: MEDIUM
    morpheme_analysis_needed: true
    outside_textbook_variation: "미끈미끈하다, 반질반질하다, 빨래하다, 듯하다처럼 교과서에 없는 의성의태어·의존 명사 어근 단어를 쓴다"
    confusing_expression: "'하다'가 접미사인지 본용언/보조 용언인지 문장 속에서 표면이 같다"

  - id: D-038
    unit: 공통
    concept: "합성어 분류: 통사적/비통사적 합성어를 어근 결합 방식으로 판정 (Step A 단어 02, 1등급 도전문제)"
    killer_structure: "보기가 합성명사의 결합 방식(명사+명사, 관형사형+명사, 용언 어간+명사, 부사+명사)을 주고, 어린이, 딱딱새, 새언니, 산들바람, 고무신을 각각 분해해 통사적인지 비통사적인지 판정한다."
    confusion: "어린이(관형사형 어미 -ㄴ이 있는 구성)와 딱딱새(어근 부사 성격)를 같이 용언 활용형으로 분석하고, 새언니의 관형사를 접두사로 오해한다."
    killer_level: 3
    correct_rate: NONE
    distractor_pattern: "어근의 품사를 틀리게 지정한 설명(KM04), 통사적/비통사적 이름만 뒤집은 설명(KM08)."
    downscale_hint: "고1은 합성어를 어근+어근 표에 분해하게만 하고(고무신=고무+신), 통사적/비통사적 분류는 쓰지 않는다. 낯선 단어 3개를 분해하는 문제로 바꾼다."
    out_of_scope: true
    confidence: LOW
    morpheme_analysis_needed: true
    outside_textbook_variation: "딱딱새, 산들바람처럼 교과서에 없는 의성의태어 어근 합성어를 새 자료로 쓴다"
    confusing_expression: "'합성어', '파생어', '통사적/비통사적'이 한 보기에서 정의 없이 겹쳐 쓰인다"

  - id: D-039
    unit: 공통
    concept: "기본형이 같은 용언의 품사와 활용 양상 비교 (이르다, 누르다: 규칙, 러 불규칙, 르 불규칙) (Step A 단어 11)"
    killer_structure: "같은 기본형이 뜻에 따라 품사와 활용이 달라지는 문장 5개(ㄱ~ㅁ)를 주고, 선지가 두 문장씩 짝지어 품사와 활용 양상의 일치/불일치를 판단한다."
    confusion: "이르게(형용사, 일찍 이르다)와 이르게(동사, 도착하다)의 어간 활용(이르러)과 일렀다(말하다, 르 불규칙)를 한 단어의 활용으로 묶고, 누르고(황색, 형용사)와 누르고(압박, 동사)를 구분하지 못한다."
    killer_level: 3
    correct_rate: NONE
    distractor_pattern: "품사는 같다고 쓰고 활용은 다르다는 서술을 반대로 바꾼다(KM08). '어간 불규칙'과 '어미 불규칙'을 맞바꾼다(KM04)."
    downscale_hint: "고1은 어간·어미 경계를 표로 먼저 나누게 하고(이르-+-어서), 규칙 활용과 불규칙 활용 1종(ㅅ 불규칙 등 교과서 범위)만 판별하게 한다."
    out_of_scope: true
    confidence: MEDIUM
    morpheme_analysis_needed: true
    outside_textbook_variation: "이르다, 누르다처럼 동음이의 용언을 새 문장 5개에 심어 교과서 용례와 다르게 만든다"
    confusing_expression: "같은 표면의 이르다/누르다가 문장마다 품사와 활용이 달라진다"

  - id: D-040
    unit: 공통
    concept: "보조사와 격조사의 결합 순서·위치를 조사 경계로 분해 (나조차도, 밥만으로, 돈으로도, 학교에서뿐만이, 그 사람만이라도) (Step A 단어 01)"
    killer_structure: "조사가 2~3개 연속된 어절 5개를 주고, 각 어절에서 보조사/격조사의 순서(보+보, 보+격, 격+보, 격+보+격, 보+격+보)를 분해하는 선지 5개를 판정한다."
    confusion: "'학교에서뿐만이'의 에서(격)+뿐(보)+만(보)+이(격) 경계와 '그 사람만이라도'의 만(보)+이(격)+라도(보) 경계를 몇 개의 조사로 나눌지 흔들린다."
    killer_level: 2
    correct_rate: NONE
    distractor_pattern: "조사의 종류(보조사/격조사) 이름을 맞바꾼 서술(KM04), 결합 순서를 한 칸 틀리게 쓴 서술(KM12)."
    downscale_hint: "고1은 조사 2개 연속(학교에서도, 책만을)만 쓰고 조사 사전 표(격조사 / 보조사 구분)를 주어 경계를 직접 쓰게 한다."
    out_of_scope: false
    confidence: MEDIUM
    morpheme_analysis_needed: true
    outside_textbook_variation: "나조차도, 밥만으로, 돈으로도, 뿐만이처럼 교과서에 드문 조사 연쇄를 새 예문에서 쓴다"
    confusing_expression: "만, 도, 이라도처럼 보조사와 격조사 모양이 비슷하고 연속되어 경계가 흐려진다"

structure_to_difficulty_map:
  note: >
    정답률 자료가 없으므로 아래는 문항 구조에서 추정한 상대 순위다(PROVISIONAL). 확인되면 정답률로 교정해야 한다.
  strongest_killer_structures:
    - "새 정의/규칙을 보기로 주고 5개 예에 동시 적용 (D-002, D-006, D-027)"
    - "음운 개수와 변동 횟수 세기 (D-004, D-005, D-034)"
    - "조항 여러 개 × 단어 여러 개 매핑 (D-007, D-008)"
    - "선지 한 줄에 판단 2건 (D-005, D-035)"
    - "원칙+허용이 있는 항목을 필연성 한정어로 단정 (D-024)"
  moderate_structures:
    - "표 칸 대조 (D-011)"
    - "예외 규정이 붙은 규정 (D-012)"
    - "분류 표의 오류 찾기 (D-033)"
  observed_absent:
    - "읽힌 범위에는 사이시옷 표기 규정, 두음 법칙 표기 규정, 소리대로/어법에 맞게 문항이 없었다. 해당 영역의 킬러 구조는 이 자료에서 관찰하지 못했다."

design_principles:
  - id: P-01
    name: 규칙 카드 2~3장을 주고 단어 4개에 동시 적용
    source_entries: [D-007, D-008, D-027]
    required_material: "규칙을 쉬운 말로 쓴 카드(번호 없이), 단어 4개, 각 단어에 걸리는 규칙이 1~2개인 표"
    distractor_design: "필요한 규칙 하나를 빼거나 더한 조합 선지(KM12), 규칙을 엉뚱한 단어에 귀속(KM05)"
    expected_difficulty: "D3~D4 (규칙 3개 단어 4개가 상한. 5개 이상은 고1에서 과하다)"
  - id: P-02
    name: 모범 풀이 2개를 먼저 보여 주고 새 단어에 같은 틀로 적용 (음운 개수 증감)
    source_entries: [D-004, D-034]
    required_material: "개수 계산법 정의 한 줄, 모범 풀이 2개, 새 단어 3개(변동 1~2회)"
    distractor_design: "유형은 맞고 개수만 한 칸 틀리게(KM12)"
    expected_difficulty: "D3 (단어에 겹받침 탈락이 들어가면 D4)"
  - id: P-03
    name: 중세 국어 조사 선택표(2x2)를 보기로 주고 중세어 문장 3개에 적용
    source_entries: [D-027]
    required_material: "유정/무정, 높임 여부 2×2 표, 현대어 풀이가 달린 중세어 구절 3개(원문은 공급 자료에서 자체 제작)"
    distractor_design: "표의 한 칸을 뒤집은 대응(KM08), 현대어 풀이로 조사를 판단하게 하는 오답 유도(KM10)"
    expected_difficulty: "D4 (고1에서 킬러로 쓸 수 있는 가장 좋은 구조)"
  - id: P-04
    name: "띄어쓰기에서 의존 명사/조사 판정표 + 문장 속 오표기 찾기"
    source_entries: [D-022, D-023]
    required_material: "판정표(앞말이 체언이면 붙임, 관형어 뒤이면 띄움), 문장 4개(만큼, 대로, 뿐 중 2종)"
    distractor_design: "표면이 같은 조사/의존 명사의 띄어쓰기 바꿔치기(KM01), 정오 혼합 목록(KM11)"
    expected_difficulty: "D2~D3 (보조 용언을 넣으면 D4이므로 고1에서는 넣지 않는다)"
  - id: P-05
    name: "원칙과 허용을 동시에 인정하는 규정에 필연성 단정 선지"
    source_entries: [D-024]
    required_material: "규정 문장 2개(원칙, 허용), 표기 5개"
    distractor_design: "허용 항목에 필연성 한정어를 붙임(KM02, KM09)"
    expected_difficulty: "D3 (한정어 감지는 학생 습관에 따라 정답률 차가 큼. 문항 수를 늘려 확인한 뒤 사용)"
  - id: P-06
    name: "통시/공시 두 칸 분류표에서 틀린 칸 찾기 (구개음화, 이어적기)"
    source_entries: [D-019, D-031]
    required_material: "중세>현대 대응 단어 표(디다>지다), 현대 형태소 경계 사례(굳이)"
    distractor_design: "시기 바꿔치기(KM03), 형태소 내부/경계 맞바꿈(KM04)"
    expected_difficulty: "D3 (ㄷ 구개음화 하나로 한정)"
  - id: P-07
    name: "사이시옷 표기 분류 + 발음의 ㄴ 첨가 유무 연결"
    source_entries: [D-014]
    required_material: "사이시옷 세 조건 정의(된소리, ㄴ 덧남, ㄴㄴ 덧남), 합성어 6개, 발음 표시"
    distractor_design: "세 조건을 맞바꿔 분류(KM07), 발음 단계 중 하나를 누락"
    expected_difficulty: "D3 (읽은 범위에 사이시옷 표기 문항이 없어서 이 설계는 이 자료로 검증되지 않았다. 다른 자료로 보강 필요)"
  - id: P-08
    name: "표 칸 대조, 환경별 발음 표(ㅎ 받침, 겹받침)에서 두 칸만 비교"
    source_entries: [D-011, D-013]
    required_material: "환경 3행 표, 용례 단어 6개"
    distractor_design: "전칭 한정어(KM02), 두 칸의 개수 변화가 같다는 서술(KM12)"
    expected_difficulty: "D3"
  - id: P-09
    name: "분류 표의 오류 칸 찾기 (교체, 탈락, 첨가, 축약)"
    source_entries: [D-033]
    required_material: "유형별 용례 표(단어 8개), 오분류 2칸 심기"
    distractor_design: "첫눈[천눈]을 첨가로 넣는 유형의 오분류(KM04)"
    expected_difficulty: "D1~D2 (하위 문항 또는 시작 문항으로 쓴다)"
  - id: P-10
    name: "반쪽 오류 선지 설계, 선지 한 줄에 판단 2건, 틀린 판단은 뒤쪽"
    source_entries: [D-005, D-035]
    required_material: "단어 쌍 3개, 비교 항목 1가지(변동 횟수)"
    distractor_design: "앞 단어는 참, 뒤 단어에서 거짓(조기 종료 유도)"
    expected_difficulty: "D3~D4"
  - id: P-11
    name: "보기 범위를 묻는 문항, 규정 2개만 주고 보기로 판단할 수 없는 질문 찾기"
    source_entries: [D-009]
    required_material: "규정 2개, 질문 5개 중 1개는 규정 밖"
    distractor_design: "질문은 그럴듯하나 규정 어디에도 없는 것"
    expected_difficulty: "D3"
  - id: P-12
    name: 새로운 정의 한 줄(범위 확장 없이)을 읽고 단어 3개를 분류
    source_entries: [D-002, D-016]
    required_material: "교과서와 충돌하지 않는 정의, 단어 3개"
    distractor_design: "정의를 무시하고 기존 지식으로 판단하게 유도"
    expected_difficulty: "D2~D3"
  - id: P-13
    name: "순서 번호 채우기, 변동 2단계(끝소리 규칙 → 비음화)의 선후"
    source_entries: [D-003, D-006]
    required_material: "단어 2개(있는, 부엌만), 단계 칸"
    distractor_design: "순서를 뒤집은 선지"
    expected_difficulty: "D3 (자음군 단순화를 넣으면 D4 이상이라 고1에서는 제외)"

out_of_scope_do_not_use_list:
  note: "수능에서만 필요하거나 고1 3단원(중세 국어+한글 맞춤법) 범위를 넘는 개념이다. 이 목록은 AI 가 고1 상위 난이도 문항을 만들 때 쓰지 않을 개념의 후보이며, 최종 판단은 교육과정 확인 후 사용자가 한다."
  items:
    - "음운 규칙의 적용 순서(규칙순) 일반론과 3단계 이상 연쇄 (D-006)"
    - "표준 발음법 조항 번호 단위의 암기 요구와 허용 발음(계집/게집, 조사 의 허용) (D-010)"
    - "반모음, 반모음화, 반모음 ㅣ 탈락, 동일 모음 탈락 분류 (D-017)"
    - "ㄱ 구개음화, ㅎ 구개음화(힘>심), 구개음화 비적용 사례의 역사 설명 (D-019)"
    - "모음 축약의 통시적 분류(단모음 연쇄, 이중 모음 축약), 방언 발음, 첫음절 장음 (D-020)"
    - "음성 인식 기술 지문의 기준 패턴, 특징 벡터, 음소 추정 구간 (D-021, 필요하면 정의를 주고 단순화)"
    - "보조 용언 띄어쓰기의 합성 용언 뒤 조건과 아/어 이외의 연결 어미 조건 (D-024)"
    - "접두사의 ㅎ 종성 체언 흔적과 ㅂ 흔적(햅쌀) (D-026)"
    - "ㅸ, ㅿ의 소실과 ㅂ 불규칙 연결, 아래아의 음절 위치별 변화 (D-028)"
    - "7종성 표기, 8종성 표기, 중철 (D-031)"
    - "자음·모음 체계, 이중 모음 구성 개념 (D-032)"
    - "음운 개수 세기에서 겹받침 탈락+거센소리되기가 겹치는 단어(칡하고) (D-004)"
    - "비음화의 확장 정의처럼 교과서와 다른 정의를 주고 적용시키는 구조 (D-002)"

report_summary: >
  블랙라벨은 약 17만 자(앞부분)만 읽혔고 정답과 해설, 정답률은 없어서 모든 correct_rate 는 NONE 이다.
  2027 바탕 PDF 는 텍스트가 비어 있어(스캔본 추정) 분석하지 못했다. 킬러는 새 규칙 동시 적용, 음운 개수/횟수 세기,
  조항×단어 매핑, 원칙+허용 한정어 단정에서 생긴다.

internal_exam_adaptation_notes:
  note: >
    사용자 추가 지침(내신 기말 문법 파트 중심: 교과서에 없는 예문·단어, 헷갈리는 표현, 형태소 분석)에 맞춰
    모든 entries 에 morpheme_analysis_needed, outside_textbook_variation, confusing_expression 필드를 추가했다.
    아래는 읽힌 범위에서 관찰한 사실만 정리한 것이다. 정답률이 없어 어느 방식이 더 어려운지는 구조 추정이다.
  morpheme_analysis_items:
    description: "형태소·단어 구성 경계를 분석해야 풀 수 있는 문항 번호(읽힌 범위)"
    entries_true: "morpheme_analysis_needed=true 인 entry 가 대부분이다(음운 문항도 어간·어미·접사 경계를 알아야 해서 true 로 표시)."
    core_morpheme_items: [D-022, D-023, D-024, D-036, D-037, D-038, D-039, D-040]
    note: >
      core 항목 8개는 음운이 아니라 단어 구성 자체(접사, 어근, 어간·어미, 조사 연쇄, 띄어쓰기)가 풀이 대상이다.
      2학기 기말의 문법 파트 설계에는 이 8개 구조가 가장 직접적이다.
  how_unfamiliar_material_is_used:
    - "같은 규칙을 교과서 예시와 다른 단어로 바꿔 쓴다. 규칙 이름은 보기에서 정의하고 단어는 낯설다(D-001~D-008)."
    - "합성어/파생어를 단어로 주고 어근·접사 경계를 학생이 직접 나누게 한다(D-036~D-038)."
    - "동음이의 용언(이르다, 누르다)을 문장 5개에 심어 표면은 같고 품사·활용이 다르게 만든다(D-039)."
    - "조사를 2~3개 연속시켜 경계 분해를 요구한다(D-040)."
    - "중세어 원문은 교재 밖 구절을 쓰되 현대어 풀이와 규칙표를 같이 준다(D-027, D-030). 원문을 그대로 복제하지 말고 자체 제작한다."
  confusing_expression_patterns:
    - "표면이 같은 두 형태(데/지, 만큼, -기, 이르다)를 문맥으로만 구분하게 한다."
    - "'~만', '~야만', '존재하지 않는다'처럼 한정·단정 표현을 허용 규정에 붙인다(KM02)."
    - "방향·순서·인과를 한 문장에서 뒤집어 쓴다('A 때문에 B' vs 'B 때문에 A')(KM08)."
    - "정오 혼합 목록이나 한 선지에 판단 2건을 넣어 반쪽 오류를 만든다(KM11, D-035)."
  caution_for_internal_exam_use:
    - "내신 기말은 등급 분리가 목적이라 낯선 단어를 써도 되지만, 그 단어가 고1 학생이 형태소를 나눌 수 있는 수준이어야 한다. 읽힌 범위의 합성어/접사 문항 다수는 고1 범위를 넘는다고 표시했다(out_of_scope=true)."
    - "중세 국어와 한글 맞춤법(사이시옷, 두음 법칙, 소리대로/어법)의 낯선 예문 방식은 이 자료에서 관찰된 사례가 적다. 중세 국어는 D-027, D-030 정도, 맞춤법은 띄어쓰기뿐이다."
    - "문항 자료를 복제하지 않고 구조만 가져온다."
