version: 1.0
date: 2026-11-09
status: RAW_NOTES_PROVISIONAL
purpose: >
  블랙라벨 문법 초고난도 문항에서 중세 국어, 한글 맞춤법(띄어쓰기), 음운 변동, 표기, 사이시옷과 겹치는 문항의
  킬러 구조를 뽑아, 고1 공통국어2 3단원 상위 난이도 문항 설계에 쓸 킬러 지도 원자료로 남긴다.
  저작권 자료이므로 문항 원문은 옮기지 않았고, 인용은 15자 이내로 제한했다. 구조와 이유만 서술한다.

