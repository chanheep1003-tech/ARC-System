entries:
- id: B-001
  unit: 중세국어
  concept: "형태가 같은 '이'의 기능 판별 (주격·비교 부사격·서술격 어간·관형격 ㅣ)"
  confusion: "‘육룡이’의 이는 주격, ‘고성이’의 이는 ‘옛 성인과’라는 비교 부사격, ‘천복이시니’의 이는 서술격 어간이라서 겉모양이 같아 모두 주격으로 묶어 버린다."
  cause: SURFACE_SIMILARITY
  frequency: HIGH
  difficulty_feel: MEDIUM
  evidence: "B01 Q3,Q5,Q9 / B02 Q6 / B03 Q6 / B04 Q4 약 6문항(선지 수준 포함 9)"
  distractor_pattern: "해설 속 ‘고성이’를 ‘육룡이’와 같은 주격으로 서술한 선지('서로 비교되는 주체이므로 둘 다 주격')를 만든다. 현대어 풀이를 제시한 뒤 풀이와 모순되는 격 이름을 붙이는 방식도 쓴다."
  design_hint: "같은 지문 안에 형태가 같은 조사를 두 개 이상 넣고 현대어 풀이만 단서로 주어, 각각의 격을 고르게 한다. 오답은 풀이 단서와 어긋나는 격 이름으로 만든다."
  outside_textbook_variation: "교과서 밖 15세기 문헌(석보상절·월인천강지곡·두시언해)에서 ‘X이 Y 달라’ 같은 비교 구문을 새로 가져와 현대어 풀이를 붙여 주고 ‘이’의 기능을 묻는 변형이 가능하다."
  morpheme_analysis_needed: true
  morpheme_boundary: "체언 + 조사 이 / 이(서술격 어간) + 시(선어말) + 니(어미) 경계를 가려야 한다."
  confusing_expression: "‘~와 비교하므로 주격’, ‘서로 비교되는 주체’처럼 의미 설명을 격 이름으로 슬쩍 바꾸는 표현"
  confidence: HIGH

- id: B-002
  unit: 중세국어
  concept: "비교 부사격 조사 ‘에’ (중국에 달아 = 중국과 달라)"
  confusion: "현대 국어의 ‘에’(장소·원인)와 같은 부사격이라 보고, 해설이 ‘과’로 풀이한 비교 기능을 놓친다."
  cause: TIME_SCOPE
  frequency: HIGH
  difficulty_feel: EASY
  evidence: "B01 Q1,Q8 / B02 Q4 / B03 Q1,Q4 / B04 없음 약 5문항(선지 수준 9)"
  distractor_pattern: "‘에’를 처소격이나 원인으로 바꾼 선지, 또는 ‘귁에’를 ‘중국과’로 풀이하는 것을 보고 ‘과’가 조사이므로 ‘에’도 접속 조사라고 서술한 선지."
  design_hint: "비교 서술어(다르다, 같다) 앞의 ‘에’를 쓰고, 현대어로는 ‘과/와’ 대응임을 근거로 판정하게 한다. 오답은 시간·장소 부사격."
  outside_textbook_variation: "‘이 말씀이 우리 말씀에 다른다’처럼 교과서에 없는 비교 구문을 새로 짓는 변형이 가능하다."
  morpheme_analysis_needed: true
  morpheme_boundary: "한자어 체언 中國과 조사 에를 끊어 적는 경계(연철 아님)를 확인해야 한다."
  confusing_expression: "‘에’가 비교의 부사격 조사로 쓰였다 / 처소의 부사격 조사로 쓰였다 식의 한 단어 차이 선지"
  confidence: HIGH

- id: B-003
  unit: 중세국어
  concept: "관형격 조사: ‘제’의 ㅣ와 ‘나랏’의 ㅅ"
  confusion: "‘제’를 ‘자신이’로 풀어 주격으로 오해한다. 해설은 ‘저 + 관형격 ㅣ’, 즉 ‘자신의’라고 본다."
  cause: CATEGORY_SWAP
  frequency: MID
  difficulty_feel: MEDIUM
  evidence: "B01 Q1(해설에서 ‘제’), Q8(㉣), Q8 해설 / B02 Q3(나랏 ㅅ) 약 3문항"
  distractor_pattern: "‘제’ 뒤에 주격 조사 ㅣ를 붙여 ‘자신이’로 풀이한 선지. ‘나랏’의 ㅅ을 현대 사이시옷과 같다고 한 선지."
  design_hint: "대명사의 관형격 형태(저+ㅣ, 나+ㅣ)를 넣고 ‘의’로 풀면 관형어, ‘이/가’로 풀면 주어임을 구분하게 한다."
  outside_textbook_variation: "‘내 그를 알다’처럼 낯선 15세기 구에서 ‘내/네/제’의 격을 묻는 변형. 교과서에 없는 대명사 ‘뉘’를 정의해 주고 격을 판단시키는 방식."
  morpheme_analysis_needed: true
  morpheme_boundary: "대명사 어간 + ㅣ(관형격/주격) 구분, 체언 + ㅅ 경계"
  confusing_expression: "‘~가’로 풀이해야 하는지 ‘~의’로 풀이해야 하는지 현대어 풀이가 걸리는 표현"
  confidence: MEDIUM

- id: B-004
  unit: 중세국어
  concept: "주격 조사 이/ㅣ/∅ 선택 (체언 끝소리 조건)"
  confusion: "자음 뒤 이, 모음 뒤 ㅣ, 체언이 ㅣ나 반모음 j로 끝나면 무표지(∅)라는 3분을 외우고도, ‘불휘’의 ∅와 ‘내히’의 이를 바꿔 짝짓는다."
  cause: MULTI_CONDITION
  frequency: HIGH
  difficulty_feel: MEDIUM
  evidence: "B01 Q5,Q9 / B02 Q6 / B04 Q4,Q6 약 5문항"
  distractor_pattern: "㉠·㉡·㉢ 자리에 ‘고성이/여름/내히’처럼 각 칸에 하나씩 둔 짝짓기에서 두 칸을 맞바꾼다. ∅가 쓰인 ‘여름 하니’를 ‘주격 조사 생략’ 정도로 서술해 맞는 선지처럼 보이게 한다."
  design_hint: "체언 끝소리를 자음·모음·ㅣ/j로 나눠 세 칸 짝짓기를 만들고, ㅎ종성 체언과 ㄱ덧생김 체언을 섞어 조건을 두 겹으로 건다."
  outside_textbook_variation: "‘믈’ ‘부텨’ ‘엄마’ 같은 교과서 밖 체언을 제시하고 주격 형태를 쓰게 하는 변형. 한자어 체언에는 형식 종성 ㅇ을 붙여 조건을 겹친다."
  morpheme_analysis_needed: true
  morpheme_boundary: "체언 어간의 마지막 소리(자음/모음/ㅣ/j)와 주격 조사(이/ㅣ/∅) 경계, 체언이 특수 어간(나모→남ㄱ)일 때 교체형"
  confusing_expression: "‘주격 조사가 나타나지 않았다’ vs ‘주격 조사가 생략되었다’ 식 서술"
  confidence: HIGH

- id: B-005
  unit: 중세국어
  concept: "보조사 ‘ㅇ/은’을 주격 조사로 오분류 (믈은, 남ㄱ은)"
  confusion: "‘므른’의 ‘은’과 ‘남ᄀᆞᆫ’의 ‘ᄋᆞᆫ’은 보조사인데 앞말이 주어처럼 보여 주격으로 판단한다."
  cause: CATEGORY_SWAP
  frequency: MID
  difficulty_feel: MEDIUM
  evidence: "B02 Q6 / B01 Q9 약 2문항"
  distractor_pattern: "‘체언이 자음으로 끝나 음성 모음 주격 조사 은이 사용되었다’처럼 보조사를 주격 조사로 단정한 선지."
