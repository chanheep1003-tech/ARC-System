  not_read:
    - "같은 세트의 중복 파일과 병합됨 파일은 지시에 따라 읽지 않음. search_files 첫 검색이 nextPageToken을 돌려주었으므로 그 뒤쪽 결과(중복·병합본 추정)는 열람하지 않았다."
    - "킬러(최다오답) 세트는 다른 담당자 몫이라 읽지 않음."
  answer_explanation_status:
    separate_answer_file: "없음. search_files(최다빈출 + 정답/해설/정답률) 결과 0건."
    inline_explanation: "있음. 각 PDF 뒤쪽에 문항별 해설이 들어 있어 오답 이유를 수집함."
    answer_number_markers: "추출 텍스트에서 선지 번호(①~⑤)와 정답 번호 표시가 소실됨. 정답은 해설 문장과 직접 풀이로 추정했다. 정답 선지를 특정한 항목은 해설이 '적절하지 않다/타당하다'로 직접 말한 경우에 한한다."
    correct_rate_data: "없음. 정답률·오답률 통계 자료는 이 세트에 없다. frequency와 difficulty_feel은 출제 횟수와 직접 풀이에서 나온 체감이며 통계가 아니다."
  extraction_caveats:
    - "옛한글 자모(아래아, 반치음, 순경음 비읖, 여린히읗, 옛이응)와 방점이 많은 곳에서 깨지거나 누락됨. 해당 항목은 '추정'으로 표시했다."
    - "표와 보기의 일부(B05 Q14 표, B01 Q7 표, B01 Q17 보기 1)가 줄 단위로 흩어져 있어 구조는 해설을 근거로 복원함."
    - "해설 자체의 오류·모호함 의심 지점: B02 Q6의 므른을 '주격 조사 은'으로 서술한 부분(보조사로 보는 것이 통설), B01 Q6 ㉲의 ㆆ 설명, B01 Q7 ⓐ의 달아 해설, B01 Q13 졸이다 해설. 해당 항목에 confidence를 낮춰 적음."
  passage_reuse_observation: "중세국어 50문항 중 약 37문항이 같은 두 지문(훈민정음 언해 서문, 용비어천가 1·2장)을 쓴다. 소재는 고정이고 묻는 각도만 바뀐다. 맞춤법 50문항은 대부분 '제N항 규정 + 단어 적용' 보기형이다."
  quoting_policy: "문항·선지 원문은 15자 이내 인용만 사용. 나머지는 구조와 이유로 서술."
  secondary_inputs:
    - "coordinator 추가 지침(2026-11-09): 항목마다 outside_textbook_variation, morpheme_analysis_needed, confusing_expression 필드를 추가하고 문법(형태소 분석 포함) 대비를 강하게 한다. 모든 항목에 반영함."
  field_notes:
    frequency_field: "HIGH=이 세트 5개 중 4개 이상에서 또는 6문항 이상 등장, MID=3~5문항, LOW=1~2문항"
    morpheme_analysis_needed: "문항을 풀거나 오답 선지를 걸러내려면 어간·어미·접사·조사·체언 경계를 가려야 하면 true"

