  top_confusions:
  - 앞이 자음이고 모양이 이면 주격이라 읽기 쉬운데 풀이(~와/과)로 보면 비교 부사격이다.
  - 같은 '에'인데 원인·방향·목표 중 어느 의미인지 가르고, 현대 예문의 '에'와 의미가 같은지 짝지어야 한다.
  - '''제''를 저+ㅣ로 보면 주격이라 ''제가''로 풀이하기 쉬운데 뒤 체언을 꾸미면 관형격이다.'
  - ‘육룡이’의 이는 주격, ‘고성이’의 이는 ‘옛 성인과’라는 비교 부사격, ‘천복이시니’의 이는 서술격 어간이라서 겉모양이 같아 모두 주격으로 묶어 버린다.
  distractor_patterns:
