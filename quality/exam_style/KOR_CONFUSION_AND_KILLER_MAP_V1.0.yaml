  - 흙만[흥만]을 ㄱ+ㅁ 비음화 한 번으로 보고, 앞에서 ㄹ이 탈락한 단계를 놓친다.
  - 칡하고[치카고]처럼 겹받침 탈락과 거센소리되기가 겹치면 개수 감소를 -1 로 센다(실제로는 -2). 축약이 1회 일어난 걸 교체로 센다.
  - 닭과[닥꽈]에서 자음군 단순화 뒤 된소리되기가 일어나 개수가 줄어드는데, 닭이[달기]는 변동이 없다는 대조를 놓친다. 먹히다는 ㄱ+ㅎ 축약만 있고 굳히다는 축약 뒤 구개음화까지 있다.
  distractor_patterns:
  - 확장 정의를 무시하고 종로[종노]를 유음화나 다른 현상으로 말하는 선지, 방향이 다른 비음화를 '방향이 모두 같다'로 단정하는 선지(KM08, KM02).
  - 순서를 뒤집은 선지('비음화가 먼저 일어난 뒤 ㄹ 탈락'). 한 단계를 빼먹은 선지. 어떤 규칙이 다른 규칙의 조건을 만든다는 문장을 '서로 무관하다'로 바꾸는 선지.
