  - 원인의 에 문장을 목표/대상의 에 예문과 짝짓는다(감기에 듣다 vs 빗소리에 깨다). '부사를 만드는 격조사'처럼 부사어를 부사로 바꿔 쓴 용어 함정을 한 선지에 넣는다.
  - 제를 주격 조사 ㅣ로 보고 보기의 2)번 규칙을 적용했다는 진술, 현대어 풀이를 '제가'로 하는 진술.
  outside_textbook_variation:
  - 달아·같다·마초다 등 비교를 요구하는 다른 서술어와 결합한 낯선 구절을 새로 만들어 이/에/와의 기능을 가리게 한다. 교과서에 없는 중세 문장을 현대어 풀이와 짝지어 보여 준다.
