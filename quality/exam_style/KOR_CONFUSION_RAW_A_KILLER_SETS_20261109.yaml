meta:
  title: "KOR 고1 공통국어2 3단원 국어의 어제와 오늘 - 킬러 세트 헷갈림·킬러 원자료(A)"
  date: "2026-11-09"
  purpose: "AI가 같은 단원의 상위 난이도(D3/D4) 문항과 오답 선지를 설계할 때 쓰는 헷갈림·킬러 지도. 저작권 자료이므로 문항·선지 원문은 15자 이내 인용만 하고 출제 구조와 헷갈리는 이유를 서술했다."
  source_family: "족보닷컴 미래엔(신유식) 공통국어2 3단원 최다오답공략·최상위공략 (중세국어 + 한글 맞춤법)"
  sets_read:
    - {abbr: O1, name: "최다오답공략_01", fileId: "1LtEVah2pzQe9Oz3u4QgkoyIEHHFIx6Pq", items: 20, read: "문제 20 + 해설 20 전체"}
    - {abbr: O2, name: "최다오답공략_02", fileId: "1Z1oawytPUjX_NkrUcqQekFcB6OCWF_LL", items: 20, read: "문제 20 + 해설 20 전체"}
    - {abbr: O3, name: "최다오답공략_03", fileId: "1U3XF6mml61lodb8plA9ZQ3n8N-HPG3-Q", items: 20, read: "문제 20 + 해설 20 전체"}
    - {abbr: O4, name: "최다오답공략_04", fileId: "1tW0DIW4n9GS9-BgcHFGNP25WFcG1mZ7I", items: 20, read: "문제 20 + 해설 20 전체"}
    - {abbr: T1, name: "최상위공략_01", fileId: "1YMGhnywBugUNKXyP6EJUqZaIRqiAcTok", items: 15, read: "문제 15 + 해설 15 전체"}
    - {abbr: T2, name: "최상위공략_02", fileId: "14tXvGqAGP930pYcGS1sOSIKSNGd13_a5", items: 15, read: "문제 15 + 해설 15 전체"}
    - {abbr: T3, name: "최상위공략_03", fileId: "1-eklQW-3ipYG6L-RZc9aAiLd46S53R2F", items: 15, read: "문제 15 + 해설 15 전체"}
  total_items_read: 125
  not_read:
    - "지시대로 같은 세트를 다른 이름으로 올린 중복 파일은 읽지 않음 (예: '[최상위 공략] 3.국어의 어제와 오늘(01)_...[Q].pdf' 계열, '[최다오답 공략] ...[Q].pdf' 계열 8개)."
    - "7개 세트 모두 전 문항(125문항)과 인라인 해설을 읽었다. 못 읽은 쪽은 없다. 단, 텍스트 추출 한계로 보지 못한 정보가 있다(아래 extraction_caveats)."
  answer_explanation_status:
    separate_answer_file: "없음. search_files(title contains 족보닷컴 + 공통국어2 + 해설/정답/정답률) 결과 0건. 별도 검색에서 나온 정답·해설 파일은 모두 ARC 자체 제작물(ARC_N_..., 인박스_정리색인)이라 이 세트의 해설이 아니므로 읽지 않았다."
    inline_explanation: "있음. 최다오답 세트는 문항별 '오답 point / 오답 파헤치기', 최상위 세트는 '1등급 공략 Tip / 바로 잡기'가 PDF 뒤쪽에 들어 있어 오답 원인 설명을 수집했다."
    correct_rate_data: "없음. 문항별 정답률·오답률 수치는 어느 세트에도 없다. killer_level은 (1) 세트 성격(최다오답/최상위), (2) 해설이 짚은 함정 강도, (3) 내가 직접 풀면서 망설인 지점으로 매긴 추정이며 통계가 아니다."
    answer_number_markers: "추출 텍스트에서 선지 번호(①~⑤)와 정답 번호 표시가 소실됨. 정답 선지는 해설 문장과 직접 풀이로 특정했다."
  extraction_caveats:
    - "옛한글 자모(아래아, 반치음, 옛이응, 쌍이응, 순경음 비읍, 여린히읗, 어두자음군 글자)와 방점이 지문 전반에서 깨지거나 누락돼, 중세 국어 어형 자체는 텍스트로 판독이 거의 불가하다. 중세 어형 분석은 해설과 15세기 국어 지식에 의존했으므로 해당 항목은 '추정'을 포함한다."
    - "보기 표와 흐름도(O1 Q14, O4 Q17, T1 Q12, O2 Q15)는 줄 단위로 흩어져 있어 구조를 해설로 복원했다."
    - "파일 라벨 불일치: O2 파일명은 (02)지만 본문 머리글은 (03)으로 표시됨. 내용은 O3와 다른 문항이므로 중복 아님."
  source_conflicts:
    - id: C1
      where: "古聖이 同符하시니의 높임 주체"
      detail: "O2 Q7 해설과 O1 Q3·T1 Q3 해설은 '고성이'를 비교 부사격 조사로 보고 주체는 해동 육룡이라 한다. 반면 O3 Q3 해설은 주체를 고성으로, O4 Q5 해설은 육룡과 고성 둘 다 주어로 서술한다. 전자가 문법적으로 일관되며 후자는 해설 오류 의심."
      handling: "A-021에 반영, confidence MEDIUM."
    - id: C2
      where: "달아(다르+아)의 ㄹㅇ형 활용"
      detail: "O3 Q1 해설은 '현대 ㄹㅇ형과 달리 중세는 ㄹ 탈락 안 함'이라 쓰고, O4 Q3 해설은 '중세는 ㄹㅇ형, 현대는 르 불규칙'이라 쓴다. 두 설명이 서로 반대로 읽힘."
      handling: "A-019에 반영, confidence LOW."
    - id: C3
      where: "한글 수 관형사 뒤 시간 단위 띄어쓰기"
      detail: "T2 Q14 해설은 '열시 사십분 이초'를 제43항 다만으로 옳다고 하고, T3 Q11 해설은 '세시 삼십 분'을 '세 시 삼십 분'으로 띄어야 한다고 한다. 같은 유형을 서로 다르게 판정."
      handling: "A-051에 반영, confidence LOW."
    - id: C4
      where: "여름(열매)의 의미 변화 판정"
      detail: "O4 Q8 해설이 정답으로는 '의미 이동'을 쓰면서 오답 point에서는 '이동이나 축소는 들어갈 수 없고 어형 변화'라 쓴다. T1 Q4는 '녀름(계절)과 여름(열매)은 별개 단어'로 설명."
      handling: "A-025에 반영, confidence MEDIUM."
    - id: C5
      where: "O3 Q3 정답 선지 해설"
      detail: "'-샤-' 분석 선지를 '적절하지 않다'고 했다가 곧바로 '적절하다'고 쓰는 자기모순이 있고, 주체 판정은 C1과 연결된다."
      handling: "A-020·A-021에 반영."
    - id: C6
      where: "O1 Q10 가져야[가저야]"
      detail: "해설이 '다만 1에 따라 허용'이라 서술하나 규정상 '져 쪄 쳐'는 [저 쩌 처]가 표준이며 허용이 아니다."
      handling: "A-046에 반영."
    - id: C7
      where: "T2 Q7 百姓·姓의 종성 ㅇ"
      detail: "해설이 '실질 종성 ㆁ으로 끝나는 체언'이라 하면서 형식 종성 설명과 섞여 있어 한자음의 -ng 종성 여부를 독자가 따로 알아야 풀린다."
      handling: "A-026에 반영."
  extraction_note_on_quoting: "문항·선지 원문은 15자 이내 인용만 사용. 나머지는 구조와 이유로 서술."
  secondary_inputs:
    - "coordinator 추가 지침(2026-11-09): 항목마다 outside_textbook_variation, morpheme_analysis_needed, confusing_expression 필드를 추가하고 문법(형태소 분석 포함) 대비를 강하게 한다. 모든 항목에 반영함. morpheme_analysis_needed는 true/false, 경계는 morpheme_boundary에 서술."
  legend:
    evidence_notation: "O1~O4=최다오답 01~04, T1~T3=최상위 01~03, Q=문항 번호. 'N문항'은 해당 개념이 정답 판단 또는 오답 선지로 직접 나온 문항 수."
    killer_level: "1=보통, 2=어려움, 3=킬러 (통계 아닌 추정)"
    unit_extra: "A-062 한 항목만 단원 밖(신어·순화) 소재라 unit을 기타로 표기."
  top_findings:
    killer_clusters: ["사이시옷(어종·파생어·한자어 예외·3유형·발음 변화)", "띄어쓰기 품사 판별(만큼·대로·뿐·지·밖에·보조용언·단위)", "렬·률/두음 법칙 받침 판정", "조사 체계(주격 3형태·비교 부사격 이·관형격 ㅅ·ㅎ종성·목적격)", "음운 변화 적용 여부(원순모음화·구개음화·두음법칙·어두자음군)"]
    top_confusions: ["합성어인지 파생어인지, 고유어인지 한자어인지 어종 판별", "앞말이 체언이냐 관형어냐에 따른 조사/의존 명사 판별", "ㄱ·ㅂ 받침 뒤 된소리 예외(깍두기 vs 짭짤)", "비교 부사격 이/에를 주격 이로 읽기", "어엿비·여름 같은 어휘 변화 분류와 구개음화가 일어난 자리 판별"]

entries:
  # ===================== 중세국어 =====================
  - id: A-001
    unit: 중세국어
    concept: "주격 조사 이/ㅣ/∅(영형태) 환경 선택"
    confusion: "체언 말음이 자음인지, ㅣ 이외 모음인지, ㅣ·반모음 ㅣ인지를 먼저 판정해야 하는데 연철 표기와 ㅎ종성·종성 ㅇ 때문에 말음 판정이 흔들린다."
    cause: MULTI_CONDITION
    killer_level: 2
    evidence: "O1 Q2·Q5, O2 Q1, O3 Q4, O4 Q2·Q3, T1 Q5, T2 Q5·Q7, T3 Q5 — 10문항(이 단원에서 가장 많이 반복)"
    distractor_pattern: "자음 말음 체언에 ㅣ, ㅣ 말음 체언에 이를 붙인 풀이를 섞고, 분류 번호 1~3을 한 칸씩 어긋나게 대응시킨다. 연철 표기(받침이 조사 쪽으로 넘어간 형태)라 조사가 눈에 안 보이게 하며, '음운 조건과 무관한 생략'이라는 네 번째 유형을 곁들이기도 한다."
    design_hint: "D3: 교과서에 없는 중세 체언 4개를 연철 표기로만 제시하고 말음을 환원한 뒤 이/ㅣ/∅로 분류하게 한다. D4: ㅎ종성 체언, 한자어 체언, ㅟ·ㅢ 말음, 비교 부사격 '이'를 한 표에 섞고 '조사 생략' 사례를 넣어 ㄱㄴㄷ 합답형으로 만든다."
    outside_textbook_variation: "새·나·소·바 같은 교과서 단어를 아비·나리·가지·구름처럼 낯선 체언으로 바꾸고 현대어 풀이 괄호만 주는 방식. 한자어 인명·지명(羅睺羅류)이나 외래 한자음 체언을 말음 판정 대상으로 쓴다."
    morpheme_analysis_needed: true
    morpheme_boundary: "체언+조사 경계. 연철된 표기에서 체언의 받침과 조사 이를 분리해 환원(얌+이→야미 유형), ㅎ종성 체언은 내ㅎ+이처럼 체언 쪽에 ㅎ을 붙여 본다."
    confusing_expression: "분류표 번호 대응형, 연철 표기로 조사 은폐형, 현대어 풀이에서 '~가'만 보여 주고 중세 형태를 고르게 하는 역방향형"
    confidence: HIGH

  - id: A-002
    unit: 중세국어
    concept: "반모음 ㅣ 말음 체언(불휘류)의 영형태 처리"
    confusion: "끝소리가 ㅟ처럼 ㅣ로 끝나는 이중 모음이면 모음 말음이라 ㅣ가 붙는지, ㅣ계 말음이라 ∅인지 가려야 한다."
    cause: CATEGORY_SWAP
    killer_level: 2
    evidence: "O1 Q2·Q5, O3 Q4·Q9, O4 Q7·Q8, T1 Q5, T3 Q5 — 8문항"
    distractor_pattern: "해당 체언에 주격 '가'가 결합했다고 하거나, ㅣ를 붙인 형태로 풀이한 선지를 만든다. 또 정답 근거를 '모음 ㅣ 이외의 모음'으로 바꿔 놓는다."
    design_hint: "D3: ㅟ·ㅢ·ㅐ·ㅔ 말음 체언 중 어느 것이 ∅이고 어느 것이 ㅣ인지 표에서 고르게 한다. D4: 같은 소재에 원순모음화 오설명(불휘의 ㅜ)을 한 선지에 겹쳐 서로 다른 개념을 한꺼번에 판정하게 한다."
    outside_textbook_variation: "불휘·새·아비를 대신해 쉬·뒤·나래·아기 같은 이중 모음·ㅣ 말음 체언으로 교체. 현대어 풀이를 '~가'로만 주어 영형태 여부를 스스로 판정하게 한다."
    morpheme_analysis_needed: true
    morpheme_boundary: "체언의 마지막 모음을 단모음 ㅣ, 반모음 ㅣ(이중 모음의 뒷요소), 그 외 모음으로 세 갈래 분해."
    confusing_expression: "근거 바꿔치기형(결론은 맞고 근거 분류가 틀림), 가 결합 오진술형"
    confidence: HIGH

  - id: A-003
    unit: 중세국어
    concept: "비교 부사격 조사 이/에와 주격 조사 이의 겉모양 혼동"
    confusion: "앞이 자음이고 모양이 이면 주격이라 읽기 쉬운데 풀이(~와/과)로 보면 비교 부사격이다."
    cause: SURFACE_SIMILARITY
    killer_level: 3
    evidence: "O1 Q2·Q4, O2 Q3, O3 Q1, O4 Q3, T1 Q3·Q8, T2 Q1·Q7 — 9문항"
    distractor_pattern: "고성이·육룡이 같은 형태를 모두 주격 이로 분류하게 하거나, 듕귁에의 에를 장소 부사격으로 해설하는 선지. 현대어 풀이 '옛 성인과', '중국과'를 숨기고 조사만 보게 한다."
    design_hint: "D3: 현대어 풀이를 함께 주고 조사 종류를 분류하게 하되 이/에가 주격·비교·장소 중 무엇인지 3자택일로 묻는다. D4: 풀이 없이 서술어의 자릿수(비교 대상을 취하는 용언 다르다·같다·부합하다)로 조사 종류를 추론하게 한다."
    outside_textbook_variation: "달아·같다·마초다 등 비교를 요구하는 다른 서술어와 결합한 낯선 구절을 새로 만들어 이/에/와의 기능을 가리게 한다. 교과서에 없는 중세 문장을 현대어 풀이와 짝지어 보여 준다."
    morpheme_analysis_needed: true
    morpheme_boundary: "체언+조사 경계와, 그 조사가 문장에서 요구하는 서술어(자릿수)와의 호응. 단어 분해가 아니라 문장 성분 관계까지 본다."
    confusing_expression: "형태 동일 다기능 조사형, 장소 vs 비교 의미 바꿔치기형"
    confidence: HIGH

  - id: A-004
    unit: 중세국어
    concept: "부사격 조사 애/에의 의미(원인·방향·목표·장소·비교)와 현대 '에' 예문 짝짓기, 부사·부사어 용어"
    confusion: "같은 '에'인데 원인·방향·목표 중 어느 의미인지 가르고, 현대 예문의 '에'와 의미가 같은지 짝지어야 한다."
    cause: CATEGORY_SWAP
    killer_level: 3
    evidence: "O1 Q1·Q4, T1 Q3, T2 Q7 — 4문항(O1 Q1은 최다오답 첫 문항)"
