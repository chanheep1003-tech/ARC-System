schema_version: ARC-EXTERNAL-EXAM-SCOPE-MAP-V1
audited_at: '2026-10-07'
target: 통합과학2
basis: 해설 PDF의 문항별 [출제의도] 텍스트만 읽음. 문제지 PDF와 그림은 열지 않음.
scope_reference: subjects/SCIENCE_MASTER_V4.0.md 중간고사 SCOPE LOCK(GT·EV·OR·EE·EM)과 SCI3(과학과 미래 사회, 사용자 포함 지시). 기말 범위는 미확정.
tiers:
  IN: 통합과학2 개념으로 직접 판단 가능
  BORDER: 인접 내용이나 통합과학2 소속이 불명확
  ADV: 주제는 겹치나 풀이에 범위 밖 심화 지식이 필요. 정답 근거로 사용 금지(ADVANCED LEAK BLOCK)
figure_policy: 그림 후보는 위치와 유형만 등록한다. 원본 그림은 복사하지 않는다. 사용 시 개념과 공식 자료로 재도식화한다(EBSi 무단 전재 금지, 저작권 자료 복제는 HARD FAIL). figure_expected는 문항 의도에서 추정한
  값이며 미검증이다.
subject_verdict:
  g2_통합과학(3회): 범위 포함. 75문항 중 IN 22(통합과학2 개념 17 + SCI3 5), BORDER 2, ADV 2. 202606 Q25는 엘니뇨와 빅데이터 복합이라 SCI3와도 겹침. 나머지는 통합과학1.
  물리학1 5회: 일부 포함. 전자기 유도·발전 문항만 IN 4. 나머지는 심화 또는 범위 밖.
  화학1·2 4회: 일부 포함. g2_202503 화학1의 산화 환원 4문항만 IN. 산화수·몰 문항은 ADV.
  생명과학1 3회: 일부 포함. g2_202503만 IN 4(생물다양성·자연선택·지질 시대). 나머지 범위 밖.
  지구과학1 3회: 일부 포함. 지질 시대·엘니뇨·대기 대순환 IN 8. 절대 연령·밀란코비치는 ADV.
  생활과윤리: 범위 밖(다른 과목)
