arc_n_set:                # 50문항 워크북 1세트
  parts: {A_VOC: 15, B_GRM: 10, C_RDG: 15, D_CRQ: 10}
  rules:
    - 부교재·학평 원문과 다른 유형으로 바꿔 낸다(원문 주제 → 문맥 어휘·빈칸·삽입)
    - B에는 ARC-ENG-GRM-02를 2문항 이상 넣는다
    - D는 ARC-ENG-CRQ-01과 ARC-ENG-CRQ-03을 6:4로 둔다
    - 2025 체제 변형(VOC-05, VOC-06, CRQ 글자 수·단어 수 고정)은 D4~D5 문항에 쓴다
arc_core_module: [문장별 구문·어법 변형 포인트, 파생어·반의어·영영풀이 사전, 어형 변환 요약문, 서답형 영작 대상 문장]
quality_gate:
  - VOC 빈칸 선지 5개의 품사·굴절형이 같아 문맥과 연어로만 풀리는가
  - GRM-02는 절·문장 전체에 밑줄을 쳤고 오류 근거가 분명한가
  - RDG-03·RDG-04는 원문을 그대로 쓰지 않고 바꿔 썼는가
  - CRQ-01은 어형을 바꿔야만 문법적으로 성립하는가
  - 서답형마다 <조건>과 부분점수 기준이 해설에 있는가
