# 한글 맞춤법(국립국어원 고시, 2017) 조항 원문 발췌 — 문항 <보기>의 [참고 조항]으로 제시한다.
# 사용자 지시(2026-11-19): 조항 번호만 알려 주지 말고 조항을 실제로 제시해 추론으로 판단하게 할 것.
library_id: ARC_KOR_ORTHOGRAPHY_RULE_TEXTS_V1.0
version: 1.0
date: 2026-11-19
source: 국립국어원 「한글 맞춤법」(문화체육관광부 고시 제2017-12호) 및 해설
rules:
  1: "제1항 한글 맞춤법은 표준어를 소리대로 적되, 어법에 맞도록 함을 원칙으로 한다."
  2: "제2항 문장의 각 단어는 띄어 씀을 원칙으로 한다."
  5: "제5항 한 단어 안에서 뚜렷한 까닭 없이 나는 된소리는 다음 음절의 첫소리를 된소리로 적는다. (1) 두 모음 사이에서 나는 된소리 (2) 'ㄴ, ㄹ, ㅁ, ㅇ' 받침 뒤에서 나는 된소리. 다만, 'ㄱ, ㅂ' 받침 뒤에서 나는 된소리는, 같은 음절이나 비슷한 음절이 겹쳐 나는 경우가 아니면 된소리로 적지 아니한다."
  6: "제6항 'ㄷ, ㅌ' 받침 뒤에 종속적 관계를 가진 '-이(-)'나 '-히-'가 올 적에는, 그 'ㄷ, ㅌ'이 'ㅈ, ㅊ'으로 소리 나더라도 'ㄷ, ㅌ'으로 적는다."
  7: "제7항 'ㄷ' 소리로 나는 받침 중에서 'ㄷ'으로 적을 근거가 없는 것은 'ㅅ'으로 적는다."
  8: "제8항 '계, 례, 몌, 폐, 혜'의 'ㅖ'는 'ㅔ'로 소리 나는 경우가 있더라도 'ㅖ'로 적는다. 다만, '게송, 게시판, 휴게실'은 본음대로 적는다."
  9: "제9항 '의'나, 자음을 첫소리로 가지고 있는 음절의 'ㅢ'는 'ㅣ'로 소리 나는 경우가 있더라도 'ㅢ'로 적는다."
  10: "제10항 한자음 '녀, 뇨, 뉴, 니'가 단어 첫머리에 올 적에는 두음 법칙에 따라 '여, 요, 유, 이'로 적는다. [붙임 1] 단어의 첫머리 이외의 경우에는 본음대로 적는다. [붙임 2] 접두사처럼 쓰이는 한자가 붙어서 된 말이나 합성어에서, 뒷말의 첫소리가 'ㄴ' 소리로 나더라도 두음 법칙에 따라 적는다."
  11: "제11항 한자음 '랴, 려, 례, 료, 류, 리'가 단어의 첫머리에 올 적에는 두음 법칙에 따라 '야, 여, 예, 요, 유, 이'로 적는다. [붙임 1] 단어의 첫머리 이외의 경우에는 본음대로 적는다. 다만, 모음이나 'ㄴ' 받침 뒤에 이어지는 '렬, 률'은 '열, 율'로 적는다."
  12: "제12항 한자음 '라, 래, 로, 뢰, 루, 르'가 단어의 첫머리에 올 적에는 두음 법칙에 따라 '나, 내, 노, 뇌, 누, 느'로 적는다. [붙임 1] 단어의 첫머리 이외의 경우에는 본음대로 적는다. [붙임 2] 접두사처럼 쓰이는 한자가 붙어서 된 단어는 뒷말을 두음 법칙에 따라 적는다."
  13: "제13항 한 단어 안에서 같은 음절이나 비슷한 음절이 겹쳐 나는 부분은 같은 글자로 적는다."
  14: "제14항 체언은 조사와 구별하여 적는다."
  15: "제15항 용언의 어간과 어미는 구별하여 적는다. [붙임 1] 두 개의 용언이 어울려 한 개의 용언이 될 적에, 앞말의 본뜻이 유지되고 있는 것은 그 원형을 밝히어 적고, 그 본뜻에서 멀어진 것은 밝히어 적지 아니한다. [붙임 2] 종결형에서 사용되는 어미 '-오'는 '요'로 소리 나는 경우가 있더라도 그 원형을 밝혀 '오'로 적는다. [붙임 3] 연결형에서 사용되는 '이요'는 '이요'로 적는다."
  18: "제18항 다음과 같은 용언들은 어미가 바뀔 경우, 그 어간이나 어미가 원칙에 벗어나면 벗어나는 대로 적는다. (어간 끝 'ㄹ'·'ㅅ'·'ㅎ'·'ㅜ'·'ㅡ'·'ㄷ'·'ㅂ'의 변화, 어미 '-아/-어'가 '-여', '-러'로 바뀌는 것, 어간 끝음절 '르'의 'ㅡ'가 줄고 '-아/-어'가 '-라/-러'로 바뀌는 것 등)"
  19: "제19항 어간에 '-이'나 '-음/-ㅁ'이 붙어서 명사로 된 것과 '-이'나 '-히'가 붙어서 부사로 된 것은 그 어간의 원형을 밝히어 적는다. 다만, 어간에 '-이'나 '-음'이 붙어서 명사로 바뀐 것이라도 그 어간의 뜻과 멀어진 것은 원형을 밝히어 적지 아니한다. [붙임] 어간에 '-이'나 '-음' 이외의 모음으로 시작된 접미사가 붙어서 다른 품사로 바뀐 것은 그 어간의 원형을 밝히어 적지 아니한다."
  20: "제20항 명사 뒤에 '-이'가 붙어서 된 말은 그 명사의 원형을 밝히어 적는다. [붙임] '-이' 이외의 모음으로 시작된 접미사가 붙어서 된 말은 그 명사의 원형을 밝히어 적지 아니한다."
  21: "제21항 명사나 혹은 용언의 어간 뒤에 자음으로 시작된 접미사가 붙어서 된 말은 그 명사나 어간의 원형을 밝히어 적는다. 다만, 겹받침의 끝소리가 드러나지 아니하는 것과 어원이 분명하지 아니하거나 본뜻에서 멀어진 것은 소리대로 적는다."
  23: "제23항 '-하다'나 '-거리다'가 붙는 어근에 '-이'가 붙어서 명사가 된 것은 그 원형을 밝히어 적는다. [붙임] '-하다'나 '-거리다'가 붙을 수 없는 어근에 '-이'나 또는 다른 모음으로 시작되는 접미사가 붙어서 명사가 된 것은 그 원형을 밝히어 적지 아니한다."
  25: "제25항 '-하다'가 붙는 어근에 '-히'나 '-이'가 붙어서 부사가 되거나, 부사에 '-이'가 붙어서 뜻을 더하는 경우에는 그 어근이나 부사의 원형을 밝히어 적는다. [붙임] '-하다'가 붙지 않는 경우에는 소리대로 적는다."
  27: "제27항 둘 이상의 단어가 어울리거나 접두사가 붙어서 이루어진 말은 각각 그 원형을 밝히어 적는다. [붙임 2] 어원이 분명하지 아니한 것은 원형을 밝히어 적지 아니한다. [붙임 3] '이[齒, 虱]'가 합성어나 이에 준하는 말에서 '니' 또는 '리'로 소리 날 때에는 '니'로 적는다."
  28: "제28항 끝소리가 'ㄹ'인 말과 딴 말이 어울릴 적에 'ㄹ' 소리가 나지 아니하는 것은 아니 나는 대로 적는다."
  29: "제29항 끝소리가 'ㄹ'인 말과 딴 말이 어울릴 적에 'ㄹ' 소리가 'ㄷ' 소리로 나는 것은 'ㄷ'으로 적는다."
  30: "제30항 사이시옷은 순우리말로 된 합성어 또는 순우리말과 한자어로 된 합성어로서 앞말이 모음으로 끝난 경우, (1) 뒷말의 첫소리가 된소리로 나는 것 (2) 뒷말의 첫소리 'ㄴ, ㅁ' 앞에서 'ㄴ' 소리가 덧나는 것 (3) 뒷말의 첫소리 모음 앞에서 'ㄴㄴ' 소리가 덧나는 것에 받치어 적는다. 두 음절로 된 한자어 중 '곳간, 셋방, 숫자, 찻간, 툇간, 횟수'도 사이시옷을 받치어 적는다."
  32: "제32항 단어의 끝모음이 줄어지고 자음만 남은 것은 그 앞의 음절에 받침으로 적는다."
  33: "제33항 체언과 조사가 어울려 줄어지는 경우에는 준 대로 적는다."
  34: "제34항 모음 'ㅏ, ㅓ'로 끝난 어간에 '-아/-어, -았-/-었-'이 어울릴 적에는 준 대로 적는다."
  35: "제35항 모음 'ㅗ, ㅜ'로 끝난 어간에 '-아/-어, -았-/-었-'이 어울려 'ㅘ/ㅝ, 왔/웠'으로 될 적에는 준 대로 적는다. [붙임 2] 'ㅚ' 뒤에 '-어, -었-'이 어울려 'ㅙ, 왰'으로 될 적에도 준 대로 적는다."
  36: "제36항 'ㅣ' 뒤에 '-어'가 와서 'ㅕ'로 줄 적에는 준 대로 적는다."
  37: "제37항 'ㅏ, ㅕ, ㅗ, ㅜ, ㅡ'로 끝난 어간에 '-이-'가 와서 각각 'ㅐ, ㅖ, ㅚ, ㅟ, ㅢ'로 줄 적에는 준 대로 적는다."
  38: "제38항 'ㅏ, ㅗ, ㅜ, ㅡ' 뒤에 '-이어'가 어울려 줄어질 적에는 준 대로 적는다."
  39: "제39항 어미 '-지' 뒤에 '않-'이 어울려 '-잖-'이 될 적과 '-하지' 뒤에 '않-'이 어울려 '-찮-'이 될 적에는 준 대로 적는다."
  40: "제40항 어간의 끝음절 '하'의 'ㅏ'가 줄고 'ㅎ'이 다음 음절의 첫소리와 어울려 거센소리로 될 적에는 거센소리로 적는다. [붙임 2] 어간의 끝음절 '하'가 아주 줄 적에는 준 대로 적는다. (해설: '하' 앞의 받침 소리가 [ㄱ, ㄷ, ㅂ]이면 '하'가 아주 준다.)"
  41: "제41항 조사는 그 앞말에 붙여 쓴다."
  42: "제42항 의존 명사는 띄어 쓴다."
  43: "제43항 단위를 나타내는 명사는 띄어 쓴다. 다만, 순서를 나타내는 경우나 숫자와 어울리어 쓰이는 경우에는 붙여 쓸 수 있다."
  44: "제44항 수를 적을 적에는 '만(萬)' 단위로 띄어 쓴다."
  45: "제45항 두 말을 이어 주거나 열거할 적에 쓰이는 말들은 띄어 쓴다."
  46: "제46항 단음절로 된 단어가 연이어 나타날 적에는 붙여 쓸 수 있다."
  47: "제47항 보조 용언은 띄어 씀을 원칙으로 하되, 경우에 따라 붙여 씀도 허용한다. 다만, 앞말에 조사가 붙거나 앞말이 합성 용언인 경우, 그리고 중간에 조사가 들어갈 적에는 그 뒤에 오는 보조 용언은 띄어 쓴다. (해설: 붙여 쓰기가 허용되는 것은 '-아/-어' 뒤에 연결되는 보조 용언과, 의존 명사에 '-하다'나 '-싶다'가 붙어서 된 보조 용언이다.)"
  48: "제48항 성과 이름, 성과 호 등은 붙여 쓰고, 이에 덧붙는 호칭어, 관직명 등은 띄어 쓴다. 다만, 성과 이름, 성과 호를 분명히 구분할 필요가 있을 경우에는 띄어 쓸 수 있다."
  49: "제49항 성명 이외의 고유 명사는 단어별로 띄어 씀을 원칙으로 하되, 단위별로 띄어 쓸 수 있다."
  50: "제50항 전문 용어는 단어별로 띄어 씀을 원칙으로 하되, 붙여 쓸 수 있다."
  51: "제51항 부사의 끝음절이 분명히 '이'로만 나는 것은 '-이'로 적고, '히'로만 나거나 '이'나 '히'로 나는 것은 '-히'로 적는다."
  53: "제53항 다음과 같은 어미는 예사소리로 적는다. (-(으)ㄹ게, -(으)ㄹ걸, -(으)ㄹ세라, -(으)ㄹ수록, -(으)ㄹ지 등) 다만, 의문을 나타내는 다음 어미들은 된소리로 적는다. (-(으)ㄹ까? -(으)ㅂ니까? -(으)리까? -(으)ㄹ쏘냐?)"
  56: "제56항 '-더라, -던'과 '-든지'는 다음과 같이 적는다. (1) 지난 일을 나타내는 어미는 '-더라, -던'으로 적는다. (2) 물건이나 일의 내용을 가리지 아니하는 뜻을 나타내는 조사와 어미는 '-든지'로 적는다."
  57: "제57항 다음 말들은 각각 구별하여 적는다. (소리는 같거나 비슷하지만 뜻이 다른 말은 뜻에 따라 표기를 달리한다.)"
