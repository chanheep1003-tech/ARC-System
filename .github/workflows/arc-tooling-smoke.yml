name: ARC tooling smoke

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'tooling/**'
      - 'quality/**'
      - 'engine/common/**'
      - 'ops/ARC_GENERATOR_CONTRACT_*'
      - 'ops/ARC_CONTENT_BUNDLE_CONTRACT_*'
      - 'ops/ARC_TYPESETTER_CONTRACT_*'
      - 'templates/**'
      - 'subjects/KOREAN_MASTER_*'
      - 'SYSTEM_MANIFEST.yaml'
      - '.github/workflows/arc-tooling-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install light smoke dependencies
        run: python -m pip install PyYAML PyMuPDF

      - name: Compile Python tooling
        run: |
          python -m py_compile tooling/promptfoo/provider.py
          python -m py_compile tooling/promptfoo/tests.py
          python -m py_compile tooling/promptfoo/assert_regression.py
          python -m py_compile tooling/similarity/arc_similarity.py
          python -m py_compile tooling/similarity/calibrate_similarity.py
          python -m py_compile tooling/pdf_qc/pdf_preflight.py
          python -m py_compile tooling/pdf_qc/test_preflight_smoke.py
          python -m py_compile tooling/pdf_qc/autofix_controller.py
          python -m py_compile tooling/pdf_qc/test_autofix_controller.py
          python -m py_compile tooling/typeset/typesetter_gateway.py
          python -m py_compile tooling/typeset/test_typesetter_gateway.py
          python -m py_compile tooling/pdf_qc/xmark_detect.py
          python -m py_compile tooling/handoff/handoff_preflight.py
          python -m py_compile tooling/handoff/test_handoff_preflight.py
          python -m py_compile tooling/handoff/handoff_serializer.py
          python -m py_compile tooling/handoff/test_handoff_serializer.py
          python -m py_compile tooling/canary/nightly_canary.py
          python -m py_compile tooling/canary/test_nightly_canary.py
          python -m py_compile tooling/canary/kor_n_canary.py
          python -m py_compile tooling/canary/test_kor_n_canary.py
          python -m py_compile tooling/content_qa/content_qa_gate.py
          python -m py_compile tooling/content_qa/test_content_qa_gate.py
          python -m py_compile tooling/visual/arc_visual_render.py
          python -m py_compile tooling/visual/visual_verify.py
          python -m py_compile tooling/validate_system.py

      - name: Validate YAML
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          files = [
              'SYSTEM_MANIFEST.yaml',
              'quality/regression/REGRESSION_FIXTURES_V1.0.yaml',
              'quality/similarity/SIMILARITY_THRESHOLDS_V1.0.yaml',
              'tooling/promptfoo/promptfooconfig.yaml',
              'quality/governance/DEPRECATION_REGISTRY_V1.0.yaml',
              'quality/semantic/ARC_QA_EVIDENCE_SCHEMA_V1.0.yaml',
              'quality/canary/KOR_CORE_CANARY_V1.yaml',
              'quality/canary/KOR_N_CANARY_V1.yaml',
          ]
          for f in files:
              yaml.safe_load(Path(f).read_text(encoding='utf-8'))
              print('OK', f)
          PY

      - name: Validate 30 regression fixtures
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'tooling/promptfoo')
          from tests import generate_tests
          tests = generate_tests()
          assert len(tests) == 30, len(tests)
          assert len({t['vars']['fixture_id'] for t in tests}) == 30
          print('fixtures', len(tests))
          PY

      - name: Run PDF preflight behavioral smoke
        run: python tooling/pdf_qc/test_preflight_smoke.py

      - name: Run PDF auto-fix controller smoke
        run: python tooling/pdf_qc/test_autofix_controller.py

      - name: Run manifest-owned Typesetter gateway smoke
        run: python tooling/typeset/test_typesetter_gateway.py

      - name: Run handoff preflight behavioral smoke
        run: python tooling/handoff/test_handoff_preflight.py

      - name: Run handoff serializer behavioral smoke
        run: python tooling/handoff/test_handoff_serializer.py

      - name: Run fixed KOR CORE E2E canary
        run: python tooling/canary/nightly_canary.py --output-dir /tmp/arc-kor-canary --report /tmp/arc-kor-canary/canary-report.json

      - name: Run fixed KOR N E2E canary
        run: python tooling/canary/kor_n_canary.py --output-dir /tmp/arc-kor-n-canary --report /tmp/arc-kor-n-canary/canary-report.json

      - name: Upload KOR canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kor-canaries-${{ github.run_id }}
          path: |
            /tmp/arc-kor-canary
            /tmp/arc-kor-n-canary
          retention-days: 7

      - name: Run Universal Independent Solve QA gate smoke
        run: python tooling/content_qa/test_content_qa_gate.py

      - name: Validate active system graph and checksums
        run: python tooling/validate_system.py --strict-checksums
