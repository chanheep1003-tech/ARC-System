# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: ARC frozen regression runner

prompts:
  - |
      Evaluate this ARC regression fixture with the current candidate QA rules.
      Return JSON only with:
      {
        "decision": "BANK_A|BANK_B|PASS|REVISE|DISCARD",
        "item_score": number|null,
        "hard_fail": true|false,
        "reasons": ["..."]
      }

      FIXTURE_ID: {{fixture_id}}
      SUBJECT: {{subject}}
      EXPECTED_CLASS: {{fixture_class}}

      FIXTURE:
      {{fixture_text}}

providers:
  - id: file://provider.py
    label: ARC candidate adapter

defaultTest:
  assert:
    - type: python
      value: file://assert_regression.py:get_assert

tests:
  - file://tests.py:generate_tests
